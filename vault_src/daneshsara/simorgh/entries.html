<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.ev{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid var(--line-strong);color:var(--ink-2)} .ev.t1{border-color:#2F7D4F;color:#2F7D4F} .ev.t2{border-color:#3C6EA8;color:#3C6EA8} .ev.t3{border-color:#8A6D1D;color:#8A6D1D} .ev.t4,.ev.t0{border-color:#8A2E2E;color:#8A2E2E}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
.xp{display:grid;gap:var(--s3)}.xp p{margin:0;line-height:1.95}.exs{display:grid;gap:var(--s3)}.exs .ex{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface-subtle,var(--surface));border:1px solid var(--line);border-inline-start:4px solid var(--fam-soc,var(--primary));line-height:1.9}.exs .ex.real{border-inline-start-color:var(--story,#B4532A)}.exs .lab{display:inline-block;font-size:var(--chip);padding:1px 10px;border-radius:999px;border:1px solid var(--line-strong,var(--line));margin-inline-end:6px;color:var(--ink-2)}.exs .ex a{font-size:var(--chip)}.tryit{padding:var(--s4) var(--s5);border-radius:var(--r-md);border:1px dashed var(--line-strong,var(--line));line-height:1.9}.tryit a{font-weight:600}.conf{margin:0;padding-inline-start:1.2em;line-height:1.9}.whyit{line-height:1.9;margin:0;color:var(--ink-2)}
.pts li .ref a.sl{cursor:pointer;color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--line-strong,var(--line))}.pts li .ref a.sl:hover{color:var(--ink)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.rels{display:flex;flex-wrap:wrap;gap:6px}.rels a{font-size:var(--small);padding:5px 12px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink-2)}.rels a:hover{border-color:var(--primary);color:var(--ink)}.rels .ext{font-size:var(--chip);color:var(--ink-3)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}

<script>
const D = {"wiki": "simorgh", "order": ["simorgh:game", "simorgh:evidence", "simorgh:history", "simorgh:strategy", "simorgh:action", "simorgh:project"], "concepts": [{"id": "simorgh:ten-unbuilt-roles", "kind": "concept", "title": {"fa": "ده نقشی که شهر هنوز نساخته", "en": "Ten roles the city has not yet built", "nl": "Ten roles the city has not yet built"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "شهر چون ناقص است می‌بازد، نه چون ضعیف. ده کارتِ خالی هر کدام یک سازوکار است که چند نفر می‌سازندش و بعد از سازندگانش مستقل می‌شود؛ هر کدام یکی از شش قفلِ میز را می‌شکند.", "en": "The city loses because it is incomplete, not weak. Ten blank cards, each a mechanism that several people build and that then becomes independent of its builders; each breaks one of the six locks on the table.", "nl": "The city loses because it is incomplete, not weak. Ten blank cards, each a mechanism that several people build and that then becomes independent of its builders; each breaks one of the six locks on the table."}, "points": [{"text": {"fa": "شش قفلی که ده نقش می‌شکنند: نبودِ نقطهٔ کانونی، نامتقارنیِ هزینه، ترجیحِ پنهان، ترسِ جزء دوم و سوم از فردا، فقدانِ فرایندِ تأسیس، و خطرِ فردمحوری. درسِ چهار دههٔ گذشته: نه انگیزه کم بوده نه استعداد، نهاد کم بوده.", "en": "Six locks broken by the ten roles: no focal point, cost asymmetry, hidden preference, fear of the second and third tier of tomorrow, no founding process, and personality dependence. The lesson of four decades: neither motivation nor talent was short, institutions were.", "nl": "Six locks broken by the ten roles: no focal point, cost asymmetry, hidden preference, fear of the second and third tier of tomorrow, no founding process, and personality dependence. The lesson of four decades: neither motivation nor talent was short, institutions were."}, "sources": [], "flags": []}, {"text": {"fa": "نمادساز — پیش‌بندِ کاوه — یک نشانهٔ ساده که هرکس در هر شهری بتواند خودش بسازد، بدون اجازه و بدون هزینه. شرطش این است که از ابزارِ کارِ روزمره بیرون بیاید، نه از طراحی گرافیکی: کاوه پرچم را نخرید، پیش‌بندش را بالا برد. (خروجی: خروجی: یک نماد، یک جمله، یک تاریخ — هر سه تکرارپذیر)", "en": "نمادساز — پیش‌بندِ کاوه: mechanism and expected output as in the Persian text.", "nl": "نمادساز — پیش‌بندِ کاوه: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فراخوان‌دهنده — سازوکار فراخوان — تبدیل «یک روز باید کاری کرد» به «فلان تاریخ، فلان ساعت، این کارِ مشخص». بدون تاریخ و عملِ مشخص، فراخوان فقط نوفه است. (خروجی: خروجی: تقویمِ عمومیِ عمل، با تأیید مستقل)", "en": "فراخوان‌دهنده — سازوکار فراخوان: mechanism and expected output as in the Persian text.", "nl": "فراخوان‌دهنده — سازوکار فراخوان: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نهاد شفافیت — نهاد داده — انتشار ماهانهٔ اندازهٔ واقعی اکثریت و راستی‌آزمایی ادعاهای هر دو طرف. لحظه‌ای که این نهاد یک ادعای اپوزیسیون را رد کند، اعتبارش ده برابر می‌شود. (خروجی: خروجی: گزارش ماهانه، با روش‌شناسی باز)", "en": "نهاد شفافیت — نهاد داده: mechanism and expected output as in the Persian text.", "nl": "نهاد شفافیت — نهاد داده: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "صندوق پشتیبانی اعتصاب — صندوق مقاومت — حقوق یک تا سه ماهِ کسی که اعتصاب می‌کند. بدون این، اعتصاب سراسری یک آرزوست — چون ۶۰٪ اشتغال کشور غیررسمی است و یک هفته نکار کردن یعنی یک هفته گرسنگی. (خروجی: خروجی: صندوق شفاف با حسابرسی مستقل)", "en": "صندوق پشتیبانی اعتصاب — صندوق مقاومت: mechanism and expected output as in the Persian text.", "nl": "صندوق پشتیبانی اعتصاب — صندوق مقاومت: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "حامی و پوشش‌دهنده — شبکهٔ حمایت — وکیل داوطلب، پزشک داوطلب، خانهٔ امن. هزینهٔ فردیِ کنش را از «نامتناهی» به «قابل‌محاسبه» می‌آورد. این تنها راهِ شکستنِ نامتقارنی هزینه است. (خروجی: خروجی: شبکهٔ حقوقی-درمانیِ از پیش‌آماده)", "en": "حامی و پوشش‌دهنده — شبکهٔ حمایت: mechanism and expected output as in the Persian text.", "nl": "حامی و پوشش‌دهنده — شبکهٔ حمایت: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نهاد حقیقت و آشتی — عدالت انتقالی — متنِ مکتوبِ فردا برای جزء دوم و سوم آن ۱۰–۱۵٪: چه کسی مصون است، چه کسی محاکمه می‌شود، با چه فرایندی، در چه بازهٔ زمانی. الگو: عفو مشروط در برابر اعتراف کامل. (خروجی: خروجی: پیش‌نویس، امضاشده توسط حقوق‌دانان دو طرف مرز)", "en": "نهاد حقیقت و آشتی — عدالت انتقالی: mechanism and expected output as in the Persian text.", "nl": "نهاد حقیقت و آشتی — عدالت انتقالی: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "امضاکنندهٔ خط قرمز — امضاکنندگانِ اول — کسانی که اول از همه اسمشان را پای میثاق می‌گذارند و هزینه‌اش را می‌پذیرند. تیرِ آرش وقتی مرز ساخت که رها شد، نه وقتی که در کمان بود. (خروجی: خروجی: فهرست علنیِ امضاها، فراجناحی)", "en": "امضاکنندهٔ خط قرمز — امضاکنندگانِ اول: mechanism and expected output as in the Persian text.", "nl": "امضاکنندهٔ خط قرمز — امضاکنندگانِ اول: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نویسندهٔ قانون — متنِ حداقلی — شش بند، نه شصت. تمامیت ارضی و برابریِ شهروندی · حاکمیت قانون · عدالت بدون انتقام · آزادیِ دین و بی‌دینی · تاریخ مشخصِ رأی‌گیری · عدمِ بهره‌برداریِ انتخاباتی از دورهٔ گذار. اجماع بر فرمِ حکومت لازم نیست و همین‌الان هم ممکن نیست — اما بی‌فرمی یعنی «تعیین‌نکردن پیش از رأی»، نه حذفِ گزینه‌ها از بحث. (خروجی: خروجی: سندِ شش‌بندی + فرایند مشارکتی تدوین قانون اساسی)", "en": "نویسندهٔ قانون — متنِ حداقلی: mechanism and expected output as in the Persian text.", "nl": "نویسندهٔ قانون — متنِ حداقلی: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سازمان‌دهندهٔ میدانی — سازماندهی افقی — هماهنگ‌کنندگان میدانی که هرکدام جانشین تربیت می‌کنند. شاخص سلامتشان یک چیز است: اگر بازداشت شوند، آیا کار متوقف می‌شود؟ (خروجی: خروجی: ساختار سلولیِ قابل‌جایگزینی)", "en": "سازمان‌دهندهٔ میدانی — سازماندهی افقی: mechanism and expected output as in the Persian text.", "nl": "سازمان‌دهندهٔ میدانی — سازماندهی افقی: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "چهرهٔ بی‌ادعای قدرت و هدهد — ضدِ فردمحوری — یکی قدرت دارد و از پیش اعلام می‌کند نامزد نمی‌شود؛ دیگری فرایند را می‌برد بی‌آنکه مقصد باشد. این دو با هم، تنها بیمه‌نامهٔ موجود در برابر تکرارِ چرخه‌اند: «مردمان ارادهٔ خود را در فردی فرافکنی می‌کنند، پشت سرش راه می‌افتند و چند دهه بعد زیرش می‌زنند.» (خروجی: خروجی: تعهدِ علنیِ عدم‌نامزدی + دبیرخانهٔ بی‌چهره)", "en": "چهرهٔ بی‌ادعای قدرت و هدهد — ضدِ فردمحوری: mechanism and expected output as in the Persian text.", "nl": "چهرهٔ بی‌ادعای قدرت و هدهد — ضدِ فردمحوری: mechanism and expected output as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:three-feathers", "rel": "see-also", "note": {"fa": "سه پَر", "en": "The three feathers", "nl": "The three feathers"}}, {"to": "simorgh:covenantal-transition", "rel": "see-also", "note": {"fa": "گذارِ میثاقی", "en": "Covenantal transition", "nl": "Covenantal transition"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:simorgh", "kind": "root", "title": {"fa": "سیمرغ", "en": "Simorgh", "nl": "Simorgh"}, "aliases": ["سیمرغ", "پر سیمرغ", "پَرِ سیمرغ", "مافیای ایران"], "parent": null, "field": null, "summary": {"fa": "همهٔ آنچه دربارهٔ «پَرِ سیمرغ» ــ بازیِ میزِ مافیای ایران ــ ساخته شده، در یک جا و با یک نقشهٔ روشن: بازی و استعاره، شواهد و ادعاها، تاریخ، راهبرد، قدمِ هر آدم، و خودِ پروژه با ابزارهایش. این ویکی صفحه‌های قاطی‌پاتی را جایگزین نمی‌کند، مرتب می‌کند: هر صفحه و هر ابزار اینجا یک جای مشخص دارد و در مدخلِ «نقشهٔ صفحه‌ها» می‌بینی هر صفحهٔ قدیمی کجا رفته. خصوصی است قلیت‌های پرشور، خشم و گذار سیاسی: بحث سخنران و نقد آن"}}, {"to": "soc:national-myth-solidarity-vs-ethnic-division-debate", "rel": "see-also", "note": {"fa": "اسطورهٔ ملی، هم‌بستگی و بحث هویت‌های قومی (دیدگاه سخنران)", "en": "اسطورهٔ ملی، هم‌بستگی و بحث هویت‌های قومی (دیدگاه سخنران)", "nl": "اسطورهٔ ملی، هم‌بستگی و بحث هویت‌های قومی (دیدگاه سخنران)"}}, {"to": "soc:security-defection-credible-commitment", "rel": "see-also", "note": {"fa": "ریزش نیروهای امنیتی و مسئلهٔ تعهد باورپذیر", "en": "ریزش نیروهای امنیتی و مسئلهٔ تعهد باورپذیر", "nl": "ریزش نیروهای امنیتی و مسئلهٔ تعهد باورپذیر"}}, {"to": "soc:network-society", "rel": "see-also", "note": {"fa": "جامعهٔ شبکه‌ای", "en": "جامعهٔ شبکه‌ای", "nl": "جامعهٔ شبکه‌ای"}}, {"to": "soc:threshold-models-of-collective-behaviour", "rel": "see-also", "note": {"fa": "مدل آستانه: چرا جمع‌های همانند رفتار ناهمانند می‌کنند", "en": "مدل آستانه: چرا جمع‌های همانند رفتار ناهمانند می‌کنند", "nl": "مدل آستانه: چرا جمع‌های همانند رفتار ناهمانند می‌کنند"}}, {"to": "soc:legitimacy-trust-function", "rel": "see-also", "note": {"fa": "مشروعیت: اعتماد، کارکرد و تعلق‌خاطر", "en": "مشروعیت: اعتماد، کارکرد و تعلق‌خاطر", "nl": "مشروعیت: اعتماد، کارکرد و تعلق‌خاطر"}}, {"to": "soc:collective-trauma-justice-revenge", "rel": "see-also", "note": {"fa": "تروما و آشفتگی هیجانی جمعی، اعتماد و خطر انتقام در بازسازی جامعه", "en": "تروما و آشفتگی هیجانی جمعی، اعتماد و خطر انتقام در بازسازی جامعه", "nl": "تروما و آشفتگی هیجانی جمعی، اعتماد و خطر انتقام در بازسازی جامعه"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:covenantal-transition", "kind": "concept", "title": {"fa": "گذارِ میثاقی و برنامهٔ ۹۰ روز / ۹ ماه / ۶۰۰ روز", "en": "Covenantal transition and the 90 day / 9 month / 600 day plan", "nl": "Covenantal transition and the 90 day / 9 month / 600 day plan"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "راهِ یکم اگر بخواهد از حرف به فرایند بدل شود سه بازهٔ زمانی دارد و هیچ‌کدام به مجوزِ کسی نیاز ندارد. هر بازه یک یا چند قفلِ میز را می‌شکند.", "en": "If path 1 is to turn from talk into process it has three time spans, none needing anyone's permission. Each breaks one or more locks of the table.", "nl": "If path 1 is to turn from talk into process it has three time spans, none needing anyone's permission. Each breaks one or more locks of the table."}, "points": [{"text": {"fa": "۹۰ روز، سوزاندنِ پَرِ یکم: ساختنِ «آمارگرِ مستقل» و «نهادِ شفافیت» که هر ماه اندازهٔ واقعیِ اکثریت را منتشر کند و ادعای هر دو طرف را راستی‌آزمایی کند، و انتشارِ نسخهٔ صفرِ میثاقِ حداقلی در چهار بند با امضای فراجناحی. قفل‌ها: آبشارِ اطلاعاتی، نبودِ نقطهٔ کانونی.", "en": "90 days, burning feather one: build an independent statistician and a transparency body that publishes the majority's true size monthly and fact-checks both sides, and issue version zero of the minimal covenant in four clauses with cross-camp signatures. Locks: information cascade, no focal point.", "nl": "90 days, burning feather one: build an independent statistician and a transparency body that publishes the majority's true size monthly and fact-checks both sides, and issue version zero of the minimal covenant in four clauses with cross-camp signatures. Locks: information cascade, no focal point."}, "sources": [], "flags": []}, {"text": {"fa": "۹ ماه، ساختنِ صندوق و سپر: «صندوقِ پشتیبانیِ اعتصاب» (حقوقِ یک تا سه ماه) و «حامی و پوشش‌دهنده» (شبکهٔ حقوقی-درمانیِ داوطلب)، و انتشارِ متنِ عدالتِ انتقالی با عفوِ مشروط که حقوق‌دانانِ داخل و خارج امضا کنند. قفل‌ها: نامتقارنیِ هزینه، ترسِ جزء دوم و سوم.", "en": "9 months, building fund and shield: a strike-support fund (one to three months' pay) and a patron-and-cover network (volunteer legal and medical), plus a transitional-justice text with conditional amnesty signed by lawyers inside and outside. Locks: cost asymmetry, fear of the second and third tier.", "nl": "9 months, building fund and shield: a strike-support fund (one to three months' pay) and a patron-and-cover network (volunteer legal and medical), plus a transitional-justice text with conditional amnesty signed by lawyers inside and outside. Locks: cost asymmetry, fear of the second and third tier."}, "sources": ["src:b16fff45ff", "src:611b119f9f"], "flags": []}, {"text": {"fa": "۶۰۰ روز، رأیِ مؤسسان: پیش‌نویسِ قانونِ اساسی با بیشترین مشارکت (نه پشتِ درهای بسته)؛ تاریخِ همه‌پرسی از روزِ نخست اعلام می‌شود و تغییر نمی‌کند. پس از میزِ نقد، نگارشِ پیش‌نویس از فازِ سوم به فازِ اول منتقل شد. قفل‌ها: فقدانِ فرایندِ تأسیس، خطرِ فردمحوری.", "en": "600 days, the founders' vote: a draft constitution with maximum participation; the referendum date is announced on day one and never changes. After the critique table, drafting moved from phase three to phase one. Locks: no founding process, personality dependence.", "nl": "600 days, the founders' vote: a draft constitution with maximum participation; the referendum date is announced on day one and never changes. After the critique table, drafting moved from phase three to phase one. Locks: no founding process, personality dependence."}, "sources": [], "flags": []}, {"text": {"fa": "میثاقِ حداقلی شش بند دارد (نه شصت): تمامیتِ ارضی و برابریِ شهروندی؛ حاکمیتِ قانون؛ عدالت بدون انتقام؛ آزادیِ دین و بی‌دینی؛ تاریخِ مشخصِ رأی‌گیری؛ عدمِ بهره‌برداریِ انتخاباتی از دورهٔ گذار. اجماع بر فرمِ حکومت لازم نیست و همین‌الان ممکن هم نیست.", "en": "The minimal covenant has six clauses (not sixty): territorial integrity and equal citizenship; rule of law; justice without revenge; freedom of religion and non-religion; a fixed vote date; no electoral exploitation of the transition. Consensus on the form of government is not needed and not possible now.", "nl": "The minimal covenant has six clauses (not sixty): territorial integrity and equal citizenship; rule of law; justice without revenge; freedom of religion and non-religion; a fixed vote date; no electoral exploitation of the transition. Consensus on the form of government is not needed and not possible now."}, "sources": [], "flags": []}, {"text": {"fa": "چرا میثاقِ «بی‌فرم» با واقعیت جور است: در پیمایشِ گمان هیچ نظامی اکثریت ندارد (پادشاهی حدود ۳۴٪، جمهوری حدود ۲۸٪، جمهوری اسلامی حدود ۱۳٪، یک‌چهارم نامطمئن). هر میثاقی که فرم را پیشاپیش تعیین کند، دست‌کم دو سومِ جامعه را بیرون می‌گذارد. آزمونِ جانشینی و سنجهٔ «تنوعِ امضا» برای این است که میثاق در عمل به یک اردوگاه مصادره نشود.", "en": "Why a form-free covenant fits reality: no system has a majority in GAMAAN. A covenant fixing the form in advance excludes at least two thirds of society.", "nl": "Why a form-free covenant fits reality: no system has a majority in GAMAAN. A covenant fixing the form in advance excludes at least two thirds of society."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "اصلاحِ ۹۰ روز با توجه به قطعِ اینترنت: نهادِ دادهٔ مستقل نمی‌تواند فقط آنلاین باشد. باید روشِ چندمنبعی داشته باشد (پیمایشِ مستقل با روشِ باز، دادهٔ رسمی، رصدِ مستقلِ قطعی‌ها مثل NetBlocks)، و نتیجه را در قالبی پخش کند که دهان‌به‌دهان و بدونِ اینترنت هم برود: یک عدد، یک جمله.", "en": "90-day fix for internet shutdowns: the data body cannot be online-only; it needs multiple sources and a format that travels by word of mouth: one number, one sentence.", "nl": "90-day fix for internet shutdowns: the data body cannot be online-only; it needs multiple sources and a format that travels by word of mouth: one number, one sentence."}, "sources": ["src:4d809f4a2a"], "flags": []}, {"text": {"fa": "اصلاحِ ۹ ماه: صندوق باید با شکافِ امروزِ دستمزد طراحی شود (میانگین حدود ۹۲ دلار در ماه): یعنی حقوقِ یک ماهِ یک کارگر در اندازهٔ کمکِ یک خانوادهٔ ایرانیِ خارج‌نشین است. اصولِ ایمنی: هیچ فهرستِ نامِ گیرندگانِ داخلِ ایران ساخته نشود، پرداخت از راه‌های قانونیِ موجود و شبکه‌های اعتمادِ محلی، حسابرسیِ مستقل در کشورِ میزبان، و شفافیتِ کلی (چقدر آمد، چقدر رفت) بدونِ افشای آدم‌ها.", "en": "9-month fix: the fund must be designed for today's wage gap; one worker's month is in the range of one diaspora family's contribution. Safety: no list of recipients inside Iran, payment through existing legal routes and local trust networks, independent audit in the host country, aggregate transparency without exposing people.", "nl": "9-month fix: the fund must be designed for today's wage gap; one worker's month is in the range of one diaspora family's contribution. Safety: no list of recipients inside Iran, payment through existing legal routes and local trust networks, independent audit in the host country, aggregate transparency without exposing people."}, "sources": ["src:7af62df15e"], "flags": ["editor-note"]}, {"text": {"fa": "درس برای برنامهٔ سیمرغ، هر چهار تا مستقیم: میثاقِ مکتوب پیش از سقوط، نه بعد (پاسخ به ۲)؛ «معیارِ عمومی برای هر مدعیِ رهبری» و تاریخِ همه‌پرسیِ تغییرناپذیر (پاسخ به ۱ و ۳)؛ انضباطِ خشونت‌پرهیز که بهانهٔ تصفیه ندهد (پاسخ به ۴)؛ و نهادهایی که بعد از روزِ سقوط هم کار کنند (شبکهٔ جایگزین). چنووت و استفان یادآوری می‌کنند که ایران استثناست: بیشترِ کارزارهای خشونت‌پرهیز، حتی شکست‌خورده‌ها، بعدها به دموکراسی نزدیک‌ترند تا کارزارهای مسلح.", "en": "Lessons for the Simorgh plan: a written covenant before the fall; a public standard for any claimant to leadership and a fixed referendum date; nonviolent discipline that gives no pretext for purges; institutions that keep working after the fall. Iran is the exception: most nonviolent campaigns, even failed ones, end closer to democracy than armed ones.", "nl": "Lessons for the Simorgh plan: a written covenant before the fall; a public standard for any claimant to leadership and a fixed referendum date; nonviolent discipline that gives no pretext for purges; institutions that keep working after the fall. Iran is the exception: most nonviolent campaigns, even failed ones, end closer to democracy than armed ones."}, "sources": ["src:41c1e6a2e7"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:ten-unbuilt-roles", "rel": "see-also", "note": {"fa": "ده نقشِ نساخته", "en": "Ten unbuilt roles", "nl": "Ten unbuilt roles"}}, {"to": "simorgh:three-paths", "rel": "see-also", "note": {"fa": "سه راه", "en": "Three paths", "nl": "Three paths"}}, {"to": "simorgh:nine-faction-critique", "rel": "see-also", "note": {"fa": "میزِ نقد", "en": "Critique table", "nl": "Critique table"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌ها", "en": "Pillars", "nl": "Pillars"}}, {"to": "simorgh:pre-mortem", "rel": "see-also", "note": {"fa": "پیش‌مرگ", "en": "Pre-mortem", "nl": "Pre-mortem"}}, {"to": "simorgh:threshold-indicators", "rel": "see-also", "note": {"fa": "نشانگرهای آستانه", "en": "Threshold indicators", "nl": "Threshold indicators"}}, {"to": "soc:transitional-justice-options", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:pacted-transitions", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:4d809f4a2a", "src:611b119f9f", "src:6c0a6f1ef3", "src:7af62df15e", "src:b16fff45ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:seven-nights", "kind": "concept", "title": {"fa": "هفت شبِ گذشته و دورِ جاری", "en": "The seven past nights and the current round", "nl": "The seven past nights and the current round"}, "aliases": [], "parent": "simorgh:history", "field": "simorgh:history", "summary": {"fa": "هر دور یک شب داشت و یک روز؛ آنچه عوض شد ترکیبِ نقش‌ها بود، نه گرداننده. کنارِ هر شب اسطوره‌ای از شاهنامه آمده که همان الگو را هزار سال پیش گفته است.", "en": "Each round had a night and a day; what changed was the mix of roles, not the host. Beside each night stands a Shahnameh myth that told the same pattern a thousand years ago.", "nl": "Each round had a night and a day; what changed was the mix of roles, not the host. Beside each night stands a Shahnameh myth that told the same pattern a thousand years ago."}, "points": [{"text": {"fa": "شبِ یکم، ۱۳۵۷ — ضحّاک: مافیا با رأیِ خودِ شهر انتخاب شد. اجماع اجتماعی بود، اجماع نخبگانی نه؛ در آن خلأ، سازمان‌یافته‌ترین گروه برنده شد، نه پرطرفدارترین.", "en": "Night 1, 1979, Zahhak: the Mafia was chosen by the city itself. Social consensus existed, elite consensus did not; in that vacuum the best organised group won, not the most popular.", "nl": "Night 1, 1979, Zahhak: the Mafia was chosen by the city itself. Social consensus existed, elite consensus did not; in that vacuum the best organised group won, not the most popular."}, "sources": ["src:435917f7dd", "src:3c12f4366b"], "flags": []}, {"text": {"fa": "برای شبِ یکم ببین «۱۳۵۷ از دریچهٔ مقاومتِ مدنی»: چنووت و استفان نشان می‌دهند همان کارزارِ خشونت‌پرهیزی که شاه را برداشت، چون تصویرِ مشترکی از فردا نداشت و قدرت را در یک نفر جمع کرد، به ضحّاکِ تازه رسید.", "en": "For night one see the 1979 lesson entry: the nonviolent campaign that removed the Shah, lacking a shared picture of tomorrow and concentrating power in one person, produced a new Zahhak.", "nl": "For night one see the 1979 lesson entry: the nonviolent campaign that removed the Shah, lacking a shared picture of tomorrow and concentrating power in one person, produced a new Zahhak."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "شبِ دوم، ۱۳۶۰ تا ۱۳۶۸ — اکوان دیو: تثبیت با جنگ و ساختِ نقش‌های تازهٔ «وابستهٔ نهادی» (بازوی مسلح، شبکهٔ محله، حلقهٔ منفعت). بزرگ‌ترین کوهورتِ تاریخِ ایران متولد شد؛ زادگان ۱۳۶۵ نزدیک به ۱٫۹۵۷ میلیون در برابر ۹۷۹٬۹۲۳ در ۱۴۰۳.", "en": "Night 2, 1981 to 1989, Akvan Div: consolidation through war and new institution-dependent roles. The largest birth cohort in Iran's history was born; about 1,957,000 births in 1986 against 979,923 in 2024.", "nl": "Night 2, 1981 to 1989, Akvan Div: consolidation through war and new institution-dependent roles. The largest birth cohort in Iran's history was born; about 1,957,000 births in 1986 against 979,923 in 2024."}, "sources": [], "flags": []}, {"text": {"fa": "شبِ سوم، ۱۳۷۶ — بیژن در چاه: شهر خواست از درونِ بازی رأی بدهد. چرخهٔ خاتمی، احمدی‌نژاد، روحانی سه بار همین را تکرار کرد تا جامعه گفت ماجرا تمام است.", "en": "Night 3, 1997, Bizhan in the well: the city tried to vote from inside the game. The Khatami, Ahmadinejad, Rouhani cycle repeated it three times until society said it was over.", "nl": "Night 3, 1997, Bizhan in the well: the city tried to vote from inside the game. The Khatami, Ahmadinejad, Rouhani cycle repeated it three times until society said it was over."}, "sources": [], "flags": []}, {"text": {"fa": "شبِ چهارم، ۱۳۸۸ — سیاوش: ارتِ «اصلاح» سوخت. بزرگ‌ترین کوهورت وارد بازاری شد که ظرفیتش را نداشت؛ نتیجه امروز در یک عدد دیده می‌شود: چهل درصدِ بیکاران فارغ‌التحصیل دانشگاه‌اند و بیکاری ۱۵ تا ۲۴ سال ۲۳٫۴٪ است.", "en": "Night 4, 2009, Siavash: the \"reform\" trial by fire burned. The biggest cohort entered a market without room; today one number shows it: forty percent of the unemployed are university graduates and 15 to 24 youth unemployment is 23.4 percent.", "nl": "Night 4, 2009, Siavash: the \"reform\" trial by fire burned. The biggest cohort entered a market without room; today one number shows it: forty percent of the unemployed are university graduates and 15 to 24 youth unemployment is 23.4 percent."}, "sources": [], "flags": []}, {"text": {"fa": "شبِ پنجم، ۱۳۹۷ — نقطهٔ شکستِ نان و خشکسالیِ ساخته‌شده: نرخِ فقر در دو سال حدود هشت واحد بالا رفت و روی ۳۰٪ ماند؛ طبقهٔ متوسط از ۸۴٪ (سناریوی بدون تحریم) به ۵۶٪ رسید، یعنی حدود ۲۸ واحد، بیست و چند میلیون نفر. درآمد سرانه ۵٬۶۱۷ دلار در ۲۰۲۵ در برابر ۷٬۴۴۲ دلار در ۱۹۷۶.", "en": "Night 5, 2018, the bread breaking point and made-up drought: poverty rose about eight points in two years and settled near 30 percent; the middle class fell from 84 percent (no-sanctions scenario) to 56 percent, about 28 points. Income per head 5,617 dollars in 2025 against 7,442 in 1976.", "nl": "Night 5, 2018, the bread breaking point and made-up drought: poverty rose about eight points in two years and settled near 30 percent; the middle class fell from 84 percent (no-sanctions scenario) to 56 percent, about 28 points. Income per head 5,617 dollars in 2025 against 7,442 in 1976."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شبِ ششم، ۱۴۰۱ — گُردآفرید: نقش‌ها بازتعریف شدند. زن از «موضوعِ بحث» به سوژهٔ محوری بدل شد و پرونده‌ی گروه‌هایی که به تمامیتِ ارضی نظر دیگری دارند تا حد زیادی بسته شد؛ ۲۹٪ خود را چندقومیتی می‌دانند و ۲۳٪ به پرسشِ قومیت پاسخ ندادند. پژوهشِ کدیور جابه‌جاییِ قدرتِ چانه‌زنی داخلِ خانه را از ماندگارترین تغییرات می‌داند.", "en": "Night 6, 2022, Gordafarid: roles were redefined. Women moved from topic of debate to central subject; 29 percent call themselves multi-ethnic and 23 percent did not answer the ethnicity question. Kadivar sees the shift of bargaining power inside the home as one of the most lasting changes.", "nl": "Night 6, 2022, Gordafarid: roles were redefined. Women moved from topic of debate to central subject; 29 percent call themselves multi-ethnic and 23 percent did not answer the ethnicity question. Kadivar sees the shift of bargaining power inside the home as one of the most lasting changes."}, "sources": ["src:f1a8df8bf8"], "flags": []}, {"text": {"fa": "شبِ هفتم، ۱۸ و ۱۹ دی ۱۴۰۴ — سوگِ سیاوشان: موجِ اعتراض که از اعتصابِ کاسب‌ها در تهران (۷ دی) شروع شد و سراسری شد. در پیمایشِ گمان حدود ۲۵٪ (نزدیک به ۱۴ میلیون نفر) گفتند در خیابان بوده‌اند و ۸۰٪ برخوردِ حکومت را نادرست دانستند؛ به گزارشِ رویترز به نقل از مقام‌های ایرانی و گروه‌های حقوقِ بشری، سرکوب هزاران کشته داشت. شاخصِ تعیین‌کننده: با وجودِ این داغ، چرخهٔ انتقام آغاز نشد؛ طبقِ قانونِ طلاییِ میز این مهم‌ترین شاخصِ برد است.", "en": "Night 7, 8 and 9 January 2026: the wave that started with shopkeepers' strikes in Tehran and went national. In GAMAAN about 25 percent (about 14 million) said they took part and 80 percent judged the crackdown wrong; per Reuters, citing officials and rights groups, the crackdown killed thousands. Despite this, no revenge cycle began.", "nl": "Night 7, 8 and 9 January 2026: the wave that started with shopkeepers' strikes in Tehran and went national. In GAMAAN about 25 percent (about 14 million) said they took part and 80 percent judged the crackdown wrong; per Reuters, citing officials and rights groups, the crackdown killed thousands. Despite this, no revenge cycle began."}, "sources": ["src:6c0a6f1ef3", "src:7af62df15e", "src:67b6aa8645"], "flags": ["editor-note"]}, {"text": {"fa": "دورِ جاری، «دریچه باز است، فرایند نیست» — و جنگ: از ۹ اسفند ۱۴۰۴ (۲۸ فوریه ۲۰۲۶) حملهٔ آمریکا و اسرائیل، جنگی که پیمایشِ گمان آن را «جنگِ ۳۹روزه» می‌نامد و واکنش به کشته‌شدنِ رهبر را پرسیده است؛ اما به گزارشِ رویترز در آبان ۱۴۰۵ بستنِ هرمز و محاصرهٔ بنادر ادامه دارد. سه شرطِ گذار هنوز همان است: اراده ✓، دریچه ✓، فرایندِ تأسیس ✗.", "en": "Current round, \"the window is open, the process is not\", plus the war: from 28 February 2026 US and Israeli strikes, a war GAMAAN calls the 39-day war and in which it asked about reactions to the Leader's killing; per Reuters in October 2026 the Hormuz closure and port blockade continue. The three transition conditions are unchanged: will yes, window yes, founding process no.", "nl": "Current round, \"the window is open, the process is not\", plus the war: from 28 February 2026 US and Israeli strikes, a war GAMAAN calls the 39-day war and in which it asked about reactions to the Leader's killing; per Reuters in October 2026 the Hormuz closure and port blockade continue. The three transition conditions are unchanged: will yes, window yes, founding process no."}, "sources": ["src:6c0a6f1ef3", "src:7af62df15e"], "flags": ["editor-note"]}, {"text": {"fa": "درسِ منطقیِ دورِ جاری برای بازی: جنگِ بیرونی شهر را دو تکه کرده؛ حدود ۴۲٪ آن را تجاوزِ نظامی می‌دانند و تقریباً همین اندازه نه. پس نقطهٔ کانونی هرگز نمی‌تواند به یک بازیگرِ خارجی گره بخورد: هر نشانه‌ای که «بیرونی» دیده شود، نیمی از شهر را بیرون می‌گذارد.", "en": "The current round's lesson for the game: the outside war split the city, about 42 percent call it aggression and about as many do not. So the focal point can never be tied to an outside actor.", "nl": "The current round's lesson for the game: the outside war split the city, about 42 percent call it aggression and about as many do not. So the focal point can never be tied to an outside actor."}, "sources": ["src:6c0a6f1ef3", "src:5077e79964"], "flags": []}], "links": [{"to": "simorgh:metaphor", "rel": "see-also", "note": {"fa": "استعارهٔ میز", "en": "The table metaphor", "nl": "The table metaphor"}}, {"to": "simorgh:timeline-tool", "rel": "see-also", "note": {"fa": "خطِ زمان (ابزار)", "en": "Timeline tool", "nl": "Timeline tool"}}, {"to": "simorgh:three-feathers", "rel": "see-also", "note": {"fa": "سه پَر", "en": "The three feathers", "nl": "The three feathers"}}, {"to": "tarikh:tarikh", "rel": "see-also", "note": {"fa": "ویکی تاریخ", "en": "History wiki", "nl": "History wiki"}}, {"to": "simorgh:current-situation", "rel": "see-also", "note": {"fa": "وضعیتِ امروز (آبان ۱۴۰۵)", "en": "Situation now", "nl": "Situation now"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون کافی نبود", "en": "Why 14 million was not enough", "nl": "Why 14 million was not enough"}}], "people": [], "sources": ["src:3c12f4366b", "src:41c1e6a2e7", "src:435917f7dd", "src:5077e79964", "src:67b6aa8645", "src:6c0a6f1ef3", "src:7af62df15e", "src:f1a8df8bf8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:current-situation", "kind": "concept", "title": {"fa": "وضعیتِ امروز: معنایش برای راهبرد (آبان ۱۴۰۵)", "en": "The situation now: what it means for strategy (November 2026)", "nl": "The situation now: what it means for strategy (November 2026)"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "مدخلی که فقط عددهای تاریخ‌دار و منبع‌دار دارد تا متنِ اصلی (که پیش از جنگ نوشته شده) با واقعیتِ امروز سنجیده شود. هر عدد تاریخ دارد؛ این مدخل باید هر چند ماه به‌روز شود.", "en": "An entry with only dated, sourced numbers so the core text (written before the war) can be checked against today. Every number is dated; the entry needs refreshing every few months.", "nl": "An entry with only dated, sourced numbers so the core text (written before the war) can be checked against today. Every number is dated; the entry needs refreshing every few months."}, "points": [{"text": {"fa": "عددهای تاریخ‌دارِ جنگ، معیشت و کار (رویترز، آبان ۱۴۰۵) و پیمایشِ گمان در لایهٔ ایران ثبت‌اند و همان‌جا به‌روز می‌شوند؛ این مدخل فقط معنایشان را برای راهبرد نگه می‌دارد.", "en": "The dated numbers on war, livelihood and work and the GAMAAN survey live and are updated in the Iran layer; this entry keeps only their meaning for strategy.", "nl": "The dated numbers on war, livelihood and work and the GAMAAN survey live and are updated in the Iran layer; this entry keeps only their meaning for strategy."}, "sources": ["src:7af62df15e"], "flags": []}, {"text": {"fa": "آنچه این عددها برای راهبرد می‌گویند: (۱) هیچ فرمِ حکومتی اکثریت ندارد، پس میثاقی که فرم را به رأیِ آزاد واگذار کند تنها چیزی است که همه می‌توانند امضا کنند؛ (۲) شکافِ دستمزد و هزینهٔ زندگی (حدود ۱ به ۳٫۷) یعنی اعتصاب بدونِ صندوق برای اکثرِ مزدبگیران ممکن نیست؛ (۳) اعتراضِ مدنی محبوب‌ترین راه است، اما ۳۰٪ به مداخلهٔ خارجی امید دارند، که پژوهش آن را راهِ کم‌احتمالی برای دموکراسی می‌داند.", "en": "What these numbers say for strategy: no form of government has a majority, so a covenant leaving the form to a free vote is the only thing all can sign; the wage-to-cost gap means strikes without a fund are impossible for most earners; civil protest is the most popular route, but 30 percent hope for foreign intervention, which research sees as unlikely to yield democracy.", "nl": "What these numbers say for strategy: no form of government has a majority, so a covenant leaving the form to a free vote is the only thing all can sign; the wage-to-cost gap means strikes without a fund are impossible for most earners; civil protest is the most popular route, but 30 percent hope for foreign intervention, which research sees as unlikely to yield democracy."}, "sources": ["src:6c0a6f1ef3", "src:5077e79964"], "flags": ["editor-note"]}, {"text": {"fa": "محدودیت‌ها: نمونهٔ گمان داوطلبانه و از راهِ فیلترشکن است (باسوادانِ ۱۵ سال به بالا، فاصلهٔ اطمینانِ حدود ±۳ واحد)؛ آمارِ رسمیِ تورم و بیکاری از منابعِ دولتی است و ممکن است کم‌برآورد باشد.", "en": "Limitations: the GAMAAN sample is voluntary and VPN-recruited; official inflation and unemployment come from government sources and may be underestimates.", "nl": "Limitations: the GAMAAN sample is voluntary and VPN-recruited; official inflation and unemployment come from government sources and may be underestimates."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:claims-economy", "rel": "see-also", "note": {"fa": "ادعاهای اقتصاد", "en": "Economy claims", "nl": "Economy claims"}}, {"to": "simorgh:claims-politics", "rel": "see-also", "note": {"fa": "ادعاهای سیاست", "en": "Politics claims", "nl": "Politics claims"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}, {"to": "simorgh:seven-nights", "rel": "see-also", "note": {"fa": "هفت شب", "en": "Seven nights", "nl": "Seven nights"}}, {"to": "simorgh:gamaan-2026", "rel": "see-also", "note": {"fa": "پیمایشِ گمان (گزارش کامل)", "en": "GAMAAN full report", "nl": "GAMAAN full report"}}], "people": [], "sources": ["src:5077e79964", "src:6c0a6f1ef3", "src:7af62df15e"], "booklets": [], "origin": null, "iran": "iran:cost-of-living-2026", "wikidata": null, "status": "draft"}, {"id": "simorgh:library-collapse", "kind": "concept", "title": {"fa": "کتابخانه: چرا حکومت‌ها ناگهان می‌افتند", "en": "Library: why regimes fall suddenly", "nl": "Library: why regimes fall suddenly"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "پنج منبعِ هستهٔ نظریِ ادعای اصلی: همه می‌دانند، هیچ‌کس نمی‌گوید، تا لحظه‌ای که همه هم‌زمان می‌گویند.", "en": "Library: why regimes fall suddenly", "nl": "Library: why regimes fall suddenly"}, "points": [{"text": {"fa": "Kuran (1995) Private Truths, Public Lies: هسته: نظریهٔ «پنهان‌سازیِ ترجیح»؛ اگر یک کتاب اضافه شود این است.", "en": "Kuran (1995) Private Truths, Public Lies: why it is on the shelf (Persian text).", "nl": "Kuran (1995) Private Truths, Public Lies: why it is on the shelf (Persian text)."}, "sources": ["src:436510de26"], "flags": []}, {"text": {"fa": "Kuran (1991) «Now Out of Never»: هسته: چرا فروپاشیِ ۱۹۸۹ را هیچ‌کس ندید؛ کوتاه و بهترین پاسخ به ژانرِ «تاریخِ سقوط را می‌گویم».", "en": "Kuran (1991) «Now Out of Never»: why it is on the shelf (Persian text).", "nl": "Kuran (1991) «Now Out of Never»: why it is on the shelf (Persian text)."}, "sources": ["src:8d71ed0d5f"], "flags": []}, {"text": {"fa": "Kurzman (2004) The Unthinkable Revolution in Iran: هسته: تا هفته‌های آخر ۵۷ حتی آنان که در خیابان بودند شدنی نمی‌دانستند.", "en": "Kurzman (2004) The Unthinkable Revolution in Iran: why it is on the shelf (Persian text).", "nl": "Kurzman (2004) The Unthinkable Revolution in Iran: why it is on the shelf (Persian text)."}, "sources": ["src:435917f7dd"], "flags": []}, {"text": {"fa": "Lohmann (1994) The Dynamics of Informational Cascades: تظاهراتِ دوشنبه‌های لایپزیگ به‌مثابهٔ آبشار اطلاعاتی؛ مدلِ کمیِ همان استعارهٔ میز.", "en": "Lohmann (1994) The Dynamics of Informational Cascades: why it is on the shelf (Persian text).", "nl": "Lohmann (1994) The Dynamics of Informational Cascades: why it is on the shelf (Persian text)."}, "sources": [], "flags": []}, {"text": {"fa": "Olson (1965) The Logic of Collective Action: مسئلهٔ سواریِ مجانی: چرا اکثریتِ ناراضی لزوماً حرکت نمی‌کند.", "en": "Olson (1965) The Logic of Collective Action: why it is on the shelf (Persian text).", "nl": "Olson (1965) The Logic of Collective Action: why it is on the shelf (Persian text)."}, "sources": ["src:a659e764c0"], "flags": []}], "links": [{"to": "simorgh:library-honesty", "rel": "see-also", "note": {"fa": "این فهرست چه نیست", "en": "What this list is not", "nl": "What this list is not"}}], "people": [], "sources": ["src:435917f7dd", "src:436510de26", "src:8d71ed0d5f", "src:a659e764c0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-demography", "kind": "concept", "title": {"fa": "ادعاهای جمعیت و ساختار", "en": "Claims: demography and structure", "nl": "Claims: demography and structure"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "7 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "7 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "7 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "باروری ۱٫۳۵ تا ۱٫۷ — زیرِ سطحِ جانشینی. (۱٫۳۵–۱٫۷؛ ≈۱۴۰۲–۱۴۰۵؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ رسمیِ باروریِ کل با رقمِ بالاتر از ۲٫۱. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim fertility: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim fertility: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "جمعیتِ دانشجویی از اوجِ ۴٫۸ میلیون به حدودِ ۳٫۱۸ میلیون سقوط کرده. (۴٫۸م ← ۳٫۱۸م؛ ≈۱۳۹۴–۱۴۰۳؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: آمارِ مؤسسهٔ پژوهش و برنامه‌ریزی آموزش عالی با روندِ متفاوت. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim students: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim students: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "سالمندی با پنج برابرِ نرخِ رشدِ کلِ جمعیت پیش می‌رود. (۵× نرخِ رشدِ کل؛ ≈۱۴۰۰ به بعد؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: هرمِ سنیِ رسمی که این نسبت را تأیید نکند. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim aging: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim aging: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "بزرگ‌ترین کوهورتِ تاریخِ ایران در دههٔ ۶۰ متولد شد — ۱٫۹ تا ۲٫۵ میلیون تولد در سال. (۱٫۹–۲٫۵ میلیون/سال؛ دههٔ ۱۳۶۰؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ سالانهٔ ثبتِ احوال یا سرشماری‌های ۱۳۶۵ و ۱۳۷۵ که اوجِ تولد را بیرون از دههٔ ۶۰ یا زیرِ ۱٫۹ میلیون در سال نشان دهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim cohort: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim cohort: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شهرنشینی ۷۷٪ — یکی از سه تعدیلی که مدلِ هزینهٔ این پروژه بر آن سوار است. (۷۷٪؛ ≈۱۴۰۰؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سرشماری یا برآوردِ رسمیِ تازه‌تر (مرکز آمار یا بانک جهانی) که سهمِ جمعیتِ شهری را بیرون از بازهٔ ۷۵–۷۹٪ بگذارد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim urbanization: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim urbanization: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "جمعیتِ مبنای همهٔ مدل‌های هزینهٔ این پروژه: ۸۷ میلیون نفر. (۸۷ میلیون؛ ≈۱۴۰۳؛ ردهٔ 3؛ مبنای مدل). شرطِ ابطال: برآوردِ جمعیتیِ به‌مراتب متفاوت، که کلِ جدولِ هزینه را مقیاس می‌دهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim population: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim population: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدودِ ۸۹٪ بزرگسالانِ ایران (۱۵ سال به بالا) خواندن و نوشتن می‌دانند — یعنی تقریباً یک نفر از هر نُه بزرگسال نمی‌داند؛ در جوانانِ ۱۵ تا ۲۴ سال این نرخ نزدیکِ ۹۹٪ است. (۸۸٫۹٪؛ ۲۰۲۳؛ ردهٔ 1؛ اندازه‌گیری). شرطِ ابطال: سریِ تازه‌ترِ یونسکو یا سرشماریِ رسمی که نرخِ سوادِ بزرگسالان را بیرون از بازهٔ ۸۷–۹۱٪ بدهد. یادداشت: سواد در این تعریف یعنی خواندنِ یک جملهٔ سادهٔ روزمره. «سختی در خواندن» که کارت از آن حرف می‌زند گروهِ بزرگ‌تری است و عددِ جدا ندارد. شکاف در سنینِ بالا و میانِ زنان بیشتر است.", "en": "Claim literacy: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim literacy: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:b05b23c7d2"], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": ["src:b05b23c7d2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:pillars-of-support", "kind": "concept", "title": {"fa": "ستون‌های پشتیبانی: بردِ واقعی یعنی چرخیدنِ ستون‌ها", "en": "Pillars of support: the real win is the pillars shifting", "nl": "Pillars of support: the real win is the pillars shifting"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "هیچ حکومتی با تظاهرات نمی‌افتد؛ وقتی می‌افتد که کسانی که نگهش داشته‌اند دیگر نگهش ندارند. این مدخل شش ستون را برمی‌شمارد و برای هرکدام می‌گوید چه چیزی در پژوهش‌ها ستون را چرخانده است. همه‌چیز در سطحِ نهاد و جمعیت است؛ هیچ فهرست یا پرونده‌ای از آدم‌ها ساخته نمی‌شود.", "en": "No regime falls to demonstrations; it falls when those who hold it up stop. Six pillars, each with what research says has shifted it. Everything is at institution and population level; no lists or files of people.", "nl": "No regime falls to demonstrations; it falls when those who hold it up stop. Six pillars, each with what research says has shifted it. Everything is at institution and population level; no lists or files of people."}, "points": [{"text": {"fa": "اصلِ کار: قدرت به همکاری وابسته است. ستون‌ها (امنیت، دیوان‌سالاری، بازار و اقتصاد، نهادِ دینی، رسانه، پشتیبانانِ خارجی) آدم‌هایی‌اند با منافع، خانواده و ترس؛ چرخیدنشان با تهدید کمتر رخ می‌دهد تا با دیدنِ آیندهٔ امن.", "en": "Principle: power depends on cooperation. Pillars are people with interests, families and fears; they shift less under threat than when they see a safe future.", "nl": "Principle: power depends on cooperation. Pillars are people with interests, families and fears; they shift less under threat than when they see a safe future."}, "sources": ["src:458bea7f0f", "src:9ce61897e7"], "flags": []}, {"text": {"fa": "امنیت: مهم‌ترین و سخت‌ترین. پژوهشِ نپستاد روی شش انقلاب نشان می‌دهد ریزشِ نیروهای مسلح تعیین‌کننده بود؛ و ریزش وقتی بیشتر است که حرکت خشونت‌پرهیز بماند (شلیک به جمعیتِ بی‌سلاح پرهزینه‌تر است) و نیروها دربارهٔ آینده‌شان ضمانت داشته باشند. سپاه ارتشِ شاه نیست؛ لویتسکی و وِی هشدار می‌دهند ارتش‌های زادهٔ انقلاب به‌طرزِ غیرعادی وفادارند. پس هدفِ واقع‌بینانه شکافِ میانِ بدنه و رأس است، نه ریزشِ کل.", "en": "Security: most important and hardest. Defection decided outcomes in Nepstad's cases, more likely when the movement stays nonviolent and forces have guarantees. Revolutionary armies are unusually loyal, so the realistic aim is a gap between rank and top.", "nl": "Security: most important and hardest. Defection decided outcomes in Nepstad's cases, more likely when the movement stays nonviolent and forces have guarantees. Revolutionary armies are unusually loyal, so the realistic aim is a gap between rank and top."}, "sources": ["src:9ce61897e7", "src:41c1e6a2e7", "src:89f0e30575"], "flags": ["editor-note"]}, {"text": {"fa": "شاهد از خودِ ایران (۱۳۵۷): برادری با سرباز (گل، «ارتش جزوِ ملت است») روحیهٔ ارتش را فرو ریخت؛ اعتصابِ چرخشی دولت را از کار انداخت چون سرباز نمی‌تواند پالایشگاه و نیروگاه را بچرخاند؛ و رئیسِ ستاد توانِ ارتش را حدودِ ۵۵٪ برآورد کرد. شرطِ همهٔ این‌ها خشونت‌پرهیز ماندنِ جنبش بود.", "en": "Evidence from Iran itself (1979): fraternisation broke army morale; rolling strikes disabled the state since soldiers cannot run refineries; army capacity about 55 percent. All conditional on the movement staying nonviolent.", "nl": "Evidence from Iran itself (1979): fraternisation broke army morale; rolling strikes disabled the state since soldiers cannot run refineries; army capacity about 55 percent. All conditional on the movement staying nonviolent."}, "sources": ["src:41c1e6a2e7", "src:435917f7dd"], "flags": []}, {"text": {"fa": "دیوان‌سالاری: دولت با این کار می‌کند که هر روز صبح آدم‌ها سرِ کار می‌آیند. «عدمِ همکاریِ اداری» تقریباً غیرقابلِ سرکوب است. درسِ عراق: انحلالِ یک‌بارهٔ دستگاه دولت را از بین برد؛ پس پیامِ پیشاپیش باید این باشد که حقوق و شغلِ کارمندانِ عادی می‌ماند.", "en": "Bureaucracy: administrative non-cooperation is nearly unsuppressible. Iraq lesson: dissolving the apparatus destroyed the state, so the advance message must be that ordinary employees keep pay and jobs.", "nl": "Bureaucracy: administrative non-cooperation is nearly unsuppressible. Iraq lesson: dissolving the apparatus destroyed the state, so the advance message must be that ordinary employees keep pay and jobs."}, "sources": ["src:b76e3ec683"], "flags": []}, {"text": {"fa": "بازار و اقتصاد: موتورِ ۱۸۹۱، مشروطه و ۱۳۵۷؛ و موجِ دی ۱۴۰۴ هم با اعتصابِ کاسب‌ها شروع شد. چیزی که نخبهٔ اقتصادی را می‌چرخاند «تعهدِ معتبر» است: اینکه دارایی‌های مشروع امن‌اند و فقط ثروتِ رانتی بررسی می‌شود.", "en": "Bazaar and economy: engine of 1891, the Constitution and 1979; the January 2026 wave began with shopkeepers' strikes. What shifts economic elites is a credible commitment that legitimate assets are safe.", "nl": "Bazaar and economy: engine of 1891, the Constitution and 1979; the January 2026 wave began with shopkeepers' strikes. What shifts economic elites is a credible commitment that legitimate assets are safe."}, "sources": ["src:241e6a9388", "src:67b6aa8645"], "flags": []}, {"text": {"fa": "نهادِ دینی: یکدست نیست و بخشِ بزرگی از روحانیت از حکومت فاصله گرفته. مخالفتِ روحانی با حکومتِ دینی از هر نقدِ بیرونی گران‌تر تمام می‌شود، چون مشروعیت را در زمینِ خودش می‌زند. پیامِ لازم: آزادیِ دین در میثاق تضمین است و جدایی از حکومت یعنی محافظت از دین، نه حذفِ آن.", "en": "Religious institution: not monolithic; much of the clergy has distanced itself. The needed message: freedom of religion is guaranteed and separation protects religion rather than abolishing it.", "nl": "Religious institution: not monolithic; much of the clergy has distanced itself. The needed message: freedom of religion is guaranteed and separation protects religion rather than abolishing it."}, "sources": [], "flags": []}, {"text": {"fa": "رسانه و بیرون: رسانهٔ رسمی وقتی می‌چرخد که مخاطبش رفته باشد؛ پشتیبانانِ خارجی (روسیه، چین) با منافع می‌چرخند نه با اخلاق. برای اروپا: «این دربارهٔ یک دولت است، نه یک دین و نه یک جامعه».", "en": "Media and outside: state media shifts when its audience has left; foreign backers shift on interests, not morals.", "nl": "Media and outside: state media shifts when its audience has left; foreign backers shift on interests, not morals."}, "sources": [], "flags": []}, {"text": {"fa": "سنجه در سطحِ جمعیت (نه فرد): نشانه‌های چرخش را فقط از گزارش‌های عمومی و معتبر می‌خوانیم: بیانیه‌های علنیِ صنف‌ها، فاصله‌گیریِ علنیِ مراجع، خروجِ سرمایه، گزارش‌های مستقل دربارهٔ اکراهِ نیروها. هرگز کسی شناسایی، فهرست یا گزارش نمی‌شود؛ این خطِ قرمزِ پروژه است.", "en": "Measurement at population level only, from public credible reports. Nobody is ever identified, listed or reported; this is the project's red line.", "nl": "Measurement at population level only, from public credible reports. Nobody is ever identified, listed or reported; this is the project's red line."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:game-reality-map", "rel": "see-also", "note": {"fa": "جدولِ تطبیق", "en": "Game-to-reality map", "nl": "Game-to-reality map"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون کافی نبود", "en": "Why 14 million was not enough", "nl": "Why 14 million was not enough"}}, {"to": "simorgh:threshold-indicators", "rel": "see-also", "note": {"fa": "نشانگرها", "en": "Indicators", "nl": "Indicators"}}, {"to": "soc:consent-theory-of-power", "rel": "see-also", "note": {"fa": "نظریهٔ رضایت در قدرت", "en": "Consent theory of power", "nl": "Consent theory of power"}}, {"to": "soc:security-defection-credible-commitment", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:241e6a9388", "src:41c1e6a2e7", "src:435917f7dd", "src:458bea7f0f", "src:67b6aa8645", "src:89f0e30575", "src:9ce61897e7", "src:b76e3ec683"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-4", "kind": "concept", "title": {"fa": "مرغ‌ها: سازندگان دانایی", "en": "Birds: سازندگان دانایی", "nl": "Birds: سازندگان دانایی"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «سازندگان دانایی» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"سازندگان دانایی\" with the mission and step of each.", "nl": "The five birds of the group \"سازندگان دانایی\" with the mission and step of each."}, "points": [{"text": {"fa": "آموزگار سوادآموزی: مأموریت: هر ایرانی بخواند، بنویسد و بسنجد. قدمِ امروز: به یک نفر چیزی یاد بده. روزِ آزادی: مدرسه پایگاه امن محله. پس از آن: سوادآموزی و کتاب درسی تازه.", "en": "Bird آموزگار سوادآموزی: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird آموزگار سوادآموزی: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پژوهشگر و داده: مأموریت: آمار راست، برای تصمیم درست. قدمِ امروز: یک عدد دفتر ویرانی‌ها را با منبع کامل کن. روزِ آزادی: نگهبانی از اسناد و داده‌ها. پس از آن: سرشماری و آمار رسمی قابل اعتماد.", "en": "Bird پژوهشگر و داده: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird پژوهشگر و داده: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "راستی‌آزما: مأموریت: شایعه نتواند شهر را به هم بریزد. قدمِ امروز: پیش از بازنشر، منبع را بسنج. روزِ آزادی: یک منبع رسمی راستی‌آزمایی‌شده. پس از آن: رسانهٔ عمومی مستقل.", "en": "Bird راستی‌آزما: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird راستی‌آزما: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "رسانه و روایت: مأموریت: روایت همهٔ مردم، نه یک صدا. قدمِ امروز: روایت خودت را بنویس. روزِ آزادی: پوشش آزاد و چندصدایی. پس از آن: قانون رسانهٔ آزاد.", "en": "Bird رسانه و روایت: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird رسانه و روایت: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مترجم: مأموریت: صدای ایران به جهان و برعکس. قدمِ امروز: یک مدخل دانش‌سرا را ترجمه کن. روزِ آزادی: ترجمه برای خبرنگاران خارجی. پس از آن: ترجمهٔ قانون‌ها و تجربه‌های کشورهای دیگر.", "en": "Bird مترجم: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird مترجم: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "تحریف ترجیحات", "en": "تحریف ترجیحات", "nl": "تحریف ترجیحات"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-model", "kind": "concept", "title": {"fa": "ادعاهای مدلِ هزینه و سناریو", "en": "Claims: cost model and scenarios", "nl": "Claims: cost model and scenarios"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "11 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "11 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "11 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "گذارِ میثاقی: هزینهٔ اجرا ۳۰–۶۰ میلیارد دلار؛ اثرِ ده‌ساله +۴۰۰ تا ۸۰۰ میلیارد دلار. (۳۰–۶۰ میلیارد $ / +۴۰۰–۸۰۰؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: مقایسه با گذارهای واقعی (لهستان ۱۹۸۹، آفریقای جنوبی ۱۹۹۰–۹۴، شیلی ۱۹۸۸–۹۰) که بازه را بیرون بیندازد. یادداشت: این پیش‌بینی نیست. مرتبهٔ بزرگی است، نه رقم. ارزشش در مقایسهٔ نسبیِ ستون‌هاست، نه در تک‌عدد. عدمِ قطعیت بالاست. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim cost-covenant: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim cost-covenant: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "گسستِ سریع: ۸۰–۱۵۰ میلیارد دلار؛ اثرِ ده‌ساله +۵۰ تا ۳۰۰ میلیارد دلار؛ افتِ تولید ۱۵–۲۵٪ به مدتِ ۲ تا ۳ سال. (۸۰–۱۵۰ میلیارد $؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: مجموعه‌ای از گذارهای سریعِ قابلِ‌مقایسه که میانگینِ افتِ تولید در سه سالِ اولشان بیرون از ۱۵–۲۵٪ باشد. یادداشت: این پیش‌بینی نیست. مرتبهٔ بزرگی است، نه رقم. ارزشش در مقایسهٔ نسبیِ ستون‌هاست، نه در تک‌عدد. عدمِ قطعیت بالاست. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim cost-rupture: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim cost-rupture: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "چرخهٔ خشونت: ۲۵۰–۵۰۰ میلیارد دلار؛ اثرِ ده‌ساله −۶۰۰ تا ۱٬۲۰۰ میلیارد دلار؛ افتِ تولید ۴۰–۷۰٪ برای پنج سال و بیشتر. (۲۵۰–۵۰۰ میلیارد $؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: مقایسه با سوریه، عراق و لیبی که بازه را بیرون بیندازد. یادداشت: این پیش‌بینی نیست. مرتبهٔ بزرگی است، نه رقم. ارزشش در مقایسهٔ نسبیِ ستون‌هاست، نه در تک‌عدد. عدمِ قطعیت بالاست. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim cost-violence: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim cost-violence: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "ادامهٔ وضعِ موجود: بدونِ رخدادِ واحد، −۴۰۰ تا ۶۰۰ میلیارد دلار هزینهٔ فرصت — با خروجِ نخبگان، سقوطِ باروری و سالمندی. (−۴۰۰ تا ۶۰۰ میلیارد $؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: سناریوی پایه‌ای که فرسایشِ جمعیتی و سرمایهٔ انسانی را جبران‌پذیر نشان دهد. یادداشت: نکتهٔ اصلیِ این سطر: «ماندن» هم قیمت دارد و قیمتش کمتر از بقیه نیست، فقط آهسته‌تر پرداخت می‌شود. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim cost-status-quo: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim cost-status-quo: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "هزینهٔ جانیِ سناریوی خشونت: ۱۰۰ هزار تا بیش از یک میلیون؛ صدکِ ۵۰ ≈۲۵۰ هزار. (۱۰۰هزار تا >۱ میلیون · میانه ≈۲۵۰هزار؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: مقایسه با سوریه (صدها هزار کشته و بیش از ۱۲ میلیون آواره از جمعیتی حدودِ یک‌چهارمِ ایران) که بازه را بیرون بیندازد. یادداشت: سقفِ این سناریو در بازنگری از ۵۰۰ هزار به بیش از یک میلیون تصحیح و صدک گزارش شد — یعنی خودِ مدل یک بار در جهتِ بدبینانه اصلاح شده. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim deaths: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim deaths: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "برنامهٔ پیشنهادی سه افق دارد: ۹۰ روز، ۹ ماه، ۶۰۰ روز. افقِ فازِ سوم در بازنگری از ۹۰۰ به ۶۰۰ روز کوتاه شد. (۹۰ / ۹ / ۶۰۰؛ پیشنهاد؛ ردهٔ 3؛ پیشنهادِ این پروژه). شرطِ ابطال: هر گذارِ مستندی که نشان دهد این افق‌ها غیرواقعی‌اند. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim plan-90-9-600: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim plan-90-9-600: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شاخصِ پیشرو: تنوعِ امضا — نسبتِ امضاکنندگانِ غیرِ پادشاهی‌خواه. هدف بیش از ۵۰٪؛ زیرِ ۳۰٪ یعنی شکستِ نقطهٔ کانونی. (>۵۰٪ هدف · <۳۰٪ شکست؛ ۹۰ روز؛ ردهٔ 3؛ شاخصِ پیشنهادی). شرطِ ابطال: خودِ شاخص ابطال‌پذیر است — اندازه‌گیری‌اش جواب می‌دهد. یادداشت: ارزشِ این سطر در این است که از پیش شرطِ شکستِ خودش را تعریف کرده. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim signature-diversity: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim signature-diversity: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شاخصِ پیشرو: پوششِ صندوقِ اعتصاب — تعدادِ کسانی که سه ماه حقوقشان تضمین شود. هدفِ اولیه: ۱۰٬۰۰۰ نفر. (۱۰٬۰۰۰ نفر؛ ۹۰ روز؛ ردهٔ 3؛ شاخصِ پیشنهادی). شرطِ ابطال: شاخص است، نه ادعا. فرضِ پشتش رد می‌شود اگر صندوق‌هایی با این پوشش وجود داشته باشند و اعتصاب‌ها باز هم پیش از سه ماه بشکنند. یادداشت: با اشتغالِ غیررسمیِ ۶۰٪، اعتصاب بدونِ صندوق عملاً ناممکن است — این دو سطر به هم وصل‌اند. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim fund-coverage: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim fund-coverage: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "طبقِ ارزیابیِ نقل‌شده در منبع، موضع‌گیریِ صریح نسبت به رفتارِ هواداران «۸۰ تا ۹۰ درصدِ مسئله» است. (۸۰–۹۰٪ مسئله؛ —؛ ردهٔ 3؛ ارزیابیِ کیفی). شرطِ ابطال: هیچ روشی برای اندازه‌گیریِ این نسبت ارائه نشده — این ضعفِ خودِ ادعاست. (محلِ نزاع) یادداشت: یک عددِ کیفی است که شکلِ کمّی به خود گرفته. باید با احتیاط خوانده شود. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim supporter-behavior: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim supporter-behavior: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شش ابتکارِ پیشنهادی مجموعاً در مرتبهٔ ده‌ها میلیون دلار هزینهٔ اجرایی دارند — در برابرِ تفاوتِ ده‌سالهٔ سناریوها که در مرتبهٔ صدها میلیارد دلار است. (ده‌ها میلیون در برابر صدها میلیارد؛ افقِ ده‌ساله؛ ردهٔ 3؛ مدلِ این پروژه). شرطِ ابطال: اگر بازه‌های سناریو رد شوند، این نسبت هم بی‌معنا می‌شود. یادداشت: این پیش‌بینی نیست. مرتبهٔ بزرگی است، نه رقم. ارزشش در مقایسهٔ نسبیِ ستون‌هاست، نه در تک‌عدد. عدمِ قطعیت بالاست. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim initiative-cost: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim initiative-cost: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "الگوهای قیاسیِ گذارِ میثاقی: آفریقای جنوبی ۱۹۹۰–۹۴ (چند هزار کشته، بدونِ جنگِ داخلی)، لهستان ۱۹۸۹ (نزدیک به صفر)، شیلی ۱۹۸۸–۹۰. (سه موردِ مرجع؛ ۱۹۸۸–۱۹۹۴؛ ردهٔ 2؛ موردِ تاریخی). شرطِ ابطال: نشان‌دادنِ اینکه شرایطِ اولیهٔ ایران آن‌قدر متفاوت است که قیاس نامعتبر باشد — همان نقدی که در «کسانی که مخالف‌اند» آمده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim transition-models: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim transition-models: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:threshold-simulator", "kind": "concept", "title": {"fa": "شبیه‌سازِ آستانه", "en": "Threshold simulator", "nl": "Threshold simulator"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "ابزاری که نشان می‌دهد وقتی هر کس آستانهٔ پیوستنِ خودش را دارد و فقط اندازهٔ دیده‌شده را می‌بیند، یک جامعه چرا ساکت می‌ماند و چرا ناگهان می‌ریزد.", "en": "A tool showing why a society where everyone has a personal joining threshold and sees only the visible size stays silent, then suddenly falls.", "nl": "A tool showing why a society where everyone has a personal joining threshold and sees only the visible size stays silent, then suddenly falls."}, "points": [{"text": {"fa": "مدلِ آستانه (گرانوتر، کوران): پیوستن به شرطِ دیدنِ کافیِ دیگران؛ یک نفرِ اضافه می‌تواند همه‌چیز را بچرخاند.", "en": "Threshold model: joining conditional on seeing enough others; one more person can tip everything.", "nl": "Threshold model: joining conditional on seeing enough others; one more person can tip everything."}, "sources": ["src:8d71ed0d5f", "src:436510de26"], "flags": []}, {"text": {"fa": "این ابزار آموزشی است و پیش‌بینی نمی‌کند؛ همان‌طور که کرزمن می‌گوید پیش از ۱۳۵۷ حتی کسانی که در خیابان بودند آن را شدنی نمی‌دانستند.", "en": "Educational, not predictive; as Kurzman notes, even people in the street before 1979 did not think it possible.", "nl": "Educational, not predictive; as Kurzman notes, even people in the street before 1979 did not think it possible."}, "sources": ["src:435917f7dd"], "flags": []}], "links": [{"to": "soc:threshold-models-of-collective-behaviour", "rel": "see-also", "note": {"fa": "مدل آستانه", "en": "Threshold model", "nl": "Threshold model"}}, {"to": "simorgh:three-feathers", "rel": "see-also", "note": {"fa": "سه پَر", "en": "The three feathers", "nl": "The three feathers"}}], "people": [], "sources": ["src:435917f7dd", "src:436510de26", "src:8d71ed0d5f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-iran-israel", "kind": "concept", "title": {"fa": "ادعاهای ایران و اسرائیل", "en": "Claims: Iran and Israel", "nl": "Claims: Iran and Israel"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "11 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "11 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "11 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "دشمنیِ رسمیِ دو دولت ۴۷ سال عمر دارد؛ رابطه حدودِ ۲۶۰۰ سال — یعنی دشمنی کمتر از دو درصدِ عمرِ رابطه است. (۴۷ در برابر ۲۶۰۰ سال (۱٫۸٪)؛ ≈۵۳۷ پ.م تا امروز؛ ردهٔ 1؛ محاسبهٔ گاه‌شماری). شرطِ ابطال: تعریفِ دیگری از «شروعِ رابطه» که مبنا را جابه‌جا کند. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim 47-2600: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim 47-2600: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پیش از ۱۳۵۷ نزدیک به ۱۰۰٬۰۰۰ یهودی در ایران زندگی می‌کردند؛ امروز برآوردها ۸٬۵۰۰ تا ۹٬۱۰۰ نفر است. (≈۱۰۰٬۰۰۰ ← ۸٬۵۰۰–۹٬۱۰۰؛ ۱۳۵۷ ← امروز؛ ردهٔ 3؛ برآورد). شرطِ ابطال: برآوردِ نهادیِ مستقل (انجمنِ کلیمیانِ تهران، سرشماری، یا جمعیت‌شناسیِ یهودی) که عددِ امروز را بیرون از ۸٬۵۰۰–۹٬۱۰۰ یا عددِ پیش از ۱۳۵۷ را زیرِ ۸۰٬۰۰۰ بدهد. یادداشت: برآوردها بازه‌اند، نه عددِ دقیق. خودِ متنِ «دو ایران» می‌گوید این رقم باید با احتیاط نقل شود. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim jews-population: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim jews-population: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "۲۰۰٬۰۰۰ تا ۲۵۰٬۰۰۰ اسرائیلی تبارِ ایرانی دارند — کامل یا از یک سو. (۲۰۰٬۰۰۰–۲۵۰٬۰۰۰؛ امروز؛ ردهٔ 3؛ برآورد). شرطِ ابطال: دادهٔ رسمیِ اسرائیل دربارهٔ کشورِ خاستگاه با ارقامِ متفاوت. یادداشت: بازهٔ تخمین؛ در «دو ایران» صریحاً جزوِ ارقامِ محتاطانه‌خوان آمده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim israeli-iranian-descent: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim israeli-iranian-descent: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "روایتِ مشهور می‌گوید سرداری ۱۵۰۰ گذرنامه صادر کرد. موزه این عدد را تأیید نمی‌کند و «به‌طرزِ باورنکردنی بزرگ» می‌خواند؛ آنچه سند دارد فهرستی از ۹۱ نفر در مِیِ ۱۹۴۳ است. (۹۱ مستند، نه ۱۵۰۰؛ ۱۹۴۰–۱۹۴۴؛ ردهٔ 1؛ سندِ نهادی). شرطِ ابطال: سندِ تازه‌ای که شمارِ بزرگ‌تری را مستند کند. تا آن زمان عددِ کوچک‌ترِ مستند معتبر است. یادداشت: این جایی است که پروژه عددِ محبوبِ خودش را رد کرده — و همان قاعده را که بر دیگران می‌گذارد بر خودش اجرا کرده.", "en": "Claim sardari: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim sardari: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:0cbc172c87"], "flags": []}, {"text": {"fa": "استوانهٔ کوروش «نخستین منشورِ حقوقِ بشر» نیست؛ یک کتیبهٔ استانداردِ شاهانهٔ بین‌النهرینی است و خوانشِ حقوق‌بشری عمدتاً ساختهٔ دههٔ ۱۹۵۰–۱۹۷۰ و جشن‌های ۲۵۰۰ ساله است. (رد شد؛ ≈۵۳۹ پ.م / خوانشِ قرنِ بیستم؛ ردهٔ 1؛ سندِ نهادی). شرطِ ابطال: خوانشِ متن‌شناسانهٔ تازه‌ای که قالبِ کتیبه را استثنایی نشان دهد. یادداشت: سیاستِ تحملِ کوروش واقعی بود، ولی ابزارِ حکمرانی بود نه اعلامیهٔ اخلاقی. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim cyrus-cylinder: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim cyrus-cylinder: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "تلمودِ بابلی — بنیادی‌ترین متنِ یهودیتِ ربانی پس از تورات — در خاکِ ساسانی نوشته شد، با وام‌واژه‌های فارسیِ میانه و ردِ حقوقِ ساسانی. (کیفی؛ ≈قرن ۳–۶ م؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: زبان‌شناسیِ تاریخی که وام‌واژه‌ها را از مسیرِ دیگری توضیح دهد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim talmud: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim talmud: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ایران در ۱۹۴۷ به تقسیمِ فلسطین رأیِ مخالف داد، اما در ۶ مارسِ ۱۹۵۰ اسرائیل را عملاً به‌رسمیت شناخت. (۶ مارس ۱۹۵۰؛ ۱۹۴۷ · ۱۹۵۰؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: سندِ دیپلماتیکِ متفاوت دربارهٔ تاریخ یا ماهیتِ شناسایی.", "en": "Claim recognition-1950: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim recognition-1950: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:44045bd6bb"], "flags": []}, {"text": {"fa": "صادرات از ۲۲٫۳ میلیون دلار در ۱۹۷۰ به ۱۰۳٫۲ میلیون دلار در ۱۹۷۷ رسید؛ خطِ لولهٔ ایلات–اشکلون پس از بسته‌شدنِ سوئز در ۱۹۶۷ مشترکاً ساخته شد. (۲۲٫۳م$ ← ۱۰۳٫۲م$؛ ۱۹۷۰–۱۹۷۷؛ ردهٔ 1؛ آمارِ تاریخی). شرطِ ابطال: آمارِ رسمیِ تجارتِ خارجیِ اسرائیل یا منبعِ اولیهٔ دیگری که برای ۱۹۷۰ یا ۱۹۷۷ عددی بیش از ۲۰٪ متفاوت بدهد.", "en": "Claim trade-1970s: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim trade-1970s: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:44045bd6bb"], "flags": []}, {"text": {"fa": "در ۲۰۲۳ صدها هزار اسرائیلی علیهِ طرحِ تغییرِ قوهٔ قضائیه به خیابان آمدند — بیش از ۲۰۰٬۰۰۰ نفر در یک رویداد. (>۲۰۰٬۰۰۰ در یک رویداد؛ ۲۰۲۳؛ ردهٔ 3؛ گزارشِ خبری). شرطِ ابطال: برآوردهای جمعیتیِ مستقل از آن تجمع‌ها با ارقامِ به‌مراتب کمتر. (محلِ نزاع) یادداشت: قیدِ روشی: آن جنبش اصلاحی بود نه براندازانه، پس «قاعدهٔ ۳٫۵٪» به آن منتقل نمی‌شود. مقایسه از این جهت نامعتبر است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim israel-2023: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim israel-2023: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "این خصومت — برخلاف تقریباً هر منازعهٔ دیگرِ خاورمیانه — هیچ ریشهٔ مادی ندارد: نه مرزِ مشترک، نه جنگِ سرزمینی، نه آوارگی، نه رقابت بر سرِ آب. (کیفی؛ ۱۳۵۷ به بعد؛ ردهٔ 3؛ استدلالِ این پروژه). شرطِ ابطال: نشان‌دادنِ یک منفعتِ مادیِ ساختاری که خصومت را مستقل از تصمیمِ سیاسی نگه می‌دارد. یادداشت: نتیجه‌ای که از آن می‌گیرد: چیزی که ریشهٔ مادی ندارد، با تغییرِ سیاست برمی‌گردد. این یک استنتاج است، نه یک یافته. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim no-material-root: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim no-material-root: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "«تا ۱۹۷۹ تقریباً بی‌وقفه مثبت» اغراق است: در صفوی و اوایلِ قاجار موجِ تغییرِ دینِ اجباری، محله‌های جدا و احکامِ نجاست هست. قابِ درست «بهتر از اروپای هم‌دوره» است. (تصحیحِ ادعا؛ ۱۵۰۱–۱۹۲۵؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: تاریخِ اجتماعی‌ای که آن دوره‌ها را استثناهای کوچک نشان دهد. یادداشت: این تصحیحی است که متنِ تازه بر صفحهٔ ق
