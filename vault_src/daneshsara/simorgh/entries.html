دیمیِ خودِ سایت تحمیل کرد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim not-always-good: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim not-always-good: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": ["src:0cbc172c87", "src:44045bd6bb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:step-cards", "kind": "concept", "title": {"fa": "قدمِ تو: 23 کارت، کوچک‌ترین قدمِ هر آدم", "en": "Your step: 23 cards, the smallest step for each person", "nl": "Your step: 23 cards, the smallest step for each person"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "صفحه‌ای که نمی‌گوید چه کار کنید؛ می‌گوید در ۳۲۳ خیزشِ ثبت‌شده چه کار کرد و چه نکرد، و برای هر جورِ آدمی یک کارت دارد با کارهای مرتب‌شده از کم‌خطر به پرخطر. همین‌جا فقط کم‌خطرترینِ هر کارت آمده؛ هیچ‌کس مجبور نیست، و کسی که داخلِ ایران است فقط قدم‌های کم‌خطر را ببیند.", "en": "A page that does not tell you what to do; it says what worked and failed in 323 recorded uprisings, with a card for each kind of person, steps ordered from low to high risk. Only the lowest-risk step of each card is quoted here; nobody is obliged, and anyone inside Iran should see only low-risk steps.", "nl": "A page that does not tell you what to do; it says what worked and failed in 323 recorded uprisings, with a card for each kind of person, steps ordered from low to high risk. Only the lowest-risk step of each card is quoted here; nobody is obliged, and anyone inside Iran should see only low-risk steps."}, "points": [{"text": {"fa": "شما تنها نیستید (ریاضی است نه دلداری): جایی که حرفِ راست خرج دارد همه حرفشان را می‌خورند، هرکس سکوت می‌بیند و فکر می‌کند تنهاست؛ تعداد از شدت مهم‌تر است (۵۳٪ در برابر ۲۶٪)؛ لحظهٔ تعیین‌کننده لحظهٔ ریزش است (سرباز، کارمند، قاضی، مدیر)؛ و هیچ تضمینی نیست: نرخِ موفقیت در دههٔ اخیر افت کرده چون حکومت‌ها یاد گرفته‌اند.", "en": "You are not alone (arithmetic, not consolation); numbers matter more than intensity; the decisive moment is defection; and there is no guarantee, since success rates have fallen.", "nl": "You are not alone (arithmetic, not consolation); numbers matter more than intensity; the decisive moment is defection; and there is no guarantee, since success rates have fallen."}, "sources": ["src:41c1e6a2e7", "src:040033aaf5", "src:436510de26"], "flags": []}, {"text": {"fa": "کوچک‌ترین قدمِ ممکن: یک حرفِ راست به یک نفر که به شما اعتماد دارد؛ استعاره نیست، عیناً همان سازوکارِ شکستنِ تحریفِ ترجیحات است.", "en": "The smallest possible step: one true word to one person who trusts you; exactly the mechanism that breaks preference falsification.", "nl": "The smallest possible step: one true word to one person who trusts you; exactly the mechanism that breaks preference falsification."}, "sources": ["src:436510de26"], "flags": []}, {"text": {"fa": "بخشِ «خطر»: همین حالا در ایران مردم اعدام می‌شوند؛ هر عددِ صفحه میانگینِ ۳۲۳ مورد است و شما یک نفرید. همین‌جا هم نقدها آمده‌اند: رژیم‌های زادهٔ انقلاب دیر می‌میرند، خطرناک‌ترین نقطه وسطِ راه است، عراقِ ۲۰۰۳، «جامعهٔ کوتاه‌مدت»، و نرخِ موفقیتِ کاهنده.", "en": "The \"risk\" section: people are being executed in Iran right now; every number is an average of 323 cases and you are one person. The critiques too: revolutionary regimes die late, the middle of the road is most dangerous, Iraq 2003, the short-term society, and falling success rates.", "nl": "The \"risk\" section: people are being executed in Iran right now; every number is an average of 323 cases and you are one person. The critiques too: revolutionary regimes die late, the middle of the road is most dangerous, Iraq 2003, the short-term society, and falling success rates."}, "sources": ["src:89f0e30575", "src:7fffecad9e", "src:b76e3ec683", "src:f24faf8755"], "flags": ["editor-note"]}, {"text": {"fa": "کاسب و بازاری: در مشروطه و در ۵۷، بستنِ بازار یکی از دو سه چیزی بود که واقعاً کار کرد. نخستین و کم‌خطرترین قدم: بدانید کدام همسایه‌ها با شما می‌بندند. همین دانستن، خودش نصفِ کار است.", "en": "Card: کاسب و بازاری. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کاسب و بازاری. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارگر — به‌ویژه نفت، گاز، پتروشیمی، بندر: این را باید بی‌تعارف گفت: در ۵۷، آنچه کمرِ دولت را شکست تظاهراتِ خیابان نبود، نخستین و کم‌خطرترین قدم: صندوقِ اعتصاب. پژوهش می‌گوید مهم‌ترین چیزی که تعیین می‌کند اعتصاب چند روز دوام می‌آورد،", "en": "Card: کارگر — به‌ویژه نفت، گاز، پتروشیمی، بندر. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کارگر — به‌ویژه نفت، گاز، پتروشیمی، بندر. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "معلم: شوراهای صنفیِ معلمان در ده سال گذشته پیوسته‌ترین تشکلِ سازمان‌یافتهٔ ایران بوده‌اند. نخستین و کم‌خطرترین قدم: لازم نیست چیزی بسازید؛ آنچه هست را پیدا کنید و زنده نگه دارید.", "en": "Card: معلم. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: معلم. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پرستار، پزشک، کادرِ درمان: بیمارستان جایی است که خشونت قابلِ انکار نیست. و ادبیاتِ عدالتِ انتقالی نخستین و کم‌خطرترین قدم: ثبتِ دقیقِ نوعِ جراحت در پروندهٔ پزشکی — کارِ حرفه‌ایِ شماست و همان است که بعداً سند می‌شود.", "en": "Card: پرستار، پزشک، کادرِ درمان. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: پرستار، پزشک، کادرِ درمان. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دانشجو: صادقانه: جنبشِ دانشجویی به‌تنهایی هرگز در ایران حکومتی را عوض نکرده. نخستین و کم‌خطرترین قدم: حلقهٔ بیرون از دانشگاه: کارگر، معلم، کاسب. این دقیقاً همان حلقهٔ مفقوده در هر بارِ قبل بود.", "en": "Card: دانشجو. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: دانشجو. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "راننده — کامیون، تاکسی، اتوبوس، پیک: اعتصاب‌های کامیون‌داران در ۱۳۹۷ و ۱۳۹۸ از مؤثرترین حرکت‌های یک دههٔ اخیر بودند، نخستین و کم‌خطرترین قدم: پخش‌بودن، سپرِ شماست. تجمع نکنید تا سرکوب‌پذیر شوید.", "en": "Card: راننده — کامیون، تاکسی، اتوبوس، پیک. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: راننده — کامیون، تاکسی، اتوبوس، پیک. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارمندِ دولت: دولت با ساختمان و مهر کار نمی‌کند؛ با این کار می‌کند که هر روز صبح آدم‌ها سرِ کار می‌آیند نخستین و کم‌خطرترین قدم: دقیقاً طبقِ آیین‌نامه کار کنید. هیچ اداره‌ای با اجرای کاملِ آیین‌نامه‌اش کار نمی‌کند.", "en": "Card: کارمندِ دولت. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کارمندِ دولت. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سرباز، پلیس، نیروی امنیتی: این کارت مهم‌ترینِ این صفحه است و بی‌تعارف نوشته شده. همهٔ پژوهش‌ها روی یک چیز نخستین و کم‌خطرترین قدم: خانوادهٔ خودتان هم در همان کوچه است. این را پژوهش می‌گوید، نه شعار: همین پیوند است که", "en": "Card: سرباز، پلیس، نیروی امنیتی. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: سرباز، پلیس، نیروی امنیتی. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کسی که پول دارد: ادبیاتِ گذار می‌گوید ریزشِ نخبگانِ اقتصادی یکی از نشانه‌های اصلیِ پایانِ یک نظام است. نخستین و کم‌خطرترین قدم: هزینهٔ وکیل برای کسی که وکیل ندارد.", "en": "Card: کسی که پول دارد. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کسی که پول دارد. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کسی که دستش تنگ است: رک بگویم: شما بیشترین خطر و کمترین پشتوانه را دارید، و هیچ صفحه‌ای حق ندارد نخستین و کم‌خطرترین قدم: بدانید در کوچهٔ شما امشب نانِ چه کسی کم است.", "en": "Card: کسی که دستش تنگ است. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کسی که دستش تنگ است. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کسی که خواندن و نوشتن برایش سخت است: این کارت معمولاً در چنین متن‌هایی نوشته نمی‌شود، و باید نوشته شود. نخستین و کم‌خطرترین قدم: آنچه با چشمِ خودتان دیده‌اید را دقیق تعریف کنید — نه بیشتر، نه کمتر. دقت، اعتبار می‌سازد.", "en": "Card: کسی که خواندن و نوشتن برایش سخت است. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کسی که خواندن و نوشتن برایش سخت است. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "زنِ خانه: خانه جایی است که آن «پنهان‌کردنِ حرف» اولین بار می‌شکند. پژوهشِ کدیور دربارهٔ ۱۴۰۱ نخستین و کم‌خطرترین قدم: گفتنِ حرفِ واقعی سرِ سفره. این دقیقاً همان سازوکار است، نه استعاره.", "en": "Card: زنِ خانه. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: زنِ خانه. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اهلِ منبر، مسجد، هیئت: این کارت هم معمولاً حذف می‌شود و نباید بشود. از نظرِ تاریخی، نخستین و کم‌خطرترین قدم: تأیید نکردن. سکوت از یک منبر، بلند شنیده می‌شود.", "en": "Card: اهلِ منبر، مسجد، هیئت. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: اهلِ منبر، مسجد، هیئت. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "وکیل و حقوق‌دان: ادبیاتِ عدالتِ انتقالی — الستر، هاینر، تایتل — روی یک نکته اصرار دارد: نخستین و کم‌خطرترین قدم: ثبت، حتی وقتی پرونده باخته است. سند برای بعد است.", "en": "Card: وکیل و حقوق‌دان. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: وکیل و حقوق‌دان. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هنرمند، نویسنده، موزیسین: اگر مسئله این است که همه فکر می‌کنند تنهایند، پس چیزی که این را می‌شکند نخستین و کم‌خطرترین قدم: ساختنِ چیزی که بشود بدونِ توضیح فهمید — تصویر، آهنگ، شعرِ کوتاه.", "en": "Card: هنرمند، نویسنده، موزیسین. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: هنرمند، نویسنده، موزیسین. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مهاجر و خارج‌نشین: این را باید کمی ناخوشایند نوشت: پژوهش می‌گوید فشارِ بیرونی به‌ندرت تغییر می‌سازد نخستین و کم‌خطرترین قدم: مستندسازی و بایگانی. آنچه اینجا نگه داشته می‌شود، آنجا پاک می‌شود.", "en": "Card: مهاجر و خارج‌نشین. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: مهاجر و خارج‌نشین. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "متخصص و تحصیل‌کرده: همایون کاتوزیان به ایران می‌گوید «جامعهٔ کوتاه‌مدت»: هر دوره از صفر شروع می‌کند، نخستین و کم‌خطرترین قدم: بنویسید یک وزارتخانه، یک بیمارستان، یک شبکهٔ برق واقعاً چطور کار می‌کند.", "en": "Card: متخصص و تحصیل‌کرده. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: متخصص و تحصیل‌کرده. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اقتصاددان، حسابدار، اهلِ بانک و بودجه: برآوردِ همین پروژه می‌گوید گسستِ سریع و بی‌برنامه با افتِ ۱۵ تا ۲۵ درصدیِ تولید همراه است. بخشِ بزرگی از این هزینه به روزهای اول برمی‌گردد: حقوقی که پرداخت نمی‌شود و پولی که فرو می‌ریزد. کارِ شما این است که آن روزها از پیش فکرشده  نخستین و کم‌خطرترین قدم: عددِ واقعی را نگه دارید: آنچه در کارتان می‌بینید و در آمارِ رسمی نیست.", "en": "Card: اقتصاددان، حسابدار، اهلِ بانک و بودجه. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: اقتصاددان، حسابدار، اهلِ بانک و بودجه. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مهندس و تکنیسینِ آب، برق، گاز و مخابرات: در عراقِ ۲۰۰۳ دولت را خالی شدنِ یک‌بارهٔ دستگاه از بین برد. شبکه‌ای که شما سرپا نگه می‌دارید همان چیزی است که نمی‌گذارد روزِ بعد به هرج‌ومرج برسد. ماندنِ شما سرِ کار، خودش قدم است. نخستین و کم‌خطرترین قدم: بدانید شبکهٔ شما بدونِ کدام آدم‌ها و کدام قطعه‌ها می‌خوابد.", "en": "Card: مهندس و تکنیسینِ آب، برق، گاز و مخابرات. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: مهندس و تکنیسینِ آب، برق، گاز و مخابرات. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "امدادگر، آتش‌نشان، هلال‌احمری، کوهنورد: پژوهش می‌گوید دموکراسی‌هایی دوام آورده‌اند که از دلِ سازمان‌یافتگیِ طولانی بیرون آمده‌اند، نه از یک روزِ پرشور. شما از معدود کسانی هستید که بلدند آدم‌ها را در لحظهٔ سخت سازمان بدهند. نخستین و کم‌خطرترین قدم: کمک‌های اولیه را به پنج نفر در محله یاد بدهید.", "en": "Card: امدادگر، آتش‌نشان، هلال‌احمری، کوهنورد. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: امدادگر، آتش‌نشان، هلال‌احمری، کوهنورد. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "برنامه‌نویس، اهلِ شبکه و امنیت: برای هماهنگی، دانستن کافی نیست؛ هر کس باید بداند که بقیه هم می‌دانند. ابزارِ این دانشِ مشترک را شما می‌سازید و نگه می‌دارید. ولی اولین کارِ شما ساختن نیست، محافظت است. نخستین و کم‌خطرترین قدم: به سه نفرِ نزدیکتان کمک کنید تلفنشان را امن‌تر کنند، با راهنمای نهادهای متخصص، نه با سلیقهٔ خودتان.", "en": "Card: برنامه‌نویس، اهلِ شبکه و امنیت. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: برنامه‌نویس، اهلِ شبکه و امنیت. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "روان‌شناس، مشاور، مددکار: ادبیاتِ عدالتِ انتقالی می‌گوید آنچه در زمانِ سرکوب حفظ شود، دامنهٔ انتخابِ فردا را می‌سازد. بخشی از آن، حافظهٔ آدم‌هاست، و شما کنارِ آن حافظه می‌نشینید: زخمی که شنیده نشود، فردا به انتقام بدل می‌شود. نخستین و کم‌خطرترین قدم: همان کاری را بکنید که بلدید: شنیدن.", "en": "Card: روان‌شناس، مشاور، مددکار. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: روان‌شناس، مشاور، مددکار. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کسی که نمی‌خواهد، یا می‌ترسد: این کارت جدی است، تعارف نیست. همان قاعدهٔ ۳٫۵ درصد یعنی ۹۶٫۵ درصد شرکت نکردند نخستین و کم‌خطرترین قدم: هیچ‌کاری نکردن یک انتخابِ مشروع است و این صفحه آن را محترم می‌شمارد.", "en": "Card: کسی که نمی‌خواهد، یا می‌ترسد. Research hook and lowest-risk first step as in the Persian text.", "nl": "Card: کسی که نمی‌خواهد، یا می‌ترسد. Research hook and lowest-risk first step as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}, {"to": "simorgh:population-groups", "rel": "see-also", "note": {"fa": "بیست گروه", "en": "Twenty groups", "nl": "Twenty groups"}}, {"to": "simorgh:claims-resistance", "rel": "see-also", "note": {"fa": "ادعاهای مقاومت", "en": "Resistance claims", "nl": "Resistance claims"}}, {"to": "simorgh:safety-first", "rel": "see-also", "note": {"fa": "اول ایمنی", "en": "Safety first", "nl": "Safety first"}}], "people": [], "sources": ["src:040033aaf5", "src:41c1e6a2e7", "src:436510de26", "src:7fffecad9e", "src:89f0e30575", "src:b76e3ec683", "src:f24faf8755"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:products-19", "kind": "concept", "title": {"fa": "نوزده محصول: اول آنچه پول می‌سازد", "en": "Nineteen products: money-makers first", "nl": "Nineteen products: money-makers first"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "کسب‌وکارِ پروژه دو سبد دارد: سبدِ یک (سیمرغ: دانش‌سرا، بازی، «سهم من»، نقشهٔ روز بعد) رایگان و بازمتن است؛ سبدِ دو محصول‌هایی در اروپاست که پول در می‌آورند، شبکه می‌سازند و خرجِ سبدِ یک را می‌دهند. هر محصول با مشتری، مدلِ درآمد، سرعت و قدمِ بعد.", "en": "Two baskets: basket one (Simorgh: Daneshsara, the game, My share, the next-day map) is free and open; basket two is products in Europe that earn, build a network and pay for basket one. Each product with customer, revenue model, speed and next step.", "nl": "Two baskets: basket one (Simorgh: Daneshsara, the game, My share, the next-day map) is free and open; basket two is products in Europe that earn, build a network and pay for basket one. Each product with customer, revenue model, speed and next step."}, "points": [{"text": {"fa": "خدمات طراحی محصول و پژوهش کاربر: مشتری: استارتاپ‌ها و شرکت‌های اروپایی؛ مدل: پروژه‌ای یا ساعتی؛ جامعه: جامعهٔ فناوری اروپا؛ سرعت: زود؛ وضع: new. قدمِ بعد: مهارت خودت است و سرمایه نمی‌خواهد: یک صفحهٔ خدمات روی سایت شخصی‌ات و سه پیام به آشناها", "en": "خدمات طراحی محصول و پژوهش کاربر: customer, model, speed and next step, as in the Persian text.", "nl": "خدمات طراحی محصول و پژوهش کاربر: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سنجش سلامت سازمان: مشتری: مدیران منابع انسانی؛ مدل: هزینهٔ سنجش + کارگاه؛ جامعه: روان‌شناسان، مدیران؛ سرعت: زود؛ وضع: have. قدمِ بعد: نمونه آماده است: یک اجرای آزمایشی ارزان یا رایگان در یک شرکت آشنا برا  به فارسی: مشتری: فارسی‌زبانان اروپا؛ مدل: هزینهٔ دوره؛ جامعه: نسل جوان‌تر؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "آموزش کار با هوش مصنوعی به فارسی: customer, model, speed and next step, as in the Persian text.", "nl": "آموزش کار با هوش مصنوعی به فارسی: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دوره‌های گروهی دانش‌سرا: مشتری: فارسی‌زبانان جهان؛ مدل: هر قدر می‌توانی بپرداز؛ جامعه: یادگیرندگانی که مرغ می‌شوند؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "دوره‌های گروهی دانش‌سرا: customer, model, speed and next step, as in the Persian text.", "nl": "دوره‌های گروهی دانش‌سرا: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نسخهٔ چاپی بازی سیمرغ: مشتری: ایرانیان اروپا، کافه‌های بازی؛ مدل: پیش‌فروش؛ جامعه: همان مردمی که دعوت می‌شوند؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "نسخهٔ چاپی بازی سیمرغ: customer, model, speed and next step, as in the Persian text.", "nl": "نسخهٔ چاپی بازی سیمرغ: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فارسی برای کودکان مهاجر: مشتری: خانواده‌های ایرانی؛ مدل: اشتراک؛ جامعه: والدین، آموزگاران داخل ایران؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "فارسی برای کودکان مهاجر: customer, model, speed and next step, as in the Persian text.", "nl": "فارسی برای کودکان مهاجر: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هلندی برای تازه‌واردها (بازی «دور: زبان»): مشتری: تازه‌واردها، آموزشگاه‌ها؛ مدل: فروش و مجوز؛ جامعه: تازه‌واردهای ایرانی؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "هلندی برای تازه‌واردها (بازی «دور: زبان»): customer, model, speed and next step, as in the Persian text.", "nl": "هلندی برای تازه‌واردها (بازی «دور: زبان»): customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ترجمه و مشاورهٔ فرهنگی: مشتری: نهادهای پناهندگی، بیمارستان‌ها؛ مدل: پروژه‌ای؛ جامعه: نهادهای هلندی؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "ترجمه و مشاورهٔ فرهنگی: customer, model, speed and next step, as in the Persian text.", "nl": "ترجمه و مشاورهٔ فرهنگی: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "داشبورد و تحلیل داده برای سازمان‌های مدنی: مشتری: سازمان‌های غیردولتی؛ مدل: پروژه‌ای؛ جامعه: نهادهای حقوق بشری؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "داشبورد و تحلیل داده برای سازمان‌های مدنی: customer, model, speed and next step, as in the Persian text.", "nl": "داشبورد و تحلیل داده برای سازمان‌های مدنی: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "غرفهٔ خوراکی ایرانی: مشتری: بازارها و جشنواره‌ها؛ مدل: حاشیهٔ سود؛ جامعه: محله و رویدادها؛ سرعت: میان؛ وضع: new. قدمِ بعد: ", "en": "غرفهٔ خوراکی ایرانی: customer, model, speed and next step, as in the Persian text.", "nl": "غرفهٔ خوراکی ایرانی: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "روان‌درمانی آنلاین به فارسی: مشتری: فارسی‌زبانان اروپا؛ مدل: کمیسیون جلسه؛ جامعه: درمانگران همکار؛ سرعت: دیر؛ وضع: new. قدمِ بعد: ", "en": "روان‌درمانی آنلاین به فارسی: customer, model, speed and next step, as in the Persian text.", "nl": "روان‌درمانی آنلاین به فارسی: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پادکست و ویدیوی دانش‌سرا: مشتری: شنوندگان فارسی‌زبان؛ مدل: حامی مالی و عضویت؛ جامعه: مخاطب عمومی؛ سرعت: دیر؛ وضع: new. قدمِ بعد: ", "en": "پادکست و ویدیوی دانش‌سرا: customer, model, speed and next step, as in the Persian text.", "nl": "پادکست و ویدیوی دانش‌سرا: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "«همراه»: همراه کار و یادگیری: مشتری: دانشجوها، فریلنسرها؛ مدل: اشتراک؛ جامعه: داوطلبان همراه؛ سرعت: دیر؛ وضع: new. قدمِ بعد: ", "en": "«همراه»: همراه کار و یادگیری: customer, model, speed and next step, as in the Persian text.", "nl": "«همراه»: همراه کار و یادگیری: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "صنایع دستی و فرش: مشتری: خریداران اروپایی؛ مدل: حاشیهٔ سود؛ جامعه: صنعتگران روستایی؛ سرعت: دیر؛ وضع: new. قدمِ بعد: ", "en": "صنایع دستی و فرش: customer, model, speed and next step, as in the Persian text.", "nl": "صنایع دستی و فرش: customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "تور فرهنگی ایران (پس از آزادی): مشتری: گردشگران اروپایی؛ مدل: هزینهٔ تور؛ جامعه: راهنماهای محلی؛ سرعت: دیر؛ وضع: new. قدمِ بعد: ", "en": "تور فرهنگی ایران (پس از آزادی): customer, model, speed and next step, as in the Persian text.", "nl": "تور فرهنگی ایران (پس از آزادی): customer, model, speed and next step, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:circle-table", "rel": "see-also", "note": {"fa": "میزِ دایره‌ای", "en": "Circle table", "nl": "Circle table"}}, {"to": "simorgh:master-plan", "rel": "see-also", "note": {"fa": "نقشهٔ کلان", "en": "Master plan", "nl": "Master plan"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-6", "kind": "concept", "title": {"fa": "مرغ‌ها: سازندگان شهر و کار", "en": "Birds: سازندگان شهر و کار", "nl": "Birds: سازندگان شهر و کار"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «سازندگان شهر و کار» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"سازندگان شهر و کار\" with the mission and step of each.", "nl": "The five birds of the group \"سازندگان شهر و کار\" with the mission and step of each."}, "points": [{"text": {"fa": "شهرساز و مسکن: مأموریت: خانهٔ ایمن برای همه. قدمِ امروز: ایمنی خانه‌ات در زلزله را بسنج. روزِ آزادی: پناهگاه موقت برای بی‌خانمان‌شدگان. پس از آن: ارزیابی ایمنی و نوسازی بافت فرسوده.", "en": "Bird شهرساز و مسکن: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird شهرساز و مسکن: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "حمل‌ونقل: مأموریت: جاده و خودروی ایمن. قدمِ امروز: ایمن رانندگی کن؛ آمار تصادف‌ها را بشناس. روزِ آزادی: حمل‌ونقل عمومی سر کار بماند. پس از آن: جایگزینی خودروهای ناایمن.", "en": "Bird حمل‌ونقل: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird حمل‌ونقل: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نوسازی صنعت: مأموریت: کارخانه‌ها کار کنند و کار بسازند. قدمِ امروز: گلوگاه صنعت خودت را بنویس. روزِ آزادی: کارخانه‌ها و کارگران سر کار بمانند. پس از آن: فناوری تازه و پایان انحصارهای رانتی.", "en": "Bird نوسازی صنعت: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird نوسازی صنعت: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارآفرین و سرمایه‌گذار: مأموریت: کار برای جوانان، در همهٔ استان‌ها. قدمِ امروز: کسب‌وکارت را سرپا نگه دار. روزِ آزادی: مغازه و نانوایی باز. پس از آن: سرمایه‌گذاری در شهرهای دور.", "en": "Bird کارآفرین و سرمایه‌گذار: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird کارآفرین و سرمایه‌گذار: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پاک‌سازی و داوطلبی: مأموریت: هر کس، هر جا، یک کار. قدمِ امروز: یک کار داوطلبانهٔ کوچک در محله. روزِ آزادی: پاک‌سازی فردای جشن. پس از آن: بازسازی مدرسه‌ها و درمانگاه‌ها.", "en": "Bird پاک‌سازی و داوطلبی: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird پاک‌سازی و داوطلبی: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:game-rules-v2", "kind": "concept", "title": {"fa": "قواعدِ بازی، نسخهٔ ۲ (پس از بازبینی)", "en": "Game rules, version 2 (after review)", "nl": "Game rules, version 2 (after review)"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "نسخهٔ قابلِ بازیِ میز برای حلقه و کارگاه، با اصلاح‌هایی که از بازبینیِ منطق بیرون آمد: حذف به‌جای کشتن، کارتِ خروج، ستون‌های پشتیبانی، سه پَر به‌عنوانِ کارتِ هم‌زمان، و شرطِ بردی که با پژوهش جور است. هدف آموزشی است؛ هیچ نقشی به آدمِ واقعی نسبت داده نمی‌شود.", "en": "A playable version of the table for the circle and workshops, with the fixes from the logic review. Educational; no role is ever assigned to a real person.", "nl": "A playable version of the table for the circle and workshops, with the fixes from the logic review. Educational; no role is ever assigned to a real person."}, "points": [{"text": {"fa": "بازیکن‌ها و نقش‌ها: ۱۰ تا ۲۰ نفر؛ کارت‌ها از ۳۷ شخصیت کشیده می‌شوند (حدود یک‌ششم مافیا، یک‌ششم مستقل، بقیه شهر). نقش‌ها پنهان‌اند و هر بازیکن یک «کارتِ ترس» از ۱ تا ۵ دارد که آستانهٔ پیوستنش است و فقط خودش می‌بیند.", "en": "Players and roles: 10 to 20; cards from the 37 characters (about one sixth Mafia, one sixth independent, the rest city). Roles are hidden; each player has a secret fear card from 1 to 5, their joining threshold.", "nl": "Players and roles: 10 to 20; cards from the 37 characters (about one sixth Mafia, one sixth independent, the rest city). Roles are hidden; each player has a secret fear card from 1 to 5, their joining threshold."}, "sources": ["src:436510de26"], "flags": []}, {"text": {"fa": "شش ستون روی میز: امنیت، دیوان‌سالاری، بازار، نهادِ دینی، رسانه، بیرون. هر ستون نشانگری دارد که از «با مافیا» تا «با شهر» حرکت می‌کند. مافیا با شب نگهشان می‌دارد؛ شهر با روز می‌چرخاندشان.", "en": "Six pillars on the table: security, bureaucracy, bazaar, religious institution, media, outside. Each has a marker from \"with Mafia\" to \"with city\".", "nl": "Six pillars on the table: security, bureaucracy, bazaar, religious institution, media, outside. Each has a marker from \"with Mafia\" to \"with city\"."}, "sources": ["src:458bea7f0f"], "flags": []}, {"text": {"fa": "شب: مافیا یکی از سه حرکت را انتخاب می‌کند: سرکوب (یک بازیکنِ شهر یک دور ساکت می‌شود، ولی اگر علنی شود یک ستون یک خانه به سمتِ شهر می‌رود: هزینهٔ سرکوب)، خریدنِ وفاداری (یک ستون یک خانه به سمتِ مافیا، از خزانه که محدود است)، یا قطعِ ارتباط (یک دور هیچ‌کس شمارشِ دیگران را نمی‌بیند).", "en": "Night: the Mafia picks repression (one citizen silenced a round, but if exposed a pillar moves toward the city: the backfire cost), buying loyalty (from a limited treasury), or cutting communications.", "nl": "Night: the Mafia picks repression (one citizen silenced a round, but if exposed a pillar moves toward the city: the backfire cost), buying loyalty (from a limited treasury), or cutting communications."}, "sources": ["src:4d809f4a2a", "src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "روز: هر بازیکن پنهانی «می‌آیم» یا «صبر می‌کنم» می‌گذارد؛ فقط جمع شمرده و اعلام می‌شود. اگر جمع از آستانهٔ کسی بالاتر بود، در دورِ بعد بی‌هزینه می‌آید (آبشار). هیچ بازیکنی نمی‌تواند دیگری را «حذف» کند؛ تنها حرکت پس‌گرفتنِ همکاری است.", "en": "Day: each player secretly places \"I come\" or \"I wait\"; only the total is announced. Above someone's threshold, they join free next round (cascade). No player can eliminate another; the only move is withdrawing cooperation.", "nl": "Day: each player secretly places \"I come\" or \"I wait\"; only the total is announced. Above someone's threshold, they join free next round (cascade). No player can eliminate another; the only move is withdrawing cooperation."}, "sources": ["src:436510de26", "src:a659e764c0"], "flags": []}, {"text": {"fa": "افزوده از کوران (بازیِ انتظار): در اعلامِ روز، مافیا می‌تواند کارتِ «عددسازی» بازی کند: جمعِ اعلام‌شده دو واحد کمتر از واقعی گفته می‌شود. کارتِ آمار این را خنثی می‌کند. اگر شهر خودش عدد را بزرگ اعلام کند و بعد لو برود، کارتِ آمارش تا پایانِ بازی بی‌اثر می‌شود. درس: در جنگِ انتظار، اعتبار تنها سرمایه است.", "en": "Added from Kuran (expectations game): the Mafia may play a \"fake count\" card lowering the announced total by two; the statistics card cancels it. If the city inflates its own count and is exposed, its statistics card is void for the rest of the game.", "nl": "Added from Kuran (expectations game): the Mafia may play a \"fake count\" card lowering the announced total by two; the statistics card cancels it. If the city inflates its own count and is exposed, its statistics card is void for the rest of the game."}, "sources": ["src:436510de26"], "flags": []}, {"text": {"fa": "افزوده از درسِ ۱۳۵۷ (حرکتِ «در خانه»): در هر روز، بازیکنِ شهر به‌جای «می‌آیم» می‌تواند «در خانه» بگذارد: نصفِ وزنِ «می‌آیم» را دارد ولی سرکوبِ شب نمی‌تواند هدفش بگیرد. این حرکت مشارکتِ کم‌خطر را مدل می‌کند، همان که در ۱۳۵۷ بعد از کشتارها جنبش را زنده نگه داشت.", "en": "Added from 1979 (the stay-home move): a citizen may play \"at home\" instead of \"I come\": half the weight, but immune to the night's repression. Models low-risk participation that kept the 1979 movement alive after massacres.", "nl": "Added from 1979 (the stay-home move): a citizen may play \"at home\" instead of \"I come\": half the weight, but immune to the night's repression. Models low-risk participation that kept the 1979 movement alive after massacres."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "سه کارتِ پَر: آمار (جمع را برای همه دقیق نشان می‌دهد و «قطعِ ارتباط» را بی‌اثر می‌کند)، صندوق (هزینهٔ «می‌آیم» را برای یک صنف صفر می‌کند)، و ضمانت (متنِ عدالت بدون انتقام؛ ستونِ امنیت و دیوان‌سالاری را دو خانه می‌چرخاند). هر پَر فقط وقتی اثر دارد که دست‌کم سه بازیکن هم‌زمان بازی‌اش کنند.", "en": "Three feather cards: statistics, fund and guarantee; each works only if at least three players play it at the same time.", "nl": "Three feather cards: statistics, fund and guarantee; each works only if at least three players play it at the same time."}, "sources": ["src:e0cb8fb11f"], "flags": []}, {"text": {"fa": "کارتِ خروج: هر بازیکنِ شهر می‌تواند برود؛ از شمارِ شهر کم می‌شود و یک «صدای بیرونی» می‌گیرد که فقط کارتِ آمار یا صندوق را تقویت می‌کند. کارتِ قدرتِ خارجی (دستِ مستقل‌ها): می‌تواند یک ستون را بشکند ولی ستونِ «رسانه» را برای شهر یک خانه عقب می‌برد (هزینهٔ مشروعیت).", "en": "Exit card and outside-power card (independents), with the legitimacy cost of outside force.", "nl": "Exit card and outside-power card (independents), with the legitimacy cost of outside force."}, "sources": ["src:6ec0c8ba1e", "src:5077e79964"], "flags": []}, {"text": {"fa": "برد و باخت: شهر می‌برد اگر دست‌کم چهار ستون از شش به سمتِ شهر بچرخند و «میثاق» را بازیکنانی از هر سه جناح امضا کنند. مافیا می‌برد اگر بازی به دورِ دهم برسد. هر دو می‌بازند (چرخهٔ خشونت) اگر در دوری کسی کارتِ انتقام بازی کند: در آن صورت همهٔ ستون‌ها یک خانه به سمتِ «فروپاشی» می‌روند.", "en": "Win and loss: the city wins if four of six pillars shift and the covenant is signed by players from all three factions; the Mafia wins if the game reaches round ten; everyone loses if a revenge card is played.", "nl": "Win and loss: the city wins if four of six pillars shift and the covenant is signed by players from all three factions; the Mafia wins if the game reaches round ten; everyone loses if a revenge card is played."}, "sources": ["src:41c1e6a2e7", "src:7fffecad9e"], "flags": []}, {"text": {"fa": "گفت‌وگوی پس از بازی (ده دقیقه): کجا آبشار راه افتاد، کدام ستون اول چرخید، کی خروج کرد و چرا. این بخش مهم‌ترین قسمتِ کارگاه است.", "en": "Post-game debrief (ten minutes): where the cascade started, which pillar shifted first, who exited and why.", "nl": "Post-game debrief (ten minutes): where the cascade started, which pillar shifted first, who exited and why."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:game-reality-map", "rel": "see-also", "note": {"fa": "جدولِ تطبیق", "en": "Game-to-reality map", "nl": "Game-to-reality map"}}, {"to": "simorgh:ten-turn-game", "rel": "see-also", "note": {"fa": "بازیِ ده‌نوبتی", "en": "Ten-turn game", "nl": "Ten-turn game"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌ها", "en": "Pillars", "nl": "Pillars"}}, {"to": "simorgh:products-19", "rel": "see-also", "note": {"fa": "کارگاه بازیِ جدی (محصول)", "en": "Serious-game workshop", "nl": "Serious-game workshop"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "نظریه: تحریفِ ترجیحات (کوران)", "en": "Theory: preference falsification", "nl": "Theory: preference falsification"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:436510de26", "src:458bea7f0f", "src:4d809f4a2a", "src:5077e79964", "src:6ec0c8ba1e", "src:7fffecad9e", "src:a659e764c0", "src:e0cb8fb11f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-politics", "kind": "concept", "title": {"fa": "ادعاهای سیاست و افکار عمومی", "en": "Claims: politics and public opinion", "nl": "Claims: politics and public opinion"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "8 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "8 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "8 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "۷۲٫۹٪ موافقِ جدایی نهادِ دین از حکومت — بر پایهٔ پیمایشِ خودِ دستگاهِ حاکم، که در هشت سال از ۳۰٫۷٪ به اینجا رسیده. (۳۰٫۷٪ ← ۷۲٫۹٪؛ ≈۸ سال؛ ردهٔ 1؛ پیمایش). شرطِ ابطال: متنِ اصلیِ پیمایش که پرسش را جورِ دیگری صورت‌بندی کرده باشد، یا نمونه‌گیریِ غیرِ نماینده. (محلِ نزاع) یادداشت: قوی‌ترین عددِ پروژه از این نظر که از منبعِ مخالف می‌آید. ولی تفسیرش محدود است: این پشتیبانی از براندازی یا از هیچ آلترناتیوِ مشخصی نیست. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim secularism-survey: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim secularism-survey: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "ائتلافِ حاکم ۱۰–۱۵٪ و اکثریتِ مقابل ۸۰–۸۵٪ — ولی این برآوردِ کیفیِ دو تحلیل‌گر است، نه یافتهٔ پیمایشی. (۱۰–۱۵٪ در برابر ۸۰–۸۵٪؛ ≈۱۴۰۴؛ ردهٔ 3؛ برآوردِ کیفی). شرطِ ابطال: هر پیمایشِ مستقلِ قابلِ اتکا — که وجود ندارد. تا آن زمان این عدد احرازشدنی نیست. (محلِ نزاع) یادداشت: خودِ سند می‌گوید آنچه با داده قابلِ دفاع است این است: «اکثریتی بزرگ، جایی میان دوسوم تا سه‌چهارم». استدلال به بازهٔ محافظه‌کارانه هم مقاوم است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim coalition-size: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim coalition-size: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "این یک بازیِ مجموع‌صفر نیست؛ یک بازیِ هماهنگی با تعادل‌های چندگانه است — پس تقاضا اشباع است و منابع باید صرفِ ساختنِ باورِ مشترک شود. (کیفی؛ —؛ ردهٔ 2؛ چارچوبِ نظری). شرطِ ابطال: شواهدی که نشان دهد مسئله همچنان متقاعدکردنِ مردم دربارهٔ وضعِ موجود است، نه نبودِ گزینهٔ بعدی.", "en": "Claim coordination-game: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim coordination-game: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:436510de26", "src:e0cb8fb11f"], "flags": []}, {"text": {"fa": "نظام‌هایی که از دلِ یک انقلابِ اجتماعیِ واقعی بیرون آمده‌اند — با حزب و ارتشِ خودساخته — به‌طرزِ غیرعادی بادوام‌اند. سپاه، ارتشِ شاه نیست. (کیفی؛ —؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: موردِ کافیِ رژیم‌های انقلابی که با فشارِ مدنی فروپاشیده‌اند. (محلِ نزاع) یادداشت: این نقدی است بر خودِ این پروژه: قیاسِ ایرانِ امروز با اروپای شرقیِ ۱۹۸۹ را زیرِ سؤال می‌برد.", "en": "Claim revolutionary-durability: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim revolutionary-durability: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:89f0e30575"], "flags": ["editor-note"]}, {"text": {"fa": "در ۲۰۰۳ انحلالِ یک‌بارهٔ ارتش و دستگاهِ حزبی، دولت را از بین برد — نه پاکش کرد و نه دموکراسی آورد. (کیفی؛ ۲۰۰۳؛ ردهٔ 2؛ موردِ تاریخی). شرطِ ابطال: ارزیابی‌ای که انحلالِ یک‌بارهٔ نهادهای امنیتی را در جایی موفق نشان دهد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim iraq-2003: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim iraq-2003: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "«هر نهادی تا وقتی بیرون از قدرت است متحدِ مردم است» صورتِ دیگری از قانونِ آهنینِ الیگارشیِ میخلز است — و نقض دارد. (کیفی؛ —؛ ردهٔ 2؛ چارچوبِ نظری). شرطِ ابطال: همان دو نقضِ موردی که در متن آمده — و هر موردِ سومی مثلِ آن‌ها. (محلِ نزاع) یادداشت: خودِ متنِ «دو ایران» این قاعده را به‌خاطرِ جبرگرایی نقد می‌کند.", "en": "Claim michels: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim michels: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:486ebb0384"], "flags": ["editor-note"]}, {"text": {"fa": "ادبیاتِ عدالتِ انتقالی بر یک نکته هم‌صداست: آنچه در زمانِ سرکوب ثبت و نگه‌داری شود، دامنهٔ حقیقت‌یابی و دادرسیِ پس از گذار را تعیین می‌کند. (کیفی؛ گذارهای ۱۹۸۰–۲۰۰۰؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: گذارهایی که در آن‌ها، با وجودِ نبودِ سوابقِ دورهٔ سرکوب، حقیقت‌یابی یا دادرسی به همان اندازه پیش رفته باشد. یادداشت: این جمع‌بندیِ ما از سه کتاب است، نه یافتهٔ کمّیِ یکی از آن‌ها؛ هیچ‌کدام برای «سقفِ عدالتِ فردا» عددی نمی‌دهند.", "en": "Claim transitional-justice: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim transitional-justice: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:b16fff45ff", "src:611b119f9f", "src:bb9258a7c8"], "flags": []}, {"text": {"fa": "در مطالعهٔ تطبیقیِ گذار از اقتدارگرایی، گذاری پیدا نشد که آغازش — مستقیم یا غیرمستقیم — پیامدِ شکافی مهم درونِ خودِ رژیم نباشد. (کیفی؛ گذارهای ۱۹۷۴–۱۹۸۶؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: گذاری مستند که بی‌هیچ شکافِ درونیِ رژیم آغاز شده باشد. (محلِ نزاع) یادداشت: اودانل و اشمیتر از شکافِ «درونِ رژیم» حرف می‌زنند، نه مشخصاً ریزشِ نخبگانِ اقتصادی که کارت می‌گوید. ادعای دومِ کارت — «بیشترین اثر به‌ازای هر ریال در دفاعِ حقوقی و خانوادهٔ زندانی است» — در هیچ گزارشی پیدا نشد؛ تا منبع پیدا شود باید نرم یا حذف شود.", "en": "Claim elite-split: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim elite-split: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:a4e411ed75"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": ["src:436510de26", "src:486ebb0384", "src:611b119f9f", "src:89f0e30575", "src:a4e411ed75", "src:b16fff45ff", "src:bb9258a7c8", "src:e0cb8fb11f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-security", "kind": "concept", "title": {"fa": "ادعاهای امنیت و جنگ", "en": "Claims: security and war", "nl": "Claims: security and war"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "4 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "4 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "4 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "شورای اتحادیهٔ اروپا در ۱۹ فوریهٔ ۲۰۲۶ سپاه را در فهرستِ تروریستیِ اتحادیه قرار داد. (۱۹ فوریه ۲۰۲۶؛ ۲۰۲۶؛ ردهٔ 1؛ سندِ رسمی). شرطِ ابطال: متنِ رسمیِ تصمیم — مستقیماً قابلِ بررسی است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim eu-irgc: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim eu-irgc: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "عملیاتِ برون‌مرزیِ ایران در اروپا و پیوندش با جنایتِ سازمان‌یافته — ارقامِ ۲۱۸ / ۱۰۲ / ۵۴ و نقلِ‌قولِ DGSI. (۲۱۸ / ۱۰۲ / ۵۴؛ —؛ ردهٔ 1؛ پژوهشِ نهادی). شرطِ ابطال: متنِ گزارشِ ICCT که این ارقام یا نقلِ‌قولِ DGSI را نداشته باشد، یا ارقامِ دیگری بدهد. یادداشت: معنای دقیقِ هر سه رقم در خودِ گزارشِ ICCT است؛ در این سایت فقط ارجاع داده شده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim icct: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim icct: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بیانیهٔ مشترکِ چهارده کشور دربارهٔ توطئه‌های ترور و ربایشِ فرامرزی، ۲۰۲۵. (۱۴ کشور؛ ۲۰۲۵؛ ردهٔ 1؛ سندِ رسمی). شرطِ ابطال: متنِ رسمیِ بیانیه که شمارِ امضاکنندگان را غیر از ۱۴ یا تاریخش را غیر از ۲۰۲۵ نشان دهد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim joint-statement: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim joint-statement: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "از اسفندِ ۱۴۰۴ جنگی در جریان بوده که در آن ایران زیرِ حملهٔ آمریکا و اسرائیل قرار گرفت؛ آتش‌بسِ فروردینِ ۱۴۰۵ در خرداد تمدید شد اما گزارش‌ها می‌گویند هر دو طرف بارها نقضش کرده‌اند. (اسفند ۱۴۰۴ –؛ ۱۴۰۴–۱۴۰۵؛ ردهٔ 3؛ گزارشِ خبری). شرطِ ابطال: هر گزارشِ معتبر که تاریخ‌های این سطر را نقض کند: آغاز در اسفندِ ۱۴۰۴ و آتش‌بسِ فروردینِ ۱۴۰۵. یادداشت: بزرگ‌ترین بدهیِ این پروژه: تحلیلِ اصلیِ «متنِ کاملِ بازی» پیش از این رویدادها نوشته شده و حکومتی منسجم با رأسِ مشخص فرض می‌کند. آن فرض دیگر بدیهی نیست. این سطر رویدادی در جریان را ثبت می‌کند و باید در هر بازبینیِ سند دوباره دیده شود. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim war-1404: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim war-1404: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:europe-deck", "kind": "concept", "title": {"fa": "ارائهٔ اروپا، فایل‌های پرسش‌وپاسخ و دانلودها", "en": "Europe deck, Q&A files and downloads", "nl": "Europe deck, Q&A files and downloads"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "ارائه‌ای دوزبانه برای مخاطبِ اروپایی (حالتِ اسلاید، ۲۲ اسلایدِ PPTX)، دو فایلِ پرسش‌وپاسخ (دربارهٔ سایت و دربارهٔ ارائه) و صفحهٔ دانلودها که فایل‌های باز را یک‌جا می‌دهد.", "en": "A bilingual deck for a European audience (slide mode, 22-slide PPTX), two Q&A files (about the site and about the deck) and a downloads page that gives the open files in one place.", "nl": "A bilingual deck for a European audience (slide mode, 22-slide PPTX), two Q&A files (about the site and about the deck) and a downloads page that gives the open files in one place."}, "points": [{"text": {"fa": "ارائه: همان استدلال با زبانِ سیاستِ اروپایی و منبع‌های ICCT و دیگران؛ جملهٔ اجباریِ دربارهٔ ایران و اسرائیل در هر نسخه می‌ماند.", "en": "The deck: the same argument in European policy language with ICCT and other sources; the mandatory Iran-Israel sentence stays in every version.", "nl": "The deck: the same argument in European policy language with ICCT and other sources; the mandatory Iran-Israel sentence stays in every version."}, "sources": [], "flags": []}, {"text": {"fa": "فایل‌ها: par-simorgh-deck.pptx (۲۲ اسلاید)، QA-site و QA-simorgh-europe، claims-dataset.json، problems-dataset.json، و ابزارِ voice2text که در مرورگر کار می‌کند و صدا را به جایی نمی‌فرستد.", "en": "Files: the PPTX deck, the two Q&A documents, the two datasets, and the voice2text tool that runs in the browser and sends audio nowhere.", "nl": "Files: the PPTX deck, the two Q&A documents, the two datasets, and the voice2text tool that runs in the browser and sends audio nowhere."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:tools-directory", "rel": "see-also", "note": {"fa": "فهرست ابزارها", "en": "Tools directory", "nl": "Tools directory"}}, {"to": "tarikh:iran-and-jews", "rel": "see-also", "note": {"fa": "ایران و اسرائیل", "en": "Iran and Israel", "nl": "Iran and Israel"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:roles-47", "kind": "concept", "title": {"fa": "۴۷ نقشِ اجتماعی: نقشه و ماتریسِ تصمیم", "en": "47 social roles: map and decision matrix", "nl": "47 social roles: map and decision matrix"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "جامعه روی میز به ۴۷ نقش شکسته شده: ۱۲ در سمتِ حاکمیت، ۱۸ شهروند، ۱۷ مستقل و میانی. هر نقش یک اهرم و یک هزینهٔ مخصوص دارد؛ ماتریس نشان می‌دهد هر نقش کجای میز می‌نشیند.", "en": "Society on the table is split into 47 roles: 12 on the ruling side, 18 citizens, 17 independent and intermediate. Each has its own leverage and cost; the matrix shows where each sits.", "nl": "Society on the table is split into 47 roles: 12 on the ruling side, 18 citizens, 17 independent and intermediate. Each has its own leverage and cost; the matrix shows where each sits."}, "points": [{"text": {"fa": "سه گروه: ۱۲ نقشِ حاکمیت، ۱۸ نقشِ شهر، ۱۷ نقشِ مستقل و میانی؛ هر کدام در یک مدخلِ جدا آمده.", "en": "Three groups, each in its own entry.", "nl": "Three groups, each in its own entry."}, "sources": [], "flags": []}, {"text": {"fa": "این تقسیم فقط در سطحِ نقش و جمعیت است؛ هیچ فرد یا فهرستی از آدم‌های واقعی ساخته نمی‌شود و ساخته نخواهد شد.", "en": "The split is at the level of roles and populations only; no list of real people is or will be built.", "nl": "The split is at the level of roles and populations only; no list of real people is or will be built."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "ابزار: صفحهٔ نقش‌ها (ماتریس تصمیم)، «چرا؟» (علمِ هر نقش) و میزِ دایره‌ای.", "en": "Tools: roles page (decision matrix), the \"why\" page (science of each role) and the circle table.", "nl": "Tools: roles page (decision matrix), the \"why\" page (science of each role) and the circle table."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:roles-ruling", "rel": "see-also", "note": {"fa": "۱۲ نقش حاکمیت", "en": "12 ruling roles", "nl": "12 ruling roles"}}, {"to": "simorgh:roles-citizen", "rel": "see-also", "note": {"fa": "۱۸ نقش شهروند", "en": "18 citizen roles", "nl": "18 citizen roles"}}, {"to": "simorgh:roles-independent", "rel": "see-also", "note": {"fa": "۱۷ نقش مستقل", "en": "17 independent roles", "nl": "17 independent roles"}}, {"to": "simorgh:tools-directory", "rel": "see-also", "note": {"fa": "فهرست ابزارها", "en": "Tools directory", "nl": "Tools directory"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:poll-integrity", "kind": "concept", "title": {"fa": "شمارشِ شفاف و بازیِ ضدِ تقلب", "en": "Transparent counting and the anti-cheating game", "nl": "Transparent counting and the anti-cheating game"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "هر کانال یا حسابی که پرسشِ «نبضِ میز» را اجرا می‌کند یک «ایالت» است: جدا شمرده می‌شود، روی نقشهٔ ایالت‌ها با رنگِ پرطرفدارترین گزینه و کم‌رنگیِ متناسب با اعتبار دیده می‌شود، و جمعِ کل با فرمولی علنی ساخته می‌شود. کنارش دفترِ تقلب است: هر حرکتِ تقلبیِ ممکن، ردی که در داده می‌گذارد و پاسخِ ما. دو ایجنت روی آن کار می‌کنند: قرمز حرکتِ بعدی را پیدا می‌کند، آبی خنثی‌اش می‌کند.", "en": "Each channel running the poll is a \"state\": counted separately, shown on a state map coloured by its leading option and faded by credibility, combined by a public formula. Beside it, a cheating ledger of moves, traces and counters, worked on by a red and a blue agent.", "nl": "Each channel running the poll is a \"state\": counted separately, shown on a state map coloured by its leading option and faded by credibility, combined by a public formula. Beside it, a cheating ledger of moves, traces and counters, worked on by a red and a blue agent."}, "points": [{"text": {"fa": "وزنِ هر ایالت: اعتبار × رادیکالِ شمارِ رأی. اعتبار با هر پرچم ۰٫۳ کم می‌شود (کف ۰٫۱) و زیرِ ۳۰۰ رأی صفر است. رادیکال نمی‌گذارد یک ایالتِ خیلی بزرگ بقیه را ببلعد. این همان منطقِ وزن‌دهیِ نمونه است که پیمایش‌های جدی به کار می‌برند، با این تفاوت که این‌جا وزن به اعتبار بسته است نه به سن و جنس، چون از رأی‌دهنده هیچ داده‌ای نمی‌گیریم.", "en": "State weight = credibility × square root of votes; credibility drops 0.3 per flag (floor 0.1), zero under 300 votes.", "nl": "State weight = credibility × square root of votes; credibility drops 0.3 per flag (floor 0.1), zero under 300 votes."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "سه نشانهٔ آماریِ تقلب، فقط از جمعِ رأی‌ها: (۱) هجومِ ناگهانی: یک ساعت بیش از ۳۵٪ کلِ رأی‌ها (شمارشِ ساعتی)؛ (۲) رأی‌های آخر با رأی‌های اول فرق دارند (فاصلهٔ دو توزیع بیش از ۰٫۲)، نشانهٔ بسیجِ یک گروه؛ (۳) ایالتی که با میانهٔ بقیه بیش از ۰٫۳ فاصله دارد، نشانهٔ تصاحب یا تفاوتِ واقعیِ مخاطب. هیچ ایالتی حذف نمی‌شود؛ فقط پرچم و وزنِ کمتر می‌گیرد و همه چیز نشان داده می‌شود.", "en": "Three statistical traces from totals only: hourly burst, early-late drift, divergence from the other states; nothing is deleted, only flagged and down-weighted.", "nl": "Three statistical traces from totals only: hourly burst, early-late drift, divergence from the other states; nothing is deleted, only flagged and down-weighted."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "دفترِ تقلب با نُه حرکتِ آغازین: ارتشِ ربات، بسیجِ گروهِ سازمان‌یافته، تصاحبِ کانال، نظرسنجیِ جعلی، جعلِ اسکرین‌شات، ترساندن، بی‌اعتبار کردنِ مرجع، خواستنِ نمایشِ رأی، تفسیرِ وارونه. هر کدام با ردش در داده و پاسخش. همهٔ قاعده‌ها علنی است، چون تقلبی که دیده شود دیگر کار نمی‌کند.", "en": "The ledger starts with nine moves, each with its trace and counter; all rules are public.", "nl": "The ledger starts with nine moves, each with its trace and counter; all rules are public."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:pulse-poll", "rel": "see-also", "note": {"fa": "نبضِ میز", "en": "Pulse poll", "nl": "Pulse poll"}}, {"to": "simorgh:pre-mortem", "rel": "see-also", "note": {"fa": "پیش‌مرگ", "en": "Pre-mortem", "nl": "Pre-mortem"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "بازیِ انتظار (کوران)", "en": "Expectations game", "nl": "Expectations game"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:tools-directory", "kind": "concept", "title": {"fa": "فهرستِ همهٔ ابزارها و جایی که هرکدام زندگی می‌کند", "en": "Directory of all tools and where each lives", "nl": "Directory of all tools and where each lives"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "هیچ ابزاری حذف نشده؛ اینجا همه با یک جمله و جای زندگی‌شان آمده‌اند. ابزارها در دو جا هستند: صفحه‌های عمومیِ «پَرِ سیمرغ» و لایهٔ خصوصیِ گاوصندوق.", "en": "No tool was removed; all appear here with one line and where they live. They are in two places: the public Par-e Simorgh pages and the private vault layer.", "nl": "No tool was removed; all appear here with one line and where they live. They are in two places: the public Par-e Simorgh pages and the private vault layer."}, "points": [{"text": {"fa": "ابزارهای صفحهٔ عمومی: نقشهٔ استدلال (argmap)؛ وارسیِ یک ادعا (inspect، چهار گام)؛ سلامتِ دیتاست (health، شمارندهٔ زنده)؛ وضعیتِ اسناد (status)؛ ممیزی (audit)؛ جدولِ داده (data، ۸۴ ادعا)؛ نقشهٔ مشکل‌ها (problems، ۲۴ مشکل)؛ خطِ زمان (timeline)؛ کتابخانه (library)؛ دو ایران (two-irans)؛ ایران و اسرائیل (shared)؛ قدمِ تو (gam، ۲۳ کارت)؛ سندِ راهبردی (sanad-rahbordi) و نسخهٔ کوتاهش (eraee-rahbordi)؛ بازیِ کامل (game، ۱۲ جلد)؛ نقش‌ها (roles، ۴۷ نقش)؛ ارائهٔ اروپا (europe)؛ دانلودها (downloads)؛ voice2text (در مرورگر، صدا را نمی‌فرستد).", "en": "Public-page tools as listed.", "nl": "Public-page tools as listed."}, "sources": [], "flags": []}, {"text": {"fa": "ابزارهای لایهٔ خصوصی (گاوصندوق): نقشهٔ کلان (plan)، سی مرغ (birds)، میزِ دایره‌ای (circle)، بازیِ ده‌نوبتی (sim)، حدسِ پانزده گذار (transitions)، چرا؟ (why، علمِ ۴۷ نقش)، و دفترِ پروژه که هر روز تغییرها را ثبت می‌کند.", "en": "Private-layer tools as listed.", "nl": "Private-layer tools as listed."}, "sources": [], "flags": []}, {"text": {"fa": "سهم من: همین صفحه: دو پرسش، سه قدم [آماده]", "en": "سهم من: status as in the Persian text.", "nl": "سهم من: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دفتر پروژه: خودکار: هر روز چه تغییر کرد و چه مانده [آماده]", "en": "دفتر پروژه: status as in the Persian text.", "nl": "دفتر پروژه: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "قدمِ تو (۲۳ کارت): کوچک‌ترین قدم برای هر قشر [آماده]", "en": "قدمِ تو (۲۳ کارت): status as in the Persian text.", "nl": "قدمِ تو (۲۳ کارت): status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "میز مافیای ایران و ۴۷ نقش: نقش‌ها و ماتریس تصمیم [آماده]", "en": "میز مافیای ایران و ۴۷ نقش: status as in the Persian text.", "nl": "میز مافیای ایران و ۴۷ نقش: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ریشه‌یابی آسیب: زنجیره‌ها و نقطه‌های عطف [آماده]", "en": "ریشه‌یابی آسیب: status as in the Persian text.", "nl": "ریشه‌یابی آسیب: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "آزمایشگاه‌ها: آستانه، کالای عمومی، دوراهی زندانی [آماده]", "en": "آزمایشگاه‌ها: status as in the Persian text.", "nl": "آزمایشگاه‌ها: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارت‌های «چرا؟» برای نقش‌ها: هر نقش به مفهوم علمی و منبعش [آماده]", "en": "کارت‌های «چرا؟» برای نقش‌ها: status as in the Persian text.", "nl": "کارت‌های «چرا؟» برای نقش‌ها: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارت‌های سی مرغ: هدف، کار امن امروز، نقش روز آزادی [آماده]", "en": "کارت‌های سی مرغ: status as in the Persian text.", "nl": "کارت‌های سی مرغ: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بپرس از دانش‌سرا: پرسش بپرس، مدخل‌ها را بگیر؛ بی‌سرور [آماده]", "en": "بپرس از دانش‌سرا: status as in the Persian text.", "nl": "بپرس از دانش‌سرا: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نقشهٔ بزرگ با نوار زمان: ویرانی‌ها و تاریخ روی نقشهٔ ایران [نیست]", "en": "نقشهٔ بزرگ با نوار زمان: status as in the Persian text.", "nl": "نقشهٔ بزرگ با نوار زمان: status as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شبیه‌سازی مافیای میلیونی: شهر و مافیا با میلیون‌ها بازیکن [نیست]", "en": "شبیه‌سازی مافیای میلیونی: status as in the Persian text.", "nl": "شبیه‌سازی مافیای میلیونی: status as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "صفحه‌های دفتر ویرانی‌ها: یک صفحه برای هر حوزه با داده [نیمه]", "en": "صفحه‌های دفتر ویرانی‌ها: status as in the Persian text.", "nl": "صفحه‌های دفتر ویرانی‌ها: status as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "صندلی‌های خالی متخصص: هر متخصص بداند کجا لازم است [آماده]", "en": "صندلی‌های خالی متخصص: status as in the Persian text.", "nl": "صندلی‌های خالی متخصص: status as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دستیار گفتگو: فقط از مدخل‌های منبع‌دار جواب می‌دهد [نیست]", "en": "دستیار گفتگو: status as in the Persian text.", "nl": "دستیار گفتگو: status as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "داشبورد شفافیت مالی: هر یورو از کجا آمد و کجا رفت [نیست]", "en": "داشبورد شفافیت مالی: status as in the Persian text.", "nl": "داشبورد شفافیت مالی: status as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "ابزارِ تازه در لایهٔ خصوصی: «نبضِ میز» (poll)، تنها پرسشِ ماهانه از مردم با جدولِ تفسیر؛ با انتشارِ سیمرغ باز می‌شود. و «نقشهٔ خرابی‌ها» در بخشِ روزِ بعد (ساخت ایران).", "en": "New private-layer tools: the pulse poll and the damage map.", "nl": "New private-layer tools: the pulse poll and the damage map."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:page-map", "rel": "see-also", "note": {"fa": "نقشهٔ صفحه‌ها", "en": "Page map", "nl": "Page map"}}, {"to": "simorgh:threshold-simulator", "rel": "see-also", "note": {"fa": "شبیه‌ساز آستانه", "en": "Threshold simulator", "nl": "Threshold simulator"}}, {"to": "simorgh:ten-turn-game", "rel": "see-also", "note": {"fa": "بازیِ ده‌نوبتی", "en": "Ten-turn game", "nl": "Ten-turn game"}}, {"to": "simorgh:pulse-poll", "rel": "see-also", "note": {"fa": "نبضِ میز (صفحهٔ poll)", "en": "Pulse poll page", "nl": "Pulse poll page"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:inspect-claim", "kind": "concept", "title": {"fa": "وارسیِ یک ادعا در چهار گام", "en": "Inspecting a claim in four steps", "nl": "Inspecting a claim in four steps"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "ابزاری که هر ادعا را در چهار گام می‌گذراند: چه می‌گوید، از کجاست، چه چیز ردش می‌کند، و چقدر می‌شود بر آن تکیه کرد.", "en": "A tool that walks any claim through four steps: what it says, where it comes from, what would refute it, and how far it can be relied on.", "nl": "A tool that walks any claim through four steps: what it says, where it comes from, what would refute it, and how far it can be relied on."}, "points": [{"text": {"fa": "چهار گام: متنِ ادعا، منبع و ردهٔ اعتبار، شرطِ ابطال، و حکمِ تکیه‌پذیری.", "en": "Four steps: statement, source and tier, falsifier, reliability verdict.", "nl": "Four steps: statement, source and tier, falsifier, reliability verdict."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "دیتاست", "en": "Dataset", "nl": "Dataset"}}, {"to": "simorgh:argmap", "rel": "see-also", "note": {"fa": "نقشهٔ استدلال", "en": "Argument map", "nl": "Argument map"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:history-roots", "kind": "concept", "title": {"fa": "ریشه‌های تاریخیِ میز (در ویکی تاریخ)", "en": "Historical roots of the table (in the history wiki)", "nl": "Historical roots of the table (in the history wiki)"}, "aliases": [], "parent": "simorgh:history", "field": "simorgh:history", "summary": {"fa": "روایت‌های تاریخیِ پروژه (ایران چطور شیعه شد، هشت پلهٔ قدرتِ روحانیت، دفترِ مناقشه‌ها، ایران و یهودیان، و درس‌های ۱۳۵۷) تاریخ‌اند، نه بازی؛ برای همین به ویکی تاریخ رفته‌اند. اینجا فقط می‌گوید هرکدام برای میز چه معنایی دارد.", "en": "The project's historical accounts are history, not game, so they moved to the history wiki. This entry only says what each means for the table.", "nl": "The project's historical accounts are history, not game, so they moved to the history wiki. This entry only says what each means for the table."}, "points": [{"text": {"fa": "ایران چطور شیعه شد و هشت پلهٔ قدرتِ روحانیت ← برای میز: «مافیا» ساختاری پانصدساله است با پول، پیرو و سلسله‌مراتبِ خودش؛ با یک موج نمی‌رود و جانشینش هم باید نهاد باشد، نه یک نفر.", "en": "Shi'ism and the eight steps: the \"Mafia\" is a five-century structure with its own money, followers and hierarchy; it does not go with one wave and its successor must be an institution, not a person.", "nl": "Shi'ism and the eight steps: the \"Mafia\" is a five-century structure with its own money, followers and hierarchy; it does not go with one wave and its successor must be an institution, not a person."}, "sources": [], "flags": []}, {"text": {"fa": "دفترِ مناقشه‌ها ← برای میز: روایتِ تاریخیِ پروژه تفسیر است و نقطه‌های ضعفش علنی است؛ هر کارتِ بازی که به تاریخ تکیه دارد باید به این دفتر ارجاع دهد.", "en": "Dispute ledger: the project's historical account is interpretation with public weak points.", "nl": "Dispute ledger: the project's historical account is interpretation with public weak points."}, "sources": [], "flags": []}, {"text": {"fa": "ایران و یهودیان ← برای میز و ارائهٔ اروپا: دشمنیِ دو دولت ۴۷ سال است و پیوندِ دو سرزمین ۲۶۰۰ سال؛ جملهٔ اجباری «این دربارهٔ یک دولت است، نه یک دین و نه یک جامعه» در ارائهٔ اروپا می‌ماند.", "en": "Iran and the Jews: the mandatory sentence stays in the Europe deck.", "nl": "Iran and the Jews: the mandatory sentence stays in the Europe deck."}, "sources": [], "flags": []}, {"text": {"fa": "درس برای برنامهٔ سیمرغ، هر چهار تا مستقیم: میثاقِ مکتوب پیش از سقوط، نه بعد (پاسخ به ۲)؛ «معیارِ عمومی برای هر مدعیِ رهبری» و تاریخِ همه‌پرسیِ تغییرناپذیر (پاسخ به ۱ و ۳)؛ انضباطِ خشونت‌پرهیز که بهانهٔ تصفیه ندهد (پاسخ به ۴)؛ و نهادهایی که بعد از روزِ سقوط هم کار کنند (شبکهٔ جایگزین). چنووت و استفان یادآوری می‌کنند که ایران استثناست: بیشترِ کارزارهای خشونت‌پرهیز، حتی شکست‌خورده‌ها، بعدها به دموکراسی نزدیک‌ترند تا کارزارهای مسلح.", "en": "Lessons for the Simorgh plan: a written covenant before the fall; a public standard for any claimant to leadership and a fixed referendum date; nonviolent discipline that gives no pretext for purges; institutions that keep working after the fall. Iran is the exception: most nonviolent campaigns, even failed ones, end closer to democracy than armed ones.", "nl": "Lessons for the Simorgh plan: a written covenant before the fall; a public standard for any claimant to leadership and a fixed referendum date; nonviolent discipline that gives no pretext for purges; institutions that keep working after the fall. Iran is the exception: most nonviolent campaigns, even failed ones, end closer to democracy than armed ones."}, "sources": ["src:41c1e6a2e7"], "flags": ["editor-note"]}], "links": [{"to": "tarikh:shiism-becomes-iranian", "rel": "see-also", "note": {"fa": "ایران چطور شیعه شد", "en": "How Iran became Shia", "nl": "How Iran became Shia"}}, {"to": "tarikh:clerical-rise-eight-steps", "rel": "see-also", "note": {"fa": "هشت پله", "en": "Eight steps", "nl": "Eight steps"}}, {"to": "tarikh:two-irans-dispute-ledger", "rel": "see-also", "note": {"fa": "دفترِ مناقشه‌ها", "en": "Dispute ledger", "nl": "Dispute ledger"}}, {"to": "tarikh:iran-and-jews", "rel": "see-also", "note": {"fa": "ایران و یهودیان", "en": "Iran and the Jews", "nl": "Iran and the Jews"}}, {"to": "tarikh:revolution-1979", "rel": "see-also", "note": {"fa": "انقلاب ۱۳۵۷", "en": "1979 revolution", "nl": "1979 revolution"}}, {"to": "simorgh:seven-nights", "rel": "see-also", "note": {"fa": "هفت شب", "en": "Seven nights", "nl": "Seven nights"}}], "people": [], "sources": ["src:41c1e6a2e7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-3", "kind": "concept", "title": {"fa": "مرغ‌ها: سازندگان نهاد", "en": "Birds: سازندگان نهاد", "nl": "Birds: سازندگان نهاد"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «سازندگان نهاد» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"سازندگان نهاد\" with the mission and step of each.", "nl": "The five birds of the group \"سازندگان نهاد\" with the mission and step of each."}, "points": [{"text": {"fa": "دادرسی و حقوق: مأموریت: دادخواهی در دادگاه، نه در خیابان. قدمِ امروز: قانون‌های تبعیض‌آمیز را برای خودت فهرست کن. روزِ آزادی: ثبت امن روایت شاهدان. پس از آن: هیئت حقیقت‌یاب و حذف قوانین تبعیض.", "en": "Bird دادرسی و حقوق: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird دادرسی و حقوق: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "انتخابات و قانون اساسی: مأموریت: قدرت از رأی آزاد بیاید. قدمِ امروز: شکل‌های حکومت را در دانش‌سرا مقایسه کن. روزِ آزادی: معرفی شورای گذار و تاریخ انتخابات. پس از آن: انتخابات محلی و مجلس مؤسسان.", "en": "Bird انتخابات و قانون اساسی: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird انتخابات و قانون اساسی: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اقتصاد و بودجه: مأموریت: حقوق‌ها پرداخت شود و پول ارزش بگیرد. قدمِ امروز: بودجهٔ خانواده‌ات را شفاف کن؛ اقتصاد رانتی را بشناس. روزِ آزادی: تضمین حقوق و باز ماندن بانک‌ها. پس از آن: مهار تورم، حساب‌رسی بنیادها، رفع تحریم.", "en": "Bird اقتصاد و بودجه: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird اقتصاد و بودجه: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دولت دیجیتال: مأموریت: اینترنت آزاد و شناسهٔ دیجیتال امن. قدمِ امروز: امنیت دیجیتال خودت را بالا ببر. روزِ آزادی: برقراری اینترنت و نگهبانی از سرورها. پس از آن: شناسهٔ شهروندی و خدمات الکترونیک.", "en": "Bird دولت دیجیتال: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird دولت دیجیتال: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "امنیت پاسخگو: مأموریت: سلاح فقط در دست نیروی قانونی و پاسخگو. قدمِ امروز: در هیچ سرکوبی شریک نشو. روزِ آزادی: خلع سلاح داوطلبانه. پس از آن: پلیس تازه زیر نظارت غیرنظامی.", "en": "Bird امنیت پاسخگو: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird امنیت پاسخگو: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "soc:security-defection-credible-commitment", "rel": "see-also", "note": {"fa": "ریزش نیروها و تعهد باورپذیر", "en": "ریزش نیروها و تعهد باورپذیر", "nl": "ریزش نیروها و تعهد باورپذیر"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-2", "kind": "concept", "title": {"fa": "مرغ‌ها: نگهبانان سرزمین", "en": "Birds: نگهبانان سرزمین", "nl": "Birds: نگهبانان سرزمین"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «نگهبانان سرزمین» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"نگهبانان سرزمین\" with the mission and step of each.", "nl": "The five birds of the group \"نگهبانان سرزمین\" with the mission and step of each."}, "points": [{"text": {"fa": "آب‌بان: مأموریت: نجات آبخوان‌ها و آب آشامیدنی. قدمِ امروز: مصرف آب خانه و زمینت را اندازه بگیر. روزِ آزادی: گزارش خرابی آب محله. پس از آن: ممیزی چاه‌ها و برنامهٔ اضطراری تابستان اول.", "en": "Bird آب‌بان: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird آب‌بان: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نگهبان طبیعت و جنگل: مأموریت: جنگل، تالاب و حیات وحش بماند. قدمِ امروز: یک پاک‌سازی کوچک طبیعت با دوستان. روزِ آزادی: نگهبانی از پارک‌های ملی در خلأ نظارت. پس از آن: کاشت درخت و توقف قطع جنگل.", "en": "Bird نگهبان طبیعت و جنگل: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird نگهبان طبیعت و جنگل: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کشاورزی پایدار: مأموریت: غذا با آب کمتر. قدمِ امروز: یک روش کم‌آب را آزمایش کن. روزِ آزادی: رساندن غذا به شهرها. پس از آن: تغییر الگوی کشت و بیمهٔ کشاورز.", "en": "Bird کشاورزی پایدار: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird کشاورزی پایدار: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "انرژی پاک: مأموریت: برق پایدار بی مازوت. قدمِ امروز: مصرف برق و گاز را بشناس. روزِ آزادی: نیروگاه‌ها و شبکه سر کار بمانند. پس از آن: برنامهٔ خورشیدی و پایان مازوت‌سوزی.", "en": "Bird انرژی پاک: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird انرژی پاک: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نگهبان میراث: مأموریت: هیچ اثر و سندی نابود نشود. قدمِ امروز: آثار محله‌ات را عکاسی و ثبت کن. روزِ آزادی: نگهبانی از موزه‌ها و بایگانی‌ها. پس از آن: مرمت آثار آسیب‌دیده و یادبودها.", "en": "Bird نگهبان میراث: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird نگهبان میراث: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:liberation-day", "kind": "concept", "title": {"fa": "روز آزادی: کارهای هر بازه، جشن‌ها و نقش‌های جشن", "en": "Liberation day: tasks per phase, celebrations and celebration roles", "nl": "Liberation day: tasks per phase, celebrations and celebration roles"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "32 کار در بازه‌های «ساعت اول، روز اول، هفتهٔ اول، صد روز»، هرکدام برای «همه» یا «مهارت‌دار» و با مرغِ مسئول؛ هفت جشن؛ و هشت نقشِ جشن. هدف این است که شادی و آمادگی هم‌زمان باشند و تصویری به جهان برود که می‌گوید آمادهٔ ساختنیم.", "en": "32 tasks across phases, each for everyone or for those with skills and with a responsible bird; seven celebrations; eight celebration roles. The aim is joy and readiness together, sending the world a picture of readiness to build.", "nl": "32 tasks across phases, each for everyone or for those with skills and with a responsible bird; seven celebrations; eight celebration roles. The aim is joy and readiness together, sending the world a picture of readiness to build."}, "points": [{"text": {"fa": "ساعت اول: به همسایه‌های سالمند و تنها سر بزن (همه، همسایه‌یار محله)؛ آب و غذا به جمع‌ها برسان (همه، جشن‌ساز و فرهنگ)؛ کمک‌های اولیه در میدان‌ها (مهارت، امداد و بحران)؛ نگهبانی آرام از مدرسه، بیمارستان یا موزهٔ محله (همه، همسایه‌یار محله)؛ جلوی هر خشونتی را بگیر و میانجی را خبر کن (همه، میانجی)؛ شایعه را پیش از پخش با منبع رسمی بسنج (همه، راستی‌آزما)", "en": "Phase ساعت اول: tasks as in the Persian text.", "nl": "Phase ساعت اول: tasks as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "روز اول: پاک‌سازی خیابان‌ها پس از جشن (همه، پاک‌سازی و داوطلبی)؛ نانوایی، داروخانه یا مغازه‌ات را باز نگه دار (همه، کارآفرین و سرمایه‌گذار)؛ اهدای خون (همه، پزشک و پرستار)؛ سر کار بمان اگر در آب، برق، بیمارستان یا حمل‌ونقل کار می‌کنی (مهارت، امداد و بحران)؛ از بایگانی و سرورهای اداره‌ات محافظت کن (مهارت، پژوهشگر و داده)؛ برای خبرنگاران خارجی ترجمه کن (مهارت، مترجم)", "en": "Phase روز اول: tasks as in the Persian text.", "nl": "Phase روز اول: tasks as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هفتهٔ اول: از زندانیان آزادشده و خانواده‌هایشان استقبال و حمایت کن (همه، روان‌یار و سوگ‌یار)؛ شورای محله را با همسایه‌ها تشکیل بده (همه، همسایه‌یار محله)؛ ثبت امن روایت شاهدان برای هیئت حقیقت‌یاب (مهارت، دادرسی و حقوق)؛ رساندن دارو به بیماران مزمن (همه، پزشک و پرستار)؛ برقراری اینترنت آزاد و امن (متخصص، دولت دیجیتال)؛ گزارش خرابی آب و برق محله در سامانهٔ مشترک (همه، آب‌بان)؛ خلع سلاح داوطلبانه و تحویل سلاح (همه، امنیت پاسخگو)", "en": "Phase هفتهٔ اول: tasks as in the Persian text.", "nl": "Phase هفتهٔ اول: tasks as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "صد روز: یاد دادن خواندن و نوشتن به یک نفر (همه، آموزگار سوادآموزی)؛ کاشت درخت در زمین‌های خالی محله (همه، نگهبان طبیعت و جنگل)؛ بازسازی یک مدرسه یا درمانگاه روستایی (همه، شهرساز و مسکن)؛ جمع‌آوری زباله از طبیعت و رودخانه‌ها (همه، نگهبان طبیعت و جنگل)؛ کمک به سرشماری و آمار تازه (مهارت، پژوهشگر و داده)؛ گروه‌های همیاری سوگ برای خانواده‌های جان‌باختگان (مهارت، روان‌یار و سوگ‌یار)؛ آموزش رأی دادن و نامزدی در انتخابات محلی (همه، انتخابات و قانون اساسی)؛ بازنویسی کتاب‌های درسی (متخصص، آموزگار سوادآموزی)؛ ممیزی چاه‌ها و برنامهٔ نجات آبخوان‌ها (متخصص، آب‌بان)؛ ارزیابی ایمنی ساختمان‌ها در برابر زلزله (متخصص، شهرساز و مسکن)؛ سرمایه‌گذاری یا مربی‌گری برای کسب‌وکار کوچک در شهرهای دور (مهارت، کارآفرین و سرمایه‌گذار)؛ بازگرداندن سرمایه یا تخصص از خارج (مهارت، پل ایرانیان خارج)؛ مستندسازی و مرمت آثار آسیب‌دیده (متخصص، نگهبان میراث)", "en": "Phase صد روز: tasks as in the Persian text.", "nl": "Phase صد روز: tasks as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جشن‌ها: جشن خودجوش (لحظهٔ اعلام؛ میدان‌های از پیش معلوم، امدادگران کنار جمع)؛ فردای جشن (پاک‌سازی همگانی؛ تصویری که به جهان می‌گوید آمادهٔ ساختنیم)؛ جشن ملی (برنامه‌ریزی‌شده با همهٔ اقوام، زبان‌ها و موسیقی‌ها)؛ روز یادبود (برای جان‌باختگان؛ با خانواده‌ها، نه به نام هیچ گروه)؛ بازگشایی (موزه‌ها، کنسرت‌ها و هنرمندان ممنوع‌کار)؛ جشن بازگشت (برای ایرانیانی که بازمی‌گردند)؛ نخستین نوروز آزاد (کاشت درخت در هر محله)", "en": "Celebrations as in the Persian text.", "nl": "Celebrations as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نقش‌های جشن: هماهنگ‌کنندهٔ میدان، امدادگر، صدا و نور، هنرمند و نوازنده، پاک‌ساز، مترجم، عکاس (با رضایت آدم‌ها)، نگهبان کودکان گم‌شده", "en": "Celebration roles as in the Persian text.", "nl": "Celebration roles as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:transition-risks", "rel": "see-also", "note": {"fa": "پانزده خطر", "en": "Fifteen risks", "nl": "Fifteen risks"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:gamaan-2026", "kind": "concept", "title": {"fa": "پیمایشِ گمان ۱۴۰۵: معنایش برای میز", "en": "The 2026 GAMAAN survey: what it means for the table", "nl": "The 2026 GAMAAN survey: what it means for the table"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "بزرگ‌ترین منبعِ عددیِ موجود دربارهٔ اینکه مردمِ داخلِ ایران پس از دی ۱۴۰۴ و جنگِ ۳۹روزه چه فکر می‌کنند. این مدخل یافته‌ها را با معنایشان برای بازی و راهبرد کنارِ هم می‌گذارد، و محدودیتِ روش را هم کامل می‌گوید.", "en": "The largest numerical source on what people inside Iran think after January 2026 and the 39-day war; findings beside their meaning for the game and strategy, with the method's limits in full.", "nl": "The largest numerical source on what people inside Iran think after January 2026 and the 39-day war; findings beside their meaning for the game and strategy, with the method's limits in full."}, "points": [{"text": {"fa": "عددهای این پیمایش (گرایش، نظامِ دلخواه، شعارها، پرچم، نگرانی‌ها، مهاجرت، قطعِ اینترنت) در لایهٔ ایران ثبت‌اند؛ اینجا فقط معنایشان برای بازی آمده.", "en": "The survey's numbers live in the Iran layer; here only their meaning for the game.", "nl": "The survey's numbers live in the Iran layer; here only their meaning for the game."}, "sources": ["src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "محدودیت‌هایی که باید همیشه کنارِ عددها بیاید: نمونهٔ خام ۷۷٪ مرد بود و با وزن‌دهی به ۵۲٪ رسید؛ حجمِ مؤثرِ نمونه پس از وزن‌دهی حدود ۶٬۲۱۱ است؛ وزن‌دهی بر پایهٔ گرایشِ سیاسی نیست، پس اگر کاربرانِ فیلترشکن سیاسی‌تر یا مخالف‌تر از بقیه باشند، عددها به آن سمت کج می‌شوند. نمونه‌گیری احتمالاتی نیست.", "en": "Limits that must travel with the numbers: raw sample 77 percent male, weighted to 52; effective sample about 6,211; no weighting on political orientation, so a more oppositional VPN population would bias results; non-probability sampling.", "nl": "Limits that must travel with the numbers: raw sample 77 percent male, weighted to 52; effective sample about 6,211; no weighting on political orientation, so a more oppositional VPN population would bias
