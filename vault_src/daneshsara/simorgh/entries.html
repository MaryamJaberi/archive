: "see-also", "note": {"fa": "آگاهی طبقاتی و آگاهی کاذب نزد لوکاچ", "en": "آگاهی طبقاتی و آگاهی کاذب نزد لوکاچ", "nl": "آگاهی طبقاتی و آگاهی کاذب نزد لوکاچ"}}, {"to": "soc:nonviolent-action-methods-mechanisms", "rel": "see-also", "note": {"fa": "مبارزهٔ بی‌خشونت شارپ: روش‌ها، سازوکارها و جوجیتسوی سیاسی", "en": "مبارزهٔ بی‌خشونت شارپ: روش‌ها، سازوکارها و جوجیتسوی سیاسی", "nl": "مبارزهٔ بی‌خشونت شارپ: روش‌ها، سازوکارها و جوجیتسوی سیاسی"}}, {"to": "phil:burke-contract-of-generations", "rel": "see-also", "note": {"fa": "برک و محافظه‌کاری: قرارداد میان مردگان، زندگان و آیندگان", "en": "برک و محافظه‌کاری: قرارداد میان مردگان، زندگان و آیندگان", "nl": "برک و محافظه‌کاری: قرارداد میان مردگان، زندگان و آیندگان"}}, {"to": "soc:nation-as-umbrella-idea-iran", "rel": "see-also", "note": {"fa": "«ایران» به‌مثابه چتر اجماع و خطر مفاهیم انتزاعی (دیدگاه سخنران)", "en": "«ایران» به‌مثابه چتر اجماع و خطر مفاهیم انتزاعی (دیدگاه سخنران)", "nl": "«ایران» به‌مثابه چتر اجماع و خطر مفاهیم انتزاعی (دیدگاه سخنران)"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "دو مفهوم آزادی", "en": "دو مفهوم آزادی", "nl": "دو مفهوم آزادی"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:metaphor", "kind": "concept", "title": {"fa": "استعارهٔ میز: ایران یک میزِ مافیاست", "en": "The table metaphor: Iran as a Mafia table", "nl": "The table metaphor: Iran as a Mafia table"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "شهری با ۸۷ میلیون نفر؛ شب عده‌ای کم بیدارند و یکدیگر را می‌شناسند، و هشتاد نفر از هر صد نفر خوابند و شمارهٔ هم را ندارند. بازی از ۱۳۵۷ شروع شده. این بازیِ کشتن نیست، بازیِ هماهنگی است.", "en": "A city of 87 million: at night a small group is awake and knows each other, while eighty in a hundred sleep without each other's numbers. The game began in 1979. It is a coordination game, not a game of killing.", "nl": "A city of 87 million: at night a small group is awake and knows each other, while eighty in a hundred sleep without each other's numbers. The game began in 1979. It is a coordination game, not a game of killing."}, "points": [{"text": {"fa": "ایران یک میزِ مافیاست با ۸۷ میلیون بازیکن. برآوردِ کیفیِ قدیمیِ پروژه پایگاهِ حاکمان را ۱۰ تا ۱۵ درصد می‌گذاشت؛ پیمایشِ گمان (تیر ۱۴۰۵، ۳۱٬۴۵۰ پاسخ‌دهنده) حالا لنگرِ تجربیِ بهتری می‌دهد: حدود ۹٪ هوادارِ اصولِ انقلاب و رهبری، ۱۰٪ اصلاحِ تدریجی از درون، ۲۳٪ گذار و ۴۷٪ تغییرِ نظام. یعنی هستهٔ مافیا کوچک است و «حاشیهٔ مردد» (اصلاح‌طلبان و بی‌پاسخ‌ها) همان‌جایی است که بازی برده یا باخته می‌شود. محدودیت: نمونه از راهِ فیلترشکن و فقط باسوادانِ ۱۵ سال به بالا.", "en": "Iran is a Mafia table with 87 million players. The project's old qualitative estimate put the rulers' base at 10 to 15 percent; the GAMAAN survey (June 2026, 31,450 respondents) now gives a better anchor: about 9 percent back the revolution's principles and the Leader, 10 percent gradual reform, 23 percent transition and 47 percent regime change. The Mafia core is small, and the hesitant margin is where the game is won or lost. Limitation: VPN-recruited sample, literate 15+ only.", "nl": "Iran is a Mafia table with 87 million players. The project's old qualitative estimate put the rulers' base at 10 to 15 percent; the GAMAAN survey (June 2026, 31,450 respondents) now gives a better anchor: about 9 percent back the revolution's principles and the Leader, 10 percent gradual reform, 23 percent transition and 47 percent regime change. The Mafia core is small, and the hesitant margin is where the game is won or lost. Limitation: VPN-recruited sample, literate 15+ only."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "سه جناح: مافیا شب حرکت می‌کند و روز حرف می‌زند؛ شهر روز حرف می‌زند و شب می‌خوابد؛ مستقل‌ها نه می‌برند نه می‌بازند و فقط تعیین می‌کنند بازی چقدر طول بکشد.", "en": "Three factions: the Mafia moves by night and talks by day; the City talks by day and sleeps by night; the independents neither win nor lose, they decide how long the game lasts.", "nl": "Three factions: the Mafia moves by night and talks by day; the City talks by day and sleeps by night; the independents neither win nor lose, they decide how long the game lasts."}, "sources": [], "flags": []}, {"text": {"fa": "شرط برد مافیا: ادامهٔ بازی. لازم نیست ببرد، کافی است بازی تمام نشود؛ هر شبِ اضافه یک نفر از شهر کم می‌کند (مهاجرت، فقر، فرسودگی).", "en": "Mafia win condition: the game continues. It need not win; it is enough that the game does not end; each extra night subtracts someone from the city (emigration, poverty, exhaustion).", "nl": "Mafia win condition: the game continues. It need not win; it is enough that the game does not end; each extra night subtracts someone from the city (emigration, poverty, exhaustion)."}, "sources": [], "flags": []}, {"text": {"fa": "شرط برد شهر (اصلاح‌شده): نه «یک روزِ واحد»، بلکه هماهنگیِ پایدار که در یک لحظهٔ کانونی دیده شود. نسخهٔ قبلی برد را به یک روز گره می‌زد؛ پژوهش می‌گوید جنبش‌های طولانی و سازمان‌یافته هم بیشتر می‌برند و هم دموکراسیِ بادوام‌تری می‌سازند، و خیزشِ انفجاریِ یک‌روزه بیشتر سرکوب می‌شود. پس «روزِ واحد» نقطهٔ نمایش است، نه خودِ برد: میثاق حداقلی + شبکه‌ای که بعد از آن روز هم سرِ پا بماند.", "en": "City win condition (revised): not \"one single day\" but sustained coordination made visible at a focal moment. Research says long, organised movements win more often and build more durable democracies, while one-day explosive uprisings are more easily crushed. The single day is the display, not the win itself.", "nl": "City win condition (revised): not \"one single day\" but sustained coordination made visible at a focal moment. Research says long, organised movements win more often and build more durable democracies, while one-day explosive uprisings are more easily crushed. The single day is the display, not the win itself."}, "sources": ["src:f1a8df8bf8", "src:040033aaf5"], "flags": []}, {"text": {"fa": "قانونِ طلاییِ میز: موفقیتِ گذار با میزانِ خشونتِ اعمال‌شده در دورهٔ گذار نسبتِ عکس دارد؛ تنها گزاره‌ای که همهٔ صداهای پرونده بر سرش توافق دارند.", "en": "The table's golden rule: transition success is inversely related to the violence used during the transition; the only proposition on which all voices in the file agree.", "nl": "The table's golden rule: transition success is inversely related to the violence used during the transition; the only proposition on which all voices in the file agree."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "شهر نیمی از راه را آمده: می‌داند مافیا کیست، اما نمی‌داند فردا صبح چه بگوید. بازی هماهنگی یک راه‌حلِ کلاسیک دارد: یک نشانهٔ پرهزینه و آشکار که همه ببینند و بدانند بقیه هم دیده‌اند؛ اسمش در اسطوره «پَرِ سیمرغ» است.", "en": "The city is half way: it knows who the Mafia is but not what to say tomorrow morning. A coordination game has a classic solution: a costly, public signal everyone sees and knows the others saw; in myth it is called the Simorgh's feather.", "nl": "The city is half way: it knows who the Mafia is but not what to say tomorrow morning. A coordination game has a classic solution: a costly, public signal everyone sees and knows the others saw; in myth it is called the Simorgh's feather."}, "sources": ["src:e0cb8fb11f", "src:436510de26"], "flags": []}, {"text": {"fa": "«حذف» در این بازی هرگز آسیب‌زدن به آدم نیست. در مافیای معمولی شهر با حذفِ بازیکن می‌برد؛ در این نسخه حذف یعنی پس‌گرفتنِ همکاری: کارمندی که امضا نمی‌کند، سربازی که شلیک نمی‌کند، کاسبی که کرکره را پایین می‌کشد. این وارونه‌سازی عمدی است و با قانونِ طلاییِ میز (خشونت نسبتِ عکس با موفقیت دارد) سازگار است.", "en": "\"Elimination\" in this game never means harming a person. In ordinary Mafia the city wins by removing players; here removal means withdrawing cooperation. The inversion is deliberate and fits the golden rule.", "nl": "\"Elimination\" in this game never means harming a person. In ordinary Mafia the city wins by removing players; here removal means withdrawing cooperation. The inversion is deliberate and fits the golden rule."}, "sources": ["src:458bea7f0f", "src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "شمارش‌ها برای اینکه قاطی نشود: ۲۷ شخصیتِ موجود + ۱۰ نقشِ نساخته = ۳۷ شخصیتِ بازی (لایهٔ روایت و تصویر). ۴۷ نقشِ اجتماعی لایهٔ دیگری است (لایهٔ علم: هر نقش با پژوهشِ پشتش). ۳۰ مرغ لایهٔ سوم است (نقش‌های مسئولیتِ روزِ آزادی). یک آدمِ واقعی می‌تواند هم‌زمان در هر سه لایه جا داشته باشد.", "en": "Counts, so they do not get mixed up: 27 existing characters + 10 unbuilt = 37 game characters (story layer). The 47 social roles are a different, science layer. The 30 birds are a third layer (liberation-day duties). One real person can sit in all three.", "nl": "Counts, so they do not get mixed up: 27 existing characters + 10 unbuilt = 37 game characters (story layer). The 47 social roles are a different, science layer. The 30 birds are a third layer (liberation-day duties). One real person can sit in all three."}, "sources": [], "flags": []}, {"text": {"fa": "گرداننده (راوی) کیست؟ در مافیا گرداننده بازیکن نیست و قواعد را اجرا می‌کند. در ایران گرداننده همان ساختارِ قانونیِ موجود است (قانون اساسی، نهادهای انتصابی، دستگاهِ قضایی) که خودش طرفِ بازی است؛ یعنی داور بی‌طرف نیست. برای همین «نویسندهٔ قانون» جزوِ ده نقشِ نساخته است: شهر باید داورِ تازه بسازد، نه فقط بازیکن عوض کند.", "en": "Who is the host? In Mafia the host is not a player. In Iran the host is the existing legal structure, which is itself a party, so there is no neutral referee. Hence \"the law writer\" is among the ten unbuilt roles: the city must build a new referee, not just swap players.", "nl": "Who is the host? In Mafia the host is not a player. In Iran the host is the existing legal structure, which is itself a party, so there is no neutral referee. Hence \"the law writer\" is among the ten unbuilt roles: the city must build a new referee, not just swap players."}, "sources": [], "flags": []}], "links": [{"to": "soc:coordination-focal-points", "rel": "see-also", "n cy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سالمندان و بازنشستگان: نیاز: حقوق باارزش، دارو، تنهایی. نخستین سیاست: تضمین پرداخت حقوق در گذار.", "en": "سالمندان و بازنشستگان: need and first policy, as in the Persian text.", "nl": "سالمندان و بازنشستگان: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارگران و روزمزدها: نیاز: دستمزد، امنیت شغلی، تشکل آزاد. نخستین سیاست: آزادی سندیکا.", "en": "کارگران و روزمزدها: need and first policy, as in the Persian text.", "nl": "کارگران و روزمزدها: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کشاورزان و روستاییان: نیاز: آب، بازار، جاده و درمانگاه. نخستین سیاست: برنامهٔ اضطراری آب.", "en": "کشاورزان و روستاییان: need and first policy, as in the Persian text.", "nl": "کشاورزان و روستاییان: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "عشایر: نیاز: مرتع، کوچ امن، آموزش سیار. نخستین سیاست: به رسمیت شناختن مرتع.", "en": "عشایر: need and first policy, as in the Persian text.", "nl": "عشایر: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اقوام و گویشوران زبان‌های ایران: نیاز: برابری، زبان مادری، سهم در قدرت. نخستین سیاست: آموزش به زبان مادری در کنار فارسی.", "en": "اقوام و گویشوران زبان‌های ایران: need and first policy, as in the Persian text.", "nl": "اقوام و گویشوران زبان‌های ایران: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اقلیت‌های دینی و بی‌دینان: نیاز: برابری قانونی، آزادی باور. نخستین سیاست: آزادی همهٔ زندانیان عقیدتی.", "en": "اقلیت‌های دینی و بی‌دینان: need and first policy, as in the Persian text.", "nl": "اقلیت‌های دینی و بی‌دینان: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دگرباشان جنسی: نیاز: امنیت، پایان جرم‌انگاری. نخستین سیاست: توقف تعقیب کیفری.", "en": "دگرباشان جنسی: need and first policy, as in the Persian text.", "nl": "دگرباشان جنسی: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "افراد دارای معلولیت: نیاز: دسترسی، کار، درمان. نخستین سیاست: استاندارد دسترسی در ساخت‌وساز تازه.", "en": "افراد دارای معلولیت: need and first policy, as in the Persian text.", "nl": "افراد دارای معلولیت: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مهاجران افغانستانی: نیاز: اقامت، آموزش کودکان، امنیت. نخستین سیاست: توقف اخراج اجباری.", "en": "مهاجران افغانستانی: need and first policy, as in the Persian text.", "nl": "مهاجران افغانستانی: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ایرانیان خارج از کشور: نیاز: بازگشت امن، سرمایه‌گذاری، رأی. نخستین سیاست: گذرنامه و بازگشت بی‌مانع.", "en": "ایرانیان خارج از کشور: need and first policy, as in the Persian text.", "nl": "ایرانیان خارج از کشور: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "خانواده‌های جان‌باختگان و زندانیان: نیاز: حقیقت، دادخواهی، یادبود. نخستین سیاست: هیئت حقیقت‌یاب.", "en": "خانواده‌های جان‌باختگان و زندانیان: need and first policy, as in the Persian text.", "nl": "خانواده‌های جان‌باختگان و زندانیان: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "معتادان و خانواده‌هایشان: نیاز: درمان به جای زندان. نخستین سیاست: کاهش آسیب در سراسر کشور.", "en": "معتادان و خانواده‌هایشان: need and first policy, as in the Persian text.", "nl": "معتادان و خانواده‌هایشان: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کارمندان دولت: نیاز: امنیت شغلی، پایان گزینش ایدئولوژیک. نخستین سیاست: ماندن کارمندان بی‌جنایت سر کار.", "en": "کارمندان دولت: need and first policy, as in the Persian text.", "nl": "کارمندان دولت: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سربازان و نیروهای عادی: نیاز: آیندهٔ امن، شغل، احترام. نخستین سیاست: راه بازگشت روشن برای بی‌جنایت‌ها.", "en": "سربازان و نیروهای عادی: need and first policy, as in the Persian text.", "nl": "سربازان و نیروهای عادی: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مذهبیان سنتی: نیاز: آزادی باور خود، احترام. نخستین سیاست: آزادی دین بدون دین دولتی.", "en": "مذهبیان سنتی: need and first policy, as in the Persian text.", "nl": "مذهبیان سنتی: need and first policy, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "طبقهٔ متوسط شهری: نیاز: آزادی، اینترنت، سفر، ارزش پول. نخستین سیاست: اینترنت آزاد از روز اول.", "en": "طبقهٔ متوسط شهری: need and first policy, as in the Persian text.", "nl": "طبقهٔ متوسط شهری: need and first policy, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:step-cards", "rel": "see-also", "note": {"fa": "قدمِ تو", "en": "Your step", "nl": "Your step"}}, {"to": "simorgh:ruins-ledger", "rel": "see-also", "note": {"fa": "دفترِ ویرانی‌ها", "en": "Ruins ledger", "nl": "Ruins ledger"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:threshold-indicators", "kind": "concept", "title": {"fa": "نشانگرهای آستانه: چه چیزی را باید دید", "en": "Threshold indicators: what to watch", "nl": "Threshold indicators: what to watch"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "آستانه از پیش دیده نمی‌شود، اما نزدیک‌شدن به آن نشانه دارد. این فهرست نشانگرهایی است که فقط از دادهٔ عمومی و در سطحِ جمعیت خوانده می‌شوند، هرکدام مربوط به یکی از سه پَر یا ستون‌ها. هیچ نشانگری به فرد نگاه نمی‌کند.", "en": "The threshold cannot be seen in advance, but approaching it has signs. Indicators read only from public, population-level data, each tied to a feather or pillar. None looks at individuals.", "nl": "The threshold cannot be seen in advance, but approaching it has signs. Indicators read only from public, population-level data, each tied to a feather or pillar. None looks at individuals."}, "points": [{"text": {"fa": "پَرِ یکم (دانشِ مشترک): روندِ پیمایش‌های مستقل (مثل گمان) دربارهٔ پشتیبانی از تغییر؛ اگر رو به بالا و عمومی منتشر شود، پَر روشن می‌ماند.", "en": "Feather one: trends in independent surveys.", "nl": "Feather one: trends in independent surveys."}, "sources": ["src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "پَرِ دوم (همکاری): پهنای اعتصاب‌ها (چند صنف، چند استان)، مدت (روز)، و تکرار؛ و وجود یا نبودِ صندوقِ پشتیبان. موجی که سه صنفِ سراسری را هم‌زمان نگه دارد علامتِ اصلی است.", "en": "Feather two: breadth, length and repetition of strikes, and whether a support fund exists.", "nl": "Feather two: breadth, length and repetition of strikes, and whether a support fund exists."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "پَرِ سوم و ستونِ امنیت: گزارش‌های معتبر (سازمان‌های حقوقِ بشری، رسانه‌های بررسی‌شده) دربارهٔ اکراهِ نیروها در سرکوب، و بیانیه‌های علنیِ بازنشستگان یا خانواده‌ها. نشانهٔ منفی: افزایشِ اعدام‌ها (حکومت برای بازدارندگی هزینه را بالا می‌برد).", "en": "Feather three and security: credible reports of reluctance among forces; negative sign: rising executions.", "nl": "Feather three and security: credible reports of reluctance among forces; negative sign: rising executions."}, "sources": ["src:9ce61897e7"], "flags": ["editor-note"]}, {"text": {"fa": "ستون‌های اقتصادی: فاصلهٔ نرخِ ارزِ آزاد و رسمی، خروجِ سرمایه، تعطیلی‌های بازار؛ و فاصلهٔ دستمزد تا هزینهٔ زندگی (امروز حدود ۱ به ۳٫۷).", "en": "Economic pillars: currency gap, capital flight, bazaar closures, wage-to-cost gap (about 1 to 3.7 today).", "nl": "Economic pillars: currency gap, capital flight, bazaar closures, wage-to-cost gap (about 1 to 3.7 today)."}, "sources": ["src:7af62df15e"], "flags": []}, {"text": {"fa": "سرکوبِ دیجیتال: تعداد و طولِ قطعی‌های اینترنت (NetBlocks، IODA)؛ قطعیِ بیشتر یعنی حکومت هماهنگی را خطر می‌بیند.", "en": "Digital repression: number and length of shutdowns.", "nl": "Digital repression: number and length of shutdowns."}, "sources": ["src:4d809f4a2a"], "flags": []}, {"text": {"fa": "سلامتِ برنامه: «تنوعِ امضا» (هدف بالای ۵۰٪ از بیرونِ اردوگاهِ غالب)، شمارِ صنف‌هایی که به صندوق وصل‌اند، و آیا متنِ عدالتِ انتقالی امضای حقوق‌دانانِ هر دو سوی مرز را دارد.", "en": "Plan health: signature diversity, number of trades linked to the fund, signatures on the transitional-justice text.", "nl": "Plan health: signature diversity, number of trades linked to the fund, signatures on the transitional-justice text."}, "sources": [], "flags": []}, {"text": {"fa": "قاعدهٔ خواندن: هیچ نشانگری به‌تنهایی پیش‌بینی نمی‌کند؛ ارزش در هم‌زمانیِ چند نشانگر است، همان‌طور که آستانه یک هم‌زمانی است. و این‌ها برای تصمیم‌گیریِ حلقه‌اند، نه برای اعلامِ «زمانِ سقوط».", "en": "Reading rule: no indicator predicts alone; the value is in several moving together. For the circle's decisions, not for announcing \"the time of the fall\".", "nl": "Reading rule: no indicator predicts alone; the value is in several moving together. For the circle's decisions, not for announcing \"the time of the fall\"."}, "sources": ["src:436510de26"], "flags": ["editor-note"]}, {"text": {"fa": "از کوران: نشانگری که بیشتر از همه معنا دارد «انتظار» است، نه فقط «ترجیح»: پرسشِ «فکر می‌کنید چند درصدِ مردم با شما هم‌نظرند؟» در کنارِ «شما چه فکر می‌کنید؟». فاصلهٔ این دو اندازهٔ نادانیِ جمعی است؛ هر چه کوچک‌تر شود، آستانه نزدیک‌تر است.", "en": "From Kuran: the most meaningful indicator is expectation, not only preference: ask \"what share agree with you?\" beside \"what do you think?\". The gap measures pluralistic ignorance; as it shrinks, the threshold nears.", "nl": "From Kuran: the most meaningful indicator is expectation, not only preference: ask \"what share agree with you?\" beside \"what do you think?\". The gap measures pluralistic ignorance; as it shrinks, the threshold nears."}, "sources": ["src:436510de26"], "flags": ["editor-note"]}, {"text": {"fa": "از مدلِ کوران (۱۹۸۹): سه نوع نشانگر را جدا بخوان. نارضایتیِ خصوصی (مثل پیمایشِ گمان) فقط زمینه است؛ ضعفِ تواناییِ حکومت در پاداش و تنبیه (شکاف در ستون‌ها، تردید در به‌کارگیریِ زور) هم زمینه است هم جرقه؛ جهشِ «انتظار» از اندازهٔ مخالفان فقط وقتی جرقه است که زمینه آماده باشد. باز شدنِ ناگهانیِ فضا هم، طبقِ تجربهٔ ۱۳۵۶ و هشدارِ توکویل، خودش نشانگرِ خطر برای حکومت است.", "en": "From Kuran (1989): read three kinds of indicator separately. Private discontent only sets the stage; weakening of the regime's capacity to reward and punish both sets the stage and can trigger; a jump in expected opposition size triggers only if the stage is set. Sudden liberalisation is itself a danger sign for a regime (1977, Tocqueville).", "nl": "From Kuran (1989): read three kinds of indicator separately. Private discontent only sets the stage; weakening of the regime's capacity to reward and punish both sets the stage and can trigger; a jump in expected opposition size triggers only if the stage is set. Sudden liberalisation is itself a danger sign for a regime (1977, Tocqueville)."}, "sources": ["src:b71c8c0eee"], "flags": []}], "links": [{"to": "simorgh:dataset-health", "rel": "see-also", "note": {"fa": "سلامتِ دیتاست", "en": "Dataset health", "nl": "Dataset health"}}, {"to": "simorgh:current-situation", "rel": "see-also", "note": {"fa": "وضعیتِ امروز", "en": "Situation now", "nl": "Situation now"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌ها", "en": "Pillars", "nl": "Pillars"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "نظریه: تحریفِ ترجیحات (کوران)", "en": "Theory: preference falsification", "nl": "Theory: preference falsification"}}, {"to": "simorgh:pulse-poll", "rel": "see-also", "note": {"fa": "نبضِ میز: پرسشِ ماهانه", "en": "Pulse poll", "nl": "Pulse poll"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:436510de26", "src:4d809f4a2a", "src:6c0a6f1ef3", "src:7af62df15e", "src:9ce61897e7", "src:b71c8c0eee"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:characters-mafia", "kind": "concept", "title": {"fa": "شخصیت‌های جناح مافیا", "en": "Mafia-faction characters", "nl": "Mafia-faction characters"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "نُه شخصیت که بازی را نگه می‌دارند: از روایت‌ساز و دربان تا رانت‌خوار. شخصیت‌ها تیپ‌اند، نه آدمِ مشخص؛ هیچ نشانِ حزبی، دولتی یا مذهبیِ واقعی ندارند.", "en": "Nine characters that keep the game going, from narrator and gatekeeper to rent-seeker. They are archetypes, not named people; none carries a real party, state or religious emblem.", "nl": "Nine characters that keep the game going, from narrator and gatekeeper to rent-seeker. They are archetypes, not named people; none carries a real party, state or religious emblem."}, "points": [{"text": {"fa": "روایت‌ساز رسمی (فقط مافیا) — راویِ دروغین — روایت‌ساز رسمی. مثالِ واقعی: مجری و تهیه‌کنندهٔ رسانهٔ رسمی · خبرگزاری نیمه‌رسمی با نشتِ کنترل‌شده · منبرِ رسانه‌ای‌شده · مستندساز سفارشی. ریشهٔ اسطوره‌ای: ضحّاک، که مارها از دوشش رویید و هر روز باید مغز جوانان می‌خوردند. اینجا مارها کابلِ پخش‌اند و آنچه می‌خورند، روایت است.", "en": "روایت‌ساز رسمی (M): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "روایت‌ساز رسمی (M): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مأمور گزینش و مجوز (فقط مافیا) — دربانِ مشروعیت. مثالِ واقعی: قاضی پرونده‌های امنیتی · کارمند گزینش و هیئت تخلفات · ممیز کتاب و مجوز · صادرکنندهٔ پروانه. ریشهٔ اسطوره‌ای: دْروج — دروغ در اوستا. نه یک هیولا؛ یک بی‌نظمی که به اسمِ نظم عمل می‌کند.", "en": "مأمور گزینش و مجوز (M): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "مأمور گزینش و مجوز (M): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جذب‌کننده با امتیاز (فقط مافیا) — تبدیل‌کننده. مثالِ واقعی: مسئول وام و سهمیه و بورسیه و سبد کالا · نهاد خیریهٔ وابسته · اردوهای فرهنگی · کارگزار استخدام دولتی در شهر کوچک. ریشهٔ اسطوره‌ای: پروانه و شمع در ادبیات عرفانی — عاشقی که خودش را می‌سوزاند و شمع بی‌گناه است. جذب‌کننده با امتیاز شمعی است که واقعاً نمی‌داند دارد چه می‌کند.", "en": "جذب‌کننده با امتیاز (M): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "جذب‌کننده با امتیاز (M): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بازجو و پرونده‌ساز (فقط مافیا) — پاکسازچی. مثالِ واقعی: بازجو و پرونده‌ساز · تیم بازداشت شبانه · کارشناس عملیات روانی و سایبری. ریشهٔ اسطوره‌ای: اکوان دیو — دیوی که در شاهنامه آدم را در خواب می‌رباید و جابه‌جا می‌کند. خشونتِ بی‌سروصدا.", "en": "بازجو و پرونده‌ساز (M): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "بازجو و پرونده‌ساز (M): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "خبرچین و شنود (فقط مافیا) — شنود. مثالِ واقعی: همسایهٔ گزارش‌دهنده · پایگاه محله · کارمند شنود و رصد شبکه · حساب‌های هویت‌جعلی. ریشهٔ اسطوره‌ای: چشم و گوشِ اهریمن در متون پهلوی — آنکه همه‌جا هست و هیچ‌جا دیده نمی‌شود.", "en": "خبرچین و شنود (M): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "خبرچین و شنود (M): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "همراه ناآگاه (مافیا ∩ شهر) — خفتهٔ ناآگاه. مثالِ واقعی: بازنشرکنندهٔ روایت آماده · کارمندی که «فقط کارش را می‌کند» · خانوادهٔ وابسته به وام و سبد · هوادار پرشور بدون بررسی. ریشهٔ اسطوره‌ای: خوابِ ضحّاک — کسی که در رؤیای خودش راه می‌رود و بیداری دیگری او را می‌راند.", "en": "همراه ناآگاه (MC): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "همراه ناآگاه (MC): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "منتقد مجاز (مافیا ∩ شهر) — منتقدِ ساختگی. مثالِ واقعی: روزنامه‌نگار خط‌قرمزشناس · اقتصاددان منتقد رسمی · هنرمند و طنزپرداز مجاز · اصلاح‌طلب بازمانده. ریشهٔ اسطوره‌ای: بلبل در ادبیات فارسی، نمادِ شکایتِ زیباست — شکایتی که هرگز به تغییر نمی‌رسد.", "en": "منتقد مجاز (MC): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "منتقد مجاز (MC): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مأمور ناچار (مافیا ∩ شهر) — مجریِ رده‌پایین. مثالِ واقعی: سرباز وظیفهٔ یگان ویژه · مأمور کلانتری شهر کوچک · ضابط قضایی زیر خط فقر · نیروی قراردادی حراست. ریشهٔ اسطوره‌ای: سهراب — جوانی که در جبههٔ اشتباه ایستاد و نمی‌دانست روبه‌رویش کیست.", "en": "مأمور ناچار (MC): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "مأمور ناچار (MC): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "رانت‌خوار (مافیا ∩ مستقل) — حلقهٔ منفعت. مثالِ واقعی: پیمانکار و هلدینگ شبه‌دولتی · کاسب تحریم و ارز ترجیحی · صراف شبکه‌ای · واسطهٔ کارمزدی. ریشهٔ اسطوره‌ای: آز — دیوِ آزمندی در اساطیر زرتشتی که در آخرالزمان، اگر چیزی برای خوردن نماند، خودش را می‌خورد.", "en": "رانت‌خوار (MI): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "رانت‌خوار (MI): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:roles-ruling", "rel": "see-also", "note": {"fa": "نقش‌های اجتماعیِ حاکمیت", "en": "Ruling social roles", "nl": "Ruling social roles"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:nine-faction-critique", "kind": "concept", "title": {"fa": "میزِ نقد: نُه جناح به سند چه می‌گویند", "en": "Critique table: what nine factions say to the paper", "nl": "Critique table: what nine factions say to the paper"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "سند را از نُه موضعِ سیاسیِ متفاوت، بعضی دشمنِ هم، نقد می‌کنند و هر نقد در قوی‌ترین شکلش نوشته شده. نقدِ پذیرفته‌شده در متنِ اصلی تغییر ایجاد کرده؛ نقدِ ردشده دلیلِ ردش دارد. هفده تغییر از این میز بیرون آمد. آزمونِ جانشینی: هر بندی که با عوض‌کردنِ نامِ یک جریان به نامِ جریانِ دیگر بی‌معنا شود جانبدارانه است و بازنویسی می‌شود.", "en": "The paper is criticised from nine different political positions, some enemies of each other, each critique at full strength. Accepted critiques changed the main text; rejected ones carry reasons. Seventeen changes came out of this table. The substitution test: any clause that becomes meaningless when one current's name is swapped for another's is partisan and gets rewritten.", "nl": "The paper is criticised from nine different political positions, some enemies of each other, each critique at full strength. Accepted critiques changed the main text; rejected ones carry reasons. Seventeen changes came out of this table. The substitution test: any clause that becomes meaningless when one current's name is swapped for another's is partisan and gets rewritten."}, "points": [{"text": {"fa": "جمهوری‌خواهِ سازمان‌یافته و مؤسسان‌گرا — «میثاقِ بی‌فرم، خودش یک فرم است»: موضعی که در خودِ کتابِ منبع غایب بود و همین غیبت، سوگیریِ ساختاری تولید کرده. نقدها: ۱ · سکوت دربارهٔ فرمِ حکومت، بی‌طرفی نیست — امتیاز است؛ ۲ · «نقطهٔ کانونی» نامِ فنیِ تدهینِ رهبر است؛ ۳ · قیاسِ ۵۷ دقیقاً برعکس خوانده شده؛ ۴ · مجلس مؤسسان نباید پایانِ صف باشد. چه تغییر کرد: ترتیبِ برنامه عوض شد: پیش‌نویسِ مؤسسان از فاز سوم به فاز اول منتقل شد — کارِ نگارش از روز نخست، هم‌زمان با نهادِ داده، آغاز می‌شود. رأی‌گیری‌اش در فاز سوم می‌ماند، نگارشش نه. بندِ ششم به میثاق اضافه شد: «هیچ امضاکننده‌ای در دورهٔ گذار از موقعیت نمادین یا نهادیِ خود برای مزیتِ انتخاباتی استفاده نمی‌کند.» ابتکار سوم بازنویسی شد: از «پیشنهاد به یک شخص» به «معیارِ عمومی» — هر مدعیِ رهبری، از هر جریانی، به همان تعهد سنجیده می‌شود. تعریفِ نقطهٔ کانونی اصلاح شد: تصریح که نقطهٔ کانونیِ سالم، رخداد است نه شخص — تاریخ، ساعت، عمل. چه نشد: نقدِ سوم دربارهٔ قیاسِ ۵۷ پذیرفته نشد — اما نه رد شد: سند حالا هر دو خوانش را کنار هم می‌گذارد و می‌گوید کدام شاهد به سودِ کدام است، چون داوری میان این دو از حدِ یک سندِ تحلیلی بیرون است.", "en": "Critique from جمهوری‌خواهِ سازمان‌یافته و مؤسسان‌گرا: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from جمهوری‌خواهِ سازمان‌یافته و مؤسسان‌گرا: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "چپِ کارگری و سنتِ سندیکایی — «شما مسئلهٔ طبقاتی را به مسئلهٔ هماهنگی تقلیل داده‌اید»: نقدی که به بنیانِ روش‌شناختیِ سند حمله می‌کند، نه به جزئیاتش. نقدها: ۱ · هشتاد درصد، یک بازیکن نیست؛ ۲ · صندوق، جانشینِ تشکل نیست؛ ۳ · جدول‌های شما بازگشتِ GDP را می‌سنجند، نه توزیع را؛ ۴ · «عدم انتقام» برای چه کسی امن است؟. چه تغییر کرد: بندِ سوم میثاق بازنویسی شد: «عدم انتقام» به «عدالت بدون انتقام» تغییر کرد، با تصریحِ اینکه عفوِ مشروط شاملِ آمرانِ کشتار و جنایت علیه بشریت نمی‌شود و فقط دربارهٔ مجریانِ رده‌پایینِ معترف اعمال می‌شود. ابتکار چهارم بازتعریف شد: هدفِ صندوق، تقویتِ تشکل‌های صنفیِ موجود است نه ساختِ نهادِ موازی؛ و حاکمیتش با نمایندگانِ منتخبِ همان تشکل‌هاست، نه با هیچ جریانِ سیاسی. ستونِ توزیع به جدول اقتصادی اضافه شد: در کنار بازدهِ کل، اثر بر ضریب جینی و بر دهکِ پایین به‌صورت جداگانه آمده — با تصریحِ اینکه در سناریوی «گسستِ سریع»، نابرابری در کوتاه‌مدت بدتر می‌شود. شاخصِ هفتم به شاخص‌های پیشرو اضافه شد: سهمِ دهک چه نشد: نقدِ اول پذیرفته شد اما کامل حل نشد. سند حالا صریحاً می‌گوید مدلِ «یک اکثریتِ واحد» یک ساده‌سازی است و در بخش تازه‌ای سه تابعِ سودِ متضاد را از هم جدا می‌کند — اما نمی‌تواند ادعا کند راه‌حلی برای خودِ تضاد دارد. این، مهم‌ترین ضعفِ باقی‌ماندهٔ سند است.", "en": "Critique from چپِ کارگری و سنتِ سندیکایی: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from چپِ کارگری و سنتِ سندیکایی: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مشروطه‌خواه و پادشاهی‌خواه — «شما از ما هزینه می‌خواهید و به ما تضمین نمی‌دهید»: نقد از سمتِ همان جریانی که سند خطاب به چهرهٔ شاخصش نوشته شده. نقدها: ۱ · تعهدِ یک‌طرفه، خلع‌سلاحِ یک‌طرفه است؛ ۲ · «پس‌زنندگی» یک‌طرفه سنجیده شده؛ ۳ · تنها دارایی را با بی‌فرمی خنثی کرده‌اید؛ ۴ · تجربهٔ ۵۷ در سند فقط علیه ماست. چه تغییر کرد: تعهد، متقارن شد: ابتکار سوم حالا یک تعهدِ متقابل است — هر جریانی که در میثاق شریک می‌شود، هم‌زمان و در یک متن، به همان قاعده متعهد می‌شود. تعهدِ یک‌طرفه از سند حذف شد. سنجهٔ «هزینهٔ پیوستن» عمومی شد: حالا به‌عنوان معیاری تعریف شده که بر همهٔ جریان‌ها اعمال می‌شود، با سه شاخصِ مشخص، نه فقط بر یکی. فازِ صفر اضافه شد: «حفاظت از استمرارِ نهادی» — فهرستِ نهادهایی که در هر سناریو باید سالم بمانند (بانک مرکزی، ثبت احوال، شبکهٔ برق و آب، آرشیوها)، با پروتکلِ تحویلِ بی‌وقفه. تصریح دربارهٔ فرم: سند حالا می‌گوید بی‌فرمیِ میثاق یعنی «تعیین‌نکردن پیش از رأی»، نه «حذفِ گزینه‌ها از بحث» — و هر جریانی آزاد اس چه نشد: نقدِ سوم بخشاً رد شد: هر میثاقی که فرم را از پیش تعیین کند، به تعریف دیگر میثاق نیست و امضاکنندگانِ رقیبش را از دست می‌دهد. اما تصریحِ بالا، بخشِ منصفانهٔ این نقد را پاسخ می‌دهد.", "en": "Critique from مشروطه‌خواه و پادشاهی‌خواه: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from مشروطه‌خواه و پادشاهی‌خواه: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ملی‑مذهبی و اصلاح‌طلبِ بازمانده — «شما یک‌سومِ جامعه را از پیش حذف کرده‌اید»: نقدی از سمتِ کسانی که سند آن‌ها را «نقشِ سوخته» خوانده است. نقدها: ۱ · عددِ ۷۲٫۹٪ آن چیزی نیست که شما می‌گویید؛ ۲ · «اصلاح‌طلبی سوخت» یک گزارهٔ سیاسی است، نه یافته؛ ۳ · دینداران در نقشهٔ شما فقط مانع‌اند؛ ۴ · عدالت انتقالی بدون روحانیت، اجرا نمی‌شود. چه تغییر کرد: تفسیرِ عدد ۷۲٫۹٪ تصحیح شد: حالا صریحاً نوشته شده این رقم موافقت با جدایی نهاد دین از حکومت است و نه پشتیبانی از براندازی یا از هیچ آلترناتیوِ مشخصی — و اینکه شکافِ میان این دو، خودش بخشی از مسئلهٔ «سمتِ عرضه» است. بندِ پنجم میثاق: «تضمینِ آزادیِ دین و بی‌دینی، و مصونیتِ فضای عمومی از اجبارِ دینی و از حذفِ دینی» — هر دو سویه، در یک بند. نقشِ «ضامنِ اخلاقی» به کمیتهٔ عدالت انتقالی اضافه شد: با ترکیبِ صریحاً چندصدایی، شاملِ چهره‌های دینیِ مستقل. «اصلاح‌طلبِ بازمانده» بازتعریف شد: از «نقشِ سوخته» به «واسطهٔ فنیِ محتمل در سناریوی مذاکره‌ای» — با تصریحِ اینکه اعتبارِ اجتماعی‌اش صفر است اما دانشِ اجر", "en": "Critique from ملی‑مذهبی و اصلاح‌طلبِ بازمانده: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from ملی‑مذهبی و اصلاح‌طلبِ بازمانده: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هویت‌طلبِ قومی — کُرد، بلوچ، ترک، عرب — «تمامیت ارضی بندِ اول است، حقوقِ ما بندِ هیچم»: نقدی که سند در نسخهٔ قبل، ضعیف‌ترین پاسخ را به آن داشت. نقدها: ۱ · ترتیبِ بندها، خودش پیام است؛ ۲ · دادهٔ «۲۹٪ چندقومیتی» درست است و نتیجه‌گیری‌اش نه؛ ۳ · هزینهٔ گذار در حاشیه، چند برابر است؛ ۴ · هیچ‌کدام از پنج ابتکار، مکانیزمِ نمایندگیِ منطقه‌ای ندارد. چه تغییر کرد: بندِ چهارم به میثاق اضافه شد و ترتیب عوض شد: «حقوقِ برابرِ شهروندی صرف‌نظر از قومیت، زبان، جنسیت و باور — شاملِ آموزش به زبان مادری» حالا هم‌ردهٔ تمامیت ارضی است و در یک بندِ واحد با آن آمده: تمامیت ارضی و برابریِ شهروندی، دو رویِ یک تعهد. ردیفِ منطقه‌ای به جدولِ هزینه اضافه شد: با تصریحِ اینکه هزینهٔ سرانهٔ گذار در استان‌های مرزی تاریخاً چند برابرِ میانگین ملی بوده و مدل باید این نامتقارنی را جدا گزارش کند. سهمیهٔ نمایندگیِ منطقه‌ای: در هر چهار نهادِ پیشنهادی، حداقلِ یک‌سومِ اعضا از خارجِ پنج کلان‌شهر — به‌عنوان قاعدهٔ تأسیسی، نه توصیه. خوانشِ دادهٔ ۲۹٪ اصلاح شد: از «مسئله حل است» به «بهانه‌ا", "en": "Critique from هویت‌طلبِ قومی — کُرد، بلوچ، ترک، عرب: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from هویت‌طلبِ قومی — کُرد، بلوچ، ترک، عرب: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جنبشِ زنان — «ما را سوژهٔ محوری خواندید و بعد از میز کنار گذاشتید»: نقدی که به فاصلهٔ میانِ تحلیل و ساختارِ پیشنهادی اشاره می‌کند. نقدها: ۱ · محوری در تحلیل، غایب در ساختار؛ ۲ · «حقوقی، نه ادراکی» را نوشتید و پیگیری نکردید؛ ۳ · «عدم انتقام» برای بازماندگانِ خشونتِ جنسی معنای دیگری دارد؛ ۴ · نرخ مشارکت ۱۳٫۷٪ فقط یک ستم نیست، یک اهرم است. چه تغییر کرد: شش موردِ حقوقی وارد متن شد: ارث، دیه، حضانت، ولایت، سفر و پوشش حالا به‌صراحت در بندِ برابریِ شهروندیِ میثاق نام برده شده‌اند — به‌عنوان مواردی که رفعِ نابرابریِ قانونی در آن‌ها پیش‌شرطِ امضاست، نه موضوعِ مذاکرهٔ بعدی. استثنای صریح در عدالت انتقالی: جرایمِ جنسی، شکنجه و کشتار از دامنهٔ عفوِ مشروط خارج شدند. سهمیهٔ حضور: حداقلِ نیمی از اعضای کمیتهٔ عدالت انتقالی و یک‌سومِ هر نهادِ دیگر، زنان — قاعدهٔ تأسیسی. شاخصِ هشتم: سهمِ زنانِ سرپرستِ خانوار از پوششِ صندوق — که هم‌زمان محرومیت و اهرم را می‌سنجد.", "en": "Critique from جنبشِ زنان: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from جنبشِ زنان: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "واقع‌گرایِ درون‌حاکمیتی — «فرضِ شما این است که ما عقلانی‌ایم؛ اگر باشیم، پیشنهادتان کار نمی‌کند»: قوی‌ترین شکلِ نقد از سمتی که سند آن را «حریف» می‌داند. آوردنش لازم است، چون اگر این نقد درست باشد، بخشِ زیادی از سند فرو می‌ریزد. نقدها: ۱ · عدالت انتقالی، تعهدِ غیرقابل‌اتکاست؛ ۲ · اعتصابِ سراسری در اقتصادِ غیررسمی، شمشیرِ دولبه است؛ ۳ · شکافِ درونیِ ما را بزرگ‌تر از واقعیت می‌بینید؛ ۴ · هزینهٔ سناریوی سوم را کم‌برآورد کرده‌اید. چه تغییر کرد: مسئلهٔ اجرای تعهد، به‌رسمیت شناخته شد: بخشِ تازه‌ای اضافه شد با سه سازوکارِ افزایشِ اتکاپذیری — ضمانتِ نهادِ بین‌المللیِ ثالث، ثبتِ حقوقیِ پیشینی، و مشارکتِ خودِ نمایندگانِ آن لایه در نگارشِ متن. با این تصریح که هیچ‌کدام مسئله را کاملاً حل نمی‌کند. تحلیلِ اهرمِ اعتصاب اصلاح شد: تمرکز از «اعتصابِ عمومی» به گلوگاه‌های رسمیِ متمرکز منتقل شد — انرژی، حمل‌ونقل، بانک، مخابرات، آموزش — که همان بخشِ رسمیِ اقتصادند و اهرم دارند. سقفِ سناریوی سوم بالا رفت: بازه از «۱۰۰ تا ۵۰۰ هزار» به «۱۰۰ هزار تا بیش از یک میلیون» اصلاح شد، با تصریحِ اینکه این تغییر، فاصلهٔ سناریوها را بیشتر می‌کند نه کمتر. هشدارِ «شبک", "en": "Critique from واقع‌گرایِ درون‌حاکمیتی: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from واقع‌گرایِ درون‌حاکمیتی: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "روش‌شناس و اقتصاددان — «اعدادِ شما بارِ استدلالی‌ای را حمل می‌کنند که تحملش را ندارند»: نقدِ فنی — بدون موضعِ سیاسی. نقدها: ۱ · نسبتِ اهرمِ ۱ به ۱۰٬۰۰۰ یک مغالطهٔ مقایسه است؛ ۲ · «۵۰ میلیارد دلار فرار مغزها» با «۲۰ میلیارد صادرات نفت» هم‌جنس نیستند؛ ۳ · مقایسهٔ درآمد سرانهٔ ۲۰۲۵ با ۱۹۷۶ ترکیب را نادیده می‌گیرد؛ ۴ · بازه‌های تلفات، توزیعِ احتمال ندارند. چه تغییر کرد: نسبتِ اهرم بازمحاسبه شد: حالا به‌صورت ارزشِ انتظاری با تغییرِ احتمال آمده — سه سناریوی محافظه‌کارانه (تغییر احتمال ۲٪، ۵٪، ۱۰٪) و بازدهِ متناظرش. ادعای «۱ به ۱۰٬۰۰۰» حذف و جایش عددِ درست نشست، که همچنان به‌شدت مثبت است اما قابل دفاع. مقایسهٔ نفت و مغزها تفکیک شد: دو عدد دیگر کنارِ هم به‌عنوان نسبت ارائه نمی‌شوند؛ هرکدام با جنسِ خودش و با تصریحِ روش‌شناسی آمده‌اند. مقایسهٔ ۱۹۷۶ مقید شد: با سه قیدِ جمعیت، ترکیبِ سنی و سهمِ نفت. بازه‌ها صدک‌دار شدند: هر بازه حالا با تصریحِ دنبالهٔ سنگین و با گزارشِ صدکِ ۵۰ و ۹۰ آمده، نه با میانگین.", "en": "Critique from روش‌شناس و اقتصاددان: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from روش‌شناس و اقتصاددان: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نسل زد، داخلِ کشور — «این سند دربارهٔ ماست و با ما نوشته نشده»: نقدی که هیچ چارچوبِ نظری ندارد و سخت‌ترین است. نقدها: ۱ · کسی که هزینه می‌دهد، پای میز نیست؛ ۲ · افقِ ۹۰۰ روز، برای ما یعنی سه سالِ دیگر؛ ۳ · «کاهش خشونت» را برای ما نوشته‌اید یا برای خودتان؟؛ ۴ · نه به ما رسانه دادید، نه بودجه، نه امضا. چه تغییر کرد: قاعدهٔ سنی و جغرافیایی: در هر چهار نهادِ پیشنهادی، حداقل یک‌سومِ اعضا زیر سی‌وپنج سال و مقیمِ داخل — با سازوکارِ امنیتیِ مشارکتِ ناشناس برای کسانی که نمی‌توانند نامشان را بگذارند. افق فشرده شد: فازِ سوم از ۹۰۰ روز به ۶۰۰ روز کوتاه شد و «تعیینِ تاریخِ همه‌پرسی» به فازِ اول منتقل شد — تاریخ باید از روزِ نخست معلوم باشد، حتی اگر دور باشد. بندِ هزینه: به بخشِ قانونِ طلایی اضافه شد که هرکس کاهشِ خشونت را توصیه می‌کند، موظف است سهمِ خود از هزینهٔ آن را مشخص کند — و این، خودِ ابتکار چهارم را از یک پیشنهادِ فنی به یک تعهدِ اخلاقی بدل می‌کند. ابتکار ششم اضافه شد: «کانالِ امنِ مشارکت» — سازوکاری که امضا", "en": "Critique from نسل زد، داخلِ کشور: objections, changes made and changes not made, as in the Persian text.", "nl": "Critique from نسل زد، داخلِ کشور: objections, changes made and changes not made, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "آزمونِ جانشینی روی هر پنج ابتکار اجرا شد؛ ابتکارِ سوم تنها موردی بود که ردش نکرد و صورت‌بندی‌اش از «پیشنهاد به یک نفر» به «معیارِ عمومی برای هر مدعیِ رهبری» عوض شد.", "en": "The substitution test was run on all five initiatives; the third alone failed it and was reformulated from \"a proposal to one person\" to \"a public standard for any claimant to leadership\".", "nl": "The substitution test was run on all five initiatives; the third alone failed it and was reformulated from \"a proposal to one person\" to \"a public standard for any claimant to leadership\"."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:covenantal-transition", "rel": "see-also", "note": {"fa": "برنامهٔ ۹۰/۹/۶۰۰", "en": "90/9/600 plan", "nl": "90/9/600 plan"}}, {"to": "simorgh:cost-model", "rel": "see-also", "note": {"fa": "برآوردِ هزینه", "en": "Cost model", "nl": "Cost model"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-history", "kind": "concept", "title": {"fa": "ادعاهای تاریخ", "en": "Claims: history", "nl": "Claims: history"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "18 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "18 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "18 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "تا ۱۵۰۱ میلادی — نُه قرن پس از ورودِ اسلام — اکثریتِ مردمِ ایران سنی بودند. (۱۵۰۱؛ ۶۵۱–۱۵۰۱؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: شواهدِ جمعیتیِ مذهبیِ پیش از صفویه که اکثریتِ شیعه را نشان دهد. یادداشت: قیدِ خودِ متن: «اکثریت سنی بودند» درست است؛ «تشیع در ایران بیگانه بود» غلط است — قم، کاشان، سبزوار و ری قرن‌ها پیش‌تر مراکزِ شیعی بودند.", "en": "Claim sunni-1501: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim sunni-1501: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:3de57600b8", "src:29661f76db"], "flags": []}, {"text": {"fa": "ایلخان الجایتو در ۱۳۱۰ رسماً به تشیعِ دوازده‌امامی گروید — دو قرن پیش از صفویه. (۱۳۱۰؛ ۱۳۱۰؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: بازخوانیِ منابعِ ایلخانی که این گرویدن را موقت یا صوری نشان دهد.", "en": "Claim oljaitu: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim oljaitu: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:3de57600b8"], "flags": []}, {"text": {"fa": "نخستین ادعای اقتدارِ سیاسی برای فقیه در ایران، حدودِ ۱۵۳۰ ثبت شده: فرمانِ شاه طهماسب که محقق کرکی «نایبِ امام» است. (≈۱۵۳۰؛ ۱۵۳۰؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: بازخوانیِ فرمان که دامنه‌اش را صرفاً تشریفاتی نشان دهد. (محلِ نزاع) یادداشت: خودِ متن می‌گوید دامنهٔ این فرمان محلِ بحث است.", "en": "Claim karaki: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim karaki: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:3de57600b8", "src:29661f76db"], "flags": ["editor-note"]}, {"text": {"fa": "شکافِ «همکاری با قدرت» در برابر «کناره‌گیری از آن» از روز اول درونِ روحانیت بود: ابراهیم قطیفی در برابرِ کرکی، گرفتنِ منصب و پول از حاکمِ جائر را حرام می‌دانست. (کیفی؛ قرن ۱۶؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: منابعِ دورهٔ صفوی که نشان دهد مناقشهٔ قطیفی و کرکی بر سرِ مشروعیتِ همکاری با شاه نبود، یا اینکه این دوگانگی در روحانیت بعدها برساخته شده. یادداشت: همان شکافی که در مشروطه، در ۵۷، و امروز در حوزه تکرار می‌شود.", "en": "Claim qatifi: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim qatifi: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:3de57600b8", "src:7f0523f6e7"], "flags": []}, {"text": {"fa": "سقوطِ اصفهان در ۱۷۲۲ را ارتشی کوچک از غلجایی‌های قندهار رقم زد — نشانهٔ پوسیدگیِ نظامی، نه نتیجهٔ سیاستِ دینی. (۱۷۲۲؛ ۱۷۲۲؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: تحلیلِ اقتصادی‌ای که عاملِ دینی را تعیین‌کننده نشان دهد. (محلِ نزاع) یادداشت: این ردِ صریحِ تحلیلِ رایج است که سقوطِ صفویه را به گردنِ تعصبِ مجلسی می‌اندازد؛ مورخانِ اقتصادی بحرانِ مالی و فروپاشیِ قزلباش را سنگین‌تر می‌دانند.", "en": "Claim isfahan-1722: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim isfahan-1722: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:4cde610b3d"], "flags": ["editor-note"]}, {"text": {"fa": "نادرشاه (۱۷۳۶–۱۷۴۷) خواست تشیع را از هویتِ رسمیِ ایران پایین بکشد — پیشنهادِ «مذهبِ جعفری» به‌عنوانِ مذهبِ پنجم؛ اوقاف را مصادره و ملاباشی را اعدام کرد. (۱۷۳۶–۱۷۴۷؛ ۱۷۳۶–۱۷۴۷؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: شواهدی که مهاجرتِ روحانیت به عتبات را عمدتاً مستقل از فشارِ نادر نشان دهد. یادداشت: قیدِ خودِ متن: این روایت نقشِ نادر را بزرگ می‌کند؛ مهاجرت به عتبات پیش از او هم جریان داشت.", "en": "Claim nader: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim nader: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:29661f76db", "src:9afd45ad62"], "flags": []}, {"text": {"fa": "از حدودِ ۱۸۵۰ جریانِ بزرگی از پول به نجف و کربلا سرازیر شد: موقوفهٔ نوابانِ اَوَده در هند — که انتقال و توزیعش را خودِ بریتانیا اداره می‌کرد. (≈۱۸۵۰ به بعد؛ ۱۸۵۰–؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: حساب‌رسیِ تاریخی که سهمِ اوده را در برابرِ خمس ناچیز نشان دهد. یادداشت: این روایتِ رایج را که استقلالِ مالیِ روحانیت فقط از خمسِ مردمِ ایران آمد، پیچیده می‌کند.", "en": "Claim oudh: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim oudh: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:818090ad06"], "flags": []}, {"text": {"fa": "پس از درگذشتِ صاحبِ جواهر در ۱۸۵۰، شیخ مرتضی انصاری برای نخستین بار مرجعِ تقلیدِ بلامنازعِ کلِ جهانِ شیعه شد و نظامِ دریافتِ وجوهات را قاعده‌مند کرد. (۱۸۵۰؛ ۱۸۵۰–۱۸۶۴؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: شواهدی از مراجعِ هم‌ترازِ هم‌زمان که «بلامنازع» را نقض کند.", "en": "Claim ansari: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim ansari: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:818090ad06"], "flags": []}, {"text": {"fa": "امتیازِ رویتر در ۱۸۷۲ تقریباً کلِ منابعِ اقتصادیِ کشور را به یک تبعهٔ بریتانیا واگذار کرد؛ لردکرزن آن را «کامل‌ترین واگذاریِ منابعِ یک کشور به یک بیگانه در تمامِ تاریخ» خواند. (۱۸۷۲؛ ۱۸۷۲؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: متنِ امتیاز که دامنه‌اش را محدودتر نشان دهد.", "en": "Claim reuter: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim reuter: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:75089897c4"], "flags": []}, {"text": {"fa": "تحریمِ سراسریِ تنباکو (۱۸۹۰) کار کرد و قرارداد در ۱۸۹۲ لغو شد — با غرامتی که نخستین بدهیِ خارجیِ ایران را رقم زد. (۱۸۹۰–۱۸۹۲؛ ۱۸۹۰–۱۸۹۲؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: تحلیلی که لغوِ امتیاز را عمدتاً به فشارِ روسیه یا مالیِ دولت نسبت دهد. یادداشت: پیوندِ بازار و روحانیت در این‌جا ساختاری بود نه اتفاقی — همان ائتلافی که موتورِ ۱۸۹۱، مشروطه و ۱۳۵۷ است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim tobacco: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim tobacco: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "در مشروطه (۱۹۰۵–۱۹۱۱) روحانیت دو نیم شد؛ شیخ فضل‌الله نوری «مشروعه» خواست و در ۱۹۰۹ اعدام شد. جمهوری اسلامی وارثِ نوری است، نه بهبهانی. (۱۹۰۹؛ ۱۹۰۵–۱۹۱۱؛ ردهٔ 2؛ سندِ تاریخی + تفسیر). شرطِ ابطال: خوانشی که پیوندِ فکریِ جمهوری اسلامی را به خطِ مشروطه‌خواهِ روحانیت وصل کند. یادداشت: نتیجه‌ای که متن می‌گیرد: خطِ حاکمِ امروز خطی است که یک بار، در ۱۹۰۹، باخته بود. این یک تفسیر است.", "en": "Claim nuri-1909: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim nuri-1909: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:3c12f4366b"], "flags": []}, {"text": {"fa": "آیت‌الله بروجردی تا ۱۹۶۱ سیاست‌گریزی را اصل کرد و جلوی ورودِ حوزه به سیاست را گرفت؛ مرگِ او دری را باز کرد که خمینی از آن وارد شد. (۱۹۶۱؛ –۱۹۶۱؛ ردهٔ 2؛ سندِ تاریخی + تفسیر). شرطِ ابطال: شواهدی از فعالیتِ سیاسیِ سازمان‌یافتهٔ حوزه در دورهٔ بروجردی.", "en": "Claim borujerdi: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim borujerdi: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:740cb65f08", "src:1fcd553f41"], "flags": []}, {"text": {"fa": "نوآوریِ خمینی در مفهومِ نیابت نبود، در دامنهٔ آن بود: ملا احمد نراقی (د. ۱۸۲۹) پیش‌تر از نیابتِ عامهٔ فقیه گفته بود. (۱۹۷۰ · ۱۸۲۹؛ ۱۸۲۹ ← ۱۹۷۰؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: خوانشِ عوائد الایام که ادعای نراقی را به‌مراتب محدودتر نشان دهد. یادداشت: این ردِ صریحِ ادعای رایجِ «کاملاً بی‌سابقه» است.", "en": "Claim velayat: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim velayat: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:9cbf7f5dbf", "src:21e1ce9154"], "flags": []}, {"text": {"fa": "پرسشِ درستِ ۱۳۵۷ این نیست که چرا مردم مذهبی‌تر شدند — نشدند — بلکه این است که چرا وقتی رژیم افتاد فقط یک نیرو آمادهٔ گرفتنِ قدرت بود. ساواک هر شبکهٔ سراسری را نابود کرده بود، به‌جز یکی. (کیفی؛ ۱۳۳۲–۱۳۵۷؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: شواهدی از یک شبکهٔ سراسریِ رقیب که در ۵۷ سالم مانده بود. (محلِ نزاع) یادداشت: قیدِ خودِ متن: شبکهٔ مسجد توضیح می‌دهد چرا روحانیت توانست هماهنگ کند؛ توضیح نمی‌دهد چرا در نبردِ قدرتِ ۱۳۵۸–۱۳۶۰ برنده شد. آن را سازماندهی، خشونت و کاریزما توضیح می‌دهد.", "en": "Claim only-network: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim only-network: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:435917f7dd"], "flags": ["editor-note"]}, {"text": {"fa": "چپِ ایران زبانِ بسیجش را به روحانیت قرض داد؛ روحانیت با همان زبان خودش را حاکم کرد و چپ را حذف: مجاهدین از ۱۳۶۰، حزب توده در ۱۳۶۲، و کشتارِ ۱۳۶۷. (۱۳۶۰–۱۳۶۷؛ ۱۳۵۷–۱۳۶۷؛ ردهٔ 1؛ سندِ تاریخی). شرطِ ابطال: شواهدی که ائتلافِ چپ و روحانیت را تاکتیکیِ کوتاه و کم‌اثر نشان دهد. یادداشت: متن این را یک خطای شناختی می‌داند نه یک موضعِ ایدئولوژیک — و همان الگو را در افغانستان و در رشدِ حماس نشان می‌دهد.", "en": "Claim left-borrowed: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim left-borrowed: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:9cbf7f5dbf"], "flags": []}, {"text": {"fa": "جنبشِ باب از ۱۸۴۴ آغاز شد و باب در ۱۸۵۰ اعدام شد؛ اثرِ ساختاری‌اش این بود که روحانیتِ رسمی خود را در کنارِ دولت نگهبانِ نظم تعریف کرد و یک دشمنِ داخلیِ دائمی به دست آورد. (۱۸۴۴–۱۸۵۰؛ ۱۸۴۴–۱۸۵۰؛ ردهٔ 2؛ سندِ تاریخی + تفسیر). شرطِ ابطال: روایتی که آزارِ بهائیان را عمدتاً پس از ۱۳۵۷ و بی‌ارتباط با این دوره نشان دهد.", "en": "Claim babi: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim babi: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:fcd2050f8a"], "flags": []}, {"text": {"fa": "رابطهٔ ایران و یهودیت یکی از قدیمی‌ترین و پیوسته‌ترین روابطِ دو تمدن در تاریخِ بشر است — حدودِ ۲۷۰۰ سال. (≈۲۷۰۰ سال؛ ≈۷۰۰ پ.م تا امروز؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: گاه‌شماری که حضورِ پیوسته را قطع‌شده نشان دهد. یادداشت: عددِ ۲۷۰۰ (از اسارتِ آشور) با عددِ ۲۶۰۰ (از کوروش) در صفحهٔ دیگرِ همین سایت فرق دارد؛ هر دو درست‌اند چون مبدأشان فرق می‌کند. این را باید صریح گفت.", "en": "Claim thread-2700: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim thread-2700: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:f34eb6e679"], "flags": []}, {"text": {"fa": "آیت‌الله منتظری، جانشینِ تعیین‌شدهٔ رهبری از ۱۳۶۴ (۱۹۸۵)، پس از اعتراض به اعدامِ دسته‌جمعیِ زندانیانِ سیاسی در ۱۳۶۷، در فروردینِ ۱۳۶۸ (مارسِ ۱۹۸۹) کنار گذاشته شد. (۱۳۶۴ ← ۱۳۶۸؛ ۱۳۶۷–۱۳۶۸؛ ردهٔ 2؛ سندِ تاریخی). شرطِ ابطال: اسنادی که نشان دهد کنارگذاشتنِ منتظری ربطی به اعتراضش به اعدام‌ها نداشت. یادداشت: این سطر یک نمونه است، نه اثبات. ادعای کارت — که مخالفتِ روحانی برای حکومتِ دینی از هر نقدِ بیرونی گران‌تر است — تفسیر است؛ این نمونه نشان می‌دهد حکومت این مخالفت را چقدر جدی گرفت، نه اینکه چقدر به آن ضربه زد.", "en": "Claim montazeri-1989: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim montazeri-1989: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:c0362f9228"], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": ["src:1fcd553f41", "src:21e1ce9154", "src:29661f76db", "src:3c12f4366b", "src:3de57600b8", "src:435917f7dd", "src:4cde610b3d", "src:740cb65f08", "src:75089897c4", "src:7f0523f6e7", "src:818090ad06", "src:9afd45ad62", "src:9cbf7f5dbf", "src:c0362f9228", "src:f34eb6e679", "src:fcd2050f8a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:argmap", "kind": "concept", "title": {"fa": "نقشهٔ استدلال", "en": "Argument map", "nl": "Argument map"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "پانزده گره و هجده پیوند در پنج گام: استعاره، ادعا، شاهد، ممیزی، عمل؛ نشان می‌دهد هر نتیجه از کدام ادعا و کدام شاهد می‌آید و کجا ضعیف است.", "en": "Fifteen nodes and eighteen links in five steps: metaphor, claim, evidence, audit, action; shows which claim and evidence each conclusion comes from and where it is weak.", "nl": "Fifteen nodes and eighteen links in five steps: metaphor, claim, evidence, audit, action; shows which claim and evidence each conclusion comes from and where it is weak."}, "points": [{"text": {"fa": "پنج گام: استعاره، ادعا، شاهد، ممیزی، عمل.", "en": "Five steps: metaphor, claim, evidence, audit, action.", "nl": "Five steps: metaphor, claim, evidence, audit, action."}, "sources": [], "flags": []}, {"text": {"fa": "هر گره به ادعاهای دیتاست وصل است؛ گرهی که پشتوانه ندارد همان‌جا نشان داده می‌شود.", "en": "Each node links to dataset claims; a node without support is shown as such.", "nl": "Each node links to dataset claims; a node without support is shown as such."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "دیتاست", "en": "Dataset", "nl": "Dataset"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:history", "kind": "field", "title": {"fa": "تاریخ و ریشه‌ها", "en": "History and roots", "nl": "History and roots"}, "aliases": [], "parent": "simorgh:simorgh", "field": null, "summary": {"fa": "دو ایران، پانصد سالِ بالا رفتنِ روحانیت، ۱۳۵۷ و ایران و اسرائیل در بلندمدت.", "en": "Two Irans, five centuries of clerical rise, 1979, and Iran and Israel in the long run.", "nl": "Two Irans, five centuries of clerical rise, 1979, and Iran and Israel in the long run."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:my-share", "kind": "concept", "title": {"fa": "«سهم من»: دو پرسش، سه قدم", "en": "My share: two questions, three steps", "nl": "My share: two questions, three steps"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "ابزاری که از هر نفر می‌پرسد «کارت چیست؟» و «چه سهمی می‌تواند داشته باشد؟»، و برای هر حرفه‌ای مرغ‌های مناسب و سه قدمِ کم‌خطر می‌دهد. برای کسی که داخلِ ایران است هیچ قدمِ پرخطری پیشنهاد نمی‌شود.", "en": "A tool asking each person what they do and what share they could have, giving for each profession suitable birds and three low-risk steps. No high-risk step is suggested to anyone inside Iran.", "nl": "A tool asking each person what they do and what share they could have, giving for each profession suitable birds and three low-risk steps. No high-risk step is suggested to anyone inside Iran."}, "points": [{"text": {"fa": "سلامت و درمان: مرغ‌های مناسب: پزشک و پرستار، روان‌یار و سوگ‌یار. قدم‌ها: بخش سلامت دفتر ویرانی‌ها را نقد کن و یک اولویت پیشنهاد بده؛ فقط بدان روز آزادی کجا لازم هستی؛ کار بیرونی نه؛ اورژانس جشن‌ها یا داروخانهٔ باز؛ شبکهٔ درمان محله یا همیاری سوگ", "en": "سلامت و درمان: suitable birds and steps, as in the Persian text.", "nl": "سلامت و درمان: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "آموزش: مرغ‌های مناسب: آموزگار سوادآموزی، پژوهشگر و داده. قدم‌ها: در یک دورهٔ دانش‌سرا شرکت کن و یک درس بساز؛ سواد رسانه‌ای را در کلاس عادی تمرین بده؛ مدرسه را پایگاه امن محله نگه دار؛ بازنویسی کتاب درسی یا سوادآموزی", "en": "آموزش: suitable birds and steps, as in the Persian text.", "nl": "آموزش: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فنی و مهندسی: مرغ‌های مناسب: آب‌بان، شهرساز و مسکن. قدم‌ها: بخش آب یا شهر دفتر ویرانی‌ها را بخوان و یک خطر را اولویت بده؛ زیرساخت اطرافت را بشناس؛ هیچ گزارش‌دهی ناامن؛ سر کار ماندن در آب، برق یا گاز؛ ممیزی چاه‌ها یا ایمنی ساختمان‌ها", "en": "فنی و مهندسی: suitable birds and steps, as in the Persian text.", "nl": "فنی و مهندسی: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فناوری و داده: مرغ‌های مناسب: دولت دیجیتال، پژوهشگر و داده. قدم‌ها: یکی از ابزارهای دانش‌سرا یا سیمرغ را بساز؛ امنیت دیجیتال خودت و خانواده‌ات را بالا ببر؛ برقراری اینترنت آزاد یا نگهبانی از سرورها؛ شناسهٔ دیجیتال و دولت الکترونیک", "en": "فناوری و داده: suitable birds and steps, as in the Persian text.", "nl": "فناوری و داده: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "حقوق: مرغ‌های مناسب: دادرسی و حقوق، انتخابات و قانون اساسی. قدم‌ها: بخش عدالت انتقالی را نقد کن؛ پیش‌نویس یک اصل بنویس؛ قانون‌های تبعیض‌آمیز را برای بعد فهرست کن، فقط برای خودت؛ ثبت امن روایت شاهدان؛ هیئت حقیقت‌یاب یا اصلاح قوانین", "en": "حقوق: suitable birds and steps, as in the Persian text.", "nl": "حقوق: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هنر و رسانه: مرغ‌های مناسب: رسانه و روایت، جشن‌ساز و فرهنگ. قدم‌ها: اثرت را در بازار هنر بفروش یا برای سیمرغ تصویر بساز؛ روزنهٔ امید را در اثرت نگه دار؛ پیام ناامن نه؛ طراحی نماد و فضای جشن؛ یادبود جان‌باختگان، مرمت میراث", "en": "هنر و رسانه: suitable birds and steps, as in the Persian text.", "nl": "هنر و رسانه: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کسب‌وکار و مالی: مرغ‌های مناسب: اقتصاد و بودجه، کارآفرین و سرمایه‌گذار. قدم‌ها: حامی ماهانه شو یا یکی از محصولات را راه بینداز؛ کسب‌وکارت را سرپا نگه دار؛ کارکنانت را نگه دار؛ باز نگه داشتن مغازه یا نانوایی؛ سرمایه‌گذاری در شهرهای دور", "en": "کسب‌وکار و مالی: suitable birds and steps, as in the Persian text.", "nl": "کسب‌وکار و مالی: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کشاورزی و محیط زیست: مرغ‌های مناسب: کشاورزی پایدار، نگهبان طبیعت و جنگل. قدم‌ها: یک خطر زیست‌محیطی را در دفتر ویرانی‌ها کامل کن؛ روش‌های کم‌آب را در زمین خودت آزمایش کن؛ رساندن غذا به شهرها؛ نجات آبخوان، کاشت درخت", "en": "کشاورزی و محیط زیست: suitable birds and steps, as in the Persian text.", "nl": "کشاورزی و محیط زیست: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "خدمات و کار فنی: مرغ‌های مناسب: همسایه‌یار محله، پاک‌سازی و داوطلبی. قدم‌ها: یک شب بازی سیمرغ را با دوستانت برگزار کن؛ همسایه‌هایت را بشناس؛ کمک‌های اولیه یاد بگیر؛ سر زدن به پنج خانهٔ از پیش معلوم؛ تعمیر مدرسه و درمانگاه محله", "en": "خدمات و کار فنی: suitable birds and steps, as in the Persian text.", "nl": "خدمات و کار فنی: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دانشجو یا بی‌تخصص: مرغ‌های مناسب: همسایه‌یار محله، پاک‌سازی و داوطلبی. قدم‌ها: یک دورهٔ دانش‌سرا را تمام کن و یک «اول حدس بزن» را با دوستی بازی کن؛ کمک‌های اولیه و راستی‌آزمایی شایعه را یاد بگیر؛ آب و غذا به جمع‌ها؛ پاک‌سازی فردای جشن؛ یاد دادن خواندن و نوشتن به یک نفر", "en": "دانشجو یا بی‌تخصص: suitable birds and steps, as in the Persian text.", "nl": "دانشجو یا بی‌تخصص: suitable birds and steps, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}, {"to": "simorgh:step-cards", "rel": "see-also", "note": {"fa": "قدمِ تو", "en": "Your step", "nl": "Your step"}}, {"to": "simorgh:safety-first", "rel": "see-also", "note": {"fa": "اول ایمنی", "en": "Safety first", "nl": "Safety first"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:project", "kind": "field", "title": {"fa": "خودِ پروژه", "en": "The project itself", "nl": "The project itself"}, "aliases": [], "parent": "simorgh:simorgh", "field": null, "summary": {"fa": "نقشهٔ کلان، علم‌ها، دفتر ویرانی‌ها، محصولات، میز دایره‌ای، ابزارها و نقشهٔ صفحه‌ها.", "en": "The master plan, sciences, ruins ledger, products, circle table, tools and the page map.", "nl": "The master plan, sciences, ruins ledger, products, circle table, tools and the page map."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:audit", "kind": "concept", "title": {"fa": "ممیزیِ ضعف‌ها: آنچه اگر ننویسیم منتقد پیدا می‌کند", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "پروژه ضعف‌های خودش را علنی فهرست کرده، چون اگر خودش نگوید اولین منتقدِ جدی پیدایش می‌کند. یافته‌های اصلی در یک نگاه.", "en": "The project lists its own weaknesses openly, since otherwise the first serious critic will find them. Main findings at a glance.", "nl": "The project lists its own weaknesses openly, since otherwise the first serious critic will find them. Main findings at a glance."}, "points": [{"text": {"fa": "۱۴ ادعا (۱۸٪) به یک ارجاعِ جمعی بند است: کلِ بلوکِ اقتصادی و جمعیتی به یک گزارشِ مدوّن وصل است که خودش به مرکز آمار، مرکز پژوهش‌های مجلس، بانک جهانی و پیمایش‌ها تکیه می‌کند؛ پس این ادعاها مستقل از هم تأیید نشده‌اند.", "en": "14 claims (18 percent) rest on one collective reference: the whole economic and demographic block hangs on one compiled report; they are not independently confirmed.", "nl": "14 claims (18 percent) rest on one collective reference: the whole economic and demographic block hangs on one compiled report; they are not independently confirmed."}, "sources": [], "flags": []}, {"text": {"fa": "متنِ اصلی پیش از جنگِ ۱۴۰۴–۱۴۰۵ نوشته شده و بخشی از اعداد پیش از جنگ‌اند؛ باید با دادهٔ تازه دوباره سنجیده شوند.", "en": "The core text predates the 2025-26 war and some numbers are pre-war; they must be re-checked against new data.", "nl": "The core text predates the 2025-26 war and some numbers are pre-war; they must be re-checked against new data."}, "sources": [], "flags": []}, {"text": {"fa": "«۲۶۰۰ در برابر ۲۷۰۰ سال» در دو جا فرق می‌کند چون نقطهٔ آغازشان فرق دارد (اسارتِ بابل در برابر نخستین پیوندها)؛ باید هر جا یکی بماند و نقطهٔ آغاز گفته شود.", "en": "\"2600 versus 2700 years\" differs because the origin points differ; one should remain and its start be stated.", "nl": "\"2600 versus 2700 years\" differs because the origin points differ; one should remain and its start be stated."}, "sources": [], "flags": []}, {"text": {"fa": "«۸۰ تا ۹۰ درصدِ مسئله» (اثرِ موضع‌گیریِ صریح نسبت به رفتارِ هواداران) عددی بدونِ روش است و فقط به‌عنوانِ داوریِ کیفیِ نقل‌شده در منبع آمده.", "en": "\"80 to 90 percent of the problem\" is a number without method, quoted only as a qualitative judgement from the source.", "nl": "\"80 to 90 percent of the problem\" is a number without method, quoted only as a qualitative judgement from the source."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "رقمِ ≈۵۰ میلیارد دلارِ سالانهِ فرار مغزها منبعِ اولیه ندارد و فقط به‌صورت «برآوردِ منسوب به بانکِ جهانی» نقل شده؛ مقایسه‌اش با صادراتِ نفتِ ۲۰۱۹ هم‌جنس نیست و در میزِ نقد هم همین گفته شد.", "en": "The ≈50 billion dollars a year brain-drain figure has no primary source and is quoted as \"attributed to the World Bank\"; comparing it with 2019 oil exports is not like for like.", "nl": "The ≈50 billion dollars a year brain-drain figure has no primary source and is quoted as \"attributed to the World Bank\"; comparing it with 2019 oil exports is not like for like."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "۱۰ از ۱۸ کارتِ قدمِ تو (در نسخهٔ آن زمان) پشتوانهٔ دیتاست نداشتند؛ حالا کارت‌ها ۲۳ تا هستند و باید دوباره سنجیده شوند.", "en": "10 of 18 \"your step\" cards lacked dataset backing at the time; there are now 23 cards and they must be re-checked.", "nl": "10 of 18 \"your step\" cards lacked dataset backing at the time; there are now 23 cards and they must be re-checked."}, "sources": [], "flags": []}, {"text": {"fa": "ناهمخوانیِ شمارش: صفحه‌ها گاهی ۷۶ و گاهی ۸۴ ادعا می‌گویند؛ شمارهٔ درست ۸۴ است.", "en": "Count mismatch: some pages say 76 claims, others 84; 84 is correct.", "nl": "Count mismatch: some pages say 76 claims, others 84; 84 is correct."}, "sources": [], "flags": []}, {"text": {"fa": "یافته‌های بازبینیِ آبان ۱۴۰۵ (اصلاح‌شده): (۱) شرطِ بردِ «یک روزِ واحد» با پژوهش ناسازگار بود و به «هماهنگیِ پایدار با یک لحظهٔ کانونی» تغییر کرد؛ (۲) «حذف» در بازی ابهام داشت و حالا صریحاً «پس‌گرفتنِ همکاری» است؛ (۳) حرکتِ «خروج» در بازی نبود و اضافه شد؛ (۴) عفوِ مشروط مرزِ جنایت‌های جمعی را نداشت و حالا دارد؛ (۵) راهِ بیرونی (جنگ) در سه راه نبود و اضافه شد؛ (۶) برآوردِ ۱۰ تا ۱۵٪ حالا لنگرِ پیمایشی دارد؛ (۷) شمارش‌های ۲۷/۳۷/۴۷/۳۰ توضیح داده شد.", "en": "November 2026 review findings (fixed): one-day win condition, ambiguous elimination, missing exit move, amnesty limits, missing outside path, survey anchor, clarified counts.", "nl": "November 2026 review findings (fixed): one-day win condition, ambiguous elimination, missing exit move, amnesty limits, missing outside path, survey anchor, clarified counts."}, "sources": ["src:f1a8df8bf8", "src:7272339677", "src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "یافته‌های بازبینی که هنوز باز است: جدول‌های هزینه پیش از جنگ‌اند و باید بازسازی شوند؛ «۸۰ تا ۹۰ درصدِ مسئله» هنوز روش ندارد؛ و تحلیلِ «چرا دی ۱۴۰۴ کافی نبود» تفسیر است و با دادهٔ بیشتر (مثلاً دربارهٔ ریزشِ نیروها) باید آزموده شود.", "en": "Still open: pre-war cost tables, the 80-90 percent figure, and the January analysis is interpretive.", "nl": "Still open: pre-war cost tables, the 80-90 percent figure, and the January analysis is interpretive."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "محدودیتِ پیمایش که در بازبینیِ پیشین کم گفته شده بود: نمونهٔ خامِ گمان ۷۷٪ مرد بود، حجمِ مؤثر پس از وزن‌دهی حدود ۶٬۲۱۱ است، و وزن‌دهی بر پایهٔ گرایشِ سیاسی نیست. هر جا عددِ گمان آمده، این محدودیت هم باید باشد.", "en": "Survey limits under-stated before: raw GAMAAN sample 77 percent male, effective size about 6,211, no weighting on political orientation.", "nl": "Survey limits under-stated before: raw GAMAAN sample 77 percent male, effective size about 6,211, no weighting on political orientation."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "دیتاست", "en": "Dataset", "nl": "Dataset"}}, {"to": "simorgh:dataset-health", "rel": "see-also", "note": {"fa": "سلامتِ دیتاست", "en": "Dataset health", "nl": "Dataset health"}}, {"to": "simorgh:nine-faction-critique", "rel": "see-also", "note": {"fa": "میزِ نقد", "en": "Critique table", "nl": "Critique table"}}, {"to": "simorgh:current-situation", "rel": "see-also", "note": {"fa": "وضعیتِ امروز", "en": "Situation now", "nl": "Situation now"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون کافی نبود", "en": "Why 14 million was not enough", "nl": "Why 14 million was not enough"}}, {"to": "simorgh:gamaan-2026", "rel": "see-also", "note": {"fa": "پیمایشِ گمان (گزارش کامل)", "en": "GAMAAN full report", "nl": "GAMAAN full report"}}], "people": [], "sources": ["src:6c0a6f1ef3", "src:7272339677", "src:f1a8df8bf8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:characters-city", "kind": "concept", "title": {"fa": "شخصیت‌های جناح شهر", "en": "City-faction characters", "nl": "City-faction characters"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "شخصیت‌های شهر: از شهروند عادی و آمارگر مستقل تا ضامن و مترجم؛ و «مردد درونِ نظام» که قابل چرخش است.", "en": "City characters, from ordinary citizen and independent statistician to guarantor and translator; plus the \"doubter inside the system\", who can turn.", "nl": "City characters, from ordinary citizen and independent statistician to guarantor and translator; plus the \"doubter inside the system\", who can turn."}, "points": [{"text": {"fa": "مردد درون نظام (مافیا ∩ شهر) — تبدیلِ ناقص — قابل چرخش. مثالِ واقعی: طلبهٔ جوان مردد · افسر جوان استانی · کارمند بلندپایه در حال فاصله‌گرفتن · خانوادهٔ سنتیِ منتقدشده. ریشهٔ اسطوره‌ای: گودرز در دو راهی — لحظه‌ای که هنوز هر دو راه باز است.", "en": "مردد درون نظام (MC): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "مردد درون نظام (MC): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "شهروند عادی (فقط شهر) — شهروند. مثالِ واقعی: طبقهٔ متوسطِ فرودست‌شده · کارگر غیررسمی (۶۰٪ اشتغال) · فارغ‌التحصیل بیکار (۴۰٪ بیکاران) · بازنشسته · حاشیه‌نشین (۷ تا ۲۵ میلیون). ریشهٔ اسطوره‌ای: همان مردمی که در شاهنامه اسم ندارند و بدون آن‌ها هیچ داستانی اتفاق نمی‌افتد.", "en": "شهروند عادی (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "شهروند عادی (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "آمارگر مستقل (فقط شهر) — قوی‌ترین نقشِ شهر. مثالِ واقعی: پیمایشگر و آمارگر مستقل · شمارندهٔ کشته‌ها و بازداشتی‌ها · روزنامه‌نگار داده‌محور · کسی که فهرست نگه می‌دارد. ریشهٔ اسطوره‌ای: ترازوی داوری، ولی بدونِ داور. فقط شمارش.", "en": "آمارگر مستقل (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "آمارگر مستقل (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "صدای پرمخاطب (فقط شهر) — زنگ‌زن. مثالِ واقعی: سلبریتی و ورزشکار · رسانهٔ فارسی‌زبان خارج · کانال محلی پرمخاطب · کسی که اولین بار خبر را بیرون می‌دهد. ریشهٔ اسطوره‌ای: صدای پرمخاطبانِ بارگاه در شاهنامه — و آن یک بارِ کاوه که فریاد زد و همه‌چیز عوض شد.", "en": "صدای پرمخاطب (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "صدای پرمخاطب (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "رابط داخل و خارج (فقط شهر) — وصل‌کننده. مثالِ واقعی: ایرانیِ دیاسپورا که وصل مانده · کسی که مرکز و حاشیه را می‌شناسد · خانوادهٔ چندقومیتی (۲۹٪) · واسط دو نسل در یک خانواده. ریشهٔ اسطوره‌ای: پلِ چینوَد — پلی که در باور زرتشتی باید از آن گذشت و برای هرکس عرضش فرق می‌کند.", "en": "رابط داخل و خارج (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "رابط داخل و خارج (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ثبت‌کنندهٔ وقایع (فقط شهر) — وقایع‌نگار. مثالِ واقعی: مورخ و آرشیودار · مادری که فهرست نگه می‌دارد · مستندساز و راوی شفاهی · کسی که سند را از بین‌رفتن نجات می‌دهد. ریشهٔ اسطوره‌ای: دبیرانِ دربار ساسانی، و آن سنتِ هزارساله که هرچه شد نوشته شد.", "en": "ثبت‌کنندهٔ وقایع (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "ثبت‌کنندهٔ وقایع (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "شاهد (فقط شهر) — شاهد. مثالِ واقعی: شاهد عینی · پزشک و پرستارِ ساعت حادثه · هم‌بندِ آزادشده · کسی که فیلم گرفت و منتشر کرد. ریشهٔ اسطوره‌ای: سوگندِ مهر — که در باور کهن، شکستنش بزرگ‌ترین گناه بود.", "en": "شاهد (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "شاهد (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "سنجندهٔ اعتبار (فقط شهر) — صرافِ اعتبار. مثالِ واقعی: فعال قدیمی که سابقهٔ همه را می‌داند · وکیل و حقوق‌دان · راستی‌آزمای ادعاها · ریش‌سفید یک صنف. ریشهٔ اسطوره‌ای: اَشا — راستی و نظم کیهانی در باور زرتشتی، نقطهٔ مقابلِ دْروج.", "en": "سنجندهٔ اعتبار (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "سنجندهٔ اعتبار (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "رصدگر اقتصاد (فقط شهر) — رصدِ نرخ. مثالِ واقعی: اقتصاددان و تحلیل‌گر بازار · رصدکنندهٔ تورم و ارز و سبد معیشت · رصدکنندهٔ مهاجرت و جمعیت · کارشناس آب و محیط زیست. ریشهٔ اسطوره‌ای: دیده‌بانانِ برج‌های مرزی — که آتش روشن می‌کردند تا خبر از این سر تا آن سرِ سرزمین برود.", "en": "رصدگر اقتصاد (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "رصدگر اقتصاد (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "حامی و پوشش‌دهنده (فقط شهر) — واکسن‌زن. مثالِ واقعی: وکیل داوطلب · معلمی که دانش‌آموزش را پوشش می‌دهد · پزشک و امدادگر داوطلب · همسایه‌ای که در را باز می‌کند. ریشهٔ اسطوره‌ای: سپرِ گیو — که همیشه جلوی دیگری بود.", "en": "حامی و پوشش‌دهنده (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "حامی و پوشش‌دهنده (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ضامن (فقط شهر) — ضامن. مثالِ واقعی: کسی که وثیقه و سند می‌گذارد · بزرگِ طایفه و مرجع محلی · کارفرمایی که پشت کارگرش می‌ایستد · دوستی که ضمانت می‌کند. ریشهٔ اسطوره‌ای: مهر (میترا) — ایزدِ پیمان. ناظرِ همهٔ عهدها.", "en": "ضامن (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "ضامن (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مترجم (فقط شهر) — مترجم. مثالِ واقعی: معلم دوزبانه · فرزند مهاجر که برای پدربزرگ ترجمه می‌کند · واسط دو نسل · واسط دو گفتمان سیاسی. ریشهٔ اسطوره‌ای: سروش — پیام‌آور و شنوندهٔ اوستا. هم می‌شنود، هم می‌رساند.", "en": "مترجم (C): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "مترجم (C): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نمایندهٔ بین‌المللی (شهر ∩ مستقل) — دیپلمات. مثالِ واقعی: واسط با نهادهای بین‌المللی · فعال حقوق بشری در تماس با دولت‌ها · نمایندهٔ دیاسپورا · حقوق‌دان بین‌الملل. ریشهٔ اسطوره‌ای: پیران ویسه — فرستاده‌ای که هر دو اردوگاه را می‌فهمید و به هیچ‌کدام کامل تعلق نداشت.", "en": "نمایندهٔ بین‌المللی (CI): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "نمایندهٔ بین‌المللی (CI): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:roles-citizen", "rel": "see-also", "note": {"fa": "نقش‌های اجتماعیِ شهروندان", "en": "Citizen social roles", "nl": "Citizen social roles"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:ruins-ledger", "kind": "concept", "title": {"fa": "دفترِ ویرانی‌ها: نوزده حوزه", "en": "Ruins ledger: nineteen domains", "nl": "Ruins ledger: nineteen domains"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "دفتری که ویرانیِ هر حوزه را (آب، خاک و طبیعت، و دیگران) فهرست می‌کند و می‌گوید در دانش‌سرا چقدر پشتوانه دارد. قاعده: بی‌منبع نوشته نمی‌شود.", "en": "A ledger listing the ruin in each domain (water, soil and nature, and others) and how much backing Daneshsara has. Rule: nothing is written without a source.", "nl": "A ledger listing the ruin in each domain (water, soil and nature, and others) and how much backing Daneshsara has. Rule: nothing is written without a source."}, "points": [{"text": {"fa": "آب [نیمه]: ورشکستگی آبی؛ فرونشست دشت‌ها (تندترین: دشت رفسنجان، بیش از ۳۵ سانتی‌متر در سال)؛ خشکی دریاچهٔ ارومیه و تالاب‌ها؛ چاه‌های غیرمجاز؛ سدسازی بی‌رویه؛ انتقال آب بین‌حوضه‌ای؛ کم‌آبی شهرها در تابستان", "en": "آب: items and coverage, as in the Persian text.", "nl": "آب: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "خاک و طبیعت [نیمه]: نابودی جنگل‌های زاگرس و هیرکانی؛ بیابان‌زایی و ریزگرد؛ فرسایش خاک؛ شکار و انقراض (یوزپلنگ آسیایی)؛ زباله و پسماند؛ آلودگی خلیج فارس و دریای خزر", "en": "خاک و طبیعت: items and coverage, as in the Persian text.", "nl": "خاک و طبیعت: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "هوا و انرژی [نیمه]: آلودگی هوای شهرها؛ مازوت‌سوزی نیروگاه‌ها؛ قطعی برق و گاز؛ یارانهٔ سوخت و قاچاق؛ سوزاندن گاز همراه نفت؛ آلودگی ناشی از حمله به تأسیسات سوخت در جنگ (باران سیاه)", "en": "هوا و انرژی: items and coverage, as in the Persian text.", "nl": "هوا و انرژی: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "روستاها و مناطق محروم [نیمه]: خالی شدن روستاها؛ نبود مدرسه، درمانگاه و جاده؛ بیکاری؛ استان‌های مرزی محروم؛ زیرساخت آب آشامیدنی", "en": "روستاها و مناطق محروم: items and coverage, as in the Persian text.", "nl": "روستاها و مناطق محروم: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "شهرها [نیمه]: ساخت‌وساز ناایمن و خطر زلزله؛ حاشیه‌نشینی؛ حمل‌ونقل عمومی ناکافی؛ خودروهای ناایمن و فرسوده؛ بافت فرسوده؛ آثار تاریخی آسیب‌دیده در جنگ ۱۴۰۴", "en": "شهرها: items and coverage, as in the Persian text.", "nl": "شهره
