results; non-probability sampling."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "برای منطقِ بازی: بیش از نیمی از شرکت‌کنندگان یک فراخوانِ مشخص را در تصمیمشان مؤثر دانستند؛ یعنی در دی ۱۴۰۴ یک «نقطهٔ کانونی» برای زمان وجود داشت. آنچه نبود، طبقِ تحلیلِ این ویکی، صندوق و متنِ ضمانت بود. این داوریِ ماست، نه یافتهٔ گمان.", "en": "For the game's logic: more than half of participants named a specific call as influential, so in January 2026 a focal point for timing existed; what was missing, in this wiki's analysis, was the fund and the guarantee. Our judgement, not a GAMAAN finding.", "nl": "For the game's logic: more than half of participants named a specific call as influential, so in January 2026 a focal point for timing existed; what was missing, in this wiki's analysis, was the fund and the guarantee. Our judgement, not a GAMAAN finding."}, "sources": ["src:6c0a6f1ef3", "src:e0cb8fb11f"], "flags": ["editor-note"]}, {"text": {"fa": "برای میثاق: نشانه‌ای که تقریباً همه پایش می‌ایستند «ایران» است، نه یک چهره یا یک فرمِ حکومت. این با قاعدهٔ «ایران پَر نیست؛ تنها میثاقِ پیشینیِ مشترک است» جور است. «نه به اعدام» (۸۱٪) هم نزدیک‌ترین شعار به پَرِ سوم است.", "en": "For the covenant: the symbol nearly everyone stands behind is \"Iran\", not a face or a form of government, which fits the rule that Iran is the only shared prior covenant. \"No to execution\" (81) is the slogan closest to feather three.", "nl": "For the covenant: the symbol nearly everyone stands behind is \"Iran\", not a face or a form of government, which fits the rule that Iran is the only shared prior covenant. \"No to execution\" (81) is the slogan closest to feather three."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:current-situation", "rel": "see-also", "note": {"fa": "وضعیتِ امروز", "en": "Situation now", "nl": "Situation now"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون کافی نبود", "en": "Why 14 million was not enough", "nl": "Why 14 million was not enough"}}, {"to": "simorgh:exit-voice", "rel": "see-also", "note": {"fa": "خروج، صدا، وفاداری", "en": "Exit, voice, loyalty", "nl": "Exit, voice, loyalty"}}, {"to": "simorgh:claims-politics", "rel": "see-also", "note": {"fa": "ادعاهای سیاست", "en": "Politics claims", "nl": "Politics claims"}}], "people": [], "sources": ["src:6c0a6f1ef3", "src:e0cb8fb11f"], "booklets": [], "origin": null, "iran": "iran:political-attitudes-2026", "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-1", "kind": "concept", "title": {"fa": "مرغ‌ها: نگهبانان جان", "en": "Birds: نگهبانان جان", "nl": "Birds: نگهبانان جان"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «نگهبانان جان» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"نگهبانان جان\" with the mission and step of each.", "nl": "The five birds of the group \"نگهبانان جان\" with the mission and step of each."}, "points": [{"text": {"fa": "پزشک و پرستار: مأموریت: هیچ بیماری در روزهای گذار بی‌درمان نماند. قدمِ امروز: فهرست داروهای حیاتی محله‌ات را بشناس. روزِ آزادی: اورژانس جشن‌ها و درمانگاه باز. پس از آن: شبکهٔ درمان محله و بازگرداندن پزشکان مهاجر.", "en": "Bird پزشک و پرستار: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird پزشک و پرستار: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "روان‌یار و سوگ‌یار: مأموریت: کسی با سوگ و تروما تنها نماند. قدمِ امروز: شنیدن بدون داوری را تمرین کن. روزِ آزادی: کنار خانواده‌های داغدار و زندانیان آزادشده. پس از آن: گروه‌های همیاری سوگ در هر شهر.", "en": "Bird روان‌یار و سوگ‌یار: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird روان‌یار و سوگ‌یار: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "امداد و بحران: مأموریت: آب، برق، غذا و دارو قطع نشود. قدمِ امروز: کمک‌های اولیه یاد بگیر. روزِ آزادی: کمک‌های اولیه در میدان‌ها؛ خدمات سر کار بمانند. پس از آن: ستاد بحران محله‌ای برای زلزله و قطعی.", "en": "Bird امداد و بحران: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird امداد و بحران: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "همراه کودک: مأموریت: هیچ کودکی قربانی گذار نشود. قدمِ امروز: نشانه‌های کودک‌آزاری را بشناس. روزِ آزادی: فضای امن کودکان در جشن‌ها؛ کودکان گم‌شده. پس از آن: پایان ازدواج و کار کودک؛ تغذیهٔ مدرسه.", "en": "Bird همراه کودک: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird همراه کودک: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "همراه رهایی از اعتیاد: مأموریت: درمان به جای زندان. قدمِ امروز: اعتیاد را بیماری ببین نه جرم. روزِ آزادی: مراکز کاهش آسیب باز بمانند. پس از آن: شبکهٔ درمان و کار برای بهبودیافتگان.", "en": "Bird همراه رهایی از اعتیاد: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird همراه رهایی از اعتیاد: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "soc:collective-trauma-justice-revenge", "rel": "see-also", "note": {"fa": "دادخواهی بدون انتقام", "en": "دادخواهی بدون انتقام", "nl": "دادخواهی بدون انتقام"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:library-power", "kind": "concept", "title": {"fa": "کتابخانه: نظریهٔ بازی و ساختارِ قدرت", "en": "Library: game theory and power structure", "nl": "Library: game theory and power structure"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "ادبیاتِ استانداردِ ادعای «پروپوزالی در قالبِ نظریهٔ بازی»؛ شامل یک منبعِ مخالف.", "en": "Library: game theory and power structure", "nl": "Library: game theory and power structure"}, "points": [{"text": {"fa": "Bueno de Mesquita & Smith (2011) The Dictator's Handbook: هسته: نظریهٔ «هستهٔ برنده»؛ چرا «کجای میز نشسته‌ای» پرسشِ درستی است.", "en": "Bueno de Mesquita & Smith (2011) The Dictator's Handbook: why it is on the shelf (Persian text).", "nl": "Bueno de Mesquita & Smith (2011) The Dictator's Handbook: why it is on the shelf (Persian text)."}, "sources": ["src:d700f79051"], "flags": []}, {"text": {"fa": "Svolik (2012) The Politics of Authoritarian Rule: هسته: دو مسئلهٔ هر دیکتاتور، کنترلِ مردم و کنترلِ خودی‌ها.", "en": "Svolik (2012) The Politics of Authoritarian Rule: why it is on the shelf (Persian text).", "nl": "Svolik (2012) The Politics of Authoritarian Rule: why it is on the shelf (Persian text)."}, "sources": ["src:d3fc1f88d0"], "flags": []}, {"text": {"fa": "Geddes, Wright & Frantz (2018) How Dictatorships Work: داده‌محور: رژیم‌های اقتدارگرا از ۱۹۴۶ چطور تمام شده‌اند.", "en": "Geddes, Wright & Frantz (2018) How Dictatorships Work: why it is on the shelf (Persian text).", "nl": "Geddes, Wright & Frantz (2018) How Dictatorships Work: why it is on the shelf (Persian text)."}, "sources": ["src:769bc745be"], "flags": []}, {"text": {"fa": "Acemoglu & Robinson (2006) Economic Origins of Dictatorship and Democracy: مسئلهٔ «تعهدِ معتبر»؛ هستهٔ هر طرحِ گذارِ مذاکره‌شده.", "en": "Acemoglu & Robinson (2006) Economic Origins of Dictatorship and Democracy: why it is on the shelf (Persian text).", "nl": "Acemoglu & Robinson (2006) Economic Origins of Dictatorship and Democracy: why it is on the shelf (Persian text)."}, "sources": ["src:241e6a9388"], "flags": []}, {"text": {"fa": "Schelling (1960) The Strategy of Conflict: چانه‌زنی، تهدیدِ معتبر، نقطهٔ کانونی؛ بدونِ آن «نظریهٔ بازی» ناقص است.", "en": "Schelling (1960) The Strategy of Conflict: why it is on the shelf (Persian text).", "nl": "Schelling (1960) The Strategy of Conflict: why it is on the shelf (Persian text)."}, "sources": ["src:e0cb8fb11f"], "flags": []}, {"text": {"fa": "Levitsky & Way (2022) Revolution and Dictatorship: نقدِ ما: رژیم‌های زادهٔ انقلابِ اجتماعی به‌طرزِ غیرعادی بادوام‌اند؛ قیاس با اروپای شرقیِ ۱۹۸۹ ممکن است اساساً غلط باشد.", "en": "Levitsky & Way (2022) Revolution and Dictatorship: why it is on the shelf (Persian text).", "nl": "Levitsky & Way (2022) Revolution and Dictatorship: why it is on the shelf (Persian text)."}, "sources": ["src:89f0e30575"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:library-honesty", "rel": "see-also", "note": {"fa": "این فهرست چه نیست", "en": "What this list is not", "nl": "What this list is not"}}], "people": [], "sources": ["src:241e6a9388", "src:769bc745be", "src:89f0e30575", "src:d3fc1f88d0", "src:d700f79051", "src:e0cb8fb11f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-economy", "kind": "concept", "title": {"fa": "ادعاهای اقتصاد و معیشت", "en": "Claims: economy and livelihood", "nl": "Claims: economy and livelihood"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "9 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "9 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "9 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "نرخِ فقر در دو سال حدود هشت واحد بالا رفت و روی ۳۰٪ تثبیت شد. (۳۰٪؛ ≈۱۴۰۰–۱۴۰۲؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ رسمیِ خطِ فقر که تثبیت روی ۳۰٪ را نشان ندهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim poverty: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim poverty: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "طبقهٔ متوسط از ۸۴٪ (سناریوی بدونِ تحریم) به ۵۶٪ واقعیت افتاد — اختلافِ ≈۲۸ واحد، بیست و چند میلیون نفر. (۸۴٪ ← ۵۶٪؛ ≈۱۳۹۰–۱۴۰۲؛ ردهٔ 3؛ برآوردِ ضدواقعی). شرطِ ابطال: مدلِ ضدواقعیِ دیگری با فرض‌های متفاوت که شکاف را به‌مراتب کوچک‌تر بدهد. یادداشت: عددِ ۸۴٪ یک سناریوی فرضی است نه اندازه‌گیری؛ پس این اختلاف یک برآوردِ مدل‌شده است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim middle-class: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim middle-class: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدودِ ۶۰٪ اشتغالِ ایران غیررسمی است — یعنی یک هفته توقفِ کار، یک هفته گرسنگی. (۶۰٪؛ ≈۱۴۰۲؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: آمارِ ILO یا مرکز آمار که سهمِ غیررسمی را به‌مراتب کمتر بدهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim informal: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim informal: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "هزینهٔ فرارِ مغزها ≈۵۰ میلیارد دلار در سال — در برابرِ کلِ صادراتِ نفتِ ۲۰۱۹ که ≈۲۰ میلیارد دلار بود. (≈۵۰ میلیارد $/سال؛ ۲۰۱۹ به بعد؛ ردهٔ 3؛ برآورد). شرطِ ابطال: یافتنِ گزارشِ اصلیِ بانک جهانی و دیدنِ اینکه عدد یا روشِ آن چیزِ دیگری است. یادداشت: ارجاعِ دقیق به گزارشِ بانک جهانی در متن نیامده؛ این ضعیف‌ترین حلقهٔ استنادیِ بخشِ اقتصاد است. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim braindrain: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim braindrain: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "درآمدِ سرانه ۵٬۶۱۷ دلار (۲۰۲۵، قیمتِ ثابتِ ۲۰۱۵) در برابرِ ۷٬۴۴۲ دلار در ۱۹۷۶. (۵٬۶۱۷$ در برابر ۷٬۴۴۲$؛ ۱۹۷۶ ← ۲۰۲۵؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ WDI با همان مبنای قیمتی که این دو رقم را تأیید نکند. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim gdp-capita: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim gdp-capita: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "تورمِ نقطه‌به‌نقطه ۸۷٫۹٪ (تیر ۱۴۰۵)؛ پوششِ سبدِ معیشت ≈۴۴٪. (۸۷٫۹٪؛ تیر ۱۴۰۵؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ رسمیِ تورم برای همان ماه با رقمِ متفاوت. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim inflation: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim inflation: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "تورمِ خوراکی ۱۱۲٫۷٪ در برابرِ تورمِ عمومی — یعنی شوک بیشتر روی دهک‌های پایین می‌نشیند. (۱۱۲٫۷٪؛ ≈۱۴۰۵؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: تفکیکِ رسمیِ تورمِ گروه‌های کالایی که این شکاف را نشان ندهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim food-inflation: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim food-inflation: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "رشدِ اقتصادیِ ۴٫۵ درصدیِ ۱۴۰۲ نرخِ فقر را پایین نیاورد — رشدِ کل، توزیع نیست. (۴٫۵٪ رشد، فقر ثابت؛ ۱۴۰۲؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: سریِ فقر که در همان سال کاهشِ معنادار نشان دهد. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim growth-no-poverty: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim growth-no-poverty: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "۴۰٪ بیکارانِ کشور فارغ‌التحصیلِ دانشگاهی‌اند. (۴۰٪؛ ≈۱۴۰۲؛ ردهٔ 3؛ اندازه‌گیری). شرطِ ابطال: آمارِ رسمیِ بیکاری به تفکیکِ تحصیلات با نسبتِ متفاوت. یادداشت: ارجاعِ جمعی است، نه ارجاعِ سطربه‌سطر؛ عددِ تک‌تک به منبعِ مشخص وصل نشده. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim grad-unemployment: value, period, tier 3 and falsifier as in the Persian text.", "nl": "Claim grad-unemployment: value, period, tier 3 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:master-plan", "kind": "concept", "title": {"fa": "نقشهٔ کلان: پنج لایه و راهنقشهٔ دروازه‌ای", "en": "Master plan: five layers and a gated roadmap", "nl": "Master plan: five layers and a gated roadmap"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "پروژه پنج لایه دارد که هرکدام دیگری را تغذیه می‌کند، و راهنقشه‌اش با دروازه می‌رود نه با تاریخ: هر مرحله وقتی شروع می‌شود که دروازهٔ قبلی بسته شده باشد.", "en": "The project has five layers feeding each other and a roadmap that goes by gates, not dates: each stage starts once the previous gate has closed.", "nl": "The project has five layers feeding each other and a roadmap that goes by gates, not dates: each stage starts once the previous gate has closed."}, "points": [{"text": {"fa": "لایه‌ها: علم: روان، جامعه، فلسفه، تبار، تاریخ و علم‌های تازه، همه با منبع؛ ایران: داده و ریشه‌یابی هر آسیب، و دفتر ویرانی‌ها؛ سیمرغ: بازی مافیای ایران: هم ابزار فهم، هم درِ ورود آدم‌ها؛ شبکه و درآمد: محصولاتی در اروپا که هم پول می‌سازند هم آدم‌های معتمد را وصل می‌کنند؛ ساخت ایران: روز آزادی، صد روز اول، و سهم هر نفر", "en": "Layers as in the Persian text.", "nl": "Layers as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مرحلهٔ پایه: نظریهٔ بازی و علوم سیاسی، جستجوی هوشمند، کارت‌های مرغ و «چرا؟». دروازه: حلقهٔ خودی نسخهٔ اول بازی را آزمود", "en": "Stage پایه: content and gate as in the Persian text.", "nl": "Stage پایه: content and gate as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مرحلهٔ حلقهٔ خودی: بازی آزمایشی، راهنمای امنیت دیجیتال، نخستین درآمد. دروازه: راهنمای امنیت نوشته شد و درآمد رسید", "en": "Stage حلقهٔ خودی: content and gate as in the Persian text.", "nl": "Stage حلقهٔ خودی: content and gate as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مرحلهٔ دایرهٔ دوم: دعوت با ضامن، دفتر ویرانی‌ها، دستیار برای حلقه، نسخهٔ چاپی بازی. دروازه: هر مرغ یک مسئول دارد", "en": "Stage دایرهٔ دوم: content and gate as in the Persian text.", "nl": "Stage دایرهٔ دوم: content and gate as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مرحلهٔ عموم: نسخهٔ آنلاین سیمرغ، دوره‌ها، نهاد غیرانتفاعی شفاف، «سهم من» برای همه. دروازه: روز آزادی", "en": "Stage عموم: content and gate as in the Persian text.", "nl": "Stage عموم: content and gate as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مرحلهٔ فردا: جشن و پاک‌سازی، هفتهٔ اول، صد روز اول، ساختن", "en": "Stage فردا: content and gate as in the Persian text.", "nl": "Stage فردا: content and gate as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:sciences-26", "rel": "see-also", "note": {"fa": "بیست‌وشش علم", "en": "Twenty-six sciences", "nl": "Twenty-six sciences"}}, {"to": "simorgh:ruins-ledger", "rel": "see-also", "note": {"fa": "دفترِ ویرانی‌ها", "en": "Ruins ledger", "nl": "Ruins ledger"}}, {"to": "simorgh:products-19", "rel": "see-also", "note": {"fa": "نوزده محصول", "en": "Nineteen products", "nl": "Nineteen products"}}, {"to": "simorgh:circle-table", "rel": "see-also", "note": {"fa": "میزِ دایره‌ای", "en": "Circle table", "nl": "Circle table"}}, {"to": "simorgh:tools-directory", "rel": "see-also", "note": {"fa": "ابزارها", "en": "Tools", "nl": "Tools"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:pre-mortem", "kind": "concept", "title": {"fa": "پیش‌مرگ: اگر برنامه شکست بخورد، احتمالاً چرا", "en": "Pre-mortem: if the plan fails, probably why", "nl": "Pre-mortem: if the plan fails, probably why"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "روشِ پیش‌مرگ: فرض کن دو سال بعد است و برنامه شکست خورده؛ چه شد؟ ده حالتِ شکست، هرکدام با نشانهٔ زودهنگام و حفاظ. این مدخل برای این است که حلقه پیش از شروع ببیند کجا ممکن است بلغزد.", "en": "The pre-mortem method: assume it is two years later and the plan failed; what happened? Ten failure modes, each with an early sign and a safeguard.", "nl": "The pre-mortem method: assume it is two years later and the plan failed; what happened? Ten failure modes, each with an early sign and a safeguard."}, "points": [{"text": {"fa": "۱. هیچ ستونی نچرخید. نشانه: بعد از هر موج، بدنهٔ امنیتی منسجم‌تر شد. حفاظ: متنِ ضمانت زودتر از هر فراخوان؛ و پیام‌هایی که مستقیم به بدنه (نه رأس) دربارهٔ آینده‌شان حرف بزند.", "en": "1. No pillar shifted. Safeguard: the guarantee text before any call.", "nl": "1. No pillar shifted. Safeguard: the guarantee text before any call."}, "sources": ["src:9ce61897e7"], "flags": []}, {"text": {"fa": "۲. میثاق به یک اردوگاه مصادره شد. نشانه: «تنوعِ امضا» زیرِ ۳۰٪. حفاظ: آزمونِ جانشینی روی هر بند، و هیچ چهره‌ای به‌عنوانِ «صاحبِ» میثاق معرفی نشود.", "en": "2. The covenant was captured by one camp. Sign: signature diversity below 30 percent. Safeguard: the substitution test on every clause.", "nl": "2. The covenant was captured by one camp. Sign: signature diversity below 30 percent. Safeguard: the substitution test on every clause."}, "sources": [], "flags": []}, {"text": {"fa": "۳. صندوق آدم‌ها را به خطر انداخت. نشانه: درخواستِ فهرستِ گیرندگان یا پرداختِ ردیابی‌پذیر. حفاظ: هیچ فهرستِ نام، تصمیمِ محلی، حسابرسیِ مستقل در بیرون، شفافیتِ کلی.", "en": "3. The fund endangered people. Safeguard: no name lists, local decisions, external audit, aggregate transparency.", "nl": "3. The fund endangered people. Safeguard: no name lists, local decisions, external audit, aggregate transparency."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "۴. جنگِ بیرونی همه‌چیز را بی‌اعتبار کرد. نشانه: پروژه با یک بازیگرِ خارجی یکی دانسته شود. حفاظ: استقلالِ مالی و سیاسی، و پیامِ ثابت که تغییر از درون می‌آید.", "en": "4. Outside war discredited everything. Safeguard: financial and political independence.", "nl": "4. Outside war discredited everything. Safeguard: financial and political independence."}, "sources": ["src:5077e79964"], "flags": []}, {"text": {"fa": "۵. قطعِ اینترنت هماهنگی را کشت. حفاظ: نشانه‌هایی که بدونِ اینترنت هم کار کنند (نمادِ ساده از ابزارِ کارِ روزمره، تاریخِ از پیش اعلام‌شده، یک عدد و یک جمله)؛ رصدِ قطعی‌ها با NetBlocks و IODA.", "en": "5. Internet shutdown killed coordination. Safeguard: signals that work offline.", "nl": "5. Internet shutdown killed coordination. Safeguard: signals that work offline."}, "sources": ["src:4d809f4a2a"], "flags": []}, {"text": {"fa": "۶. رأس افتاد و چرخهٔ انتقام شروع شد. نشانه: فهرست‌های سیاهِ دست‌به‌دست، شعارِ مرگ برای افراد. حفاظ: میانجی‌های محله، اعلامِ پیشاپیشِ دادگاه، و مرغِ «میانجی» در روزِ اول.", "en": "6. The top fell and a revenge cycle began. Safeguard: neighbourhood mediators and announced courts.", "nl": "6. The top fell and a revenge cycle began. Safeguard: neighbourhood mediators and announced courts."}, "sources": ["src:7fffecad9e", "src:b16fff45ff"], "flags": []}, {"text": {"fa": "۷. حاشیه‌ها جا ماندند. نشانه: استان‌های مرزی در امضاها و نهادها کم‌وزن. حفاظ: بندِ برابریِ شهروندی، سازوکارِ نمایندگیِ منطقه‌ای، و سهمِ حداقلی در هر نهاد.", "en": "7. The periphery was left out. Safeguard: equal-citizenship clause and regional representation.", "nl": "7. The periphery was left out. Safeguard: equal-citizenship clause and regional representation."}, "sources": [], "flags": []}, {"text": {"fa": "۸. اقتصاد پیش از گذار فروریخت. نشانه: کمبودِ دارو و غذا. حفاظ: کانالِ انسان‌دوستانهٔ مستقل و برنامهٔ «قوانینِ روزِ اول» برای حقوق و پول.", "en": "8. The economy collapsed before transition. Safeguard: an independent humanitarian channel and day-one rules on pay and currency.", "nl": "8. The economy collapsed before transition. Safeguard: an independent humanitarian channel and day-one rules on pay and currency."}, "sources": ["src:7af62df15e"], "flags": []}, {"text": {"fa": "۹. فردمحوری. نشانه: کارزار حولِ یک نفر به‌جای یک فرایند. حفاظ: «معیارِ عمومی برای هر مدعیِ رهبری» و تاریخِ همه‌پرسیِ تغییرناپذیر.", "en": "9. Personality dependence. Safeguard: a public standard for any claimant and a fixed referendum date.", "nl": "9. Personality dependence. Safeguard: a public standard for any claimant and a fixed referendum date."}, "sources": [], "flags": []}, {"text": {"fa": "۱۰. فرسودگی. نشانه: حلقه کوچک‌تر می‌شود و کار به یک نفر وابسته می‌ماند. حفاظ: هر نفر مسئولِ یک چیز، ثبتِ همهٔ کارها، و «هفته‌ای یک قدم».", "en": "10. Exhaustion. Safeguard: one responsibility each, everything recorded, one step a week.", "nl": "10. Exhaustion. Safeguard: one responsibility each, everything recorded, one step a week."}, "sources": ["src:f1a8df8bf8"], "flags": []}, {"text": {"fa": "شاهدِ واقعی برای حالتِ ۵ (قطعِ اینترنت): قطعیِ ۸۸روزه در ۱۴۰۴–۱۴۰۵، و ۲۵٪ مردم گفتند در اثرِ آن شغل یا منبعِ اصلیِ درآمدشان را از دست دادند (گمان). یعنی قطعِ اینترنت هم سلاحِ هماهنگی‌زدایی است و هم خودش فشارِ اقتصادیِ تازه؛ برنامه باید برای هر دو آماده باشد.", "en": "Real evidence for mode 5: the 88-day shutdown in 2025-26, and 25 percent said they lost a job or main income because of it (GAMAAN). The shutdown is both a de-coordination weapon and a new economic pressure.", "nl": "Real evidence for mode 5: the 88-day shutdown in 2025-26, and 25 percent said they lost a job or main income because of it (GAMAAN). The shutdown is both a de-coordination weapon and a new economic pressure."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "شاهدِ تاریخی برای حالتِ ۹ (فردمحوری): در ۱۳۵۷ کارزار پیروز شد ولی چون ایدئولوژی‌اش قدرت را در یک نفر جمع می‌کرد و ائتلاف تصویرِ مشترکی از فردا نداشت، دولتِ موقت در چند ماه کنار رفت. یعنی خطرِ ۹ فرضی نیست؛ یک بار در همین کشور رخ داده است.", "en": "Historical evidence for mode 9: in 1979 the campaign won, but power concentrated in one person and no shared picture of tomorrow meant the provisional government fell within months.", "nl": "Historical evidence for mode 9: in 1979 the campaign won, but power concentrated in one person and no shared picture of tomorrow meant the provisional government fell within months."}, "sources": ["src:41c1e6a2e7"], "flags": ["editor-note"]}, {"text": {"fa": "حالتِ ۱۱، موجِ وارونه (از کوران): پس از سرکوبی بزرگ، اگر به نظر برسد حکومت می‌ماند، مشارکت در چند هفته فرو می‌ریزد، چنان‌که در هندِ ۱۹۷۵ پس از وضعِ اضطراری. نشانه: کم‌شدنِ ناگهانیِ نشانه‌های کم‌هزینه (نه فقط خیابان). حفاظ: نشانه‌های کم‌خطری که همیشه در دسترس‌اند و انتظار را زنده نگه می‌دارند، و عددِ مستقلِ منظم که نشان دهد ترجیحِ درونی عوض نشده است.", "en": "Mode 11, the reverse bandwagon (Kuran): after a major crackdown, if the regime seems set to survive, participation collapses within weeks, as in India 1975. Safeguard: always-available low-risk signals and regular independent numbers showing private preferences have not changed.", "nl": "Mode 11, the reverse bandwagon (Kuran): after a major crackdown, if the regime seems set to survive, participation collapses within weeks, as in India 1975. Safeguard: always-available low-risk signals and regular independent numbers showing private preferences have not changed."}, "sources": ["src:436510de26"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:three-paths", "rel": "see-also", "note": {"fa": "سه راه", "en": "Three paths", "nl": "Three paths"}}, {"to": "simorgh:transition-risks", "rel": "see-also", "note": {"fa": "پانزده خطر", "en": "Fifteen risks", "nl": "Fifteen risks"}}, {"to": "simorgh:threshold-indicators", "rel": "see-also", "note": {"fa": "نشانگرها", "en": "Indicators", "nl": "Indicators"}}, {"to": "simorgh:circle-table", "rel": "see-also", "note": {"fa": "میزِ دایره‌ای", "en": "Circle table", "nl": "Circle table"}}, {"to": "soc:digital-repression", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:4d809f4a2a", "src:5077e79964", "src:6c0a6f1ef3", "src:7af62df15e", "src:7fffecad9e", "src:9ce61897e7", "src:b16fff45ff", "src:f1a8df8bf8", "src:436510de26"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:library-iran", "kind": "concept", "title": {"fa": "کتابخانه: ایران، تاریخ، ساختار، سپاه", "en": "Library: Iran, history, structure, the Guards", "nl": "Library: Iran, history, structure, the Guards"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "منابعِ فهمِ ایران؛ شامل نقدِ «جامعهٔ کوتاه‌مدت» به خوش‌بینیِ مجموعه.", "en": "Library: Iran, history, structure, the Guards", "nl": "Library: Iran, history, structure, the Guards"}, "points": [{"text": {"fa": "Abrahamian (1982) Iran Between Two Revolutions: هسته: مرجعِ پایه؛ بدونِ آن بخشِ تاریخیِ هر تحلیل روی هوا می‌ماند.", "en": "Abrahamian (1982) Iran Between Two Revolutions: why it is on the shelf (Persian text).", "nl": "Abrahamian (1982) Iran Between Two Revolutions: why it is on the shelf (Persian text)."}, "sources": ["src:3c12f4366b"], "flags": []}, {"text": {"fa": "Parsa (2016) Democracy in Iran: هسته: همان پرسشِ مجموعه با روشِ جامعه‌شناسیِ تطبیقی؛ اصلاحِ درون‌سیستمی بن‌بست است.", "en": "Parsa (2016) Democracy in Iran: why it is on the shelf (Persian text).", "nl": "Parsa (2016) Democracy in Iran: why it is on the shelf (Persian text)."}, "sources": ["src:7cca0195a6"], "flags": []}, {"text": {"fa": "Harris (2017) A Social Revolution: هسته: دولتِ رفاه و طبقهٔ متوسطِ تازه؛ وفاداری‌ها هیچ‌وقت ساده نبوده‌اند.", "en": "Harris (2017) A Social Revolution: why it is on the shelf (Persian text).", "nl": "Harris (2017) A Social Revolution: why it is on the shelf (Persian text)."}, "sources": ["src:7f733b3f0a"], "flags": []}, {"text": {"fa": "Ostovar (2016) Vanguard of the Imam: تاریخِ نهادیِ سپاه؛ مرجعِ استانداردِ انگلیسی.", "en": "Ostovar (2016) Vanguard of the Imam: why it is on the shelf (Persian text).", "nl": "Ostovar (2016) Vanguard of the Imam: why it is on the shelf (Persian text)."}, "sources": ["src:55fb1755fa"], "flags": []}, {"text": {"fa": "Abrahamian (1999) Tortured Confessions: تاریخِ «اعترافِ اجباری» در ایران.", "en": "Abrahamian (1999) Tortured Confessions: why it is on the shelf (Persian text).", "nl": "Abrahamian (1999) Tortured Confessions: why it is on the shelf (Persian text)."}, "sources": ["src:f7a51da2b0"], "flags": []}, {"text": {"fa": "Afary (1996) The Iranian Constitutional Revolution, 1906–1911: ریشهٔ مشروطه با تناقض‌هایش، نه نسخهٔ آرمانی‌شده.", "en": "Afary (1996) The Iranian Constitutional Revolution, 1906–1911: why it is on the shelf (Persian text).", "nl": "Afary (1996) The Iranian Constitutional Revolution, 1906–1911: why it is on the shelf (Persian text)."}, "sources": ["src:00c70f86c1"], "flags": []}, {"text": {"fa": "Katouzian، «جامعهٔ کوتاه‌مدت»: نقدِ ما: اگر در ایران هر دوره میراثِ دورهٔ قبل را پاک می‌کند، عوض‌شدنِ حکومت چیزی را تضمین نمی‌کند.", "en": "Katouzian، «جامعهٔ کوتاه‌مدت»: why it is on the shelf (Persian text).", "nl": "Katouzian، «جامعهٔ کوتاه‌مدت»: why it is on the shelf (Persian text)."}, "sources": ["src:f24faf8755"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:library-honesty", "rel": "see-also", "note": {"fa": "این فهرست چه نیست", "en": "What this list is not", "nl": "What this list is not"}}], "people": [], "sources": ["src:00c70f86c1", "src:3c12f4366b", "src:55fb1755fa", "src:7cca0195a6", "src:7f733b3f0a", "src:f24faf8755", "src:f7a51da2b0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:three-feathers", "kind": "concept", "title": {"fa": "سه پَر، سه چیزی که پَر نیستند، و آستانه", "en": "Three feathers, three things that are not feathers, and the threshold", "nl": "Three feathers, three things that are not feathers, and the threshold"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "پَر یک نشانهٔ پرهزینهٔ از پیش‌توافق‌شده است که وقتی روشن شد همه بدانند و بدانند بقیه هم می‌دانند. آنچه می‌سوزد سه چیزِ نامرئی است که شهر دارایی می‌پنداشت و بدهی بود. آستانه یک عدد نیست، یک هم‌زمانی است.", "en": "The feather is a pre-agreed costly signal: once lit, everyone knows and knows that others know. What burns are three invisible things the city took for assets that were liabilities. The threshold is not a number but a simultaneity.", "nl": "The feather is a pre-agreed costly signal: once lit, everyone knows and knows that others know. What burns are three invisible things the city took for assets that were liabilities. The threshold is not a number but a simultaneity."}, "points": [{"text": {"fa": "پَرِ یکم، ترسِ خصوصی: چیزی که می‌سوزد توهمِ «فقط من این‌طور فکر می‌کنم» است. ابزارش عدد است: ۷۲٫۹٪ موافقِ جدایی دین از حکومت در پیمایشِ خودِ حاکمیت (در هشت سال از ۳۰٫۷٪)، و حالا گمان (تیر ۱۴۰۵) که فقط ۹٪ را هوادارِ اصولِ انقلاب می‌یابد. وضعیت: تا حدِ زیادی سوخته؛ در دی ۱۴۰۴ میلیون‌ها نفر دیدند تنها نیستند. اما این پَر خودبه‌خود باز «خیس» می‌شود اگر عددِ تازه منتشر نشود؛ نهادِ دادهٔ مستقل باید آن را روشن نگه دارد.", "en": "Feather one, private fear: largely burned; in January 2026 millions saw they were not alone. But it gets wet again without fresh numbers; an independent data body must keep it lit.", "nl": "Feather one, private fear: largely burned; in January 2026 millions saw they were not alone. But it gets wet again without fresh numbers; an independent data body must keep it lit."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "پَرِ دوم، همکاریِ روزمره: اعتصابِ هماهنگ و اعلام‌شده در چند صنف. با ۶۰٪ اشتغالِ غیررسمی و حالا میانگینِ دستمزدِ حدود ۹۲ دلار در برابرِ هزینهٔ زندگیِ حدود ۳۳۶ دلار (رویترز، آبان ۱۴۰۵)، هر روز نکارکردن یعنی گرسنگی؛ پس این پَر بدونِ صندوق هرگز نمی‌سوزد. وضعیت: نسوخته. ترتیبِ درست: اول صندوق و شبکهٔ حمایت، بعد اعتصاب؛ و از صنف‌هایی شروع شود که اهرمِ بیشتر و آسیب‌پذیریِ کمتر دارند (پخش‌بودن، مثلِ رانندگان).", "en": "Feather two, everyday cooperation: with an average wage of about 92 dollars against a living cost of about 336, each day without work means hunger; this feather never burns without a fund. Status: not burned. Right order: fund and support network first, then strikes.", "nl": "Feather two, everyday cooperation: with an average wage of about 92 dollars against a living cost of about 336, each day without work means hunger; this feather never burns without a fund. Status: not burned. Right order: fund and support network first, then strikes."}, "sources": ["src:7af62df15e", "src:41c1e6a2e7"], "flags": ["editor-note"]}, {"text": {"fa": "پَرِ سوم، حقِ انتقام: اعلامِ علنی و مکتوب که فردا دادگاه هست و انتقام نیست. پس از کشته‌شدنِ هزاران نفر در دی ۱۴۰۴ این گران‌تر و هم لازم‌تر شده. اصلاحِ مهم: «عفوِ مشروط» شاملِ جنایت‌های جمعی و جنایت علیه بشریت نمی‌شود (سیاستِ سازمان ملل عفوِ این جرم‌ها را نمی‌پذیرد)؛ ضمانت برای بدنهٔ بزرگی است که دستش به خون آلوده نیست: کارمند، سربازِ وظیفه، مأمورِ رده‌پایین. وضعیت: نسوخته؛ متن هنوز نوشته نشده.", "en": "Feather three, the right of revenge: after thousands were killed in January 2026 this is costlier and more needed. Key fix: conditional amnesty does not cover mass atrocities or crimes against humanity (UN policy does not accept amnesty for them); the guarantee is for the large body whose hands are clean. Status: not burned; the text is not yet written.", "nl": "Feather three, the right of revenge: after thousands were killed in January 2026 this is costlier and more needed. Key fix: conditional amnesty does not cover mass atrocities or crimes against humanity (UN policy does not accept amnesty for them); the guarantee is for the large body whose hands are clean. Status: not burned; the text is not yet written."}, "sources": ["src:7272339677", "src:b16fff45ff"], "flags": ["editor-note"]}, {"text": {"fa": "سه چیز که پَر نیستند: جان (هر خشونت پَر را خیس می‌کند نه روشن)؛ زیرساخت (موزه‌ها، بانک مرکزی، خزانه؛ هرچه بیشتر بسوزد امکان تأسیسِ جدید کمتر می‌شود)؛ ایران (تنها میثاقِ پیشینیِ مشترک؛ کسی که مرزها را وسطِ بازی جابه‌جا کند پَر را در چاه می‌اندازد).", "en": "Three things that are not feathers: life (violence wets the feather rather than lighting it); infrastructure (museums, central bank, treasury; the more burns, the less room for a new founding); Iran (the only shared prior covenant; whoever moves borders mid-game drops the feather in the well).", "nl": "Three things that are not feathers: life (violence wets the feather rather than lighting it); infrastructure (museums, central bank, treasury; the more burns, the less room for a new founding); Iran (the only shared prior covenant; whoever moves borders mid-game drops the feather in the well)."}, "sources": [], "flags": []}, {"text": {"fa": "آستانه: سیمرغ وقتی می‌آید که هر سه پَر هم‌زمان بسوزند و دیده شوند، یعنی (الف) اندازهٔ واقعیِ اکثریت برای خودِ اکثریت آشکار شده باشد، (ب) دست‌کم سه صنفِ سراسری بتوانند یک روز هم‌زمان بایستند و گرسنه نمانند، (ج) جزء دوم و سومِ آن ۱۰–۱۵٪ متنی مکتوب برای فردایشان در دست داشته باشند.", "en": "Threshold: the Simorgh comes only when all three feathers burn at once and are seen: (a) the true size of the majority is visible to itself, (b) at least three national trades can stand together for one day without starving, (c) the second and third tier of the 10 to 15 percent hold a written text of their tomorrow.", "nl": "Threshold: the Simorgh comes only when all three feathers burn at once and are seen: (a) the true size of the majority is visible to itself, (b) at least three national trades can stand together for one day without starving, (c) the second and third tier of the 10 to 15 percent hold a written text of their tomorrow."}, "sources": ["src:a659e764c0"], "flags": ["editor-note"]}, {"text": {"fa": "ماتریسِ هماهنگی: خانهٔ پایین-راستِ «من صبر می‌کنم و بقیه هم صبر می‌کنند» تعادلِ امروز است. راهِ خروج تغییرِ ترجیحِ مردم نیست (سال‌هاست تغییر کرده) بلکه تغییرِ باورِ هر نفر دربارهٔ رفتارِ بقیه است؛ و این دقیقاً کارِ پَر است.", "en": "Coordination matrix: the bottom-right cell, \"I wait and the others wait\", is today's equilibrium. The way out is not changing people's preference (it changed years ago) but each person's belief about the others' behaviour; exactly what the feather does.", "nl": "Coordination matrix: the bottom-right cell, \"I wait and the others wait\", is today's equilibrium. The way out is not changing people's preference (it changed years ago) but each person's belief about the others' behaviour; exactly what the feather does."}, "sources": [], "flags": []}, {"text": {"fa": "وضعیتِ سه پَر در آبان ۱۴۰۵ در یک خط: پَرِ یکم تا حدِ زیادی سوخته، پَرِ دوم و سوم نسوخته. برای همین ۱۴ میلیون نفر در دی ۱۴۰۴ میز را نچرخاند. کارِ بعدی ساختنِ صندوق و نوشتنِ متنِ ضمانت است.", "en": "Feathers in November 2026 in one line: one largely burned, two and three not; that is why 14 million in January did not turn the table.", "nl": "Feathers in November 2026 in one line: one largely burned, two and three not; that is why 14 million in January did not turn the table."}, "sources": ["src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "شاهدِ تازه برای آستانه: در گمان، «زنده باد ایران» (۹۴٪) و «نه به اعدام» (۸۱٪) تقریباً همه را پوشش می‌دهند، اما شعارهای جناحی ۳۰ تا ۴۰ درصد مخالف دارند. نتیجه برای طراحیِ پَر: هر نشانهٔ کانونی که یک جناح را صاحبش نشان دهد، بخشی از شهر را بیرون می‌گذارد؛ نشانهٔ امن نشانه‌ای است که «ایران» و «نه به خشونت» را حمل کند.", "en": "New evidence for the threshold: \"Long live Iran\" (94) and \"No to execution\" (81) cover nearly everyone, while factional slogans have 30 to 40 percent opposed. For feather design: any focal symbol owned by one faction leaves part of the city out.", "nl": "New evidence for the threshold: \"Long live Iran\" (94) and \"No to execution\" (81) cover nearly everyone, while factional slogans have 30 to 40 percent opposed. For feather design: any focal symbol owned by one faction leaves part of the city out."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "از کوران (فصل ۴): پَرِ یکم با «عددِ واقعی» نمی‌سوزد، با «انتظار» می‌سوزد. هر دو طرف می‌کوشند خود را اکثریت نشان دهند، پس عددی که از یک طرف می‌آید باور نمی‌شود. برای همین نهادِ داده باید بی‌طرفیِ دیدنی داشته باشد و هرگز عدد را بزرگ نکند؛ یک بار گزافه‌گویی کافی است تا پَر خیس شود. و چون آدم‌ها به روایتِ ملموس بیش از آمار وزن می‌دهند، هر عدد با یک تصویرِ ساده همراه شود (بی‌آنکه کسی را به خطر بیندازد).", "en": "From Kuran ch. 4: feather one burns through expectations, not the true number. Both sides claim to be the majority, so a number from one side is not believed; the data body must be visibly neutral and never inflate. People weigh vivid stories over statistics, so pair each number with a simple image.", "nl": "From Kuran ch. 4: feather one burns through expectations, not the true number. Both sides claim to be the majority, so a number from one side is not believed; the data body must be visibly neutral and never inflate. People weigh vivid stories over statistics, so pair each number with a simple image."}, "sources": ["src:436510de26"], "flags": ["editor-note"]}], "links": [{"to": "soc:threshold-models-of-collective-behaviour", "rel": "see-also", "note": {"fa": "مدل آستانه", "en": "Threshold model", "nl": "Threshold model"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "تحریف ترجیحات", "en": "Preference falsification", "nl": "Preference falsification"}}, {"to": "simorgh:ten-unbuilt-roles", "rel": "see-also", "note": {"fa": "ده نقشِ نساخته", "en": "Ten unbuilt roles", "nl": "Ten unbuilt roles"}}, {"to": "simorgh:threshold-simulator", "rel": "see-also", "note": {"fa": "شبیه‌ساز آستانه", "en": "Threshold simulator", "nl": "Threshold simulator"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون کافی نبود", "en": "Why 14 million was not enough", "nl": "Why 14 million was not enough"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌ها", "en": "Pillars", "nl": "Pillars"}}, {"to": "simorgh:gamaan-2026", "rel": "see-also", "note": {"fa": "پیمایشِ گمان (گزارش کامل)", "en": "GAMAAN full report", "nl": "GAMAAN full report"}}, {"to": "simorgh:pulse-poll", "rel": "see-also", "note": {"fa": "نبضِ میز: پرسشِ ماهانه", "en": "Pulse poll", "nl": "Pulse poll"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:6c0a6f1ef3", "src:7272339677", "src:7af62df15e", "src:a659e764c0", "src:b16fff45ff", "src:436510de26"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:action", "kind": "field", "title": {"fa": "عمل و آمادگی", "en": "Action and readiness", "nl": "Action and readiness"}, "aliases": [], "parent": "simorgh:simorgh", "field": null, "summary": {"fa": "قدمِ هر آدم، سی مرغ، بیست گروه، پانزده خطر و روز آزادی.", "en": "A step for every person, thirty birds, twenty groups, fifteen risks and liberation day.", "nl": "A step for every person, thirty birds, twenty groups, fifteen risks and liberation day."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:library-after-fall", "kind": "concept", "title": {"fa": "کتابخانه: بعد از سقوط", "en": "Library: after the fall", "nl": "Library: after the fall"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "فوری‌ترین بخش: بیشترِ منابع می‌گویند خطرِ اصلی بعد از سقوط است، نه پیش از آن.", "en": "Library: after the fall", "nl": "Library: after the fall"}, "points": [{"text": {"fa": "Walter (2022) How Civil Wars Start: نقدِ ما: خطرناک‌ترین وضعیت میانه است، همان‌جا که هر گذار از آن می‌گذرد؛ هر برآوردِ هزینه‌ای که این را حساب نکند کم‌برآورد است.", "en": "Walter (2022) How Civil Wars Start: why it is on the shelf (Persian text).", "nl": "Walter (2022) How Civil Wars Start: why it is on the shelf (Persian text)."}, "sources": ["src:7fffecad9e"], "flags": ["editor-note"]}, {"text": {"fa": "Dodge (2012) Iraq: From War to a New Authoritarianism: نقدِ ما: انحلالِ یک‌بارهٔ ارتش و دستگاهِ حزبی در ۲۰۰۳ دولت را از بین برد؛ هشدار به هر طرحِ «انحلالِ سپاه».", "en": "Dodge (2012) Iraq: From War to a New Authoritarianism: why it is on the shelf (Persian text).", "nl": "Dodge (2012) Iraq: From War to a New Authoritarianism: why it is on the shelf (Persian text)."}, "sources": ["src:b76e3ec683"], "flags": ["editor-note"]}, {"text": {"fa": "Elster (2004) Closing the Books: هسته: عدالتِ انتقالی در بسترِ تاریخی؛ چه کسی محاکمه شود، چه کسی عفو.", "en": "Elster (2004) Closing the Books: why it is on the shelf (Persian text).", "nl": "Elster (2004) Closing the Books: why it is on the shelf (Persian text)."}, "sources": ["src:b16fff45ff"], "flags": []}, {"text": {"fa": "Hayner (2001) Unspeakable Truths: کمیسیون‌های حقیقت: چه برمی‌آید و چه برنمی‌آید.", "en": "Hayner (2001) Unspeakable Truths: why it is on the shelf (Persian text).", "nl": "Hayner (2001) Unspeakable Truths: why it is on the shelf (Persian text)."}, "sources": ["src:611b119f9f"], "flags": []}, {"text": {"fa": "همه‌پرسیِ شیلی ۱۹۸۸ (کارزارِ «نه»): الگوی عملیاتیِ رفراندوم زیرِ حکومتِ اقتدارگرا؛ نزدیک‌ترین نمونه به آنچه مجموعه پیشنهاد می‌دهد.", "en": "همه‌پرسیِ شیلی ۱۹۸۸ (کارزارِ «نه»): why it is on the shelf (Persian text).", "nl": "همه‌پرسیِ شیلی ۱۹۸۸ (کارزارِ «نه»): why it is on the shelf (Persian text)."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:library-honesty", "rel": "see-also", "note": {"fa": "این فهرست چه نیست", "en": "What this list is not", "nl": "What this list is not"}}], "people": [], "sources": ["src:611b119f9f", "src:7fffecad9e", "src:b16fff45ff", "src:b76e3ec683"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:circle-table", "kind": "concept", "title": {"fa": "میزِ دایره‌ای: برگهٔ جلسهٔ یک‌ساعته", "en": "Circle table: one-hour meeting sheet", "nl": "Circle table: one-hour meeting sheet"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "برگه‌ای نُه‌بخشی برای یک جلسهٔ یک‌ساعته؛ هر خط پیشنهاد است نه تصمیم و هر کس روی خطی که با آن موافق نیست می‌زند تا خط بخورد. بخش‌ها: ما چه هستیم و نیستیم، دنبال چه هستیم، از این حلقه چه می‌خواهم، محصول در دو سبد، بازاریابی، سرمایه، جاهای خالی، ده پرسش، جمع‌بست.", "en": "A nine-part sheet for a one-hour meeting; every line is a proposal, not a decision, and anyone who disagrees strikes it. Sections: what we are and are not, what we seek, what I want from this circle, product in two baskets, marketing, capital, empty seats, ten questions, wrap-up.", "nl": "A nine-part sheet for a one-hour meeting; every line is a proposal, not a decision, and anyone who disagrees strikes it. Sections: what we are and are not, what we seek, what I want from this circle, product in two baskets, marketing, capital, empty seats, ten questions, wrap-up."}, "points": [{"text": {"fa": "هستیم: دانش‌سرایی منبع‌دار به زبانِ ساده، بازیِ تمرینِ اعتماد، نقشهٔ «روزِ بعد» (آب، برق، نان، عدالت)، شبکه‌ای که هر نفر یک قدمِ کوچک برمی‌دارد، شفاف در روش و پول.", "en": "We are: a sourced knowledge commons, a trust game, a day-after map, a network where each person takes one small step, transparent in method and money.", "nl": "We are: a sourced knowledge commons, a trust game, a day-after map, a network where each person takes one small step, transparent in method and money."}, "sources": [], "flags": []}, {"text": {"fa": "نیستیم: حزب یا گروهِ سیاسی با رهبر؛ سازمانِ مخفی؛ رسانهٔ خبری؛ دادگاه (به هیچ آدمِ واقعی برچسب نمی‌زنیم و پرونده نمی‌سازیم)؛ دولتِ در تبعید.", "en": "We are not: a party with a leader; a secret organisation; a news outlet; a court (no real person is labelled and no file kept); a government in exile.", "nl": "We are not: a party with a leader; a secret organisation; a news outlet; a court (no real person is labelled and no file kept); a government in exile."}, "sources": [], "flags": []}, {"text": {"fa": "دنبالش نیستیم: خشونت و انتقام؛ قدرت یا مقام؛ رشدِ سریع به بهای امنیتِ آدم‌ها؛ پولی با شرطِ سیاسی؛ هیچ کارِ پرخطر از کسی که داخلِ ایران است.", "en": "Not seeking: violence or revenge; power or office; fast growth at the cost of people's safety; money with political conditions; any high-risk act from someone inside Iran.", "nl": "Not seeking: violence or revenge; power or office; fast growth at the cost of people's safety; money with political conditions; any high-risk act from someone inside Iran."}, "sources": [], "flags": []}, {"text": {"fa": "خواسته‌ها از حلقه: نقدِ صریح، هر نفر مسئولِ یک چیز، هر کار روی سایت ثبت شود، آهسته اما پیوسته، «نه» گفتنِ راحت؛ و نخواستن: تأییدِ تعارفی، نامِ یا عکسِ کسی بی‌اجازه، و حرف‌زدن دربارهٔ حلقه بیرون از آن تا راهنمای امنیت آماده شود.", "en": "What is asked of the circle: frank critique, one responsibility each, all work recorded on the site, slow but steady, easy to say no; and what is not wanted: polite approval, anyone's name or photo without consent, talk about the circle outside it until the security guide is ready.", "nl": "What is asked of the circle: frank critique, one responsibility each, all work recorded on the site, slow but steady, easy to say no; and what is not wanted: polite approval, anyone's name or photo without consent, talk about the circle outside it until the security guide is ready."}, "sources": [], "flags": []}, {"text": {"fa": "سه محصولی که زودتر پول می‌شوند: سنجشِ سلامتِ سازمان (پرسش‌نامهٔ بی‌نام، گزارش، کارگاه؛ نمونه آماده)، کارگاهِ بازیِ جدی برای تیم‌ها، و خدماتِ طراحیِ محصول و پژوهشِ کاربر برای شرکت‌های اروپایی.", "en": "Three products nearest to money: organisational wellbeing assessment, serious-game workshops for teams, and product design and user-research services for European firms.", "nl": "Three products nearest to money: organisational wellbeing assessment, serious-game workshops for teams, and product design and user-research services for European firms."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:products-19", "rel": "see-also", "note": {"fa": "نوزده محصول", "en": "Nineteen products", "nl": "Nineteen products"}}, {"to": "simorgh:master-plan", "rel": "see-also", "note": {"fa": "نقشهٔ کلان", "en": "Master plan", "nl": "Master plan"}}, {"to": "simorgh:roles-47", "rel": "see-also", "note": {"fa": "نقش‌ها", "en": "Roles", "nl": "Roles"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:library-transition", "kind": "concept", "title": {"fa": "کتابخانه: گذار از اینجا به آنجا", "en": "Library: transition from here to there", "nl": "Library: transition from here to there"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "منابعِ تجربی و نظریِ گذار؛ شامل دادهٔ NAVCO، قاعدهٔ ۳٫۵ درصد و نقدِ پژوهشگرِ ایرانی.", "en": "Library: transition from here to there", "nl": "Library: transition from here to there"}, "points": [{"text": {"fa": "O'Donnell & Schmitter (1986) Transitions from Authoritarian Rule: هسته: چارچوبِ تندرو/میانه‌رو در هر دو اردوگاه و منطقِ «پیمان»؛ ستون‌فقراتِ هر تحلیلِ گذار.", "en": "O'Donnell & Schmitter (1986) Transitions from Authoritarian Rule: why it is on the shelf (Persian text).", "nl": "O'Donnell & Schmitter (1986) Transitions from Authoritarian Rule: why it is on the shelf (Persian text)."}, "sources": ["src:a4e411ed75"], "flags": []}, {"text": {"fa": "Chenoweth & Stephan (2011) Why Civil Resistance Works: هسته: دادهٔ NAVCO، ۳۲۳ خیزشِ ۱۹۰۰ تا ۲۰۰۶، ۵۳٪ در برابر ۲۶٪؛ مهم‌ترین منبعِ تجربیِ «قدمِ تو».", "en": "Chenoweth & Stephan (2011) Why Civil Resistance Works: why it is on the shelf (Persian text).", "nl": "Chenoweth & Stephan (2011) Why Civil Resistance Works: why it is on the shelf (Persian text)."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "Chenoweth (2021) Civil Resistance: What Everyon tatorship to Democracy: عملیاتی‌ترین متنِ فهرست؛ واژگانِ مشترکِ بخشی از مخاطب.", "en": "Sharp, From Dictatorship to Democracy: why it is on the shelf (Persian text).", "nl": "Sharp, From Dictatorship to Democracy: why it is on the shelf (Persian text)."}, "sources": [], "flags": []}, {"text": {"fa": "Nepstad (2011) Nonviolent Revolutions: هسته: چرا ارتش در بعضی انقلاب‌ها کنار کشید و در بعضی نه؛ مستقیم‌ترین منبع برای «ستون‌ها».", "en": "Nepstad: why militaries defected in some revolutions and not others.", "nl": "Nepstad: why militaries defected in some revolutions and not others."}, "sources": ["src:9ce61897e7"], "flags": []}, {"text": {"fa": "Helvey (2004) On Strategic Nonviolent Conflict: مفهومِ «ستون‌های پشتیبانی» به زبانِ عملیاتی.", "en": "Helvey: pillars of support in operational language.", "nl": "Helvey: pillars of support in operational language."}, "sources": ["src:458bea7f0f"], "flags": []}, {"text": {"fa": "Hirschman (1970) Exit, Voice, and Loyalty: چرا مهاجرت صدا را ضعیف می‌کند.", "en": "Hirschman: why emigration weakens voice.", "nl": "Hirschman: why emigration weakens voice."}, "sources": ["src:6ec0c8ba1e"], "flags": []}, {"text": {"fa": "Downes & Monten (2013) Forced to Be Free?: نقدِ ما: تغییرِ تحمیل‌شده از بیرون به‌ندرت دموکراسی می‌سازد.", "en": "Downes and Monten: foreign-imposed regime change rarely democratises.", "nl": "Downes and Monten: foreign-imposed regime change rarely democratises."}, "sources": ["src:5077e79964"], "flags": ["editor-note"]}, {"text": {"fa": "Feldstein (2021) The Rise of Digital Repression: چرا نرخِ موفقیتِ خیزش‌ها افت کرده.", "en": "Feldstein: why uprising success rates fell.", "nl": "Feldstein: why uprising success rates fell."}, "sources": ["src:4d809f4a2a"], "flags": []}, {"text": {"fa": "OHCHR (2009) Rule-of-Law Tools: Amnesties: مرزِ عفو در حقوقِ بین‌الملل؛ پایهٔ اصلاحِ پَرِ سوم.", "en": "OHCHR: the limits of amnesty in international law.", "nl": "OHCHR: the limits of amnesty in international law."}, "sources": ["src  منابع به فارسی ترجمه نشده‌اند که خودش یکی از مشکل‌هاست.", "en": "Not complete; not neutral; blurbs guide choice rather than summarise; most sources are untranslated into Persian.", "nl": "Not complete; not neutral; blurbs guide choice rather than summarise; most sources are untranslated into Persian."}, "sources": [], "flags": []}, {"text": {"fa": "عمداً نیست: کانال‌های «پیش‌بینیِ سقوط»، هر عددی که منبعِ قابل‌ارجاع نداشت، و هر نقل‌قولی که بدونِ سند به شخصی واقعی نسبت داده شود.", "en": "Deliberately absent: collapse-prediction channels, any number without a citable source, any quote attributed to a real person without a document.", "nl": "Deliberately absent: collapse-prediction channels, any number without a citable source, any quote attributed to a real person without a document."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:library-collapse", "rel": "see-also", "note": {"fa": "کتابخانه: چرا حکومت‌ها ناگهان می‌افتند", "en": "Library: why regimes fall suddenly", "nl": "Library: why regimes fall suddenly"}}, {"to": "simorgh:library-power", "rel": "see-also", "note": {"fa": "کتابخانه: نظریهٔ بازی و ساختارِ قدرت", "en": "Library: game theory and power structure", "nl": "Library: game theory and power structure"}}, {"to": "simorgh:library-transition", "rel": "see-also", "note": {"fa": "کتابخانه: گذار از اینجا به آنجا", "en": "Library: transition from here to there", "nl": "Library: transition from here to there"}}, {"to": "simorgh:library-iran", "rel": "see-also", "note": {"fa": "کتابخانه: ایران، تاریخ، ساختار، سپاه", "en": "Library: Iran, history, structure, the Guards", "nl": "Library: Iran, history, structure, the Guards"}}, {"to": "simorgh:library-after-fall", "rel": "see-also", "note": {"fa": "کتابخانه: بعد از سقوط", "en": "Library: after the fall", "nl": "Library: after the fall"}}, {"to": "simorgh:library-data-myth", "rel": "see-also", "note": {"fa": "کتابخانه: حقوقِ بشر، رسانه، داده، اسطوره", "en": "Library: rights, media, data, myth", "nl": "Library: rights, media, data, myth"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:cost-model", "kind": "concept", "title": {"fa": "برآوردِ هزینه: جانی و مالی", "en": "Cost model: lives and money", "nl": "Cost model: lives and money"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "این‌ها پیش‌بینی نیستند؛ بازه‌های مدل‌شده‌اند از قیاسِ گذارهای مستندِ جهانی، مقیاس‌شده به ۸۷ میلیون با سه تعدیل (شهرنشینیِ ۷۷٪، ارزیابی‌های متن دربارهٔ خطرِ تجزیه و فردمحوری، و رفتارِ مشاهده‌شدهٔ جامعه در دی ۱۴۰۴). هر عدد مرتبهٔ بزرگی است نه رقم؛ ارزش در مقایسهٔ نسبیِ سه ستون است.", "en": "These are not predictions; they are modelled ranges from comparable documented transitions, scaled to 87 million with three adjustments. Each number is an order of magnitude, not a figure; the value lies in comparing the columns.", "nl": "These are not predictions; they are modelled ranges from comparable documented transitions, scaled to 87 million with three adjustments. Each number is an order of magnitude, not a figure; the value lies in comparing the columns."}, "points": [{"text": {"fa": "هزینهٔ جانی: گذارِ میثاقی ۱٬۰۰۰ تا ۱۵٬۰۰۰ کشته و کمتر از ۵۰۰ هزار آواره، ۱ تا ۳ سال ناامنی؛ گسستِ سریع ۵٬۰۰۰ تا ۵۰٬۰۰۰ کشته، ۰٫۵ تا ۲ میلیون آواره، ۲ تا ۵ سال؛ چرخهٔ خشونت ۱۰۰٬۰۰۰ تا ۵۰۰٬۰۰۰+ کشته، ۳ تا ۱۰ میلیون آواره، ۱۰ تا ۲۰ سال؛ وضعِ موجود: مرگ‌های «آرام» و مهاجرتِ فزاینده، نامحدود.", "en": "Human cost: covenantal 1,000 to 15,000 deaths and under 500,000 displaced, 1 to 3 years; rapid rupture 5,000 to 50,000 deaths, 0.5 to 2 million displaced, 2 to 5 years; cycle of violence 100,000 to 500,000+ deaths, 3 to 10 million displaced, 10 to 20 years; status quo: slow deaths and rising emigration, open-ended.", "nl": "Human cost: covenantal 1,000 to 15,000 deaths and under 500,000 displaced, 1 to 3 years; rapid rupture 5,000 to 50,000 deaths, 0.5 to 2 million displaced, 2 to 5 years; cycle of violence 100,000 to 500,000+ deaths, 3 to 10 million displaced, 10 to 20 years; status quo: slow deaths and rising emigration, open-ended."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "هزینهٔ مالی: افتِ GDP در اوج: ۵ تا ۱۲٪ (میثاقی)، ۱۵ تا ۲۵٪ (گسست)، ۴۰ تا ۷۰٪ (چرخهٔ خشونت)؛ بازسازی ۳۰–۶۰، ۸۰–۱۵۰ و ۲۵۰–۵۰۰ میلیارد دلار؛ بازگشت به سطحِ امروز ۲ تا ۴، ۵ تا ۸ و ۱۵ تا ۲۵ سال؛ بازدهِ خالصِ ده‌ساله +۴۰۰ تا ۸۰۰، +۵۰ تا ۳۰۰ و −۶۰۰ تا ۱٬۲۰۰ میلیارد دلار؛ وضعِ موجود −۴۰۰ تا ۶۰۰ هزینهٔ فرصت.", "en": "Financial cost: peak GDP drop 5 to 12, 15 to 25 and 40 to 70 percent; reconstruction 30-60, 80-150 and 250-500 billion dollars; return to today's level 2-4, 5-8 and 15-25 years; ten-year net return +400 to 800, +50 to 300 and -600 to -1,200 billion; status quo -400 to -600 opportunity cost.", "nl": "Financial cost: peak GDP drop 5 to 12, 15 to 25 and 40 to 70 percent; reconstruction 30-60, 80-150 and 250-500 billion dollars; return to today's level 2-4, 5-8 and 15-25 years; ten-year net return +400 to 800, +50 to 300 and -600 to -1,200 billion; status quo -400 to -600 opportunity cost."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "لنگرِ عددی: فرارِ مغزها ≈۵۰ میلیارد دلار در سال (برآوردِ منسوب به بانکِ جهانی، بی‌منبعِ اولیه) در برابرِ ≈۲۰ میلیارد صادراتِ نفتِ ۲۰۱۹؛ درآمدِ سرانه ۵٬۶۱۷ (۲۰۲۵) در برابرِ ۷٬۴۴۲ (۱۹۷۶). منتقدِ روش‌شناس می‌گوید این دو هم‌جنس نیستند و ترکیبِ جمعیت را نادیده می‌گیرد؛ نسبتِ اهرمِ ۱ به ۱۰٬۰۰۰ بازمحاسبه شد.", "en": "Anchors: brain drain ≈50 billion dollars a year (estimate attributed to the World Bank, no primary source) against ≈20 billion 2019 oil exports; income per head 5,617 (2025) against 7,442 (1976). The methodologist critic says these are not like for like; the 1-to-10,000 leverage ratio was recomputed.", "nl": "Anchors: brain drain ≈50 billion dollars a year (estimate attributed to the World Bank, no primary source) against ≈20 billion 2019 oil exports; income per head 5,617 (2025) against 7,442 (1976). The methodologist critic says these are not like for like; the 1-to-10,000 leverage ratio was recomputed."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "معادلهٔ پنجاه‌هزار: در حوزهٔ تمدنِ ایرانی (۳۰ تا ۵۰ کشور) پنجاه‌هزار نفرِ نخبه می‌خواهید که بدانند به یک تمدن تعلق دارند؛ و منبعِ تولیدِ آن‌ها، جمعیتِ دانشجویی، از ۴٫۸ به ۳٫۱۸ میلیون باریک می‌شود. هر سال تأخیر ظرفیتِ ساختنِ فردا را کم می‌کند و این جبران‌پذیر نیست.", "en": "The fifty-thousand equation: across the Iranian civilisational area (30 to 50 countries) you need fifty thousand elite people who feel they belong to one civilisation; the student population that produces them shrinks from 4.8 to 3.18 million. Each year of delay reduces the capacity to build tomorrow, irreversibly.", "nl": "The fifty-thousand equation: across the Iranian civilisational area (30 to 50 countries) you need fifty thousand elite people who feel they belong to one civilisation; the student population that produces them shrinks from 4.8 to 3.18 million. Each year of delay reduces the capacity to build tomorrow, irreversibly."}, "sources": [], "flags": []}, {"text": {"fa": "هشدارِ بازبینی: جدول‌ها پیش از جنگِ ۱۴۰۴–۱۴۰۵ ساخته شدند. ستونِ «وضعِ موجود» حالا خودش هزینهٔ جنگ و محاصره را دارد (تورم ۷۳٫۶٪، خوراکی ۱۲۱٫۸٪)، پس فاصلهٔ «ماندن» با «گذارِ میثاقی» از آنچه جدول نشان می‌دهد بیشتر است. اعداد باید با دادهٔ تازه بازسازی شوند و تا آن وقت فقط مقایسهٔ نسبیِ ستون‌ها معتبر است.", "en": "Review warning: the tables were built before the 2025-26 war. The status-quo column now itself carries war and blockade costs, so the gap between staying and covenantal transition is larger than shown. The numbers must be rebuilt; until then only the relative comparison of columns holds.", "nl": "Review warning: the tables were built before the 2025-26 war. The status-quo column now itself carries war and blockade costs, so the gap between staying and covenantal transition is larger than shown. The numbers must be rebuilt; until then only the relative comparison of columns holds."}, "sources": ["src:7af62df15e"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:three-paths", "rel": "see-also", "note": {"fa": "سه راه", "en": "Three paths", "nl": "Three paths"}}, {"to": "simorgh:claims-model", "rel": "see-also", "note": {"fa": "ادعاهای مدل", "en": "Model claims", "nl": "Model claims"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}], "people": [], "sources": ["src:7af62df15e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-5", "kind": "concept", "title": {"fa": "مرغ‌ها: سازندگان پیوند", "en": "Birds: سازندگان پیوند", "nl": "Birds: سازندگان پیوند"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "پنج مرغِ گروهِ «سازندگان پیوند» با مأموریت و قدمِ هرکدام.", "en": "The five birds of the group \"سازندگان پیوند\" with the mission and step of each.", "nl": "The five birds of the group \"سازندگان پیوند\" with the mission and step of each."}, "points": [{"text": {"fa": "میانجی: مأموریت: اختلاف به خشونت نرسد. قدمِ امروز: یک گفتگوی سخت را بی‌دعوا تمرین کن. روزِ آزادی: جلوگیری از انتقام در محله. پس از آن: گفتگوی ملی بر سر قواعد.", "en": "Bird میانجی: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird میانجی: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ضامن اعتماد: مأموریت: اعتماد، حلقه به حلقه. قدمِ امروز: فقط کسی را دعوت کن که می‌شناسی. روزِ آزادی: معرفی آدم‌های مطمئن به گروه‌های کار. پس از آن: شبکه‌های محلی همکاری.", "en": "Bird ضامن اعتماد: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird ضامن اعتماد: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "همسایه‌یار محله: مأموریت: هیچ همسایه‌ای تنها نماند. قدمِ امروز: همسایه‌های سالمند و بیمارت را بشناس. روزِ آزادی: سر زدن به پنج خانه. پس از آن: شورای محله.", "en": "Bird همسایه‌یار محله: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird همسایه‌یار محله: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پل ایرانیان خارج: مأموریت: تخصص و سرمایه برگردد. قدمِ امروز: از محصولات پروژه بخر یا حامی شو. روزِ آزادی: پاسخ به فهرست نیازهای فوری. پس از آن: بازگشت تخصص، سرمایه‌گذاری، دیپلماسی مردمی.", "en": "Bird پل ایرانیان خارج: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird پل ایرانیان خارج: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جشن‌ساز و فرهنگ: مأموریت: شادی، همبستگی می‌سازد. قدمِ امروز: یک شب بازی سیمرغ برگزار کن. روزِ آزادی: جشن امن با همهٔ زبان‌ها و موسیقی‌ها. پس از آن: جشن ملی و نخستین نوروز آزاد.", "en": "Bird جشن‌ساز و فرهنگ: mission, step today, liberation-day role, long-term, as in the Persian text.", "nl": "Bird جشن‌ساز و فرهنگ: mission, step today, liberation-day role, long-term, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "soc:coordination-focal-points", "rel": "see-also", "note": {"fa": "نقطهٔ کانونی", "en": "نقطهٔ کانونی", "nl": "نقطهٔ کانونی"}}, {"to": "soc:repeated-games-cooperation", "rel": "see-also", "note": {"fa": "بازی تکراری و همکاری", "en": "بازی تکراری و همکاری", "nl": "بازی تکراری و همکاری"}}, {"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:sciences-26", "kind": "concept", "title": {"fa": "بیست‌وشش علم: چه داریم، چه نیمه داریم، چه نداریم", "en": "Twenty-six sciences: what we have, partly have, lack", "nl": "Twenty-six sciences: what we have, partly have, lack"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "بازی روی علم بنا شده؛ این مدخل می‌گوید برای هر علم چه چیزی لازم است و چقدر از آن در دانش‌سرا پوشش داده شده است (دارد، نیمه، ندارد).", "en": "The game rests on science; this entry says what each science is needed for and how much Daneshsara covers it (have, partly, none).", "nl": "The game rests on science; this entry says what each science is needed for and how much Daneshsara covers it (have, partly, none)."}, "points": [{"text": {"fa": "روان‌شناسی [دارد]: ترس، درماندگی آموخته، تروما و سه‌گانهٔ تاریک: چرا آدم‌ها سکوت می‌کنند یا همدست می‌شوند", "en": "روان‌شناسی: coverage status and use, as in the Persian text.", "nl": "روان‌شناسی: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جامعه‌شناسی [دارد]: کنش جمعی، اعتماد، نابرابری، آنومی و ریشه‌های آسیب", "en": "جامعه‌شناسی: coverage status and use, as in the Persian text.", "nl": "جامعه‌شناسی: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فلسفه [دارد]: مشروعیت، عدالت، دادخواهی و بخشش: شهر برای چه می‌جنگد", "en": "فلسفه: coverage status and use, as in the Persian text.", "nl": "فلسفه: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "تبار و ژنتیک [دارد]: همهٔ ایرانیان از یک آمیختگی بلندند؛ پاسخ علمی به تفرقهٔ نژادی", "en": "تبار و ژنتیک: coverage status and use, as in the Persian text.", "nl": "تبار و ژنتیک: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "تاریخ و ایران‌شناسی [نیمه]: مشروطه، ۱۳۳۲، ۱۳۵۷ و همهٔ گذارهای گذشته", "en": "تاریخ و ایران‌شناسی: coverage status and use, as in the Persian text.", "nl": "تاریخ و ایران‌شناسی: coverage status and use, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "نظریهٔ بازی [نیمه]: هماهنگی، آستانه، تعهد باورپذیر، چانه‌زنی", "en": "نظریهٔ بازی: coverage status and use, as in
