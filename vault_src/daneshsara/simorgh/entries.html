ا: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "اقتصاد [نیمه]: تورم مزمن و سقوط ریال؛ بیکاری جوانان و فارغ‌التحصیلان؛ اقتصاد رانتی و بنیادهای بی‌حساب‌رسی؛ فساد و قاچاق؛ فرار سرمایه؛ صنعت فرسوده؛ تحریم‌ها", "en": "اقتصاد: items and coverage, as in the Persian text.", "nl": "اقتصاد: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "فقر و شکاف طبقاتی [نیمه]: فقر و سوءتغذیه؛ امتیاز وابستگان قدرت؛ نابرابری منطقه‌ای؛ مسکن دست‌نیافتنی؛ بیمهٔ ناکافی", "en": "فقر و شکاف طبقاتی: items and coverage, as in the Persian text.", "nl": "فقر و شکاف طبقاتی: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "آموزش [نیمه]: بی‌سوادی و کم‌سوادی؛ بازماندن دختران روستایی و کودکان مهاجر از مدرسه؛ کتاب درسی ایدئولوژیک؛ حقوق پایین و کمبود معلم؛ گزینش و دانشجویان ستاره‌دار؛ مهاجرت نخبگان", "en": "آموزش: items and coverage, as in the Persian text.", "nl": "آموزش: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "سلامت [دارد]: مهاجرت پزشکان و پرستاران؛ کمبود دارو؛ اعتیاد؛ سلامت روان؛ بیماری‌های ناشی از آلودگی؛ بیماری‌های ژنتیکی و ازدواج خویشاوندی", "en": "سلامت: items and coverage, as in the Persian text.", "nl": "سلامت: items and coverage, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کودک و خانواده [دارد]: تجربه‌های ناگوار کودکی؛ ازدواج کودک؛ کار کودک؛ کودک‌آزاری؛ خشونت خانگی؛ کودکان بی‌شناسنامه؛ به کارگیری نوجوانان در نیروهای نظامی", "en": "کودک و خانواده: items and coverage, as in the Persian text.", "nl": "کودک و خانواده: items and coverage, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "زنان [نیمه]: تبعیض در قانون (ارث، دیه، شهادت، حضانت، اجازهٔ سفر)؛ حجاب اجباری و سرکوب؛ خشونت علیه زنان؛ مشارکت اقتصادی پایین", "en": "زنان: items and coverage, as in the Persian text.", "nl": "زنان: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "اقلیت‌ها [نیمه]: تبعیض قومی و زبانی؛ تبعیض دینی (بهاییان، اهل سنت، دراویش، نوکیشان مسیحی و دیگران)؛ دگرباشان جنسی؛ مهاجران افغانستانی و بازگرداندن اجباری", "en": "اقلیت‌ها: items and coverage, as in the Persian text.", "nl": "اقلیت‌ها: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حقوق بشر و دادخواهی [نیمه]: اعدام‌ها؛ زندانیان سیاسی؛ شکنجه و اعتراف اجباری؛ کشتار ۱۳۶۷؛ کشته‌شدگان اعتراض‌ها (۱۳۸۸، ۱۳۹۶، ۱۳۹۸، ۱۴۰۱، دی ۱۴۰۴)؛ خانواده‌های دادخواه", "en": "حقوق بشر و دادخواهی: items and coverage, as in the Persian text.", "nl": "حقوق بشر و دادخواهی: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "آزادی و اطلاعات [نیمه]: سانسور و فیلترینگ؛ قطع اینترنت؛ انحصار رسانهٔ دولتی؛ زندانی شدن روزنامه‌نگاران؛ نظارت دیجیتال", "en": "آزادی و اطلاعات: items and coverage, as in the Persian text.", "nl": "آزادی و اطلاعات: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "جامعه و اعتماد [دارد]: اعتماد اجتماعی پایین؛ خودکشی؛ مهاجرت گسترده؛ آنومی؛ قطبی‌شدن", "en": "جامعه و اعتماد: items and coverage, as in the Persian text.", "nl": "جامعه و اعتماد: items and coverage, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نهادها و حکمرانی [نیمه]: نهادهای انتصابی؛ نظارت استصوابی؛ قوهٔ قضائیهٔ وابسته؛ سپاه در اقتصاد و سیاست؛ بسیج مسلح؛ اداره‌های فاسد و ناکارآمد", "en": "نهادها و حکمرانی: items and coverage, as in the Persian text.", "nl": "نهادها و حکمرانی: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "روابط خارجی و حقوق بین‌الملل [ندارد]: تحریم‌های آمریکا، اروپا و بازگشت تحریم‌های سازمان ملل؛ جنگ ۱۴۰۴–۱۴۰۵ و خسارت‌هایش؛ هزینهٔ گروه‌های نیابتی؛ دارایی‌های بلوکه؛ پروندهٔ هسته‌ای؛ اعتبار پایین گذرنامه", "en": "روابط خارجی و حقوق بین‌الملل: items and coverage, as in the Persian text.", "nl": "روابط خارجی و حقوق بین‌الملل: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "میراث و فرهنگ [نیمه]: آثار آسیب‌دیده (کاخ گلستان، فلک‌الافلاک، بناهای اصفهان)؛ تخریب گورستان‌های جمعی؛ هنرمندان ممنوع‌کار؛ موسیقی و رقص ممنوع", "en": "میراث و فرهنگ: items and coverage, as in the Persian text.", "nl": "میراث و فرهنگ: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "روان جمعی [نیمه]: تروما و سوگ جمعی؛ ترس و پنهان‌کاری؛ درماندگی آموخته؛ بی‌اعتمادی به نهادها", "en": "روان جمعی: items and coverage, as in the Persian text.", "nl": "روان جمعی: items and coverage, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:population-groups", "rel": "see-also", "note": {"fa": "بیست گروه", "en": "Twenty groups", "nl": "Twenty groups"}}, {"to": "simorgh:master-plan", "rel": "see-also", "note": {"fa": "نقشهٔ کلان", "en": "Master plan", "nl": "Master plan"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:strategy-paper", "kind": "concept", "title": {"fa": "سندِ راهبردی: تشخیص، گزینه‌ها و مسیر (۱۲ بخش)", "en": "Strategy paper: diagnosis, options and path (12 sections)", "nl": "Strategy paper: diagnosis, options and path (12 sections)"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "سندی ۴۵ دقیقه‌ای (مهر ۱۴۰۵) که می‌پرسد مسئلهٔ امروز چیست، چه گزینه‌هایی روی میز است، هرکدام چه قیمتی دارد و چه چیزی را می‌شود اندازه گرفت. تحلیلِ ساختاری است نه بیانیه و نه پیش‌بینی، و بر ۸۴ ادعای منبع‌دار تکیه دارد. نسخهٔ کوتاهِ آن «ارائهٔ راهبردی» است.", "en": "A 45-minute paper (October 2026) asking what today's problem is, what options are on the table, what each costs and what can be measured. Structural analysis, not a manifesto nor a forecast, resting on 84 sourced claims. Its short version is the strategy brief.", "nl": "A 45-minute paper (October 2026) asking what today's problem is, what options are on the table, what each costs and what can be measured. Structural analysis, not a manifesto nor a forecast, resting on 84 sourced claims. Its short version is the strategy brief."}, "points": [{"text": {"fa": "شش گزارهٔ خلاصهٔ اجرایی: مسئله متقاعدکردنِ مردم نیست (۳۰٫۷٪ تا ۷۲٫۹٪ موافقِ جدایی دین از حکومت، از پیمایشِ خودِ حاکمیت)؛ ائتلافِ حاکم کوچک ولی منسجم است؛ فشارِ اقتصادی شکلِ خاصی دارد؛ ساعتِ جمعیتی می‌دود؛ گزینه‌ها قیمت دارند؛ و راهِ شدنی کوچک‌ترین قدمِ هماهنگ است.", "en": "The six executive propositions: the problem is not persuading people; the ruling coalition is small but cohesive; economic pressure has a specific shape; the demographic clock is running; options have prices; and the feasible way is the smallest coordinated step.", "nl": "The six executive propositions: the problem is not persuading people; the ruling coalition is small but cohesive; economic pressure has a specific shape; the demographic clock is running; options have prices; and the feasible way is the smallest coordinated step."}, "sources": ["src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "تشخیص با چهار سنجه: تقاضا اشباع است؛ ائتلاف حاکم ۱۰ تا ۱۵٪ (برآوردِ کیفی) در برابر ۸۰ تا ۸۵٪؛ فقر ۳۰٪ و طبقهٔ متوسط ۸۴٪ ← ۵۶٪؛ ساعتِ جمعیتی (باروری ۱٫۳۵ تا ۱٫۷، دانشجو ۴٫۸ ← ۳٫۱۸ میلیون، تورم ۸۷٫۹٪).", "en": "Diagnosis by four gauges: demand is saturated; the ruling coalition 10 to 15 percent (qualitative) against 80 to 85; poverty 30 percent, middle class 84 to 56; demographic clock.", "nl": "Diagnosis by four gauges: demand is saturated; the ruling coalition 10 to 15 percent (qualitative) against 80 to 85; poverty 30 percent, middle class 84 to 56; demographic clock."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "ریشهٔ ساختاری: پانصد سال بالا رفتن (هشت پله) و ۱۳۵۷ با درسِ سازمان‌یافتگی؛ و کارتِ هجده قشر: کاسب و بازاری، کارگرِ صنعتی (نفت، گاز، پتروشیمی، بندر)، راننده، معلم، کادرِ درمان، سرباز و پلیس و نیروی امنیتی، کارمندِ دولت، اهلِ منبر و مسجد، دانشجو، متخصص، مهاجر، زنِ خانه، دست‌تنگ، سرمایه‌دار، وکیل، هنرمند، کم‌سواد، و کسی که نمی‌خواهد یا می‌ترسد؛ برای هرکدام نقش، وضع، خطر، خواست و چگونگیِ همراه‌شدن.", "en": "Structural roots: five centuries of rising and 1979; and the eighteen-strata card: for each what it does, its situation, risk, wish and how it joins.", "nl": "Structural roots: five centuries of rising and 1979; and the eighteen-strata card: for each what it does, its situation, risk, wish and how it joins."}, "sources": [], "flags": []}, {"text": {"fa": "پایهٔ شواهد: ۸۴ ادعا؛ ردهٔ ۱ دادهٔ اولیه یا سند، ردهٔ ۲ پژوهش، ردهٔ ۳ برآورد یا مدل. آنچه ادبیات می‌گوید: خشونت‌پرهیزی مؤثرتر (۵۳٪ در برابر ۲۶٪)، قاعدهٔ ۳٫۵٪ مشاهده است نه قانون، و ریزشِ نیروهای نگه‌دارنده تعیین‌کننده است. آنچه ما را رد می‌کند: دوامِ رژیم‌های انقلابی، خطرِ میانهٔ راه و نرخِ کاهنده.", "en": "Evidence base: 84 claims across three tiers. What the literature says: nonviolence is more effective, the 3.5 percent rule is an observation not a law, and defection of supporting forces decides. What refutes us: durability of revolutionary regimes, the middle-of-the-road danger and the falling success rate.", "nl": "Evidence base: 84 claims across three tiers. What the literature says: nonviolence is more effective, the 3.5 percent rule is an observation not a law, and defection of supporting forces decides. What refutes us: durability of revolutionary regimes, the middle-of-the-road danger and the falling success rate."}, "sources": ["src:41c1e6a2e7", "src:89f0e30575", "src:7fffecad9e"], "flags": []}, {"text": {"fa": "گزینه‌ها و قیمت (چهار مسیر) و توصیه در سه افق (۹۰ روز، ۹ ماه، ۶۰۰ روز) با شش ابتکار؛ و یک اقدامِ پربازده: موضع‌گیریِ صریح و مکرر نسبت به رفتارِ هواداران که منبع «۸۰ تا ۹۰ درصدِ مسئله» می‌داند (داوریِ کیفی، بی‌روش).", "en": "Options and prices (four paths) and the three-horizon recommendation with six initiatives; plus one high-yield action: explicit, repeated position on supporters' behaviour, which the source calls \"80 to 90 percent of the problem\" (qualitative, no method).", "nl": "Options and prices (four paths) and the three-horizon recommendation with six initiatives; plus one high-yield action: explicit, repeated position on supporters' behaviour, which the source calls \"80 to 90 percent of the problem\" (qualitative, no method)."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "دفترچهٔ سیاست: ده پرونده با چهار خانه (مسئلهٔ امروز، چه می‌شود کرد، تجربهٔ جهانی، آنچه نمی‌دانیم؛ خانهٔ چهارم اجباری): مسکن و خانه‌های خالی؛ امنیتِ عمومی در صد روزِ اول؛ بودجه و پول‌های بلوکه؛ مسجد، حوزه و نهادِ دینی؛ پزشکِ سهمیه‌ای و عدالتِ آموزشی؛ سواد و آموزشِ بزرگسال؛ آب، محیط‌زیست و حیاتِ وحش (تنها پروندهٔ برگشت‌ناپذیر)؛ بازسازیِ پس از جنگ؛ قوانینِ روزِ اول (هفت متنِ کوتاه که باید امروز نوشته و در کشو گذاشته شود)؛ مردم چطور از خودشان مراقبت کنند.", "en": "Policy notebook: ten files with four boxes each (today's problem, what can be done, world experience, what we do not know; the fourth is mandatory).", "nl": "Policy notebook: ten files with four boxes each (today's problem, what can be done, world experience, what we do not know; the fourth is mandatory)."}, "sources": [], "flags": []}, {"text": {"fa": "سنجه‌های ۹۰ روز: هر راهبردی که شرطِ شکستِ خودش را تعریف نکند راهبرد نیست؛ مثلاً «تنوعِ امضا» با هدفِ بیش از ۵۰٪ امضاکنندهٔ غیرپادشاهی‌خواه و آستانهٔ شکستِ زیر ۳۰٪. و ممیزی: ۱۴ ادعا به یک ارجاعِ جمعی بند است.", "en": "90-day metrics: any strategy that does not define its own failure condition is not a strategy; e.g. \"signature diversity\" with a target above 50 percent non-monarchist signers and a failure threshold below 30. And the audit.", "nl": "90-day metrics: any strategy that does not define its own failure condition is not a strategy; e.g. \"signature diversity\" with a target above 50 percent non-monarchist signers and a failure threshold below 30. And the audit."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "پروندهٔ جدا: ایران و اسرائیل در یک سندِ راهبردی، با چهار چیزی که نمی‌گوید.", "en": "A separate file: Iran and Israel, with the four things it does not say.", "nl": "A separate file: Iran and Israel, with the four things it does not say."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:covenantal-transition", "rel": "see-also", "note": {"fa": "برنامهٔ ۹۰/۹/۶۰۰", "en": "90/9/600", "nl": "90/9/600"}}, {"to": "simorgh:nine-faction-critique", "rel": "see-also", "note": {"fa": "میزِ نقد", "en": "Critique table", "nl": "Critique table"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}, {"to": "simorgh:europe-deck", "rel": "see-also", "note": {"fa": "ارائهٔ اروپا", "en": "Europe deck", "nl": "Europe deck"}}, {"to": "tarikh:iran-and-jews", "rel": "see-also", "note": {"fa": "ایران و اسرائیل", "en": "Iran and Israel", "nl": "Iran and Israel"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌های پشتیبانی: بردِ واقعی یعنی چرخیدنِ ستون‌ها", "en": "Pillars of support: the real win is the pillars shifting", "nl": "Pillars of support: the real win is the pillars shifting"}}, {"to": "simorgh:pre-mortem", "rel": "see-also", "note": {"fa": "پیش‌مرگ: اگر برنامه شکست بخورد، احتمالاً چرا", "en": "Pre-mortem: if the plan fails, probably why", "nl": "Pre-mortem: if the plan fails, probably why"}}, {"to": "simorgh:threshold-indicators", "rel": "see-also", "note": {"fa": "نشانگرهای آستانه: چه چیزی را باید دید", "en": "Threshold indicators: what to watch", "nl": "Threshold indicators: what to watch"}}, {"to": "simorgh:why-not-january", "rel": "see-also", "note": {"fa": "چرا ۱۴ میلیون نفر در خیابان کافی نبود", "en": "Why 14 million in the streets was not enough", "nl": "Why 14 million in the streets was not enough"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:6c0a6f1ef3", "src:7fffecad9e", "src:89f0e30575"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:exit-voice", "kind": "concept", "title": {"fa": "خروج، صدا، وفاداری: حرکتی که بازی نداشت", "en": "Exit, voice, loyalty: the move the game lacked", "nl": "Exit, voice, loyalty: the move the game lacked"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "در بازیِ نسخهٔ یک کسی از میز بلند نمی‌شد؛ در ایران «خروج» بزرگ‌ترین حرکتِ پنهان است. نظریه (هیرشمن) در ویکی جامعه‌شناسی است؛ اینجا معنایش برای بازی و برنامه.", "en": "In version one nobody left the table; in Iran exit is the largest hidden move. The theory (Hirschman) is in the sociology wiki; here, its meaning for the game and the plan.", "nl": "In version one nobody left the table; in Iran exit is the largest hidden move. The theory (Hirschman) is in the sociology wiki; here, its meaning for the game and the plan."}, "points": [{"text": {"fa": "واقعیتِ ۱۴۰۵: به گزارشِ رویترز، خانواده‌ها هزینهٔ تحصیل را می‌بُرند و تحصیل در خارج برای بسیاری ناممکن شده؛ یعنی خروج هم گران شده. نتیجهٔ دوگانه: کسانی که نمی‌توانند بروند، یا به صدا رو می‌آورند یا به درماندگی.", "en": "2026 reality: per Reuters families cut education spending and study abroad is out of reach for many, so exit has become costly too. Double result: those who cannot leave turn either to voice or to helplessness.", "nl": "2026 reality: per Reuters families cut education spending and study abroad is out of reach for many, so exit has become costly too. Double result: those who cannot leave turn either to voice or to helplessness."}, "sources": ["src:7af62df15e"], "flags": ["editor-note"]}, {"text": {"fa": "عددِ کلیدی از گمان (تیر ۱۴۰۵): ۳۲٪ می‌خواهند قانونی بروند ولی امکانش را ندارند. این «خروجِ بسته» بزرگ‌ترین گروهِ میزِ امروز است: آدم‌هایی که دیگر وفادار نیستند، نمی‌توانند بروند، و هنوز صدا هم نشده‌اند. هیرشمن پیش‌بینی می‌کند وقتی خروج بسته می‌شود فشار به سمتِ صدا می‌رود؛ اما فقط اگر صدا هزینهٔ تحمل‌پذیر داشته باشد، که دوباره ما را به صندوق و ضمانت برمی‌گرداند.", "en": "Key GAMAAN figure: 32 percent want to leave legally but cannot. This \"blocked exit\" is the largest group at today's table: no longer loyal, unable to leave, not yet voice. Hirschman predicts pressure shifts to voice when exit closes, but only if voice has bearable cost, which leads back to the fund and the guarantee.", "nl": "Key GAMAAN figure: 32 percent want to leave legally but cannot. This \"blocked exit\" is the largest group at today's table: no longer loyal, unable to leave, not yet voice. Hirschman predicts pressure shifts to voice when exit closes, but only if voice has bearable cost, which leads back to the fund and the guarantee."}, "sources": ["src:6c0a6f1ef3", "src:6ec0c8ba1e"], "flags": ["editor-note"]}, {"text": {"fa": "دیاسپورا (۴ تا ۸ میلیون، برآورد) خروج‌کرده‌هایی‌اند که هنوز می‌توانند «صدا» باشند، اما فقط در چند کارِ مشخص مؤثرند: مستندسازی و آرشیو، کمکِ حقوقی و صندوقِ شفاف با حسابرسیِ مستقل، فشارِ سیاستی در اروپا با منبعِ معتبر، و مهارت برای «روز بعد». فشارِ بیرونیِ بی‌هماهنگ گاهی حرکتِ داخل را بی‌اعتبار می‌کند.", "en": "The diaspora (4 to 8 million, estimate) are exiters who can still be voice, effective only in specific jobs: documentation, legal aid and transparent audited funds, policy pressure in Europe with credible sources, and skills for the day after.", "nl": "The diaspora (4 to 8 million, estimate) are exiters who can still be voice, effective only in specific jobs: documentation, legal aid and transparent audited funds, policy pressure in Europe with credible sources, and skills for the day after."}, "sources": ["src:41c1e6a2e7"], "flags": ["editor-note"]}, {"text": {"fa": "در قواعدِ نسخهٔ ۲ «کارتِ خروج» اضافه شد: بازیکنی که می‌رود از شمارِ شهر کم می‌شود ولی یک «صدای بیرونی» با اثرِ محدود می‌گیرد؛ هر خروج آستانهٔ شهر را سخت‌تر می‌کند.", "en": "Rules v2 add an exit card: a leaving player is subtracted from the city but gets a limited \"outside voice\"; each exit makes the city's threshold harder.", "nl": "Rules v2 add an exit card: a leaving player is subtracted from the city but gets a limited \"outside voice\"; each exit makes the city's threshold harder."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:game-rules-v2", "rel": "see-also", "note": {"fa": "قواعد نسخهٔ ۲", "en": "Rules v2", "nl": "Rules v2"}}, {"to": "simorgh:game-reality-map", "rel": "see-also", "note": {"fa": "جدولِ تطبیق", "en": "Game-to-reality map", "nl": "Game-to-reality map"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "تحریف ترجیحات", "en": "Preference falsification", "nl": "Preference falsification"}}, {"to": "simorgh:gamaan-2026", "rel": "see-also", "note": {"fa": "پیمایشِ گمان (گزارش کامل)", "en": "GAMAAN full report", "nl": "GAMAAN full report"}}, {"to": "soc:exit-voice-loyalty", "rel": "see-also", "note": {"fa": "نظریه: خروج، صدا، وفاداری", "en": "Theory: exit, voice, loyalty", "nl": "Theory: exit, voice, loyalty"}}], "people": [], "sources": ["src:41c1e6a2e7", "src:6c0a6f1ef3", "src:6ec0c8ba1e", "src:7af62df15e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:library-data-myth", "kind": "concept", "title": {"fa": "کتابخانه: حقوقِ بشر، رسانه، داده، اسطوره", "en": "Library: rights, media, data, myth", "nl": "Library: rights, media, data, myth"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "مرجع‌های داده برای هر ادعای عددی دربارهٔ سرکوب، و منابعِ لایهٔ روایی.", "en": "Library: rights, media, data, myth", "nl": "Library: rights, media, data, myth"}, "points": [{"text": {"fa": "مأموریتِ مستقلِ حقیقت‌یابِ سازمان ملل دربارهٔ ایران (OHCHR): داده: مرجعِ رسمی و قابل‌استناد؛ مأموریت در ژانویهٔ ۲۰۲۶ تمدید شد.", "en": "مأموریتِ مستقلِ حقیقت‌یابِ سازمان ملل دربارهٔ ایران (OHCHR): why it is on the shelf (Persian text).", "nl": "مأموریتِ مستقلِ حقیقت‌یابِ سازمان ملل دربارهٔ ایران (OHCHR): why it is on the shelf (Persian text)."}, "sources": [], "flags": []}, {"text": {"fa": "Freedom House، گزارشِ سرکوبِ فراملی: داده: «این مسئلهٔ خودِ ت emorial Museum. Encyclopedia entry: Abdol Hossein Sardari.", "year": null, "tier": 2, "wikis": ["tarikh", "simorgh"]}, "src:55fb1755fa": {"id": "src:55fb1755fa", "cite": "Ostovar, A. (2016). Vanguard of the Imam: Religion, Politics, and the Iran's Revolutionary Guards. Oxford University Press.", "year": 2016, "tier": 2, "wikis": ["simorgh"]}, "src:040033aaf5": {"id": "src:040033aaf5", "cite": "Chenoweth, E. (2021). Civil Resistance: What Everyone Needs to Know. Oxford University Press.", "year": 2021, "tier": 3, "wikis": ["soc", "simorgh"]}, "src:d17b25882e": {"id": "src:d17b25882e", "cite": "Tufekci, Z. (2017). Twitter and Tear Gas: The Power and Fragility of Networked Protest. Yale University Press.", "year": 2017, "tier": 2, "wikis": ["simorgh"]}, "src:24d305d03c": {"id": "src:24d305d03c", "cite": "Kadivar, M. A. (2018). Mass Mobilization and the Durability of New Democracies. American Sociological Review, 83(2).", "year": 2018, "tier": 2, "wikis": ["simorgh"]}, "src:a659e764c0": {"id": "src:a659e764c0", "cite": "Olson, M. (1965). The Logic of Collective Action: Public Goods and the Theory of Groups. Harvard University Press.", "year": 1965, "tier": 3, "wikis": ["soc", "simorgh"]}}, "iran": {"iran:cost-of-living-2026": {"id": "iran:cost-of-living-2026", "domain": "soc", "question": {"fa": "در جنگ و محاصرهٔ ۱۴۰۵ دستمزد و هزینهٔ زندگی چقدر از هم فاصله گرفته‌اند؟", "en": "How far apart are wages and living costs under the 2026 war and blockade?"}, "finding": {"fa": "به گزارشِ رویترز (۶ آبان ۱۴۰۵) بر پایهٔ آمارِ رسمی: تورمِ سالانه ۷۳٫۶٪، خوراکی و نوشیدنی ۱۲۱٫۸٪، اجاره ۳۲٫۸٪ و مسکن و آب و سوخت حدود ۳۸٪ (شهریور ۱۴۰۵). حداقلِ هزینهٔ زندگیِ خانوادهٔ سه‌نفرهٔ کارگری حدود ۳۳۶ دلار در ماه و میانگینِ دستمزد حدود ۹۲ دلار به نرخِ بازارِ آزاد؛ ریال در یک سال بیش از نصفِ ارزشش را از دست داد. بیکاریِ رسمی ۹٫۱٪ (بهار ۱۴۰۵، ۱٫۸ واحد بیشتر از سالِ پیش)، نرخِ مشارکت ۴۰٫۷٪، و نزدیک به یک‌چهارمِ ۱۵ تا ۲۴ساله‌ها بیکار. زمینه: حملهٔ آمریکا و اسرائیل از ۹ اسفند ۱۴۰۴، بستنِ هرمز و محاصرهٔ بنادر، و گسترشِ تحریم‌ها در ۲ شهریور ۱۴۰۵.", "en": "Per Reuters (28 October 2026) from official data: annual inflation 73.6%, food and beverages 121.8%, rent 32.8%, housing, utilities and fuel about 38% (September 2026). Minimum living cost for a working family of three about $336 a month against an average wage of about $92 at the free-market rate; the rial lost more than half its value in a year. Official unemployment 9.1% (spring 2026, up 1.8 points), participation 40.7%, nearly a quarter of 15-24 year-olds unemployed. Context: US and Israeli strikes from 28 February 2026, Hormuz closure and port blockade, sanctions widened on 24 August 2026."}, "year": 2026, "method": "official statistics (Statistical Centre, state media) as reported by Reuters; free-market exchange rate for dollar conversions", "grade": "B", "contested": false, "source": [{"title": "Hafezi, P. (28 October 2026). Iranians cut essentials and put dreams on hold as war-hit economy bites. Reuters, via Al-Monitor.", "url": "https://www.al-monitor.com/originals/2026/10/iranians-cut-essentials-and-put-dreams-hold-war-hit-economy-bites"}], "critique": "عددها رسمی‌اند و احتمالاً کم‌برآورد؛ تبدیل به دلار با نرخِ آزاد انجام شده که هر هفته عوض می‌شود. نسبتِ دستمزد به هزینه (حدود ۱ به ۳٫۷) جهت را مطمئن نشان می‌دهد، نه رقمِ دقیق را.", "viz": {"kind": "bars", "unit": {"fa": "درصد تغییرِ سالانه"}, "label": {"fa": "گرانیِ سالانه به تفکیک، شهریور ۱۴۰۵"}, "bars": [{"fa": "خوراکی و نوشیدنی", "v": 121.8, "self": true}, {"fa": "تورمِ کل", "v": 73.6}, {"fa": "مسکن، آب و سوخت", "v": 38}, {"fa": "اجاره", "v": 32.8}], "note": {"fa": "یک سال پیش و یک سال بعد از آغازِ جنگ؛ خوراکی بیش از دو برابر شده."}}, "roots": {"fa": "جنگ و محاصره درآمدِ ارزی را بریده، کسریِ بودجه با چاپِ پول پر می‌شود و ریال سقوط می‌کند."}, "now": {"fa": "برای بیشترِ مزدبگیران هر روز نکارکردن یعنی گرسنگی؛ هر برنامه‌ای که به اعتصاب تکیه دارد بدونِ صندوقِ پشتیبان شدنی نیست."}, "fields": [], "concepts": ["soc:collective-action"], "capability": [10]}, "iran:political-attitudes-2026": {"id": "iran:political-attitudes-2026", "domain": "soc", "question": {"fa": "ایرانیان پس از اعتراض‌های دی ۱۴۰۴ و جنگ ۱۴۰۴–۱۴۰۵ دربارهٔ تغییر چه می‌گویند؟", "en": "What do Iranians say about change after the January 2026 protests and the 2026 war?"}, "finding": {"fa": "در نظرسنجی آنلاین گمان (۳۰ خرداد تا ۶ تیر ۱۴۰۵، ۳۱٬۴۵۰ پاسخ‌دهنده در ایران، وزن‌دهی‌شده) حدود ۴۷٪ «تغییر نظام» و حدود ۲۳٪ «گذار ساختاری از جمهوری اسلامی» را شرط تغییر دانستند؛ حدود ۱۰٪ اصلاح تدریجی درون نظام و حدود ۹٪ پایبندی به اصول انقلاب و رهبری. ۲۴٫۹٪ گفتند در اعتراض‌های دی ۱۴۰۴ شرکت کرده‌اند و ۲۵٫۴٪ پاسخ ندادند. دربارهٔ نظام جایگزین: حدود ۳۴٪ پادشاهی، ۲۸٪ جمهوری، ۱۳٪ جمهوری اسلامی و حدود یک چهارم بی‌نظر. شعارها: «زنده باد ایران» ۹۴٪ موافق، «نه به اعدام» ۸۱٪، «مرگ بر دیکتاتور» ۷۹٪، «زن، زندگی، آزادی» ۷۴٪؛ شعارهای جناحی دوقطبی‌ترند. پرچمِ شیر و خورشید (با یا بی تاج) ۶۴٪ و پرچمِ رسمی ۱۹٪. نگرانیِ اصلی: گرانی ۷۶٪، ادامهٔ حکومت و سرکوب ۶۰٪، سلامت و دارو ۴۲٪، بیکاری ۳۶٪، ازسرگیریِ جنگ ۱۸٪، پیامدهای تغییرِ نظام ۱۴٪. راهِ مؤثرِ تغییر: اعتراضِ مدنی ۴۴٪، مداخلهٔ نظامیِ خارجی ۳۰٪، انتخابات ۱۹٪، مبارزهٔ خشونت‌آمیز ۱۴٪.", "en": "In GAMAAN’s online survey (20–27 June 2026, 31,450 respondents inside Iran, weighted) about 47% named “regime change” and about 23% “structural transition from the Islamic Republic” as the condition for change; about 10% gradual reform within the system and about 9% loyalty to the revolution’s principles and the Leader. 24.9% said they took part in the January 2026 protests and 25.4% declined to answer. On the alternative system: about 34% monarchy, 28% republic, 13% Islamic Republic and about a quarter undecided. Slogans: \"Long live Iran\" 94% agree, \"No to execution\" 81%, \"Death to the dictator\" 79%, \"Woman, Life, Freedom\" 74%; factional slogans are more polarised. Lion-and-sun flag (with or without crown) 64%, official flag 19%. Main concerns: prices 76%, regime continuation and repression 60%, health and medicine 42%, unemployment 36%, war resuming 18%, consequences of regime change 14%. Effective route to change: civil protest 44%, foreign military intervention 30%, elections 19%, violent struggle 14%."}, "year": 2026, "method": "online survey via circumvention tools (Psiphon ~97%), raked on age, gender, education, residence, province; effective sample ~6,211", "grade": "B", "contested": true, "source": [{"title": "GAMAAN (2026). Iranians’ Attitudes Toward the 2026 Protests and War: Survey Report.", "url": "https://gamaan.org/wp-content/uploads/2026/07/GAMAAN-2026-Protests-and-War-Survey-Report-Final-English.pdf"}], "fields": [], "concepts": ["soc:preference-falsification", "soc:coordination-focal-points", "soc:security-defection-credible-commitment"], "capability": [7], "critique": "نمونه آنلاین و از راه فیلترشکن است: باسوادها، جوان‌ترها و شهری‌ها بیشتر در آن هستند و وزن‌دهی همهٔ این سوگیری را جبران نمی‌کند. در عوض ناشناس است و ترس از پاسخ را کم می‌کند، که در نظرسنجی تلفنی داخل ایران ممکن نیست. اعداد را باید جهت‌نما دانست، نه دقیق. نمونهٔ خام ۷۷٪ مرد بود و با وزن‌دهی به ۵۲٪ رسید؛ وزن‌دهی بر پایهٔ گرایشِ سیاسی نیست.", "viz": {"kind": "bars", "unit": {"fa": "درصد پاسخ‌دهندگان (تقریبی)"}, "label": {"fa": "شرط تغییر از نگاه پاسخ‌دهندگان، تیر ۱۴۰۵"}, "bars": [{"fa": "تغییر نظام", "v": 47, "self": true}, {"fa": "گذار ساختاری", "v": 23}, {"fa": "اصلاح تدریجی درون نظام", "v": 10}, {"fa": "اصول انقلاب و رهبری", "v": 9}], "note": {"fa": "جمع به ۱۰۰ نمی‌رسد چون گزینه‌های دیگر و «نمی‌دانم» نشان داده نشده‌اند. نمونهٔ آنلاین است؛ ردهٔ B."}}}}, "ext": {"soc:pacted-transitions": {"title": {"fa": "گذار توافقی: وقتی دو طرف پای میز می‌آیند", "en": "Pacted transitions", "nl": "Onderhandelde transities"}, "url": "../soc/#pacted-transitions"}, "soc:modern-iranian-brain-drain-debate": {"title": {"fa": "فرار مغزها از ایران: برنامه‌ریزی‌شده، انبوه و پیوسته به وطن؟", "en": "Iranian brain drain: planned, mass-scale and still connected?", "nl": "Iraanse braindrain: gepland, massaal en nog verbonden?"}, "url": "../soc/#modern-iranian   const tr = c.try && tx(c.try.text || {}) ? `<h2 class="sec">${XL.tryit}</h2><div class="tryit">${esc(tx(c.try.text))}${c.try.tool && /^[a-z]/.test(c.try.tool) && c.try.tool.includes(".html") ? ` <div><a href="../${esc(c.try.tool)}">${XL.tool} ←</a></div>` : ""}</div>` : "";
  const cf = (c.confusions || []).map(x => tx(x)).filter(Boolean); const conf = cf.length ? `<h2 class="sec">${XL.conf}</h2><ul class="conf">${cf.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const srcs = srcIds.map((id, i) => { const s = D.sources[id]; if (!s) return ""; return `<li id="src-${i + 1}">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)}</a>` : esc(s.cite)} <small>(${T("tier")} ${fa(s.tier)})</small></li>`; }).join("");
  return `<article class="detail"><button class="back" data-back>${T("back")}</button>
   <div><div class="kick">${f ? esc(tx(f.title)) : ""}</div><h1>${esc(tx(c.title))}</h1>${L === "fa" && c.title.en ? `<div class="sub">${esc(c.title.en)}${c.title.nl && c.title.nl !== c.title.en ? ` · ${esc(c.title.nl)}` : ""}</div>` : ""}</div>
   <p class="lead">${esc(tx(c.summary))}</p>
   ${xp}${exs ? `<h2 class="sec">${XL.ex}</h2><div class="exs">${exs}</div>` : ""}${why}${tr}${conf}
   ${pts ? `<h2 class="sec">${T("points")}</h2><ol class="pts">${pts}</ol>` : ""}
   ${iran}
   ${links ? `<h2 class="sec">${T("links")}</h2><div class="links">${links}</div>` : ""}
   ${back ? `<h2 class="sec">${LB[0]}</h2><div class="rels">${back}</div>` : ""}
   ${same ? `<h2 class="sec">${LB[1]}</h2><div class="rels">${same}</div>` : ""}
   ${ppl ? `<h2 class="sec">${T("people")}</h2><div class="ppl">${ppl}</div>` : ""}
   ${srcs ? `<h2 class="sec">${T("sources")}</h2><ol class="src">${srcs}</ol>` : ""}
   <div class="status"><span class="draft">⚑ ${T(c.status)}</span>${c.origin ? `<span>${esc(c.origin)}</span>` : ""}</div></article>`;
}
function render(){
  const h = location.hash.slice(1); const c = h && BY[D.wiki + ":" + h];
  if (h && !c && D.renamed && D.renamed[h]) { location.replace("#" + D.renamed[h]); return; }
  if (h && !c && D.merged && D.merged[h]) { location.replace("../" + D.merged[h] + "/entries.html#" + h); return; }
  document.getElementById("main").innerHTML = c ? detail(c) : list();
  if (c) window.scrollTo({top: 0}); else { const i = document.getElementById("q"); if (i && q) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]"); if (g) { location.hash = g.dataset.go.split(":")[1]; return; }
  { const sl = ev.target.closest("[data-src]"); if (sl) { const t = document.getElementById("src-" + sl.dataset.src); if (t) { t.scrollIntoView({behavior: "smooth", block: "center"}); t.style.outline = "2px solid var(--primary)"; setTimeout(() => t.style.outline = "", 1600); } return; } }
  if (ev.target.closest("[data-back]")) { history.pushState(null, "", location.pathname); render(); return; }
  const f = ev.target.closest("[data-f]"); if (f) { fieldSel = f.dataset.f || null; render(); }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-go]")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input", ev => { if (ev.target.id === "q") { q = ev.target.value; render(); } });
window.addEventListener("hashchange", render);
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); const _wn = document.getElementById("wname"); if (_wn) _wn.textContent = tx(ROOT.title); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = (L === "fa" ? "همهٔ مدخل‌ها | ویکی " + tx(ROOT.title) + " | دانش‌سرا" : "All entries | " + tx(ROOT.title) + " | Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
</script>
