 علم داده [نیمه]: آمار رسمی قابل اعتماد، سرشماری تازه", "en": "آمار و علم داده: coverage status and use, as in the Persian text.", "nl": "آمار و علم داده: coverage status and use, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "انسان‌شناسی [نیمه]: اقوام، عشایر و فرهنگ‌های محلی", "en": "انسان‌شناسی: coverage status and use, as in the Persian text.", "nl": "انسان‌شناسی: coverage status and use, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "مدیریت و روان‌شناسی سازمانی [نیمه]: ساختن سازمان‌های تازه و شایسته‌سالاری", "en": "مدیریت و روان‌شناسی سازمانی: coverage status and use, as in the Persian text.", "nl": "مدیریت و روان‌شناسی سازمانی: coverage status and use, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "علم پیچیدگی [دارد]: چرا تغییرهای بزرگ ناگهانی رخ می‌دهند", "en": "علم پیچیدگی: coverage status and use, as in the Persian text.", "nl": "علم پیچیدگی: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "استدلال با مشابهت [دارد]: آموختن از گذار اسپانیا، لهستان، آفریقای جنوبی، شیلی؛ و درس منفی عراق و لیبی", "en": "استدلال با مشابهت: coverage status and use, as in the Persian text.", "nl": "استدلال با مشابهت: coverage status and use, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هنر و فرهنگ [نیمه]: حافظهٔ جمعی، یادبود، جشن", "en": "هنر و فرهنگ: coverage status and use, as in the Persian text.", "nl": "هنر و فرهنگ: coverage status and use, as in the Persian text."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:master-plan", "rel": "see-also", "note": {"fa": "نقشهٔ کلان", "en": "Master plan", "nl": "Master plan"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:characters-indie", "kind": "concept", "title": {"fa": "شخصیت‌های مستقل", "en": "Independent characters", "nl": "Independent characters"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "پنج شخصیتِ بیرون از دو جناح: ناظر، حسابِ پرسروصدا، صاحبِ زیرساخت، میانجی و قدرتِ خارجی؛ آن‌ها طولِ بازی را تعیین می‌کنند.", "en": "Five characters outside both factions: observer, noisy account, infrastructure owner, mediator and outside power; they set how long the game lasts.", "nl": "Five characters outside both factions: observer, noisy account, infrastructure owner, mediator and outside power; they set how long the game lasts."}, "points": [{"text": {"fa": "ناظر مستقل (فقط مستقل) — ناظر. مثالِ واقعی: سازمان حقوق بشری بین‌المللی · پیمایشگر مستقر در خارج · راستی‌آزمای رسانه‌ای · نهاد آماری بین‌المللی. ریشهٔ اسطوره‌ای: جامِ جم — آینه‌ای که همه‌چیز را نشان می‌دهد و در هیچ‌چیز دخالت نمی‌کند.", "en": "ناظر مستقل (I): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "ناظر مستقل (I): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "حساب پرسروصدا (فقط مستقل) — نوفه. مثالِ واقعی: اکانت‌های پرسروصدای هر دو جناح · هوادار افراطی که به پایگاه خودش ضربه می‌زند · کانال شایعه · بازار خرافه. ریشهٔ اسطوره‌ای: دیوِ پراکندگی — که کارش نه دروغ‌گفتن، که همه‌چیز گفتن است.", "en": "حساب پرسروصدا (I): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "حساب پرسروصدا (I): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "صاحب زیرساخت (مرکز — هر سه) — مالکِ جاده. مثالِ واقعی: اپراتور مخابرات و اینترنت · مالک پلتفرم و درگاه پرداخت · بازار ارز و طلا · زیرساخت حمل‌ونقل و انبار. ریشهٔ اسطوره‌ای: صاحب زیرساختانِ راه ابریشم — که نه سپاه داشتند نه تاج، اما هیچ‌چیز بی‌اجازهٔ آن‌ها جابه‌جا نمی‌شد.", "en": "صاحب زیرساخت (MCI): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "صاحب زیرساخت (MCI): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "میانجی (مرکز — هر سه) — واسطهٔ حرفه‌ای. مثالِ واقعی: واسطهٔ سیاسی حرفه‌ای · نهاد بین‌المللی میانجی · دولت ثالث · چهرهٔ موردقبولِ هر دو طرف. ریشهٔ اسطوره‌ای: داورانِ دو لشکر — که همیشه وسط می‌ایستادند و همیشه از هر دو طرف چیزی می‌گرفتند.", "en": "میانجی (MCI): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "میانجی (MCI): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "قدرت خارجی (فقط مستقل) — قدرتِ بیرونی. مثالِ واقعی: دولت بزرگ خارجی · شرکت جهانی و پلتفرم · قدرت منطقه‌ای با منافع معارض · سرویس امنیتی خارجی. ریشهٔ اسطوره‌ای: افراسیاب از آن سوی جیحون — قدرتی که همیشه هست و هیچ‌وقت مالِ اینجا نیست.", "en": "قدرت خارجی (I): archetype of the table. Real-world examples and myth root as in the Persian text.", "nl": "قدرت خارجی (I): archetype of the table. Real-world examples and myth root as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:roles-independent", "rel": "see-also", "note": {"fa": "نقش‌های اجتماعیِ مستقل‌ها", "en": "Independent social roles", "nl": "Independent social roles"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:claims-resistance", "kind": "concept", "title": {"fa": "ادعاهای مقاومت مدنی و گذار", "en": "Claims: civil resistance and transition", "nl": "Claims: civil resistance and transition"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "16 ادعای منبع‌دار از مجموعهٔ ۸۴ادعایی، هر کدام با مقدار، دوره، ردهٔ اعتبار (۱ داده/سند، ۲ پژوهش، ۳ برآورد یا مدل) و شرطی که آن را باطل می‌کند. ادعایی که نتواند بگوید چه چیز ردش می‌کند ادعا نیست.", "en": "16 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it.", "nl": "16 sourced claims of the 84-claim set, each with value, period, tier (1 data/document, 2 research, 3 estimate or model) and the condition that would refute it."}, "points": [{"text": {"fa": "در ۳۲۳ خیزشِ ثبت‌شدهٔ ۱۹۰۰–۲۰۰۶، خیزش‌های خشونت‌پرهیز ۵۳٪ و خیزش‌های مسلحانه ۲۶٪ به هدفِ اعلام‌شده‌شان رسیدند. (۵۳٪ در برابر ۲۶٪؛ ۱۹۰۰–۲۰۰۶؛ ردهٔ 1؛ اندازه‌گیری). شرطِ ابطال: بازتحلیلِ NAVCO با تعریفِ دیگری از «موفقیت»، یا افزودنِ خیزش‌های پس از ۲۰۰۶، که نسبت را برگرداند.", "en": "Claim navco-success: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim navco-success: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "هیچ خیزشی که ۳٫۵٪ جمعیت را به‌طور فعال و پیوسته به میدان آورده باشد در دادهٔ ثبت‌شده شکست نخورده — ولی این یک مشاهدهٔ آماری است، نه قانون. (۳٫۵٪؛ ۱۹۰۰–۲۰۰۶؛ ردهٔ 1؛ اندازه‌گیری). شرطِ ابطال: یک خیزشِ مستند با مشارکتِ فعالِ بالای ۳٫۵٪ که به هدفش نرسیده باشد. خودِ چنووث می‌گوید سازمان‌یافتگی و تداوم دستِ‌کم به‌اندازهٔ تعداد مهم‌اند. (محلِ نزاع)", "en": "Claim rule-35: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim rule-35: value, period, tier 1 and falsifier as in the Persian text."}, "sources": ["src:040033aaf5"], "flags": ["editor-note"]}, {"text": {"fa": "همان قاعده یعنی در آن خیزش‌های موفق، ۹۶٫۵٪ جمعیت شرکت نکردند. (۹۶٫۵٪؛ ۱۹۰۰–۲۰۰۶؛ ردهٔ 1؛ محاسبهٔ مستقیم). شرطِ ابطال: مستقل نیست: حسابِ صرف روی سطرِ rule-35 است. اگر برآوردی معتبر نشان دهد اوجِ مشارکت در خیزش‌های موفق معمولاً بسیار بالاتر از ۳٫۵٪ بوده، سهمِ «شرکت‌نکرده» کوچک‌تر و این سطر رد می‌شود. منبع: مدلِ خودِ پروژه، نه یافتهٔ بیرونی.", "en": "Claim rule-35-inverse: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim rule-35-inverse: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "لحظهٔ تعیین‌کنندهٔ خیزش‌ها، لحظهٔ ریزشِ نیروهای امنیتی است؛ پیوندهای خانوادگی و محلی میانِ معترضان و نیروها یکی از سازوکارهای اصلیِ آن است. (کیفی؛ —؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: مجموعه‌ای از خیزش‌های موفق بدونِ ریزشِ معنادارِ نیروهای امنیتی.", "en": "Claim defection: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim defection: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "نرخِ موفقیتِ خیزش‌ها — از هر نوع — در دههٔ اخیر افت کرده، چون حکومت‌ها یاد گرفته‌اند. (روندِ نزولی؛ ≈۲۰۱۰ به بعد؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: نسخهٔ تازهٔ NAVCO یا دادهٔ هم‌ارز که نرخِ موفقیتِ کارزارهای پس از ۲۰۱۰ را برابر یا بالاتر از دهه‌های ۱۹۹۰ و ۲۰۰۰ نشان دهد.", "en": "Claim success-declining: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim success-declining: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:040033aaf5"], "flags": []}, {"text": {"fa": "مردم ترجیحِ واقعیِ خود را پنهان می‌کنند تا لحظه‌ای که آبشارِ اطلاعاتی بشکند؛ در ۵۷ هم تا هفته‌های آخر خودِ شرکت‌کننده‌ها فکر نمی‌کردند ممکن باشد. (کیفی؛ ۱۹۸۹ · ۱۳۵۷؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: شواهدی که نشان دهد پیش از ۵۷ نظرِ عمومی به‌درستی قابلِ اندازه‌گیری و پیش‌بینی بود.", "en": "Claim preference-falsification: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim preference-falsification: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:436510de26", "src:435917f7dd"], "flags": []}, {"text": {"fa": "ضربهٔ نهاییِ ۵۷ را اعتصابِ کارگرانِ نفت در پاییزِ ۱۳۵۷ زد — که شبکه‌های کارگری و چپ سازمانش دادند، نه مسجد. (کیفی؛ پاییز ۱۳۵۷؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: سندی که نشان دهد هماهنگیِ اعتصابِ نفت از شبکهٔ مسجد آمد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim oil-strike-57: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim oil-strike-57: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اعتصاب‌های کامیون‌دارانِ ۱۳۹۷ و ۱۳۹۸ از مؤثرترین حرکت‌های دههٔ اخیر بودند، به یک دلیلِ ساختاری: پخش‌بودن. (کیفی؛ ۱۳۹۷–۱۳۹۸؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: ارزیابی‌ای که اثرِ اقتصادیِ آن اعتصاب‌ها را ناچیز نشان دهد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim truckers: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim truckers: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "یکی از ماندگارترین تغییراتِ ۱۴۰۱، جابه‌جاییِ قدرتِ چانه‌زنی داخلِ خودِ خانه بود — نه در خیابان. (کیفی؛ ۱۴۰۱؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: پیمایشی که نشان دهد ساختارِ قدرت در خانواده‌ها پس از ۱۴۰۱ تغییرِ معناداری نکرد.", "en": "Claim home-bargaining: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim home-bargaining: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:f1a8df8bf8"], "flags": []}, {"text": {"fa": "فاصلهٔ میانِ موج‌های اعتراضی کوتاه‌تر شده: از مشروطه تا ۵۷ هفتاد و دو سال؛ از ۹۶ تا امروز چهار موج در هشت سال. (۷۲ سال ← ۸ سال؛ ۱۲۸۵–۱۴۰۵؛ ردهٔ 1؛ گاه‌شمار). شرطِ ابطال: تعریفِ دیگری از «موج» که فاصله‌ها را یکنواخت کند. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim wave-interval: value, period, tier 1 and falsifier as in the Persian text.", "nl": "Claim wave-interval: value, period, tier 1 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جنبشِ دانشجویی به‌تنهایی هرگز در ایران حکومتی را عوض نکرده؛ ۷۸ و ۸۸ و ۱۴۰۱ همه شروعِ درخشان داشتند و به‌تنهایی ماندند. (کیفی؛ ۱۳۷۸ · ۱۳۸۸ · ۱۴۰۱؛ ردهٔ 2؛ گاه‌شمار). شرطِ ابطال: موردی که در آن اعتراضِ دانشجویی به‌تنهایی تغییرِ حکومتی آورده باشد. (محلِ نزاع) ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim student-movement: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim student-movement: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "در مشروطه و در ۵۷، بستنِ بازار یکی از دو سه اهرمی بود که واقعاً کار کرد. (کیفی؛ ۱۲۸۵ · ۱۳۵۷؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: تحلیلی که سهمِ بازار در آن دو رویداد را حاشیه‌ای نشان دهد. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim bazaar-lever: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim bazaar-lever: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دموکراسی‌هایی که از بسیجِ طولانی و سازمان‌یافتهٔ مردمی بیرون آمده‌اند بیشتر دوام آورده‌اند تا آن‌هایی که در سکون متولد شدند: در تحلیلِ بقای ۱۱۲ دموکراسیِ تازه در ۸۰ کشور، هرچه بسیج طولانی‌تر، احتمالِ ماندنِ دموکراسی بیشتر. (۱۱۲ دموکراسی · ۸۰ کشور؛ نیم‌قرنِ اخیر؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: بازتحلیلی با دادهٔ گسترده‌تر که نشان دهد طولِ بسیج پیش از گذار با دوامِ دموکراسیِ بعدی رابطه‌ای ندارد یا رابطه‌اش منفی است. یادداشت: سازوکاری که کدیور نشان می‌دهد «ساختارِ سازمانی» است: کادرِ رهبری، پیوند با جامعه، و مهارِ دولتِ پس از گذار. کارتِ «تنگ‌دست» آن را به «شبکهٔ روزمرهٔ کمکِ متقابل» تعمیم داده که نزدیک است ولی همان نیست. اینکه شوراهای صنفیِ معلمان «پیوسته‌ترین تشکل»اند هنوز سطرِ جدا ندارد.", "en": "Claim kadivar-durability: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim kadivar-durability: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:24d305d03c", "src:f1a8df8bf8"], "flags": []}, {"text": {"fa": "«عدمِ همکاریِ اداری» در فهرستِ ۱۹۸ روشِ جین شارپ یک خانوادهٔ کامل است: امتناعِ گزینشی از کمک، بستنِ مسیرِ فرمان و اطلاعات، کُندکاری و ممانعت، عدمِ همکاریِ اداریِ عمومی، و ناکارآمدیِ عمدی. (روش‌های ۱۴۲–۱۴۷؛ فهرستِ ۱۹۷۳؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: برای خودِ فهرست: متنِ شارپ. برای ادعای کارت: شواهدی که نشان دهد کارمندانی که این روش‌ها را به کار برده‌اند به همان شدتِ معترضانِ خیابانی مجازات شده‌اند. یادداشت: شارپ فهرست و نمونهٔ تاریخی می‌دهد، نه اندازه‌گیریِ خطر. اینکه این روش‌ها «تقریباً غیرقابلِ‌مجازات»اند برداشتِ کارت است و هنوز شاهدِ مستقل ندارد.", "en": "Claim admin-noncooperation: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim admin-noncooperation: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:d61b063a10"], "flags": []}, {"text": {"fa": "برای هماهنگی، دانستن کافی نیست؛ «دانشِ مشترک» لازم است — هر کس باید بداند که بقیه هم می‌دانند. آیین‌ها، مراسم و رویدادهای همگانی ابزارهای ساختنِ همین دانش‌اند. (کیفی؛ —؛ ردهٔ 2؛ چارچوبِ نظری). شرطِ ابطال: شواهدِ تجربی که نشان دهد مشارکت در کنشِ جمعی به دانستنِ «اینکه دیگران هم می‌دانند» حساس نیست. یادداشت: اینکه یک ترانه «از یک بیانیه خطرناک‌تر است» برداشتِ کارت است؛ چوی سازوکار را توضیح می‌دهد، نه این مقایسه را. ارجاعِ این ادعا به «گزارشِ مبنای پروژه» (تحلیلِ مدوّنِ داخلی) است، نه به یک منبعِ مستقلِ منتشرشده؛ ردهٔ آن به همین دلیل پایین‌تر از دادهٔ اولیه است.", "en": "Claim common-knowledge: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim common-knowledge: value, period, tier 2 and falsifier as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "در دادهٔ چنووث و استفان، حمایتِ دولتِ خارجی با موفقیتِ شورش‌های مسلحانه همبسته است، نه با موفقیتِ خیزش‌های خشونت‌پرهیز؛ مطالعهٔ بعدیِ همان دو شاهدی نیافت که حمایتِ بیرونی برای پیروزیِ کارزارِ خشونت‌پرهیز لازم یا کافی باشد. (کیفی؛ ۱۹۰۰–۲۰۰۶؛ ردهٔ 2؛ پژوهش). شرطِ ابطال: بازتحلیلی که نشان دهد حمایتِ بیرونی احتمالِ موفقیتِ کارزارهای خشونت‌پرهیز را به‌طورِ معنادار بالا می‌برد. یادداشت: این پژوهش دربارهٔ حمایتِ دولت‌هاست، نه دیاسپورا. اینکه دیاسپورا در مستندسازی، کمک به خانوادهٔ زندانی و زیرساختِ فنی مؤثرتر است، توصیهٔ کارت است و هنوز سطرِ جدا ندارد.", "en": "Claim external-support: value, period, tier 2 and falsifier as in the Persian text.", "nl": "Claim external-support: value, period, tier 2 and falsifier as in the Persian text."}, "sources": ["src:41c1e6a2e7"], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "جدولِ ۸۴ ادعا (ابزار)", "en": "84-claim table (tool)", "nl": "84-claim table (tool)"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزیِ ضعف‌ها", "en": "Audit of weaknesses", "nl": "Audit of weaknesses"}}, {"to": "simorgh:inspect-claim", "rel": "see-also", "note": {"fa": "وارسیِ یک ادعا", "en": "Inspect a claim", "nl": "Inspect a claim"}}], "people": [], "sources": ["src:040033aaf5", "src:24d305d03c", "src:41c1e6a2e7", "src:435917f7dd", "src:436510de26", "src:d61b063a10", "src:f1a8df8bf8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:game-reality-map", "kind": "concept", "title": {"fa": "جدولِ تطبیق: هر سازوکارِ بازی در واقعیت چیست و کجا می‌شکند", "en": "Game-to-reality map: what each mechanic is in reality and where it breaks", "nl": "Game-to-reality map: what each mechanic is in reality and where it breaks"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "بازی فقط وقتی ابزارِ فهم است که بدانیم هر قاعده‌اش به چه سازوکارِ واقعی اشاره دارد و کجا دیگر شبیه نیست. این مدخل هر سازوکار را با معادلِ واقعی، شاهدِ پژوهشی و نقطهٔ شکستِ استعاره کنارِ هم می‌گذارد.", "en": "The game is a tool for understanding only if we know which real mechanism each rule points to and where the resemblance stops. Each mechanic here sits beside its real equivalent, research evidence and the point where the metaphor breaks.", "nl": "The game is a tool for understanding only if we know which real mechanism each rule points to and where the resemblance stops. Each mechanic here sits beside its real equivalent, research evidence and the point where the metaphor breaks."}, "points": [{"text": {"fa": "مافیا هم را می‌شناسد، شهر نه ← دانشِ مشترک و هزینهٔ هماهنگی. حاکمیت شبکه، رسانه و زنجیرهٔ فرمان دارد؛ شهروندان نمی‌دانند دیگران چه فکر می‌کنند. شکستِ استعاره: «مافیا» یک تیمِ یکپارچه نیست، ائتلافی است با جناح‌های رقیب که بر سرِ جانشینی و منابع می‌جنگند.", "en": "The Mafia knows each other, the city does not: common knowledge and coordination cost. Break: the \"Mafia\" is a coalition of rival factions, not a single team.", "nl": "The Mafia knows each other, the city does not: common knowledge and coordination cost. Break: the \"Mafia\" is a coalition of rival factions, not a single team."}, "sources": ["src:d3fc1f88d0", "src:436510de26"], "flags": []}, {"text": {"fa": "شب (حرکتِ پنهان) ← سرکوب، بازداشت، پرونده‌سازی، قطعِ اینترنت و خریدنِ وفاداری. شکست: در واقعیت «شب» تمام‌وقت است و سرکوبِ دیجیتال حالا ارزان‌تر از هر زمانی است.", "en": "Night: repression, arrests, cases, internet shutdowns and bought loyalty. Break: in reality \"night\" is constant and digital repression is cheaper than ever.", "nl": "Night: repression, arrests, cases, internet shutdowns and bought loyalty. Break: in reality \"night\" is constant and digital repression is cheaper than ever."}, "sources": ["src:4d809f4a2a"], "flags": []}, {"text": {"fa": "روز (گفت‌وگو و رأی) ← آن لحظه‌هایی که مردم می‌توانند علنی ببینند چند نفرند: خیابان، اعتصاب، عدد پیمایش. شکست: رأیِ شهر در بازی شمرده می‌شود؛ در واقعیت هیچ صندوقِ معتبری نیست و «شمارش» باید با نهادِ دادهٔ مستقل ساخته شود.", "en": "Day: the moments when people can openly see how many they are. Break: in the game the city's vote is counted; in reality there is no credible ballot box, so counting must be built by an independent data body.", "nl": "Day: the moments when people can openly see how many they are. Break: in the game the city's vote is counted; in reality there is no credible ballot box, so counting must be built by an independent data body."}, "sources": ["src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "حذفِ بازیکن ← پس‌گرفتنِ همکاری «ستون‌های پشتیبانی» (نیروی امنیتی، کارمند، بازار، روحانیت، رسانه، بازیگرِ خارجی). شکست: ستون‌ها حذف نمی‌شوند، می‌چرخند؛ و هر ستون‌ای که بچرخد باید در فردا جا داشته باشد.", "en": "Elimination: withdrawing cooperation of the pillars of support. Break: pillars do not disappear, they shift, and each must have a place tomorrow.", "nl": "Elimination: withdrawing cooperation of the pillars of support. Break: pillars do not disappear, they shift, and each must have a place tomorrow."}, "sources": ["src:458bea7f0f", "src:9ce61897e7"], "flags": []}, {"text": {"fa": "مستقل‌ها طولِ بازی را تعیین می‌کنند ← صاحبانِ زیرساخت، میانجی‌ها و قدرت‌های خارجی. شکست: قدرتِ خارجی در واقعیت می‌تواند کلِ میز را بزند (جنگِ ۱۴۰۴–۱۴۰۵)، اما پژوهش می‌گوید تغییرِ نظامی که از بیرون تحمیل شود به‌ندرت به دموکراسی می‌رسد.", "en": "Independents set the length: infrastructure owners, mediators, outside powers. Break: an outside power can strike the whole table (the 2025-26 war), but research says foreign-imposed regime change rarely leads to democracy.", "nl": "Independents set the length: infrastructure owners, mediators, outside powers. Break: an outside power can strike the whole table (the 2025-26 war), but research says foreign-imposed regime change rarely leads to democracy."}, "sources": ["src:5077e79964"], "flags": []}, {"text": {"fa": "ریختنِ ناگهانیِ میز ← آبشارِ ترجیح: وقتی هر کس ببیند به اندازهٔ کافی دیگران هم آمده‌اند. شکست: بازی آستانه را می‌داند؛ در واقعیت آستانه دیده نمی‌شود و فقط بعد از رخ دادن معلوم است.", "en": "Sudden collapse: preference cascade. Break: in the game the threshold is known; in reality it is invisible until after the fact.", "nl": "Sudden collapse: preference cascade. Break: in the game the threshold is known; in reality it is invisible until after the fact."}, "sources": ["src:436510de26"], "flags": []}, {"text": {"fa": "در بازی کسی از میز بلند نمی‌شود ← اما در واقعیت «خروج» (مهاجرت) بزرگ‌ترین حرکتِ پنهان است: هر کسی که می‌رود از شهر کم می‌شود و فشار برای صدا کم می‌شود. این سازوکار در نسخهٔ اول نبود و حالا در قواعدِ نسخهٔ ۲ اضافه شد.", "en": "In the game nobody leaves the table; in reality exit (emigration) is the largest hidden move. It was missing in version 1 and is now in rules v2.", "nl": "In the game nobody leaves the table; in reality exit (emigration) is the largest hidden move. It was missing in version 1 and is now in rules v2."}, "sources": ["src:6ec0c8ba1e"], "flags": []}, {"text": {"fa": "هر بازیکن یک نقش دارد ← در واقعیت هر آدم چند نقش دارد (کارمندِ دولت، پدرِ دانشجو، عضوِ هیئت) و نقش‌ها با زمان عوض می‌شوند. برای همین بازی هیچ‌وقت برای برچسب‌زدن به آدمِ واقعی به کار نمی‌رود: نقش جایگاه است، نه هویت.", "en": "Each player has one role; in reality each person has several roles that change over time. So the game is never used to label real people: a role is a position, not an identity.", "nl": "Each player has one role; in reality each person has several roles that change over time. So the game is never used to label real people: a role is a position, not an identity."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "simorgh:metaphor", "rel": "see-also", "note": {"fa": "استعارهٔ میز", "en": "Table metaphor", "nl": "Table metaphor"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌های پشتیبانی", "en": "Pillars of support", "nl": "Pillars of support"}}, {"to": "simorgh:exit-voice", "rel": "see-also", "note": {"fa": "خروج، صدا، وفاداری", "en": "Exit, voice, loyalty", "nl": "Exit, voice, loyalty"}}, {"to": "simorgh:game-rules-v2", "rel": "see-also", "note": {"fa": "قواعد نسخهٔ ۲", "en": "Rules v2", "nl": "Rules v2"}}, {"to": "soc:consent-theory-of-power", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:digital-repression", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:foreign-imposed-regime-change", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:exit-voice-loyalty", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:436510de26", "src:458bea7f0f", "src:4d809f4a2a", "src:5077e79964", "src:6c0a6f1ef3", "src:6ec0c8ba1e", "src:9ce61897e7", "src:d3fc1f88d0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:ten-turn-game", "kind": "concept", "title": {"fa": "بازیِ ده‌نوبتی و حدسِ گذارها", "en": "The ten-turn game and the transitions guess", "nl": "The ten-turn game and the transitions guess"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "دو بازیِ کوچک که می‌شود امتحان کرد: یک بازیِ ده‌نوبتیِ آستانه، و ابزاری که از تو می‌خواهد پانزده گذارِ جهانی را حدس بزنی تا ببینی شهودت با تاریخ کجا جور نیست.", "en": "Two small games to try: a ten-turn threshold game, and a tool that makes you guess fifteen world transitions to see where your intuition and history part.", "nl": "Two small games to try: a ten-turn threshold game, and a tool that makes you guess fifteen world transitions to see where your intuition and history part."}, "points": [{"text": {"fa": "بازیِ ده‌نوبتی (sim): هر نوبت یک تصمیم دربارهٔ هماهنگی و هزینه؛ هدفش حس‌کردنِ منطقِ آستانه است، نه پیش‌بینی.", "en": "The ten-turn game: each turn a decision about coordination and cost; it is to feel the threshold logic, not to predict.", "nl": "The ten-turn game: each turn a decision about coordination and cost; it is to feel the threshold logic, not to predict."}, "sources": [], "flags": []}, {"text": {"fa": "پانزده گذار (transitions): حدس بزن و ببین؛ مناسبِ یک شبِ دورهمی و میزِ دایره‌ای.", "en": "Fifteen transitions: guess and see; suited to an evening gathering and the circle table.", "nl": "Fifteen transitions: guess and see; suited to an evening gathering and the circle table."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:threshold-simulator", "rel": "see-also", "note": {"fa": "شبیه‌ساز آستانه", "en": "Threshold simulator", "nl": "Threshold simulator"}}, {"to": "simorgh:circle-table", "rel": "see-also", "note": {"fa": "میزِ دایره‌ای", "en": "Circle table", "nl": "Circle table"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:page-map", "kind": "concept", "title": {"fa": "نقشهٔ صفحه‌ها: هر صفحهٔ قدیمی کجا رفت", "en": "Page map: where each old page went", "nl": "Page map: where each old page went"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "پاسخ به «صفحه‌ها قاطی‌پاتی است»: هر صفحه و زیرصفحه یک مدخلِ مشخص در این ویکی دارد و ابزارها سر جایشان مانده‌اند. صفحهٔ قدیمی مرجعِ ابزار است و این ویکی مرجعِ محتوا.", "en": "The answer to \"the pages are a mess\": every page and sub-page has a specific entry in this wiki and the tools stayed where they are. The old page is the tool; this wiki is the content.", "nl": "The answer to \"the pages are a mess\": every page and sub-page has a specific entry in this wiki and the tools stayed where they are. The old page is the tool; this wiki is the content."}, "points": [{"text": {"fa": "صفحهٔ اصلی (index) و صفحهٔ بازی (game، ۱۲ جلد: قواعد، هفت شب، نقشهٔ میز، کتابِ شخصیت‌ها، ده نقشِ نساخته، پَر، سه راه، هزینه، کمیک، میزِ نقد، سی مرغ) ← بازی و استعاره: استعاره، هفت شب، سه پَر، شخصیت‌ها (سه مدخل)، ده نقشِ نساخته؛ و راهبرد: سه راه، گذارِ میثاقی، هزینه، میزِ نقد.", "en": "Index and game pages map to the game and strategy entries.", "nl": "Index and game pages map to the game and strategy entries."}, "sources": [], "flags": []}, {"text": {"fa": "نقش‌ها (roles) و چرا؟ (why) ← سه مدخلِ ۴۷ نقش؛ صفحه‌های nights، players و rules (نسخه‌های خالیِ جا‌ماندهٔ قدیمی) ← در «هفت شب» و «شخصیت‌ها» ادغام شدند و می‌توان حذفشان کرد.", "en": "Roles and why map to the three 47-role entries; the empty nights, players and rules stubs merged into Seven nights and Characters and can be removed.", "nl": "Roles and why map to the three 47-role entries; the empty nights, players and rules stubs merged into Seven nights and Characters and can be removed."}, "sources": [], "flags": []}, {"text": {"fa": "data، health، status، audit، argmap، inspect، timeline، library ← بخشِ شواهد: دیتاست، ادعاها به تفکیکِ موضوع، ممیزی، سلامت، نقشهٔ استدلال، وارسی، خطِ زمان، شش مدخلِ کتابخانه.", "en": "Evidence pages map to the evidence entries.", "nl": "Evidence pages map to the evidence entries."}, "sources": [], "flags": []}, {"text": {"fa": "two-irans، shared، timeline ← تاریخ: دو ایران، هشت پله، دفترِ مناقشه‌ها، ایران و اسرائیل.", "en": "History pages map to the history entries.", "nl": "History pages map to the history entries."}, "sources": [], "flags": []}, {"text": {"fa": "sanad-rahbordi، eraee-rahbordi، europe، downloads، QA فایل‌ها ← راهبرد: سندِ راهبردی، ارائهٔ اروپا و فایل‌ها.", "en": "Strategy pages map to the strategy entries.", "nl": "Strategy pages map to the strategy entries."}, "sources": [], "flags": []}, {"text": {"fa": "gam (قدمِ تو)، birds، plan.me، transitions-risks ← عمل: قدمِ تو، سی مرغ (شش مدخل)، بیست گروه، پانزده خطر، روز آزادی، سهمِ من.", "en": "Action pages map to the action entries.", "nl": "Action pages map to the action entries."}, "sources": [], "flags": []}, {"text": {"fa": "plan، circle، sim، transitions، problems، map ← پروژه: نقشهٔ کلان، علم‌ها، دفترِ ویرانی‌ها، محصولات، میزِ دایره‌ای، نقشهٔ مشکل‌ها، ابزارها، فهرستِ کارهای مانده.", "en": "Project pages map to the project entries.", "nl": "Project pages map to the project entries."}, "sources": [], "flags": []}, {"text": {"fa": "صفحهٔ story (کارگاهِ نوشتنِ یک متنِ شخصی) بخشی از ادعاها یا بازی نیست و محتوایش در این ویکی نیامده؛ فقط وجودش ثبت شده است.", "en": "The story page (a personal writing workshop) is not part of the claims or the game and its content is deliberately not reproduced here; only its existence is noted.", "nl": "The story page (a personal writing workshop) is not part of the claims or the game and its content is deliberately not reproduced here; only its existence is noted."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "مدخل‌های تازهٔ بازبینی (آبان ۱۴۰۵) که صفحهٔ قدیمی نداشتند: جدولِ تطبیقِ بازی و واقعیت، خروج و صدا، قواعدِ بازیِ نسخهٔ ۲، وضعیتِ امروز، چرا ۱۴ میلیون کافی نبود، ستون‌های پشتیبانی، پیش‌مرگ، نشانگرهای آستانه، و اول ایمنی.", "en": "New entries from the November 2026 review with no old page.", "nl": "New entries from the November 2026 review with no old page."}, "sources": [], "flags": []}, {"text": {"fa": "پیشنهادِ مرتب‌سازی (انجام نشده، فقط پیشنهاد): صفحهٔ عمومی به چهار ورودی کاهش یابد (بازی، شواهد، قدمِ تو، دانلود) و بقیه از زیرِ همین‌ها به ابزارها پیوند بخورند؛ نسخه‌های خالیِ nights، players و rules حذف شوند.", "en": "Tidy-up proposal (not done, only suggested): reduce the public entrance to four doors and link the rest as tools beneath them; remove the empty stubs.", "nl": "Tidy-up proposal (not done, only suggested): reduce the public entrance to four doors and link the rest as tools beneath them; remove the empty stubs."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "جداسازیِ لایه‌ها (۲۴ آبان ۱۴۰۵): روایت‌های تاریخی به ویکی تاریخ رفتند (بخشِ تازهٔ «از صفویه تا قاجار»، ایران و یهودیان، و درس‌های ۱۳۵۷ در مدخلِ انقلاب)؛ نظریه‌های عمومی به ویکی جامعه‌شناسی (خروج و صدا، تغییرِ تحمیل‌شده از بیرون، سرکوبِ دیجیتال، و افزوده به نظریهٔ رضایت و عدالتِ انتقالی)؛ عددهای تاریخ‌دار به لایهٔ ایران. سیمرغ فقط بازی، راهبرد، عمل و خودِ پروژه را نگه می‌دارد و به آن‌ها پیوند می‌دهد.", "en": "Layer separation (15 November 2026): history to the history wiki, general theory to the sociology wiki, dated numbers to the Iran layer; Simorgh keeps game, strategy, action and project and links out.", "nl": "Layer separation (15 November 2026): history to the history wiki, general theory to the sociology wiki, dated numbers to the Iran layer; Simorgh keeps game, strategy, action and project and links out."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:tools-directory", "rel": "see-also", "note": {"fa": "فهرستِ ابزارها", "en": "Tools directory", "nl": "Tools directory"}}, {"to": "simorgh:backlog", "rel": "see-also", "note": {"fa": "کارهای مانده", "en": "Backlog", "nl": "Backlog"}}, {"to": "simorgh:game-reality-map", "rel": "see-also", "note": {"fa": "جدولِ تطبیق", "en": "Game-to-reality map", "nl": "Game-to-reality map"}}, {"to": "simorgh:pre-mortem", "rel": "see-also", "note": {"fa": "پیش‌مرگ", "en": "Pre-mortem", "nl": "Pre-mortem"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:why-not-january", "kind": "concept", "title": {"fa": "چرا ۱۴ میلیون نفر در خیابان کافی نبود", "en": "Why 14 million in the streets was not enough", "nl": "Why 14 million in the streets was not enough"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "در دی ۱۴۰۴ اگر عددِ پیمایش درست باشد، چند برابرِ «۳٫۵ درصد» به خیابان آمدند، و نظام نیفتاد. این مهم‌ترین آزمونِ واقعیِ منطقِ بازی است: کدام پَر سوخت و کدام نسوخت؟ این مدخل یک تحلیل است، نه حکم.", "en": "In January 2026, if the survey is right, several times \"3.5 percent\" took to the streets, and the regime did not fall. This is the most important real test of the game's logic: which feather burned and which did not? This entry is an analysis, not a verdict.", "nl": "In January 2026, if the survey is right, several times \"3.5 percent\" took to the streets, and the regime did not fall. This is the most important real test of the game's logic: which feather burned and which did not? This entry is an analysis, not a verdict."}, "points": [{"text": {"fa": "عدد: حدود ۲۵٪ پاسخ‌دهندگانِ گمان (نزدیک به ۱۴ میلیون) مشارکت را گزارش کردند؛ ۳٫۵٪ جمعیت حدود ۳ میلیون است. گمان خودش می‌گوید مشارکت ممکن است فعالیت‌های متفاوت در چند روز را بپوشاند و ۲۵٪ پاسخ نداده‌اند.", "en": "The number: about 25 percent of GAMAAN respondents (about 14 million) reported taking part; 3.5 percent of the population is about 3 million. GAMAAN itself notes participation may cover varied activity over several days and 25 percent declined to answer.", "nl": "The number: about 25 percent of GAMAAN respondents (about 14 million) reported taking part; 3.5 percent of the population is about 3 million. GAMAAN itself notes participation may cover varied activity over several days and 25 percent declined to answer."}, "sources": ["src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "از گزارشِ کاملِ گمان: ۵۵٪ شرکت‌کنندگان فراخوانِ رضا پهلوی و ۱۹٪ همبستگی با بازاریان را در تصمیمشان مؤثر دانستند؛ پس نقطهٔ کانونیِ زمانی و شروعِ صنفی هر دو وجود داشت. قطعیِ ۸۸روزهٔ اینترنت (به گفتهٔ گزارش، طولانی‌ترین قطعیِ سراسریِ ثبت‌شده) نشان می‌دهد چرا هماهنگیِ بعد از روزِ اول شکست: نشانه‌ای که فقط آنلاین زندگی می‌کند، با کلیدِ قطع خاموش می‌شود.", "en": "From the full GAMAAN report: 55 percent of participants named Reza Pahlavi's call and 19 percent solidarity with bazaaris as influential; so a timing focal point and a trade-based start both existed. The 88-day internet shutdown shows why coordination after day one failed: a signal that lives only online is switched off with a key.", "nl": "From the full GAMAAN report: 55 percent of participants named Reza Pahlavi's call and 19 percent solidarity with bazaaris as influential; so a timing focal point and a trade-based start both existed. The 88-day internet shutdown shows why coordination after day one failed: a signal that lives only online is switched off with a key."}, "sources": ["src:6c0a6f1ef3", "src:4d809f4a2a"], "flags": ["editor-note"]}, {"text": {"fa": "درسِ اول: «قاعدهٔ ۳٫۵ درصد» یک مشاهدهٔ تاریخی است، نه قانون؛ و خودِ چنووث می‌گوید نرخِ موفقیت در دههٔ اخیر افت کرده، چون حکومت‌ها یاد گرفته‌اند (قطعِ اینترنت، نظارتِ دیجیتال، خسته‌کردن). یعنی تعداد شرطِ لازم است، نه کافی.", "en": "Lesson one: the 3.5 percent rule is a historical observation, not a law; Chenoweth herself says success rates have fallen as regimes learned. Numbers are necessary, not sufficient.", "nl": "Lesson one: the 3.5 percent rule is a historical observation, not a law; Chenoweth herself says success rates have fallen as regimes learned. Numbers are necessary, not sufficient."}, "sources": ["src:040033aaf5", "src:4d809f4a2a"], "flags": []}, {"text": {"fa": "درسِ دوم، در زبانِ بازی: پَرِ یکم (ترسِ خصوصی) تا حدِ زیادی سوخت؛ مردم دیدند چند نفرند. اما پَرِ دوم (صندوق و اعتصابِ پایدار) و پَرِ سوم (متنِ ضمانت برای جزءِ دوم و سومِ حاکمیت) نسوختند. آستانه یک هم‌زمانی است، و هم‌زمانی رخ نداد.", "en": "Lesson two, in game terms: feather one largely burned; people saw how many they were. But feather two (fund and sustained strike) and feather three (a guarantee text for the second and third tier) did not. The threshold is a simultaneity, and it did not happen.", "nl": "Lesson two, in game terms: feather one largely burned; people saw how many they were. But feather two (fund and sustained strike) and feather three (a guarantee text for the second and third tier) did not. The threshold is a simultaneity, and it did not happen."}, "sources": [], "flags": []}, {"text": {"fa": "درسِ سوم: لحظهٔ تعیین‌کننده لحظهٔ ریزشِ نیروهای نگه‌دارنده است، و ریزشِ گسترده گزارش نشد. پژوهش می‌گوید ریزش وقتی رخ می‌دهد که نیروها آینده‌شان را امن ببینند و حرکت خشونت‌پرهیز و گسترده بماند.", "en": "Lesson three: the decisive moment is defection of the supporting forces, and broad defection was not reported. Research says defection happens when forces see a safe future and the movement stays nonviolent and broad.", "nl": "Lesson three: the decisive moment is defection of the supporting forces, and broad defection was not reported. Research says defection happens when forces see a safe future and the movement stays nonviolent and broad."}, "sources": ["src:9ce61897e7", "src:41c1e6a2e7"], "flags": []}, {"text": {"fa": "درسِ چهارم: حرکت کوتاه و انفجاری بود. کدیور نشان می‌دهد جنبش‌های طولانی و سازمان‌یافته هم بیشتر می‌برند و هم بعد دموکراسیِ بادوام‌تری می‌سازند. تشکل‌هایی مثل شوراهای صنفیِ معلمان سرمایه‌ای‌اند که باید پیش از موجِ بعد ساخته شود.", "en": "Lesson four: the wave was short and explosive. Kadivar shows long, organised movements win more and build more durable democracies.", "nl": "Lesson four: the wave was short and explosive. Kadivar shows long, organised movements win more and build more durable democracies."}, "sources": ["src:f1a8df8bf8"], "flags": []}, {"text": {"fa": "نتیجه برای برنامه: کارِ اصلیِ ۹۰ روز و ۹ ماه دقیقاً همان دو پَرِ نسوخته است: صندوق و ضمانت؛ نه فراخوانِ خیابانیِ تازه.", "en": "Consequence for the plan: the core work of the 90 days and 9 months is exactly the two unburned feathers, the fund and the guarantee; not a new street call.", "nl": "Consequence for the plan: the core work of the 90 days and 9 months is exactly the two unburned feathers, the fund and the guarantee; not a new street call."}, "sources": [], "flags": []}, {"text": {"fa": "مقایسه با ۱۳۵۷: آن بار اعتصابِ سراسری ماه‌ها ادامه داشت (از شهریور تا بهمن)، کارگران پس از هر بازگرداندنِ اجباری دوباره اعتصاب کردند، و شبکهٔ مسجد و بازار هماهنگی را بدونِ نیاز به رسانهٔ آزاد نگه داشت. در دی ۱۴۰۴ هیچ‌کدام از این سه نبود: اعتصابِ پایدار، صندوق، و شبکهٔ آفلاین.", "en": "Compared with 1979: then the general strike lasted months, workers struck again after each forced return, and the mosque-bazaar network sustained coordination without free media. In January 2026 none of the three existed.", "nl": "Compared with 1979: then the general strike lasted months, workers struck again after each forced return, and the mosque-bazaar network sustained coordination without free media. In January 2026 none of the three existed."}, "sources": ["src:41c1e6a2e7", "src:435917f7dd"], "flags": ["editor-note"]}, {"text": {"fa": "از کوران: سرکوبِ دی ۱۴۰۴ فقط کسانی را که گرفت ساکت نکرد؛ انتظارِ بقیه را عوض کرد. این همان «موجِ وارونه» است که کوران در هندِ ۱۹۷۵ نشان می‌دهد، و قطعِ ۸۸روزهٔ اینترنت راهِ دیدنِ اینکه «دیگران هنوز هستند» را هم بست. ترجیحِ درونی اما در پیمایشِ شش ماه بعد عوض نشده بود؛ یعنی تعادل جابه‌جا نشد، فقط پنهان شد.", "en": "From Kuran: the January 2026 crackdown changed everyone else's expectations, the reverse bandwagon Kuran shows for India 1975, and the 88-day shutdown removed the means of seeing that others were still there. Private preferences had not changed six months later; the equilibrium hid rather than moved.", "nl": "From Kuran: the January 2026 crackdown changed everyone else's expectations, the reverse bandwagon Kuran shows for India 1975, and the 88-day shutdown removed the means of seeing that others were still there. Private preferences had not changed six months later; the equilibrium hid rather than moved."}, "sources": ["src:436510de26", "src:6c0a6f1ef3"], "flags": ["editor-note"]}, {"text": {"fa": "کوران (۱۹۸۹): بعد از هر انقلاب، حکومتِ تازه می‌داند حمایتِ ظاهری از خودش هم سست است و برای همین سرکوب و تلقین می‌کند، حتی علیه همراهانِ دیروز. همین منطق دربارهٔ هر «روزِ بعد» صدق می‌کند: اگر گذار با زور یا ترس پیش برود، چرخه تکرار می‌شود؛ پس عدالتِ انتقالی و آزادیِ بیان از روزِ اول شرطِ شکستنِ این چرخه است.", "en": "Kuran (1989): after a revolution the new regime knows its outward support is also brittle, so it represses and indoctrinates, even yesterday's allies. Any \"day after\" faces the same logic; transitional justice and free speech from day one are what break the cycle.", "nl": "Kuran (1989): after a revolution the new regime knows its outward support is also brittle, so it represses and indoctrinates, even yesterday's allies. Any \"day after\" faces the same logic; transitional justice and free speech from day one are what break the cycle."}, "sources": ["src:b71c8c0eee"], "flags": []}], "links": [{"to": "simorgh:three-feathers", "rel": "see-also", "note": {"fa": "سه پَر", "en": "Three feathers", "nl": "Three feathers"}}, {"to": "simorgh:pillars-of-support", "rel": "see-also", "note": {"fa": "ستون‌ها", "en": "Pillars", "nl": "Pillars"}}, {"to": "simorgh:covenantal-transition", "rel": "see-also", "note": {"fa": "برنامهٔ ۹۰/۹/۶۰۰", "en": "90/9/600", "nl": "90/9/600"}}, {"to": "simorgh:claims-resistance", "rel": "see-also", "note": {"fa": "ادعاهای مقاومت", "en": "Resistance claims", "nl": "Resistance claims"}}, {"to": "simorgh:gamaan-2026", "rel": "see-also", "note": {"fa": "پیمایشِ گمان (گزارش کامل)", "en": "GAMAAN full report", "nl": "GAMAAN full report"}}, {"to": "soc:digital-repression", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:civil-resistance-success-rates", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:040033aaf5", "src:41c1e6a2e7", "src:435917f7dd", "src:4d809f4a2a", "src:6c0a6f1ef3", "src:9ce61897e7", "src:f1a8df8bf8", "src:436510de26", "src:b71c8c0eee"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:birds-30", "kind": "concept", "title": {"fa": "سی مرغ: شش گروه، پنج نقش", "en": "Thirty birds: six groups of five roles", "nl": "Thirty birds: six groups of five roles"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "هر مرغ یک نقشِ مسئول برای روز آزادی و پس از آن است: نگهبانانِ جان، نگهبانانِ سرزمین، سازندگانِ نهاد، سازندگانِ دانایی، سازندگانِ پیوند و گروهِ ششم. هر مرغ یک «مأموریت»، یک «قدمِ امروز»، یک نقشِ روزِ آزادی و یک افقِ بلندمدت دارد. نقش‌ها جایگاه‌اند، نه فهرستِ آدم‌ها.", "en": "Each bird is a responsible role for liberation day and after: guardians of life, guardians of land, builders of institutions, builders of knowledge, builders of ties, and a sixth group. Each has a mission, a step for today, a liberation-day role and a long-term horizon. Roles are places, not lists of people.", "nl": "Each bird is a responsible role for liberation day and after: guardians of life, guardians of land, builders of institutions, builders of knowledge, builders of ties, and a sixth group. Each has a mission, a step for today, a liberation-day role and a long-term horizon. Roles are places, not lists of people."}, "points": [{"text": {"fa": "نگهبانان جان: پزشک و پرستار، روان‌یار و سوگ‌یار، امداد و بحران، همراه کودک، همراه رهایی از اعتیاد", "en": "Group: نگهبانان جان.", "nl": "Group: نگهبانان جان."}, "sources": [], "flags": []}, {"text": {"fa": "نگهبانان سرزمین: آب‌بان، نگهبان طبیعت و جنگل، کشاورزی پایدار، انرژی پاک، نگهبان میراث", "en": "Group: نگهبانان سرزمین.", "nl": "Group: نگهبانان سرزمین."}, "sources": [], "flags": []}, {"text": {"fa": "سازندگان نهاد: دادرسی و حقوق، انتخابات و قانون اساسی، اقتصاد و بودجه، دولت دیجیتال، امنیت پاسخگو", "en": "Group: سازندگان نهاد.", "nl": "Group: سازندگان نهاد."}, "sources": [], "flags": []}, {"text": {"fa": "سازندگان دانایی: آموزگار سوادآموزی، پژوهشگر و داده، راستی‌آزما، رسانه و روایت، مترجم", "en": "Group: سازندگان دانایی.", "nl": "Group: سازندگان دانایی."}, "sources": [], "flags": []}, {"text": {"fa": "سازندگان پیوند: میانجی، ضامن اعتماد، همسایه‌یار محله، پل ایرانیان خارج، جشن‌ساز و فرهنگ", "en": "Group: سازندگان پیوند.", "nl": "Group: سازندگان پیوند."}, "sources": [], "flags": []}, {"text": {"fa": "سازندگان شهر و کار: شهرساز و مسکن، حمل‌ونقل، نوسازی صنعت، کارآفرین و سرمایه‌گذار، پاک‌سازی و داوطلبی", "en": "Group: سازندگان شهر و کار.", "nl": "Group: سازندگان شهر و کار."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-1", "rel": "see-also", "note": {"fa": "نگهبانان جان", "en": "نگهبانان جان", "nl": "نگهبانان جان"}}, {"to": "simorgh:birds-2", "rel": "see-also", "note": {"fa": "نگهبانان سرزمین", "en": "نگهبانان سرزمین", "nl": "نگهبانان سرزمین"}}, {"to": "simorgh:birds-3", "rel": "see-also", "note": {"fa": "سازندگان نهاد", "en": "سازندگان نهاد", "nl": "سازندگان نهاد"}}, {"to": "simorgh:birds-4", "rel": "see-also", "note": {"fa": "سازندگان دانایی", "en": "سازندگان دانایی", "nl": "سازندگان دانایی"}}, {"to": "simorgh:birds-5", "rel": "see-also", "note": {"fa": "سازندگان پیوند", "en": "سازندگان پیوند", "nl": "سازندگان پیوند"}}, {"to": "simorgh:birds-6", "rel": "see-also", "note": {"fa": "سازندگان شهر و کار", "en": "سازندگان شهر و کار", "nl": "سازندگان شهر و کار"}}, {"to": "simorgh:liberation-day", "rel": "see-also", "note": {"fa": "روز آزادی", "en": "Liberation day", "nl": "Liberation day"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:three-paths", "kind": "concept", "title": {"fa": "سه راه و راهِ صفر", "en": "Three paths and path zero", "nl": "Three paths and path zero"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "سه شاخهٔ ممکن، هرکدام در جای دیگری از جهان اجرا شده و نتیجه‌اش را می‌دانیم؛ پیش‌بینی نیستند. تفاوتشان در «حق بودن» نیست، در هزینه است. ماندن هم راهی است («راه صفر») و قیمتش کمتر نیست، فقط آهسته‌تر پرداخت می‌شود.", "en": "Three possible branches, each run elsewhere in the world with known outcomes; not predictions. They differ in cost, not in being right. Staying is also a path (\"path zero\") and costs no less, only more slowly.", "nl": "Three possible branches, each run elsewhere in the world with known outcomes; not predictions. They differ in cost, not in being right. Staying is also a path (\"path zero\") and costs no less, only more slowly."}, "points": [{"text": {"fa": "راهِ یکم (توصیه‌شده)، گذارِ میثاقی: الگوها آفریقای جنوبی ۱۹۹۰–۹۴، لهستان ۱۹۸۹، شیلی ۱۹۸۸–۹۰؛ سازوکار میثاقِ حداقلیِ پیشینی، عفوِ مشروط در برابرِ اعترافِ کامل، تاریخِ مشخصِ رأی‌گیری و حفظِ زیرساخت و بوروکراسی. خطرِ اصلی: اجماعِ نخبگانی حاصل نشود، همان ✗ امروز.", "en": "Path 1 (recommended), covenantal transition: models South Africa 1990-94, Poland 1989, Chile 1988-90; mechanism: a prior minimal covenant, conditional amnesty for full confession, a fixed vote date, infrastructure and bureaucracy kept. Main risk: no elite consensus, today's \"no\".", "nl": "Path 1 (recommended), covenantal transition: models South Africa 1990-94, Poland 1989, Chile 1988-90; mechanism: a prior minimal covenant, conditional amnesty for full confession, a fixed vote date, infrastructure and bureaucracy kept. Main risk: no elite consensus, today's \"no\"."}, "sources": ["src:a4e411ed75", "src:89f0e30575"], "flags": []}, {"text": {"fa": "راهِ دوم، گسستِ سریع: الگوها صربستان ۲۰۰۰، تونس ۲۰۱۱ و، با احتیاطِ فراوان، سوریهٔ اخیر؛ سریع‌تر اما فردای بی‌نقشه. هشدارِ متن: قیاس با سوریه خوش‌بینانه است و تجربهٔ آن هنوز شکل می‌گیرد.", "en": "Path 2, rapid rupture: models Serbia 2000, Tunisia 2011 and, with great caution, recent Syria; faster but a tomorrow without a plan.", "nl": "Path 2, rapid rupture: models Serbia 2000, Tunisia 2011 and, with great caution, recent Syria; faster but a tomorrow without a plan."}, "sources": ["src:d72e4f416e"], "flags": ["editor-note"]}, {"text": {"fa": "راهِ سوم (پرهیز)، چرخهٔ خشونت: لیبی ۲۰۱۱، سوریه ۲۰۱۱–۲۴، عراق ۲۰۰۳؛ سقوط با انتقام، تجزیهٔ اقتدار، بازیگرِ مسلحِ محلی و بعد خارجی. خطری که همهٔ طرف‌ها می‌بینند: درغلتیدن به اقتدارگراییِ تازه.", "en": "Path 3 (avoid), cycle of violence: Libya 2011, Syria 2011-24, Iraq 2003; fall with revenge, fragmenting authority, local then foreign armed actors.", "nl": "Path 3 (avoid), cycle of violence: Libya 2011, Syria 2011-24, Iraq 2003; fall with revenge, fragmenting authority, local then foreign armed actors."}, "sources": ["src:7fffecad9e", "src:b76e3ec683"], "flags": []}, {"text": {"fa": "راهِ صفر، ادامهٔ وضع موجود: باروریِ زیر ۱٫۵، جمعیتِ دانشجویی از ۴٫۸ به ۳٫۱۸ میلیون، سالمندی با پنج برابرِ نرخِ رشدِ کل و خروجِ سالانهٔ مغزها؛ گران‌ترین سناریو نیست اما تنها سناریویی است که در آن هیچ‌کس نمی‌برد.", "en": "Path zero, status quo: fertility under 1.5, student population from 4.8 to 3.18 million, ageing at five times the overall growth and yearly brain drain; not the costliest but the only one where nobody wins.", "nl": "Path zero, status quo: fertility under 1.5, student population from 4.8 to 3.18 million, ageing at five times the overall growth and yearly brain drain; not the costliest but the only one where nobody wins."}, "sources": [], "flags": []}, {"text": {"fa": "راهِ بیرونی (که در نسخهٔ اول نبود و جنگ آن را واقعی کرد): تغییر با فشار یا حملهٔ نظامیِ خارجی. ۳۰٪ پاسخ‌دهندگانِ گمان آن را مؤثر می‌دانند. پژوهشِ داونز و مونتن نشان می‌دهد تغییرِ نظامِ تحمیل‌شده از بیرون به‌ندرت به دموکراسی می‌رسد، مگر در کشورهایی که پیش‌شرط‌های داخلی (ثروتِ بالا، همگونی، تجربهٔ دموکراسی) داشتند؛ و هزینهٔ مشروعیت دارد: پیمایش نشان می‌دهد جامعه دربارهٔ جنگ دو نیمه است. این راه را نمی‌شود «انتخاب» کرد، اما باید برایش آماده بود: اگر رأس بیفتد و فرایندِ تأسیس ساخته نشده باشد، نتیجه به راهِ دوم یا سوم می‌لغزد.", "en": "The outside path (absent in version 1, made real by the war): change through foreign pressure or military action. 30 percent of GAMAAN respondents see it as effective. Research shows foreign-imposed regime change rarely leads to democracy except where domestic preconditions existed, and it carries a legitimacy cost. It cannot be chosen, but one must be ready: if the top falls without a founding process, the result slides toward path two or three.", "nl": "The outside path (absent in version 1, made real by the war): change through foreign pressure or military action. 30 percent of GAMAAN respondents see it as effective. Research shows foreign-imposed regime change rarely leads to democracy except where domestic preconditions existed, and it carries a legitimacy cost. It cannot be chosen, but one must be ready: if the top falls without a founding process, the result slides toward path two or three."}, "sources": ["src:5077e79964", "src:6c0a6f1ef3", "src:b76e3ec683"], "flags": ["editor-note"]}], "links": [{"to": "simorgh:covenantal-transition", "rel": "see-also", "note": {"fa": "گذارِ میثاقی و برنامهٔ ۹۰/۹/۶۰۰", "en": "Covenantal transition and the 90/9/600 plan", "nl": "Covenantal transition and the 90/9/600 plan"}}, {"to": "simorgh:cost-model", "rel": "see-also", "note": {"fa": "برآوردِ هزینه", "en": "Cost model", "nl": "Cost model"}}, {"to": "simorgh:claims-model", "rel": "see-also", "note": {"fa": "ادعاهای مدل", "en": "Model claims", "nl": "Model claims"}}, {"to": "simorgh:pre-mortem", "rel": "see-also", "note": {"fa": "پیش‌مرگ: اگر شکست بخوریم چرا", "en": "Pre-mortem", "nl": "Pre-mortem"}}, {"to": "soc:foreign-imposed-regime-change", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}, {"to": "soc:pacted-transitions", "rel": "see-also", "note": {"fa": "نظریه در ویکی جامعه‌شناسی", "en": "Theory in the sociology wiki", "nl": "Theory in the sociology wiki"}}], "people": [], "sources": ["src:5077e79964", "src:6c0a6f1ef3", "src:7fffecad9e", "src:89f0e30575", "src:a4e411ed75", "src:b76e3ec683", "src:d72e4f416e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:transition-risks", "kind": "concept", "title": {"fa": "پانزده خطرِ گذار و پاسخِ هرکدام", "en": "Fifteen transition risks and the response to each", "nl": "Fifteen transition risks and the response to each"}, "aliases": [], "parent": "simorgh:action", "field": "simorgh:action", "summary": {"fa": "خطرهای روزهای نخست، هرکدام با نشانه، پاسخِ از پیش‌آماده و مرغِ مسئول: انتقام و خشونتِ خیابانی، غارت، خلأ قدرت یا کودتا، گروه‌های مسلح و دیگران.", "en": "The risks of the first days, each with signs, a pre-prepared response and the responsible bird.", "nl": "The risks of the first days, each with signs, a pre-prepared response and the responsible bird."}, "points": [{"text": {"fa": "انتقام و خشونت خیابانی: نشانه: شعار مرگ برای افراد، فهرست‌های سیاه دست‌به‌دست. پاسخ: پیام از پیش: دادخواهی در دادگاه؛ میانجی‌ها در محله. مرغِ مسئول: میانجی.", "en": "انتقام و خشونت خیابانی: signs, response and responsible bird, as in the Persian text.", "nl": "انتقام و خشونت خیابانی: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "غارت و هرج‌ومرج: نشانه: شکستن مغازه‌ها، حمله به انبارها. پاسخ: همسایه‌یاران و نگهبانی محله‌ای از اماکن. مرغِ مسئول: همسایه‌یار محله.", "en": "غارت و هرج‌ومرج: signs, response and responsible bird, as in the Persian text.", "nl": "غارت و هرج‌ومرج: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "خلأ قدرت یا کودتا: نشانه: غیبت نهاد پذیرفته‌شده در روز اول. پاسخ: شورای گذار از پیش معرفی‌شده و زمان‌بندی انتخابات. مرغِ مسئول: انتخابات و قانون اساسی.", "en": "خلأ قدرت یا کودتا: signs, response and responsible bird, as in the Persian text.", "nl": "خلأ قدرت یا کودتا: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "گروه‌های مسلح: نشانه: سلاح در دست بسیج و داوطلبان «جان‌فدا». پاسخ: برنامهٔ خلع سلاح و بازگشت به زندگی مدنی با شغل. مرغِ مسئول: امنیت پاسخگو.", "en": "گروه‌های مسلح: signs, response and responsible bird, as in the Persian text.", "nl": "گروه‌های مسلح: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "جنگ قومی یا تجزیه: نشانه: خشونت در استان‌های مرزی، شعارهای قومی. پاسخ: تمرکززدایی و حقوق برابر از پیش تعهدشده. مرغِ مسئول: میانجی.", "en": "جنگ قومی یا تجزیه: signs, response and responsible bird, as in the Persian text.", "nl": "جنگ قومی یا تجزیه: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "مداخلهٔ خارجی: نشانه: نیروهای خارجی یا نیابتی در خاک ایران. پاسخ: دیپلماسی فوری با همسایه‌ها. مرغِ مسئول: دادرسی و حقوق.", "en": "مداخلهٔ خارجی: signs, response and responsible bird, as in the Persian text.", "nl": "مداخلهٔ خارجی: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فروپاشی اقتصادی: نشانه: جهش قیمت نان و دارو، بانک‌ها بسته. پاسخ: تضمین حقوق‌ها، باز ماندن نانوایی‌ها، کمک اضطراری. مرغِ مسئول: اقتصاد و بودجه.", "en": "فروپاشی اقتصادی: signs, response and responsible bird, as in the Persian text.", "nl": "فروپاشی اقتصادی: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "قطع خدمات: نشانه: قطع آب، برق، دارو یا اینترنت. پاسخ: کارکنان خدمات سر کار؛ فهرست اضطراری. مرغِ مسئول: امداد و بحران.", "en": "قطع خدمات: signs, response and responsible bird, as in the Persian text.", "nl": "قطع خدمات: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "موج شایعه: نشانه: خبرهای متناقض دربارهٔ کشته‌ها یا دستگیری‌ها. پاسخ: یک منبع رسمی و راستی‌آزمایی‌شده. مرغِ مسئول: راستی‌آزما.", "en": "موج شایعه: signs, response and responsible bird, as in the Persian text.", "nl": "موج شایعه: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "پاک‌سازی افراطی: نشانه: اخراج دسته‌جمعی کارمندان. پاسخ: درس عراق ۲۰۰۳: فقط آمران و عاملان جنایت. مرغِ مسئول: دادرسی و حقوق.", "en": "پاک‌سازی افراطی: signs, response and responsible bird, as in the Persian text.", "nl": "پاک‌سازی افراطی: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "استبداد تازه: نشانه: تمدید بی‌پایان دورهٔ گذار، سرکوب منتقدان تازه. پاسخ: تاریخ ثابت انتخابات و رسانهٔ آزاد. مرغِ مسئول: رسانه و روایت.", "en": "استبداد تازه: signs, response and responsible bird, as in the Persian text.", "nl": "استبداد تازه: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "دعوای اپوزیسیون بر سر شکل حکومت: نشانه: تحریم یکدیگر، تفرقه در روز اول. پاسخ: توافق بر قواعد گفتگو، نه بر پاسخ‌ها؛ تصمیم با رأی مردم. مرغِ مسئول: میانجی.", "en": "دعوای اپوزیسیون بر سر شکل حکومت: signs, response and responsible bird, as in the Persian text.", "nl": "دعوای اپوزیسیون بر سر شکل حکومت: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نابودی اسناد: نشانه: آتش زدن پرونده‌ها، پاک کردن سرورها. پاسخ: نگهبانی از بایگانی‌ها و مراکز داده. مرغِ مسئول: پژوهشگر و داده.", "en": "نابودی اسناد: signs, response and responsible bird, as in the Persian text.", "nl": "نابودی اسناد: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "زندان‌ها: نشانه: آشوب در زندان‌ها، خطر جان زندانیان. پاسخ: آزادی منظم زندانیان سیاسی و امنیت بقیه. مرغِ مسئول: دادرسی و حقوق.", "en": "زندان‌ها: signs, response and responsible bird, as in the Persian text.", "nl": "زندان‌ها: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بحران آب در تابستان اول: نشانه: قطع آب شهرها. پاسخ: برنامهٔ اضطراری آب پیش از تابستان. مرغِ مسئول: آب‌بان.", "en": "بحران آب در تابستان اول: signs, response and responsible bird, as in the Persian text.", "nl": "بحران آب در تابستان اول: signs, response and responsible bird, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:birds-30", "rel": "see-also", "note": {"fa": "سی مرغ", "en": "Thirty birds", "nl": "Thirty birds"}}, {"to": "simorgh:liberation-day", "rel": "see-also", "note": {"fa": "روز آزادی", "en": "Liberation day", "nl": "Liberation day"}}, {"to": "simorgh:three-paths", "rel": "see-also", "note": {"fa": "سه راه", "en": "Three paths", "nl": "Three paths"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:dataset-84", "kind": "concept", "title": {"fa": "دیتاستِ ۸۴ ادعا و جدولِ داده", "en": "The 84-claim dataset and data table", "nl": "The 84-claim dataset and data table"}, "aliases": [], "parent": "simorgh:evidence", "field": "simorgh:evidence", "summary": {"fa": "پشتِ همهٔ صفحه‌ها یک دیتاستِ باز است: ۸۴ ادعا، هر کدام با مقدار، دوره، مبنا، ردهٔ اعتبار، منبع، شرطِ ابطال، جای استفاده و نشانِ محل نزاع. جدولِ داده همین را قابل‌جست‌وجو می‌کند.", "en": "Behind every page is an open dataset: 84 claims with value, period, basis, tier, source, falsifier, where used and a contested flag. The data table makes it searchable.", "nl": "Behind every page is an open dataset: 84 claims with value, period, basis, tier, source, falsifier, where used and a contested flag. The data table makes it searchable."}, "points": [{"text": {"fa": "ردهٔ ۱: ۲۱ ادعا (دادهٔ اولیه یا سند)؛ ردهٔ ۲: ۳۲ (پژوهش یا ادبیاتِ تخصصی)؛ ردهٔ ۳: ۳۱ (برآورد، مدل یا ارزیابیِ کیفی). موضوع‌ها: جمعیت، اقتصاد، تاریخ، ایران و اسرائیل، مدل، سیاست، مقاومت، امنیت و جنگ.", "en": "Tier 1: 21 claims (primary data or documents); tier 2: 32 (research); tier 3: 31 (estimates, models, qualitative judgement). Topics as listed.", "nl": "Tier 1: 21 claims (primary data or documents); tier 2: 32 (research); tier 3: 31 (estimates, models, qualitative judgement). Topics as listed."}, "sources": [], "flags": []}, {"text": {"fa": "قاعدهٔ دیتاست: ادعایی که نتواند بگوید چه شواهدی ردش می‌کند، ادعا نیست؛ و هر عدد که منبعِ قابل‌ارجاع نداشت ننوشته شد.", "en": "Dataset rule: a claim that cannot say what evidence would refute it is no claim; any number without a citable source was not written.", "nl": "Dataset rule: a claim that cannot say what evidence would refute it is no claim; any number without a citable source was not written."}, "sources": [], "flags": []}, {"text": {"fa": "فایل‌ها: claims-dataset.json، problems-dataset.json، و جدول در صفحهٔ data.", "en": "Files: claims-dataset.json, problems-dataset.json and the table in the data page.", "nl": "Files: claims-dataset.json, problems-dataset.json and the table in the data page."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:claims-demography", "rel": "see-also", "note": {"fa": "ادعاهای جمعیت و ساختار", "en": "Claims: demography and structure", "nl": "Claims: demography and structure"}}, {"to": "simorgh:claims-economy", "rel": "see-also", "note": {"fa": "ادعاهای اقتصاد و معیشت", "en": "Claims: economy and livelihood", "nl": "Claims: economy and livelihood"}}, {"to": "simorgh:claims-history", "rel": "see-also", "note": {"fa": "ادعاهای تاریخ", "en": "Claims: history", "nl": "Claims: history"}}, {"to": "simorgh:claims-iran-israel", "rel": "see-also", "note": {"fa": "ادعاهای ایران و اسرائیل", "en": "Claims: Iran and Israel", "nl": "Claims: Iran and Israel"}}, {"to": "simorgh:claims-model", "rel": "see-also", "note": {"fa": "ادعاهای مدلِ هزینه و سناریو", "en": "Claims: cost model and scenarios", "nl": "Claims: cost model and scenarios"}}, {"to": "simorgh:claims-politics", "rel": "see-also", "note": {"fa": "ادعاهای سیاست و افکار عمومی", "en": "Claims: politics and public opinion", "nl": "Claims: politics and public opinion"}}, {"to": "simorgh:claims-resistance", "rel": "see-also", "note": {"fa": "ادعاهای مقاومت مدنی و گذار", "en": "Claims: civil resistance and transition", "nl": "Claims: civil resistance and transition"}}, {"to": "simorgh:claims-security", "rel": "see-also", "note": {"fa": "ادعاهای امنیت و جنگ", "en": "Claims: security and war", "nl": "Claims: security and war"}}, {"to": "simorgh:audit", "rel": "see-also", "note": {"fa": "ممیزی", "en": "Audit", "nl": "Audit"}}, {"to": "simorgh:dataset-health", "rel": "see-also", "note": {"fa": "سلامتِ دیتاست", "en": "Dataset health", "nl": "Dataset health"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:timeline-tool", "kind": "concept", "title": {"fa": "خطِ زمان: ۸۴ ادعا روی زمان", "en": "Timeline: the 84 claims on time", "nl": "Timeline: the 84 claims on time"}, "aliases": [], "parent": "simorgh:history", "field": "simorgh:history", "summary": {"fa": "همان ۸۴ ادعا این بار روی محور زمان در سه بازه که عرضِ برابر ندارند (۲۲۵۰ سال، ۴۰۰ سال، ۱۳۰ سال)؛ چگالیِ رویداد در بازه‌ها قابل‌مقایسه نیست.", "en": "The same 84 claims on a time axis in three spans of unequal width (2,250, 400 and 130 years); event density is not comparable across spans.", "nl": "The same 84 claims on a time axis in three spans of unequal width (2,250, 400 and 130 years); event density is not comparable across spans."}, "points": [{"text": {"fa": "بازه‌ها: «باستان تا صفویه» (۵ ادعا)، «چهار قرنِ ساخته‌شدن» (۱۱ ادعا) و دورهٔ معاصر؛ هر ردیف ردهٔ اعتبار و پیوند به سطرِ کاملِ ادعا دارد.", "en": "Spans: ancient to Safavid (5 claims), four centuries of making (11 claims), and the contemporary period; each row has a tier and a link to the full claim row.", "nl": "Spans: ancient to Safavid (5 claims), four centuries of making (11 claims), and the contemporary period; each row has a tier and a link to the full claim row."}, "sources": [], "flags": []}, {"text": {"fa": "هشدار مقیاس: روی یک محورِ خطی کلِ دورهٔ معاصر یک خطِ نازک می‌شد.", "en": "Scale warning: on one linear axis the whole contemporary period would be a thin line.", "nl": "Scale warning: on one linear axis the whole contemporary period would be a thin line."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "دیتاست", "en": "Dataset", "nl": "Dataset"}}, {"to": "simorgh:seven-nights", "rel": "see-also", "note": {"fa": "هفت شب", "en": "Seven nights", "nl": "Seven nights"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:problems-map", "kind": "concept", "title": {"fa": "نقشهٔ مشکل‌ها: ۲۴ مشکل روی دو محور", "en": "Problem map: 24 problems on two axes", "nl": "Problem map: 24 problems on two axes"}, "aliases": [], "parent": "simorgh:project", "field": "simorgh:project", "summary": {"fa": "هر مشکل جایی روی دو محور می‌افتد: فراوانی (چه نسبتی درگیرند) و شدتِ زیسته (چقدر زندگیِ روزمره را مختل می‌کند)؛ جایی که می‌افتد تعیین می‌کند چه پاسخی به دردش می‌خورد. این نقشه برای آموزشِ چارچوب است و ادعای عددی نمی‌کند؛ «مهم‌ترین مشکل» پرسشِ بدی است.", "en": "Each problem falls on two axes: frequency and lived severity; where it falls determines what response suits it. The map teaches a framework and makes no numerical claim; \"the most important problem\" is a bad question.", "nl": "Each problem falls on two axes: frequency and lived severity; where it falls determines what response suits it. The map teaches a framework and makes no numerical claim; \"the most important problem\" is a bad question."}, "points": [{"text": {"fa": "چهار ربع و چهار جورِ پاسخ: شایع و سنگین ← اولویتِ اضطراریِ سیاستِ کلان؛ نادر اما ویرانگر ← چترِ حمایت و آمادگیِ بحران، هدفمند؛ شایع و آزارنده ← اصلاحِ روزمره و خدماتِ عمومی؛ کم‌شیوع و خفیف ← پایش، منابع را این‌جا انبار نکنید.", "en": "Four quadrants, four kinds of response.", "nl": "Four quadrants, four kinds of response."}, "sources": [], "flags": []}, {"text": {"fa": "فشار معیشت و تورم (ساختاری؛ فراوانی 92، شدت 72): شایع‌ترین و یکی از سنگین‌ترین‌ها؛ در آمارِ رسمی هم کاملاً دیده می‌شود.", "en": "Problem tavarom: position on the two axes and note, as in the Persian text.", "nl": "Problem tavarom: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بیکاری و شغل ناپایدار (فردی؛ فراوانی 78، شدت 68): با اشتغالِ غیررسمیِ بالا، «شاغل بودن» تضمینِ امنیت نیست.", "en": "Problem bikari: position on the two axes and note, as in the Persian text.", "nl": "Problem bikari: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "هزینهٔ مسکن (خانوار؛ فراوانی 84، شدت 70): برای خانوارِ شهری بزرگ‌ترین قلمِ هزینه.", "en": "Problem maskan: position on the two axes and note, as in the Persian text.", "nl": "Problem maskan: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "کیفیت پایین مسکن (محله؛ فراوانی 72، شدت 55): ", "en": ٔ رسمی: ", "en": "Problem tanhaee: position on the two axes and note, as in the Persian text.", "nl": "Problem tanhaee: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "خشونت خانگی (خانوار؛ فراوانی 46، شدت 88)، کم‌ثبت در دادهٔ رسمی: نمونهٔ روشنِ «کم‌ثبت، پرشدت»: در آمارِ رسمی به‌شدت کمتر از واقعیت دیده می‌شود.", "en": "Problem khoshoonat: position on the two axes and note, as in the Persian text.", "nl": "Problem khoshoonat: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فرسودگی مراقبت (خانوار؛ فراوانی 45، شدت 65)، کم‌ثبت در دادهٔ رسمی: کارِ مراقبتیِ بی‌مزد، عمدتاً بر دوشِ زنان و عمدتاً نامرئی در آمار.", "en": "Problem farsoodegi: position on the two axes and note, as in the Persian text.", "nl": "Problem farsoodegi: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بیماری مزمن (فردی؛ فراوانی 51، شدت 72): ", "en": "Problem bimari: position on the two axes and note, as in the Persian text.", "nl": "Problem bimari: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "معلولیت بدون حمایت (ساختاری؛ فراوانی 36، شدت 66): ", "en": "Problem maloliat: position on the two axes and note, as in the Persian text.", "nl": "Problem maloliat: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "اعتیاد شدید (خانوار؛ فراوانی 27، شدت 77): ", "en": "Problem etiad: position on the two axes and note, as in the Persian text.", "nl": "Problem etiad: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بی‌خانمانی (فردی؛ فراوانی 18، شدت 80): ", "en": "Problem bikhanemani: position on the two axes and note, as in the Persian text.", "nl": "Problem bikhanemani: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "فاجعه و بحران حاد (ساختاری؛ فراوانی 16، شدت 92): نادر ولی ویرانگر — پاسخش آمادگی است، نه سیاستِ روزمره.", "en": "Problem bohran: position on the two axes and note, as in the Persian text.", "nl": "Problem bohran: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "ترک تحصیل (خانوار؛ فراوانی 60، شدت 38): ", "en": "Problem tark: position on the two axes and note, as in the Persian text.", "nl": "Problem tark: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "نابرابری فرصت شغلی (ساختاری؛ فراوانی 46، شدت 30): ", "en": "Problem nabarabari: position on the two axes and note, as in the Persian text.", "nl": "Problem nabarabari: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "شکاف دیجیتال (محله؛ فراوانی 38، شدت 22): ", "en": "Problem digital: position on the two axes and note, as in the Persian text.", "nl": "Problem digital: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "طرد اجتماعی اقلیت (ساختاری؛ فراوانی 34، شدت 44)، کم‌ثبت در دادهٔ رسمی: برای گروهِ هدف بسیار سنگین است، حتی وقتی سهمِ جمعیتی‌اش کوچک است.", "en": "Problem tard: position on the two axes and note, as in the Persian text.", "nl": "Problem tard: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "بی‌ثباتی وضعِ اقامت (فردی؛ فراوانی 24، شدت 60)، کم‌ثبت در دادهٔ رسمی: ", "en": "Problem mohajer: position on the two axes and note, as in the Persian text.", "nl": "Problem mohajer: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}, {"text": {"fa": "تنهاییِ سالمندی و مراقبت (خانوار؛ فراوانی 40، شدت 51)، کم‌ثبت در دادهٔ رسمی: با سالمندیِ پنج‌برابریِ نرخِ رشدِ جمعیت، سهمِ این نقطه بالا می‌رود.", "en": "Problem salmand: position on the two axes and note, as in the Persian text.", "nl": "Problem salmand: position on the two axes and note, as in the Persian text."}, "sources": [], "flags": []}], "links": [{"to": "simorgh:population-groups", "rel": "see-also", "note": {"fa": "بیست گروه", "en": "Twenty groups", "nl": "Twenty groups"}}, {"to": "simorgh:ruins-ledger", "rel": "see-also", "note": {"fa": "دفترِ ویرانی‌ها", "en": "Ruins ledger", "nl": "Ruins ledger"}}, {"to": "simorgh:dataset-84", "rel": "see-also", "note": {"fa": "دیتاست", "en": "Dataset", "nl": "Dataset"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:pulse-poll", "kind": "concept", "title": {"fa": "نبضِ میز: تنها پرسشی که از مردم می‌پرسیم", "en": "The table's pulse: the one question we ask people", "nl": "The table's pulse: the one question we ask people"}, "aliases": [], "parent": "simorgh:strategy", "field": "simorgh:strategy", "summary": {"fa": "ماهی یک بار، فقط یک پرسش: «دربارهٔ اینکه حکومتِ فعلی بماند یا تغییر کند، فکر می‌کنید چند درصدِ مردم مثلِ شما فکر می‌کنند؟» نه نظرِ کسی، فقط حدسش. با انتشارِ سیمرغ باز می‌شود؛ صفحه‌اش پرسش، قاعده‌های ایمنی، دلیلِ صادق‌بودن برای هر گروه، نتیجهٔ هر ماه و جدولِ تفسیر را دارد.", "en": "Once a month, one question: what share of people do you think think like you about whether the current government should stay or change? Not anyone's view, only their estimate. Opens when Simorgh launches.", "nl": "Once a month, one question: what share of people do you think think like you about whether the current government should stay or change? Not anyone's view, only their estimate. Opens when Simorgh launches."}, "points": [{"text": {"fa": "چرا این پرسش: بنا بر کوران، چیزی که سکوت را نگه می‌دارد خودِ ترجیح نیست، انتظار از دیگران است. این پرسش همان انتظار را می‌سنجد، و افشای فاصلهٔ آن با عددِ واقعی (حدود ۷۰٪ در پیمایشِ گمان) همان کاری است که پَرِ یکم را روشن نگه می‌دارد.", "en": "Why: per Kuran, silence is held by expectations, not preferences; the question measures that expectation, and revealing its gap from the real figure keeps feather one lit.", "nl": "Why: per Kuran, silence is held by expectations, not preferences; the question measures that expectation, and revealing its gap from the real figure keeps feather one lit."}, "sources": ["src:436510de26", "src:6c0a6f1ef3"], "flags": []}, {"text": {"fa": "چرا اتهام نمی‌سازد: پرسش حدس است نه نظر؛ هر گزینه را هر دو طرف می‌توانند بزنند. رأی‌گیری در جاهایی که رأی را به دیگران نشان نمی‌دهند: نظرسنجیِ کانالِ تلگرام (ناشناس حتی برای مدیرِ کانال)، نظرسنجیِ X، و فرمِ رمزگذاری‌شدهٔ CryptPad. فقط جمعِ هر ماه نگه داشته می‌شود.", "en": "Why it accuses no one: it is an estimate, not a view; both sides can pick any option. Votes are run where they are not shown to others; only monthly totals are kept.", "nl": "Why it accuses no one: it is an estimate, not a view; both sides can pick any option. Votes are run where they are not shown to others; only monthly totals are kept."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "بازیِ حدس با تعادلِ نش در راستگویی: جدولِ تفسیر علنی است، پس به‌جای پنهان‌کردنش بازی طوری ساخته شده که کم‌ضررترین حرکت برای هر گروه حدسِ راست باشد. سه قاعده: (۱) پیامِ منتشرشده ثابت است («این حدسِ شما بود، این عددِ مستقل است») و با نتیجه عوض نمی‌شود، پس دست‌کاری پیامی نمی‌خرد؛ (۲) بعد از هر پیمایشِ مستقل اعلام می‌شود چند درصد درست حدس زدند، پس تنها راهِ بُردن حدسِ واقعی است؛ (۳) در میانِ هزاران رأی هیچ رأیی تعیین‌کننده نیست، پس دروغ برای هیچ فردی سود ندارد. خطرِ باقی‌مانده رأیِ سازمان‌یافته است که مقایسهٔ تلگرام و X و قاعدهٔ «دو قله» آشکارش می‌کند.", "en": "A guessing game with a truth-telling Nash equilibrium: a fixed published message, a score for correct guesses against an independent figure, and no pivotal vote; organised voting is the remaining risk, exposed by cross-channel comparison.", "nl": "A guessing game with a truth-telling Nash equilibrium: a fixed published message, a score for correct guesses against an independent figure, and no pivotal vote; organised voting is the remaining risk, exposed by cross-channel comparison."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "پشتوانهٔ نظری: سازوکارهای «سازگار با انگیزه»، مثلِ قاعده‌های امتیازدهیِ درست برای پیش‌بینی و سرمِ حقیقتِ بیزیِ پرلک (۲۰۰۴)، که راستگویی را بهترین پاسخ می‌کنند. نسخهٔ ما ساده‌ترین شکل است: امتیاز در برابرِ عددی که رأی‌ها آن را نمی‌سازند.", "en": "Theory: incentive-compatible mechanisms such as proper scoring rules and Prelec's Bayesian truth serum (2004).", "nl": "Theory: incentive-compatible mechanisms such as proper scoring rules and Prelec's Bayesian truth serum (2004)."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "جدولِ تفسیر (خلاصه): بیشترِ رأی‌ها در ۵۰ تا ۷۵٪ یعنی تخمین به واقعیت نزدیک است؛ بیشتر از ۷۵٪ خوش‌بینی؛ ۲۵ تا ۵۰٪ نادانیِ جمعیِ ملایم؛ کمتر از ۲۵٪ نادانیِ جمعیِ کامل؛ دو قله یعنی دو تصویرِ جدا یا رأیِ سازمان‌یافته؛ پخش و برابر یعنی خلأ اطلاعاتی؛ کمتر از ۳۰۰ رأی یعنی نتیجه منتشر نمی‌شود. این جدول فقط برای تحلیل است؛ پیامِ منتشرشده همیشه یکی است.", "en": "Interpretation table in brief, with a ready follow-up message for each case.", "nl": "Interpretation table in brief, with a ready follow-up message for each case."}, "sources": [], "flags": []}, {"text": {"fa": "محدودیت: نتیجه نظرِ رأی‌دهندگان است نه همهٔ ایرانیان، و نمی‌دانیم هر رأی‌دهنده خودش کدام طرف است. ارزش در روندِ ماه‌به‌ماه است. پرسش در تلگرام و X جدا اجرا و جدا گزارش می‌شود؛ فاصلهٔ این دو خودش یافته است (داخل در برابرِ بیرون).", "en": "Limits: voters, not all Iranians; trend over months matters most; Telegram and X are reported separately.", "nl": "Limits: voters, not all Iranians; trend over months matters most; Telegram and X are reported separately."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "کوران (۱۹۸۹) خودش هشدار داده: اعلامِ «پتانسیل بالاست» می‌تواند یا موج را راه بیندازد یا حکومت را به اقدامِ پیشگیرانه وادارد. برای همین نبضِ میز عدد را خام و بی‌فراخوان منتشر می‌کند، همراهِ جدولِ تفسیر، و هرگز «آستانه رسید، بیایید» نمی‌گوید.", "en": "Kuran (1989) warns that announcing \"potential is high\" can trigger a wave or provoke pre-emption. So the pulse poll publishes the raw figure with its interpretation table and never says \"the threshold is reached, come out\".", "nl": "Kuran (1989) warns that announcing \"potential is high\" can trigger a wave or provoke pre-emption. So the pulse poll publishes the raw figure with its interpretation table and never says \"the threshold is reached, come out\"."}, "sources": ["src:b71c8c0eee"], "flags": []}], "links": [{"to": "simorgh:threshold-indicators", "rel": "see-also", "note": {"fa": "نشانگرهای آستانه", "en": "Threshold indicators", "nl": "Threshold indicators"}}, {"to": "simorgh:three-feathers", "rel": "see-also", "note": {"fa": "سه پَر", "en": "Three feathers", "nl": "Three feathers"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "نظریه: تحریفِ ترجیحات", "en": "Preference falsification", "nl": "Preference falsification"}}, {"to": "simorgh:safety-first", "rel": "see-also", "note": {"fa": "اول ایمنی", "en": "Safety first", "nl": "Safety first"}}, {"to": "simorgh:poll-integrity", "rel": "see-also", "note": {"fa": "شمارشِ شفاف و بازیِ ضدِ تقلب", "en": "Transparent counting", "nl": "Transparent counting"}}], "people": [], "sources": ["src:436510de26", "src:6c0a6f1ef3", "src:b71c8c0eee"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "simorgh:roles-citizen", "kind": "concept", "title": {"fa": "نقش‌های اجتماعیِ شهروندان (۱۸ نقش)", "en": "Citizen social roles (18)", "nl": "Citizen social roles (18)"}, "aliases": [], "parent": "simorgh:game", "field": "simorgh:game", "summary": {"fa": "هجده نقشِ شهر، از کاسب و کارگر تا معلم، پرستار و دانشجو، هرکدام با پشتوانهٔ علمیِ اهرمی که در دست دارد.", "en": "Eighteen city roles, from shopkeeper and worker to teacher, nurse and student, each with the science behind the leverage it holds.", "nl": "Eighteen city roles, from shopkeeper and worker to teache
